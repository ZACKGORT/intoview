<!DOCTYPE html>
<html lang="en">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='12' fill='%23E5E567'/%3E%3Ctext x='40' y='50' font-family='system-ui, -apple-system, sans-serif' font-size='28' font-weight='800' text-anchor='middle' fill='%231C1C1E' letter-spacing='-0.5'%3ECX%3C/text%3E%3C/svg%3E" />

    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2,3,4,5,6,7,8,9&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg: #f0f0f2;
            --fg: #1c1c1e;
            --fg-rgb: 28, 28, 30;
            --nav-bg-rgb: 240, 240, 242;
            --rule: rgba(0, 0, 0, .08);
            --faint: rgba(0, 0, 0, .04);
            --muted: rgba(0, 0, 0, .55);
            --accent: #E5E567;
            --card: #ffffff;
            --card-dark: #1c1c1e;
            --card-mid: #3a3a3c;
            --ink: #1c1c1e;
            --ink-mid: #3a3a3c;
            --ink-light: #8e8e93;
            --ink-lighter: #b0b0b6;
            --border: #e6e6e8;
            --peek-bg: #d0d0d5;
            --peek-border: rgba(28, 28, 30, .16);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.02);
            --shadow-floating: 0 8px 32px rgba(0, 0, 0, 0.1);
            --radius: 1.5rem;
            --radius-sm: 0.65rem;
            --font: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            --fs-body: 15px;
            --max-width: 1600px;
            --margin: 16px;
            --topbar-height: 56px;
            --hud-height: 64px;
            --scrollbar-height: 3px;

            --swiss-columns: 12;
            --swiss-gap: 24px;
            --grid-outline: rgba(0, 160, 255, 0.45);
            --grid-fill: rgba(0, 160, 255, 0.06);
            --grid-gutter: rgba(0, 160, 255, 0.10);

            --card-w: 240px;
            --col-pitch: 280px;
            --row-pitch: 320px;
            --grid-col-line: rgba(0, 0, 0, 0.07);
            --grid-row-line: rgba(0, 0, 0, 0.035);
            --grid-overlay-opacity: 0.55;

            --impact-gain: #2F6B4F;
            --impact-loss: #C63A2A;
            --impact-accent: #8A7A1F;
        }
        @media (min-width: 640px) { :root { --margin: 24px; --topbar-height: 64px; --hud-height: 70px; } }
        @media (min-width: 1024px) { :root { --margin: 32px; --topbar-height: 72px; --hud-height: 76px; } }

        body[data-theme='dark'] {
            --bg: #1c1c1e;
            --fg: #ffffff;
            --fg-rgb: 255, 255, 255;
            --nav-bg-rgb: 28, 28, 30;
            --rule: rgba(255, 255, 255, .08);
            --faint: rgba(255, 255, 255, .04);
            --muted: rgba(255, 255, 255, .55);
            --card: #232325;
            --card-dark: #2c2c2e;
            --card-mid: #3a3a3c;
            --ink: #ffffff;
            --ink-mid: #b0b0b6;
            --ink-light: #8e8e93;
            --ink-lighter: #6e6e73;
            --border: rgba(255, 255, 255, .12);
            --peek-bg: #35353a;
            --peek-border: rgba(255, 255, 255, .14);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-floating: 0 8px 32px rgba(0, 0, 0, 0.6);
            --grid-col-line: rgba(255, 255, 255, 0.09);
            --grid-row-line: rgba(255, 255, 255, 0.04);
            --impact-gain: #6FCF97;
            --impact-loss: #FF6B6B;
            --impact-accent: #E5E567;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }
        html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg); color: var(--fg); font-family: var(--font);
            font-size: var(--fs-body); line-height: 1.6;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            min-height: 100vh; min-height: 100dvh;
            padding-bottom: calc(var(--hud-height) + 20px + var(--scrollbar-height));
            overflow-x: hidden;
            transition: background 0.2s ease, color 0.2s ease;
        }
        ::selection { background: var(--accent); color: #1c1c1e; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--ink-lighter); border-radius: var(--radius-sm); }
        html { scrollbar-width: thin; scrollbar-color: var(--ink-lighter) transparent; }
        .letters-track::-webkit-scrollbar { display: none; }
        .letters-track { scrollbar-width: none; -ms-overflow-style: none; }

        /* Suppress native focus rings, shadows, and callouts on long-press/active states for canvas elements */
        .canvas-node,
        .canvas-node:focus,
        .canvas-node:active,
        .canvas-node:focus-within,
        .cluster-stack,
        .cluster-stack:focus,
        .cluster-stack:active,
        .cluster-stack:focus-within,
        .cluster-leaves,
        .cluster-leaves:focus,
        .cluster-leaves:active,
        .cluster-leaves:focus-within {
            outline: none !important;
            box-shadow: none !important;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .btn {
            font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.08em;
            text-transform: uppercase; background: transparent; border: 1px solid var(--border);
            color: var(--ink-mid); padding: 5px 12px; cursor: pointer;
            transition: all 0.2s ease; border-radius: var(--radius-sm); font-weight: 500;
            touch-action: manipulation; min-height: 30px; display: inline-flex;
            align-items: center; justify-content: center; white-space: nowrap; gap: 6px;
        }
        .btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
        .btn:active { transform: scale(0.96); }
        .btn.ghost { color: var(--ink-light); }
        .btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
        .btn-grid {
            font-size: 9px; min-height: 32px; padding: 4px 10px;
            border-color: var(--border); color: var(--ink-light);
        }
        .btn-grid.active { background: var(--grid-outline); border-color: var(--grid-outline); color: white; }
        .btn-grid .dot-indicator { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.4; transition: opacity 0.2s ease; }
        .btn-grid.active .dot-indicator { opacity: 1; background: white; }

        .topbar {
            position: sticky; top: 0; z-index: 150; background: transparent;
            padding: 6px 0; min-height: var(--topbar-height); display: flex; align-items: center;
            pointer-events: none;
        }
        .topbar .wordmark,
        .topbar .btn,
        .topbar .breadcrumb-item { pointer-events: auto; }
        .topbar .wrap {
            display: flex; align-items: center; gap: 12px;
            padding: 0 var(--margin); max-width: var(--max-width);
            margin: 0 auto; width: 100%;
            pointer-events: none;
        }
        .wordmark {
            font-size: clamp(12px, 3.5vw, 20px); font-weight: 700; letter-spacing: -0.03em;
            display: flex; align-items: baseline; gap: 6px; color: var(--ink);
            flex-shrink: 0; cursor: pointer;
        }
        .wordmark .count {
            font-family: var(--font-mono); font-size: 8px; font-weight: 400;
            color: var(--ink-light); letter-spacing: 0.04em;
        }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: auto; }
        .topbar-right .btn { font-size: 9px; min-height: 32px; padding: 4px 10px; }
        .topbar-appearance-wrapper { position: relative; display: flex; align-items: center; }

        .breadcrumb {
            display: flex; align-items: center; gap: 4px;
            font-family: var(--font-mono); font-size: 9px; letter-spacing: .06em;
            text-transform: uppercase; color: var(--ink-light);
            flex: 1; min-width: 0; overflow: hidden; padding: 0 4px;
        }
        .breadcrumb-item {
            background: none; border: none; padding: 3px 6px; cursor: pointer;
            font: inherit; color: var(--ink-light);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 220px; border-radius: 4px;
            transition: color .15s ease, background .15s ease;
        }
        .breadcrumb-item:hover { color: var(--ink); background: var(--faint); }
        .breadcrumb-item.is-current { color: var(--ink); font-weight: 600; cursor: default; }
        .breadcrumb-item.is-current:hover { background: none; }
        .breadcrumb-sep { color: var(--ink-lighter); opacity: .55; flex-shrink: 0; }

        .mobile-back { display: none; font-size: 9px; min-height: 32px; padding: 4px 10px; flex-shrink: 0; }
        .mobile-menu-btn { display: none; font-size: 15px; min-height: 32px; padding: 4px 12px; line-height: 1; }

        @media (max-width: 640px) {
            .breadcrumb { display: none; }
            .mobile-back:not([hidden]) { display: inline-flex; }
            .mobile-menu-btn { display: inline-flex; }
        }

        .viewport-blur {
            position: fixed; left: 0; right: 0; z-index: 40; pointer-events: none;
            backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
            transition: backdrop-filter 0.3s ease, background 0.4s ease;
        }
        .viewport-blur.scrolling { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(8px); }
        .viewport-blur-top {
            top: 0; height: calc(var(--topbar-height) + 36px);
            background: linear-gradient(to bottom, rgba(var(--nav-bg-rgb), 0.7), rgba(var(--nav-bg-rgb), 0));
            mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
        }
        .viewport-blur-bottom {
            bottom: 0; height: calc(var(--hud-height) + 60px);
            background: linear-gradient(to top, rgba(var(--nav-bg-rgb), 0.7), rgba(var(--nav-bg-rgb), 0));
            mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
        }

        .canvas-root {
            position: fixed; inset: 0; z-index: 50; overflow: hidden;
            background: var(--bg);
            cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
        }
        .canvas-root.panning { cursor: grabbing; }
        .canvas-root.panning .canvas-node { pointer-events: none; }

        .canvas-surface {
            position: absolute; top: 0; left: 0; width: 0; height: 0;
            transform-origin: 0 0; will-change: transform;
        }
        .canvas-surface::before {
            content: '';
            position: absolute;
            top: -10000px; left: -10000px;
            width: 20000px; height: 20000px;
            background-image:
                repeating-linear-gradient(to right, var(--grid-col-line) 0 1px, transparent 1px var(--col-pitch)),
                repeating-linear-gradient(to bottom, var(--grid-row-line) 0 1px, transparent 1px var(--row-pitch));
            background-position: 10000px 0, 0 10000px;
            background-repeat: repeat;
            pointer-events: none; z-index: 0;
            opacity: var(--grid-overlay-opacity);
            transition: opacity 0.2s ease;
        }
        body.show-grid .canvas-surface::before { opacity: 1; }
        body.dragging-node .canvas-surface::before { opacity: 1; }

        .canvas-edges {
            position: absolute; top: 0; left: 0;
            width: 1px; height: 1px;
            overflow: visible; pointer-events: none; z-index: 1;
        }
        .canvas-edge {
            stroke: rgba(var(--fg-rgb), .22); stroke-width: 1;
            fill: none; stroke-dasharray: 2 4;
            transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        body.has-focus .canvas-edge[data-focus="false"] {
            opacity: 0.15;
        }

        .canvas-node {
            position: absolute;
            cursor: grab; user-select: none; -webkit-user-select: none;
            z-index: 2;
            transition:
                left 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.15s ease,
                filter 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: left, top, filter;
        }
        /* Disable the grab cursor when expanded to indicate it cannot be dragged */
        .canvas-node.is-expanded {
            cursor: default !important;
        }
        .canvas-node:not(.dragging) {
            box-shadow: none !important;
        }
        .canvas-node.dragging {
            cursor: grabbing;
            transition: box-shadow 0.15s ease;
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.18), 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        body.has-focus .canvas-node:not(.is-focused) {
            filter: blur(2.5px) saturate(0.7);
            opacity: 0.45;
        }
        body.has-focus .canvas-node.is-focused {
            z-index: 200 !important;
        }
        body.has-focus .canvas-node.is-focused .cluster-title > .prov-card {
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.12),
                0 3px 8px rgba(0, 0, 0, 0.06);
        }

        .prov-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); box-shadow: var(--shadow);
            padding: 16px 18px 14px;
            display: flex; flex-direction: column; gap: 10px;
            width: var(--card-w); min-height: 260px;
            cursor: pointer; position: relative; overflow: hidden;
            transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease;
        }

        @media (hover: hover) and (pointer: fine) {
            .prov-card:hover { box-shadow: var(--shadow-hover); }
            .canvas-node:not(.dragging):hover .prov-card { transform: translateY(-2px); }
        }

        .prov-card-kicker {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            font-family: var(--font-mono); font-size: 8px; font-weight: 600;
            letter-spacing: .12em; text-transform: uppercase; color: var(--ink-light);
        }
        .prov-card-type { display: flex; align-items: center; gap: 6px; }
        .prov-card-type::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: var(--ink-lighter);
        }
        .prov-card[data-type="cluster"] .prov-card-type::before { background: var(--ink); }
        .prov-card[data-type="statement"] .prov-card-type::before { background: var(--ink); }
        .prov-card[data-type="evidence"] .prov-card-type::before { background: var(--impact-gain); }
        .prov-card[data-type="reply"] .prov-card-type::before { background: var(--impact-accent); }
        .prov-card[data-type="update"] .prov-card-type::before { background: var(--impact-loss); }
        .prov-card[data-type="identity"] .prov-card-type::before { background: var(--accent); }

        .prov-card-status {
            padding: 1px 7px; border-radius: 999px; font-size: 7px;
            border: 1px solid currentColor; color: var(--ink-light);
            letter-spacing: .08em; white-space: nowrap;
        }
        .prov-card-status[data-status="published"] { color: var(--ink); }
        .prov-card-status[data-status="verified"]  { color: var(--impact-gain); }
        .prov-card-status[data-status="contested"] { color: var(--impact-loss); }
        .prov-card-status[data-status="revised"]   { color: var(--impact-accent); }
        .prov-card-status[data-status="draft"]     { color: var(--ink-light); border-style: dashed; }
        .prov-card-status[data-status="archived"]  { color: var(--ink-lighter); }

        .prov-card-title {
            font-family: var(--font); font-size: 17px; font-weight: 700;
            letter-spacing: -.01em; line-height: 1.2; color: var(--ink); margin: 0;
        }
        .prov-card-deck {
            font-size: 12.5px; line-height: 1.5; color: var(--ink-mid); margin: 0;
            display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .prov-card-meta {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; margin-top: auto;
            padding-top: 12px; border-top: 1px solid var(--border);
            font-family: var(--font-mono); font-size: 8px; letter-spacing: .06em;
            text-transform: uppercase; color: var(--ink-light);
        }
        .prov-card-source { display: flex; align-items: center; gap: 4px; }
        .prov-card-relations { display: flex; gap: 8px; }
        .prov-card-relation { display: flex; align-items: center; gap: 3px; opacity: .75; }
        .prov-card-relation strong { font-weight: 600; color: var(--ink-mid); }

        .prov-card[data-type="cluster"] {
            background: var(--accent); border-color: var(--accent); color: #1c1c1e;
            width: var(--card-w); min-height: 280px;
            --fg: #1c1c1e; --fg-rgb: 28, 28, 30;
            --ink: #1c1c1e;
            --ink-mid: rgba(28, 28, 30, .78);
            --ink-light: rgba(28, 28, 30, .60);
            --ink-lighter: rgba(28, 28, 30, .40);
            --border: rgba(28, 28, 30, .18);
            --faint: rgba(28, 28, 30, .06);
            --card: #1c1c1e;
            --impact-gain: #2F6B4F;
            --impact-loss: #C63A2A;
            --impact-accent: #6b5f14;
        }
        .prov-card[data-type="cluster"] .prov-card-title,
        .prov-card[data-type="cluster"] .prov-card-deck,
        .prov-card[data-type="cluster"] .prov-card-kicker,
        .prov-card[data-type="cluster"] .prov-card-meta,
        .prov-card[data-type="cluster"] .prov-card-source,
        .prov-card[data-type="cluster"] .prov-card-relation { color: #1c1c1e; }
        .prov-card[data-type="cluster"] .prov-card-deck { color: rgba(28,28,30,.72); }
        .prov-card[data-type="cluster"] .prov-card-meta { border-top-color: rgba(28,28,30,.18); color: rgba(28,28,30,.62); }
        .prov-card[data-type="cluster"] .prov-card-status,
        .prov-card[data-type="cluster"] .prov-card-status[data-status] {
            color: #1c1c1e; border-color: rgba(28, 28, 30, .45); border-style: solid;
        }

        .prov-card[data-type="identity"] {
            background: #ffffff;
            border-color: rgba(0, 0, 0, .10);
            color: #1c1c1e;
            width: var(--card-w);
            min-height: 300px;
            --fg: #1c1c1e; --fg-rgb: 28, 28, 30;
            --ink: #1c1c1e;
            --ink-mid: rgba(28, 28, 30, .78);
            --ink-light: rgba(28, 28, 30, .58);
            --ink-lighter: rgba(28, 28, 30, .35);
            --border: rgba(28, 28, 30, .14);
            --faint: rgba(28, 28, 30, .06);
            --impact-gain: #2F6B4F;
            --impact-loss: #C63A2A;
            --impact-accent: #8A7A1F;
        }
        .prov-card[data-type="identity"] .prov-card-title,
        .prov-card[data-type="identity"] .prov-card-deck,
        .prov-card[data-type="identity"] .prov-card-kicker,
        .prov-card[data-type="identity"] .prov-card-meta,
        .prov-card[data-type="identity"] .prov-card-source { color: #1c1c1e; }
        .prov-card[data-type="identity"] .prov-card-deck { color: rgba(28,28,30,.62); }
        .prov-card[data-type="identity"] .prov-card-meta { border-top-color: rgba(28,28,30,.14); color: rgba(28,28,30,.55); }
        .prov-card[data-type="identity"] .prov-card-status {
            color: #1c1c1e; border-color: rgba(28,28,30,.45);
        }

        .identity-monogram {
            width: 48px; height: 48px; border-radius: 10px;
            background: var(--accent); color: #1c1c1e;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 20px;
            letter-spacing: -0.02em; flex-shrink: 0;
        }
        .identity-role {
            font-family: var(--font-mono); font-size: 9px;
            letter-spacing: .06em; text-transform: uppercase;
            color: var(--ink-light); margin: 0;
        }
        .identity-meta {
            display: flex; gap: 12px;
            font-family: var(--font-mono); font-size: 9px;
            color: var(--ink-light); letter-spacing: .04em;
            text-transform: uppercase;
        }
        .identity-stats {
            display: flex; gap: 16px;
            font-family: var(--font-mono); font-size: 9px;
            color: var(--ink-light);
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .identity-stats strong { color: var(--ink); font-weight: 600; margin-right: 4px; }
        .identity-availability {
            font-family: var(--font-mono); font-size: 8px;
            letter-spacing: .08em; text-transform: uppercase;
            padding: 1px 7px; border-radius: 999px;
            border: 1px solid currentColor;
            color: var(--ink-light);
        }
        .identity-availability[data-availability="open"] { color: var(--impact-gain); }
        .identity-availability[data-availability="engaged"] { color: var(--impact-accent); }
        .identity-availability[data-availability="hiring"] { color: var(--impact-loss); }

        .prov-card[data-type="index"] {
            width: var(--card-w); min-height: 280px;
            padding: 14px 14px 12px; gap: 8px;
        }
        .prov-card[data-type="index"] .prov-card-title { font-size: 15px; }
        .index-list {
            list-style: none; display: flex; flex-direction: column;
            margin: 2px 0 0; padding: 0;
            font-family: var(--font-mono); font-size: 10px;
            flex: 1;
        }
        .index-row {
            display: grid;
            grid-template-columns: 22px 1fr auto auto;
            gap: 8px; align-items: center;
            padding: 7px 6px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s ease;
            border-radius: 4px;
            color: var(--ink-mid);
        }
        .index-row:last-child { border-bottom: none; }
        .index-row:hover { background: var(--faint); color: var(--ink); }
        .index-num { color: var(--ink-light); font-weight: 600; font-size: 9px; }
        .index-title {
            color: var(--ink); font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .index-count { color: var(--ink-light); font-size: 9px; }
        .index-status {
            font-size: 6.5px; letter-spacing: .08em; text-transform: uppercase;
            padding: 1px 5px; border-radius: 999px;
            border: 1px solid currentColor;
            color: var(--ink-light); white-space: nowrap;
        }
        .index-status[data-status="published"] { color: var(--ink); }
        .index-status[data-status="verified"] { color: var(--impact-gain); }
        .index-status[data-status="contested"] { color: var(--impact-loss); }
        .index-status[data-status="revised"] { color: var(--impact-accent); }
        .index-status[data-status="draft"] { color: var(--ink-light); border-style: dashed; }
        .index-status[data-status="archived"] { color: var(--ink-lighter); }

        .cluster-stack {
            display: flex; align-items: flex-start; gap: 24px;
            position: relative;
            box-shadow: none !important;
        }
        .cluster-stack[data-expanded="true"] { padding-bottom: 40px; }
        .cluster-stack-inner { position: relative; flex-shrink: 0; }
        .cluster-title { position: relative; z-index: 10; }
        .cluster-title > .prov-card { position: relative; z-index: 10; }

        /* ═══ CLUSTER PEEK STACK — depth cues ═══ */
        .cluster-peek {
            position: absolute; inset: 0;
            background: var(--peek-bg);
            border: 1px solid var(--peek-border);
            border-radius: var(--radius-sm);
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.25s ease;
        }
        .cluster-peek[data-depth="1"] { transform: translate(4px, 8px);  z-index: 4; }
        .cluster-peek[data-depth="2"] { transform: translate(8px, 16px); z-index: 3; }
        .cluster-peek[data-depth="3"] { transform: translate(12px, 24px); z-index: 2; }
        .cluster-peek[data-depth="4"] { transform: translate(16px, 32px); z-index: 1; }

        .cluster-peek-hit {
            position: absolute;
            left: -2px; right: -14px; top: 100%;
            height: 48px; z-index: 20;
            cursor: pointer;
        }
        .cluster-stack[data-expanded="true"] .cluster-peek-hit { display: none; }

        @media (hover: none) {
            .cluster-peek { display: none !important; }
        }

        @media (hover: hover) and (pointer: fine) {
            .cluster-peek-hit:hover ~ .cluster-peek[data-depth="1"] { transform: translate(6px, 12px); }
            .cluster-peek-hit:hover ~ .cluster-peek[data-depth="2"] { transform: translate(12px, 24px); }
            .cluster-peek-hit:hover ~ .cluster-peek[data-depth="3"] { transform: translate(18px, 36px); }
            .cluster-peek-hit:hover ~ .cluster-peek[data-depth="4"] { transform: translate(24px, 48px); }
        }

        .cluster-stack[data-expanded="true"] .cluster-peek,
        .cluster-stack[data-expanded="true"] .cluster-peek-hit {
            display: none !important;
            visibility: hidden !important;
            box-shadow: none !important;
            background: transparent !important;
            border-color: transparent !important;
        }

        .cluster-leaves {
            position: relative; display: none;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 16px;
            max-width: var(--card-w);
            flex-shrink: 0;
            box-shadow: none !important;
        }
        .cluster-stack[data-expanded="true"] .cluster-leaves { display: flex; }
        @media (min-width: 720px) { .cluster-leaves { max-width: calc(var(--card-w) * 2 + 16px * 2 + 4px); } }
        @media (min-width: 1080px) { .cluster-leaves { max-width: calc(var(--card-w) * 3 + 16px * 2 + 4px); } }

        .cluster-collapse-chip {
            display: none;
            position: absolute;
            top: -32px; right: 0;
            padding: 4px 12px;
            background: var(--accent); color: #1c1c1e;
            border: 1px solid rgba(28, 28, 30, 0.18);
            border-radius: 999px;
            font-family: var(--font-mono); font-size: 8px;
            font-weight: 600; letter-spacing: 0.08em;
            text-transform: uppercase; cursor: pointer;
            z-index: 15;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .cluster-collapse-chip:hover { background: #d8d855; }
        .cluster-collapse-chip:active { transform: scale(0.96); }
        .cluster-stack[data-expanded="true"] .cluster-collapse-chip { display: inline-flex; }
        body[data-layout="array"] .cluster-collapse-chip { display: none !important; }
        body[data-layout="array"] .cluster-peek-hit { display: none !important; }
        body[data-layout="array"] .cluster-peek { display: none !important; }

        .cluster-leaf {
            cursor: pointer;
            animation: leaf-in 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }
        .cluster-leaf:nth-child(1) { animation-delay: 0.02s; }
        .cluster-leaf:nth-child(2) { animation-delay: 0.06s; }
        .cluster-leaf:nth-child(3) { animation-delay: 0.10s; }
        .cluster-leaf:nth-child(4) { animation-delay: 0.14s; }
        .cluster-leaf:nth-child(5) { animation-delay: 0.18s; }
        .cluster-leaf:nth-child(6) { animation-delay: 0.22s; }
        @keyframes leaf-in {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        .cluster-leaf > .prov-card { width: var(--card-w); min-height: 260px; }

        body[data-layout="array"] .cluster-leaves {
            max-width: none;
            flex-wrap: nowrap;
            overflow: visible;
        }

        /* ═══ CONTEXT MENUS ═══ */
        .canvas-context-menu {
            position: fixed; z-index: 300;
            min-width: 208px; padding: 6px 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow-floating), 0 0 0 1px rgba(0,0,0,0.02);
            font-family: var(--font-mono);
            display: none;
            user-select: none; -webkit-user-select: none;
        }
        .canvas-context-menu.open {
            display: block;
            animation: ctx-in 0.12s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        @keyframes ctx-in {
            from { opacity: 0; transform: translateY(-4px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .ctx-section-label {
            padding: 4px 14px 6px;
            font-size: 8px; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--ink-light);
        }
        .ctx-item {
            display: flex; align-items: center; gap: 10px;
            width: 100%; padding: 7px 14px;
            background: none; border: none;
            text-align: left; font-family: inherit;
            font-size: 10px; letter-spacing: 0.06em;
            text-transform: uppercase; color: var(--ink-mid);
            cursor: pointer;
        }
        .ctx-item:hover { background: var(--bg); color: var(--ink); }
        .ctx-indicator {
            width: 8px; height: 8px; border-radius: 50%;
            border: 1px solid var(--ink-lighter);
            flex-shrink: 0;
        }
        .ctx-item.active .ctx-indicator { background: var(--ink); border-color: var(--ink); }
        .ctx-item.no-indicator .ctx-indicator { visibility: hidden; }
        .ctx-divider { height: 1px; background: var(--border); margin: 5px 0; }
        .ctx-hint {
            padding: 4px 14px 6px;
            font-size: 8px; letter-spacing: 0.06em;
            color: var(--ink-light); text-transform: none;
            opacity: 0.75; border-top: 1px solid var(--border);
            margin-top: 5px; padding-top: 8px;
        }

        /* ═══ LETTER-NAV INDEX MENU ═══ */
        #letterNavContextMenu {
            min-width: 240px;
            max-width: 320px;
            max-height: min(70vh, 520px);
            overflow-y: auto;
            overscroll-behavior: contain;
        }
        #letterNavContextMenu .ctx-item {
            text-transform: none;
            letter-spacing: 0;
            font-family: var(--font);
            font-size: 11px;
            padding: 8px 14px;
        }
        #letterNavContextMenu .ctx-item .ctx-item-num {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--ink-light);
            min-width: 18px;
            flex-shrink: 0;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        #letterNavContextMenu .ctx-item .ctx-item-title {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #letterNavContextMenu .ctx-item .ctx-item-count {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--ink-light);
            flex-shrink: 0;
            letter-spacing: 0.06em;
        }

        /* ═══ WIDGET / MINIMAP / ZOOM HUD ═══ */
        .canvas-widget {
            position: fixed; top: calc(var(--topbar-height) + 8px); right: var(--margin);
            z-index: 95;
            display: flex; align-items: center; gap: 2px;
            background: color-mix(in srgb, var(--bg) 92%, transparent);
            backdrop-filter: blur(16px) saturate(1.1);
            -webkit-backdrop-filter: blur(16px) saturate(1.1);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 4px 6px 4px 4px;
            box-shadow: var(--shadow-floating);
            font-family: var(--font-mono);
            max-width: calc(100vw - 16px);
        }
        .canvas-widget.dragging {
            cursor: grabbing;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.06);
        }
        .widget-grip {
            display: flex; align-items: center; justify-content: center;
            width: 20px; height: 26px;
            background: none; border: none;
            color: var(--ink-light); cursor: grab;
            border-radius: 4px; flex-shrink: 0;
            padding: 0; touch-action: none;
        }
        .widget-grip:hover { background: var(--faint); color: var(--ink); }
        .widget-grip svg { display: block; }
        .widget-controls { display: flex; align-items: center; gap: 2px; }
        .widget-controls .btn {
            min-height: 26px; font-size: 8px; padding: 3px 8px;
            border-color: transparent; color: var(--ink-mid);
        }
        .widget-controls .btn:hover { border-color: var(--ink); }
        .widget-controls .btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
        .widget-divider { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
        .widget-close {
            display: flex; align-items: center; justify-content: center;
            width: 20px; height: 26px;
            background: none; border: none;
            color: var(--ink-light); font-size: 14px; line-height: 1;
            cursor: pointer; border-radius: 4px;
            flex-shrink: 0; padding: 0; margin-left: 2px;
        }
        .widget-close:hover { background: var(--faint); color: var(--ink); }

        .canvas-minimap {
            position: fixed; z-index: 96;
            bottom: 24px; right: var(--margin);
            width: 220px;
            background: color-mix(in srgb, var(--bg) 94%, transparent);
            backdrop-filter: blur(16px) saturate(1.1);
            -webkit-backdrop-filter: blur(16px) saturate(1.1);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-floating);
            font-family: var(--font-mono);
            user-select: none; -webkit-user-select: none;
            overflow: hidden;
        }
        @media (max-width: 640px) {
            .canvas-minimap { width: 180px; }
            .minimap-viewport { height: 110px; }
        }
        .minimap-header {
            display: flex; align-items: center; gap: 4px;
            padding: 4px 6px 4px 4px;
            border-bottom: 1px solid var(--border);
        }
        .minimap-grip {
            display: flex; align-items: center; justify-content: center;
            width: 20px; height: 22px;
            background: none; border: none;
            color: var(--ink-light); cursor: grab;
            border-radius: 4px; flex-shrink: 0; padding: 0;
            touch-action: none;
        }
        .minimap-grip:hover { background: var(--faint); color: var(--ink); }
        .minimap-label {
            flex: 1; padding-left: 2px;
            font-size: 8px; font-weight: 600;
            letter-spacing: 0.14em; text-transform: uppercase;
            color: var(--ink-light);
        }
        .minimap-close {
            display: flex; align-items: center; justify-content: center;
            width: 20px; height: 22px;
            background: none; border: none;
            color: var(--ink-light); font-size: 14px; line-height: 1;
            cursor: pointer; border-radius: 4px; flex-shrink: 0; padding: 0;
        }
        .minimap-close:hover { background: var(--faint); color: var(--ink); }
        .minimap-viewport {
            position: relative; width: 100%; height: 140px;
            overflow: hidden; cursor: crosshair;
            background-image: radial-gradient(circle, rgba(var(--fg-rgb), 0.09) 1px, transparent 1px);
            background-size: 12px 12px;
            touch-action: none;
        }
        .minimap-content {
            position: absolute; top: 0; left: 0;
            transform-origin: 0 0; will-change: transform;
            pointer-events: none;
        }
        .minimap-node {
            position: absolute; box-sizing: border-box;
            border-radius: 1.5px;
            background: color-mix(in srgb, var(--ink) 45%, transparent);
            border: 1px solid color-mix(in srgb, var(--ink) 65%, transparent);
        }
        .minimap-node[data-kind="identity"] { background: #ffffff; border-color: rgba(0, 0, 0, .40); }
        .minimap-node[data-kind="cluster"] {
            background: var(--accent);
            border-color: color-mix(in srgb, var(--accent) 60%, #1c1c1e);
        }
        .minimap-frame {
            position: absolute; box-sizing: border-box;
            border: 1.5px solid var(--accent);
            background: rgba(229, 229, 103, 0.14);
            border-radius: 2px; pointer-events: none;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.14);
        }

        .canvas-zoomhud {
            position: fixed; z-index: 96;
            top: calc(var(--topbar-height) + 12px);
            left: 50%;
            transform: translateX(-50%);
            display: flex; align-items: center; gap: 2px;
            background: color-mix(in srgb, var(--bg) 92%, transparent);
            backdrop-filter: blur(16px) saturate(1.1);
            -webkit-backdrop-filter: blur(16px) saturate(1.1);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 4px 6px 4px 4px;
            box-shadow: var(--shadow-floating);
            font-family: var(--font-mono);
            max-width: calc(100vw - 16px);
            user-select: none;
            -webkit-user-select: none;
        }
        .canvas-zoomhud.dragging {
            cursor: grabbing;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.06);
        }
        .zoomhud-grip {
            display: flex; align-items: center; justify-content: center;
            width: 20px; height: 26px;
            background: none; border: none;
            color: var(--ink-light); cursor: grab;
            border-radius: 4px; flex-shrink: 0;
            padding: 0; touch-action: none;
        }
        .zoomhud-grip:hover { background: var(--faint); color: var(--ink); }
        .zoomhud-grip svg { display: block; }
        .zoomhud-controls { display: flex; align-items: center; gap: 2px; }
        .zoomhud-controls .btn {
            min-height: 26px; font-size: 8px; padding: 3px 8px;
            border-color: transparent; color: var(--ink-mid);
        }
        .zoomhud-controls .btn:hover { border-color: var(--ink); }
        .zoomhud-zoom-btn {
            width: 26px; padding: 0 !important;
            font-size: 14px; line-height: 1;
            font-family: var(--font-mono);
        }
        .zoomhud-percent {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 46px; height: 26px; padding: 0 6px;
            background: none; border: 1px solid transparent;
            color: var(--ink); cursor: pointer;
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
            font-size: 10px; font-weight: 600;
            letter-spacing: 0.02em;
            border-radius: var(--radius-sm);
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        .zoomhud-percent:hover { background: var(--faint); border-color: var(--border); }
        .zoomhud-percent:active { transform: scale(0.96); }
        .zoomhud-divider { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
        .zoomhud-close {
            display: flex; align-items: center; justify-content: center;
            width: 20px; height: 26px;
            background: none; border: none;
            color: var(--ink-light); font-size: 14px; line-height: 1;
            cursor: pointer; border-radius: 4px;
            flex-shrink: 0; padding: 0; margin-left: 2px;
        }
        .zoomhud-close:hover { background: var(--faint); color: var(--ink); }

        .letters-viewport { position: relative; overflow: hidden; width: 100vw; left: 50%; margin-left: -50vw; }
        .letters-track {
            display: flex; align-items: flex-start; gap: 22px;
            padding-top: clamp(20px, 4vh, 60px); padding-bottom: 60px;
            padding-left: max(4vw, calc(50% - 520px));
            padding-right: max(4vw, calc(50% - 520px));
            overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; cursor: grab; user-select: none; box-sizing: border-box;
        }
        .letters-track.dragging { cursor: grabbing; scroll-snap-type: none; scroll-behavior: auto; }
        .letter-panel {
            flex: 0 0 auto; width: min(92vw, 1000px); max-width: 1000px;
            scroll-snap-align: center; box-sizing: border-box;
            opacity: 0.35; transition: opacity 0.3s ease, transform 0.3s ease; cursor: pointer;
        }
        .letter-panel.active { opacity: 1; cursor: auto; }

        .letter-hotspot {
            position: absolute; top: 0; bottom: 0;
            width: clamp(72px, 11vw, 220px);
            z-index: 20; cursor: pointer;
            display: flex; align-items: center;
            opacity: 0.35;
            transition: opacity 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .letter-hotspot-prev { left: 0; justify-content: flex-start; padding-left: clamp(12px, 2.5vw, 36px); }
        .letter-hotspot-next { right: 0; justify-content: flex-end; padding-right: clamp(12px, 2.5vw, 36px); }
        .letter-hotspot:hover { opacity: 1; }

        .hotspot-chevron {
            display: flex; align-items: center; justify-content: center;
            width: 48px; height: 48px;
            border-radius: 50%;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            color: var(--ink);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.2s ease,
                        background 0.2s ease;
        }
        .hotspot-chevron svg { width: 18px; height: 18px; display: block; }

        .letter-hotspot-prev:hover .hotspot-chevron {
            transform: translateX(-4px);
            box-shadow: var(--shadow-hover);
        }
        .letter-hotspot-next:hover .hotspot-chevron {
            transform: translateX(4px);
            box-shadow: var(--shadow-hover);
        }

        @media (max-width: 640px) {
            .letter-hotspot { display: none; }
        }

        .letter-card-frame {
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 28px clamp(20px, 3vw, 36px) 40px;
            background: var(--card); box-shadow: var(--shadow);
            transition: box-shadow 0.3s ease, transform 0.3s ease; position: relative;
        }
        .letter-panel.active .letter-card-frame { box-shadow: var(--shadow-hover); }
        .letter-cover {
            display: flex; flex-direction: column; gap: 6px;
            padding-bottom: 18px; margin-bottom: 24px; border-bottom: 1px solid var(--border);
        }
        .letter-cover-kicker {
            font-family: var(--font-mono); font-size: 9px; font-weight: 600;
            letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-light);
        }
        .letter-cover-name {
            font-family: var(--font); font-size: clamp(22px, 3vw, 34px);
            font-weight: 700; letter-spacing: -0.02em; color: var(--ink);
        }
        .letter-cover-deck {
            font-size: clamp(13px, 1vw, 16px); line-height: 1.5;
            color: var(--ink-light); max-width: 520px;
        }
        .letter-provenance {
            display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center;
            padding-top: 14px; margin-top: 6px; border-top: 1px dashed var(--border);
            font-family: var(--font-mono); font-size: 9px; letter-spacing: .06em;
            text-transform: uppercase; color: var(--ink-light);
        }
        .letter-provenance-field { display: inline-flex; gap: 6px; align-items: baseline; }
        .letter-provenance-field strong { font-weight: 600; color: var(--ink-mid); letter-spacing: .1em; }
        .letter-provenance-status {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor;
            font-size: 8px; font-weight: 600; color: var(--ink);
        }
        .letter-provenance-status[data-status="verified"]  { color: var(--impact-gain); }
        .letter-provenance-status[data-status="contested"] { color: var(--impact-loss); }
        .letter-provenance-status[data-status="draft"]     { color: var(--ink-light); border-style: dashed; }
        .letter-provenance-status[data-status="revised"]   { color: var(--impact-accent); }

        .letter-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
        .letter-toolbar .letter-count { font-family: var(--font-mono); font-size: 8px; color: var(--ink-light); margin-left: auto; }

        .swiss-grid {
            display: grid; grid-template-columns: repeat(var(--swiss-columns), 1fr);
            gap: var(--swiss-gap); width: 100%; position: relative;
        }
        .swiss-grid > * { min-width: 0; }
        .swiss-col, [class*="swiss-col-span-"] {
            grid-column: var(--swiss-col-start, auto) / span var(--swiss-col-span, 1);
            position: relative; transition: outline 0.2s ease, background 0.2s ease; min-width: 0;
        }
        .swiss-col-span-1  { --swiss-col-span: 1; }
        .swiss-col-span-2  { --swiss-col-span: 2; }
        .swiss-col-span-3  { --swiss-col-span: 3; }
        .swiss-col-span-4  { --swiss-col-span: 4; }
        .swiss-col-span-5  { --swiss-col-span: 5; }
        .swiss-col-span-6  { --swiss-col-span: 6; }

        body.show-grid .swiss-col,

            background: repeating-linear-gradient(90deg,
                transparent 0px, transparent calc(var(--swiss-gap) / 2 - 0.5px),
                var(--grid-gutter) calc(var(--swiss-gap) / 2 - 0.5px),
                var(--grid-gutter) calc(var(--swiss-gap) / 2 + 0.5px),

        .letter-accordion { max-width: 820px; margin: 0 0 40px; border-top: 1px solid var(--border); }
        .letter-accordion-item { border-bottom: 1px solid var(--border); }
        .letter-accordion-trigger {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            gap: 16px; padding: 20px 0; background: none; border: none; cursor: pointer;
            text-align: left; font-family: inherit; color: var(--fg); transition: color 0.15s ease;
        }
        .letter-accordion-trigger:hover { color: rgba(var(--fg-rgb), .7); }
        .letter-accordion-num { font-family: var(--font-mono); font-size: 11px; color: var(--ink-light); margin-right: 14px; flex-shrink: 0; }
        .letter-accordion-title { flex: 1; font-size: clamp(17px, 1.9vw, 21px); font-weight: 700; letter-spacing: -.005em; color: var(--fg); }
        .letter-accordion-icon {
            flex-shrink: 0; width: 22px; height: 22px; display: flex; align-items: center;
            justify-content: center; font-size: 16px; color: var(--ink-light);
            transition: transform .3s cubic-bezier(.16, 1, .3, 1);
        }
        .letter-accordion-item.is-open .letter-accordion-icon { transform: rotate(45deg); }
        .letter-accordion-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s cubic-bezier(.16, 1, .3, 1); }
        .letter-accordion-item.is-open .letter-accordion-panel { grid-template-rows: 1fr; }
        .letter-accordion-panel-inner { overflow: hidden; min-height: 0; }
        .letter-accordion-panel-inner p { font-size: 15px; line-height: 1.7; color: var(--ink-mid); margin: 0 0 20px; }
        .letter-accordion-item.is-open .letter-accordion-panel-inner { padding-bottom: 22px; }

        .letter-never-toggle { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; font-family: var(--font-mono); }
        .letter-never-toggle button {
            padding: 5px 12px; border: 1px solid var(--border); background: none;
            color: var(--ink-light); cursor: pointer; font-family: inherit;
            font-size: 10px; letter-spacing: .04em; text-transform: uppercase;
            border-radius: 2px; transition: color .15s, border-color .15s, background .15s;
        }
        .letter-never-toggle button.active { color: var(--fg); border-color: var(--fg); background: rgba(var(--fg-rgb), .06); }
        .letter-never-list {
            list-style: none; display: flex; flex-direction: column; gap: 26px;
            margin: 0 0 44px; padding: 0; max-width: 820px; counter-reset: never-item;
        }
        .letter-never-item { display: flex; gap: 16px; align-items: baseline; counter-increment: never-item; }
        .letter-never-marker { flex: 0 0 auto; min-width: 22px; font-family: var(--font-mono); font-size: 13px; color: var(--ink-light); }
        .letter-never-list.is-numbered .letter-never-marker::before { content: counter(never-item) "."; }
        .letter-never-list.is-bulleted .letter-never-marker::before { content: "—"; }
        .letter-never-body { flex: 1; min-width: 0; }
        .letter-never-statement {
            font-size: clamp(18px, 2vw, 22px); font-weight: 700;
            line-height: 1.3; letter-spacing: -.005em; color: var(--fg); margin: 0;
        }
        .letter-never-context { margin: 6px 0 0; font-size: 13px; line-height: 1.5; font-style: italic; color: var(--ink-light); }

        .hud {
            position: fixed; left: 50%; transform: translateX(-50%);
            z-index: 100;
            background: color-mix(in srgb, var(--bg) 92%, transparent);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: var(--radius);
            box-shadow: var(--shadow-floating);
            display: flex; align-items: center; justify-content: center;
            min-height: 44px; font-family: var(--font-mono);
            max-width: min(520px, calc(100vw - var(--margin) * 2));
        }
        .hud-top {
            top: calc(var(--topbar-height) + 8px);
            padding: 6px 12px 6px 6px;
            gap: 4px;
            user-select: none;
            -webkit-user-select: none;
        }
        .hud-top.dragging {
            cursor: grabbing;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.06);
        }
        .hud-top-grip {
            display: flex; align-items: center; justify-content: center;
            width: 20px; height: 26px;
            background: none; border: none;
            color: var(--ink-light); cursor: grab;
            border-radius: 4px; flex-shrink: 0;
            padding: 0; touch-action: none;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .hud-top-grip:hover { background: var(--faint); color: var(--ink); }
        .hud-top-grip:active { cursor: grabbing; }
        .hud-top-grip svg { display: block; }

        .hud-bottom { bottom: calc(12px + var(--scrollbar-height)); padding: 10px 18px; min-height: 48px; gap: 12px; }
        .hud .btn { min-height: 30px; padding: 5px 10px; font-size: 8px; }

        .hud-nav-counter {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            padding: 0 6px;
            margin: 0 2px;
            background: none;
            color: inherit;
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
            line-height: 1;
            user-select: none;
            min-width: 0;
        }
        .hud-nav-counter .nav-current {
            font-size: 20px;
            font-weight: 700;
            color: var(--fg);
            letter-spacing: -0.03em;
            line-height: 1;
        }
        .hud-nav-counter .nav-slash {
            font-size: 13px;
            font-weight: 400;
            color: var(--ink-lighter);
            letter-spacing: 0;
            margin: 0 1px;
            transform: translateY(-1px);
        }
        .hud-nav-counter .nav-total {
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-light);
            letter-spacing: 0.01em;
            line-height: 1;
        }

        .hud-count { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--fg); line-height: 1; flex-shrink: 0; }
        .hud-sep { width: 1px; height: 12px; background: var(--border); flex-shrink: 0; display: block; }
        .hud-text {
            font-size: 9px; font-weight: 500; letter-spacing: .12em;
            text-transform: uppercase; color: var(--ink-light);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            min-width: 0;
        }
        .hud-mobile-only { display: none !important; }
        @media (max-width: 640px) {
            .hud-mobile-only:not([hidden]) { display: flex !important; }
            .hud-bottom { padding: 8px 14px; min-height: 44px; gap: 10px; }
            .hud .btn { font-size: 7px; padding: 4px 8px; min-height: 26px; }
        }

        /* ═══ MOBILE HUD — notification breadcrumb ═══ */
        #hudCanvas {
            bottom: calc(14px + var(--scrollbar-height) + env(safe-area-inset-bottom, 0px));
            padding: 0;
            gap: 8px;
            min-height: 0;
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            max-width: calc(100vw - 24px);

        #hudCanvas .hud-canvas-nav {
            display: flex; align-items: center; justify-content: center;
            width: 44px; height: 44px;
            background: color-mix(in srgb, var(--bg) 94%, transparent);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);

            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.10), 0 2px 6px rgba(0, 0, 0, 0.04);

            line-height: 1;

        }
        #hudCanvas .hud-canvas-nav:active { transform: scale(0.94); }

        .hud-canvas-notif {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 0 1 auto;
            padding: 10px 14px;
            background: color-mix(in srgb, var(--bg) 94%, transparent);

            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.10), 0 2px 6px rgba(0, 0, 0, 0.04);
            font-family: var(--font);
            color: var(--ink);
            cursor: pointer;
            max-width: 66vw;
            text-align: left;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;

        .hud-canvas-notif:active {
            transform: scale(0.97);
            background: color-mix(in srgb, var(--bg) 86%, transparent);

        .hud-canvas-notif.updating {
            animation: notif-pulse 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes notif-pulse {
            0%   { transform: scale(1);    }
            45%  { transform: scale(1.035); }

        }

        .notif-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);

        .notif-crumb {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: -0.005em;
            color: var(--ink);

            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;

        .notif-crumb-parent {
            font-family: var(--font-mono);

        .scroll-border-top, .scroll-border-bottom {
            position: fixed; height: 3px; background: var(--accent);
            z-index: 160; width: 0%; pointer-events: none;
            box-shadow: 0 0 10px rgba(229, 229, 103, 0.35);

        .scroll-border-top { top: 0; left: 0; border-radius: 0 2px 2px 0; }
        .scroll-border-bottom { bottom: 0; right: 0; border-radius: 2px 0 0 2px; }
        .scroll-border-corner { position: fixed; z-index: 160; pointer-events: none; background: var(--accent); opacity: 0; transition: opacity 0.3s ease; }
        .scroll-border-corner.show { opacity: 1; }
        .scroll-border-corner-tl { top: 0; left: 0; width: 6px; height: 6px; }
        .scroll-border-corner-tr { top: 0; right: 0; width: 6px; height: 6px; }
        .scroll-border-corner-bl { bottom: 0; left: 0; width: 6px; height: 6px; }
        .scroll-border-corner-br { bottom: 0; right: 0; width: 6px; height: 6px; }

        body.custom-cursor-active { cursor: none; }
        .write-cursor-dot, .write-cursor-ellipse {
            position: fixed; top: 0; left: 0; z-index: 500; pointer-events: none;
            transform: translate(-9999px, -9999px); opacity: 0;
            transition: opacity 0.18s ease, background-color .2s ease, border-color .2s ease;
            will-change: transform;
        }
        .write-cursor-dot.visible, .write-cursor-ellipse.visible { opacity: 1; }
        .write-cursor-dot { width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--ink); }
        .write-cursor-ellipse { width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 1.5px solid var(--ink); border-radius: 50%; opacity: 0; }
        .write-cursor-ellipse.visible { opacity: 0.32; }

        body.cursor-on-accent .write-cursor-ellipse { border-color: #1c1c1e; }
        body.cursor-on-light .write-cursor-dot { background: #1c1c1e; }
        body.cursor-on-light .write-cursor-ellipse { border-color: #1c1c1e; }

        @media (hover: none) {
            body.custom-cursor-active { cursor: auto; }

            display: grid;

            .cluster-stack { gap: 8px; }

            /* Slightly tighter peek offsets on mobile */

            body.show-grid .canvas-surface::before { opacity: 1; }
