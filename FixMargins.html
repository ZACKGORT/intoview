                    grip.addEventListener('pointerup', onUp);
                    grip.addEventListener('pointercancel', onUp);
                    e.preventDefault();
                });
            }

            /* ═══ NODE INTERACTION ═══ */
            function handleNodeTap(node, target) {
                if (target.closest && target.closest('.cluster-collapse-chip')) {
                    toggleCluster(node.dataset.clusterId); return;
                }
                if (target.closest && target.closest('.cluster-peek-hit')) {
                    if (isMobile()) {
                        focusedNodeId = node.dataset.clusterId;
                    }
                    toggleCluster(node.dataset.clusterId); return;
                }
                const leaf = target.closest && target.closest('.cluster-leaf');
                if (leaf) {
                    navigate({ level: 'card', clusterId: leaf.dataset.clusterId, cardId: leaf.dataset.cardId });
                    return;
                }
                if (target.closest && target.closest('.index-row')) {
                    const cid = target.closest('.index-row').dataset.clusterId;
                    if (cid) navigate({ level: 'cluster', clusterId: cid });
                    return;
                }
                if (node.dataset.kind === 'identity') {
                    navigate({ level: 'cluster', clusterId: 'identity' }); return;
                }
                if (node.dataset.kind === 'index') {
                    navigate({ level: 'cluster', clusterId: 'index' }); return;
                }
                if (node.dataset.kind === 'cluster') {
                    navigate({ level: 'cluster', clusterId: node.dataset.clusterId }); return;
                }
            }

            function attachNodeHandlers(node) {
                let dragState = null;

                node.addEventListener('pointerdown', (e) => {
                    if (e.button !== 0) return;

                    if (e.pointerType === 'touch') {
                        const startX = e.clientX, startY = e.clientY;
                        const target = e.target;
                        const onUp = (ev) => {
                            if (ev.pointerId !== e.pointerId) return;
                            node.removeEventListener('pointerup', onUp);
                            node.removeEventListener('pointercancel', onUp);
                            const d = Math.hypot(ev.clientX - startX, ev.clientY - startY);
                            if (d < 10) handleNodeTap(node, target);
                        };
                        node.addEventListener('pointerup', onUp);
                        node.addEventListener('pointercancel', onUp);
                        return;
                    }

                    dragState = {
                        startX: e.clientX, startY: e.clientY,
                        startLeft: parseFloat(node.style.left) || 0,
                        startTop: parseFloat(node.style.top) || 0,
                        origTarget: e.target, moved: false, pointerId: e.pointerId
                    };
                    try { node.setPointerCapture(e.pointerId); } catch (err) {}
                    node.classList.add('dragging');
                    node.style.zIndex = String(++topZ);
                    e.preventDefault();
                    e.stopPropagation();
                });

                node.addEventListener('pointermove', (e) => {
                    if (!dragState || e.pointerId !== dragState.pointerId) return;

                    // If the node is expanded, do not allow dragging
                    if (node.classList.contains('is-expanded')) return;

                    const dx = (e.clientX - dragState.startX) / scale;
                    const dy = (e.clientY - dragState.startY) / scale;
                    if (!dragState.moved && Math.hypot(dx * scale, dy * scale) > 4) {
                        dragState.moved = true;
                        document.body.classList.add('dragging-node');
                        if (canvasLayout === 'array' && node.dataset.kind === 'cluster') {
                            exitArrayForDrag(node);
                        }
                    }
                    if (!dragState.moved) return;
                    const x = dragState.startLeft + dx;
                    const y = dragState.startTop + dy;
                    node.style.left = x + 'px';
                    node.style.top = y + 'px';
                    const mmEl = minimapNodeEls.get(node.dataset.nodeId);
                    if (mmEl) { mmEl.style.left = x + 'px'; mmEl.style.top = y + 'px'; }
                });

                const endDrag = (e) => {
                    if (!dragState || (e && e.pointerId !== dragState.pointerId)) return;
                    const state = dragState;
                    dragState = null;
                    node.classList.remove('dragging');
                    document.body.classList.remove('dragging-node');
                    try { node.releasePointerCapture(state.pointerId); } catch (err) {}

                    if (state.moved) {
                        const colPitch = getColPitch();
                        const rowPitch = getRowPitch();
                        const nx = snapTo(parseFloat(node.style.left) || 0, colPitch);
                        const ny = snapTo(parseFloat(node.style.top) || 0, rowPitch);
                        node.style.left = nx + 'px';
                        node.style.top  = ny + 'px';
                        restPositions.set(node.dataset.nodeId, { x: nx, y: ny });
                        saveCanvasState();
                        requestAnimationFrame(() => drawCanvasEdges());
                        queueMinimapLayout();
                        return;
                    }

                    handleNodeTap(node, state.origTarget);
                };

                node.addEventListener('pointerup', endDrag);
                node.addEventListener('pointercancel', endDrag);
            }

            function exitArrayForDrag(draggedNode) {
                if (canvasLayout !== 'array') return;
                const draggedId = draggedNode.dataset.nodeId;
                const draggedX = parseFloat(draggedNode.style.left) || 0;
                const draggedY = parseFloat(draggedNode.style.top) || 0;

                expandedClusters.clear();
                document.querySelectorAll('.cluster-stack').forEach(s => s.dataset.expanded = 'false');
                document.querySelectorAll('.canvas-node[data-kind="cluster"]').forEach(n => n.classList.remove('is-expanded'));

                canvasLayout = 'grid';
                document.body.dataset.layout = 'grid';

                const specs = getCanvasNodes();
                const computed = getLayoutPositions('grid', specs);
                specs.forEach(s => {
                    if (s.id === draggedId) {
                        restPositions.set(s.id, { x: draggedX, y: draggedY });
                        return;
                    }
                    const pos = computed[s.id] || { x: 0, y: 0 };
                    restPositions.set(s.id, { x: pos.x, y: pos.y });
                    const n = document.querySelector(`.canvas-node[data-node-id="${CSS.escape(s.id)}"]`);
                    if (n) { n.style.left = pos.x + 'px'; n.style.top = pos.y + 'px'; }
                });
                applyFocus();
                updateCanvasToolbarUI();
                updateStatusText();
            }

            /* ═══ CLUSTER EXPAND / COLLAPSE ═══ */
            function toggleCluster(id) {
                if (!id) return;
                if (canvasLayout === 'array') return;
                const wasExpanded = expandedClusters.has(id);

                if (wasExpanded) expandedClusters.delete(id);
                else expandedClusters.add(id);

                const node = document.querySelector(`.canvas-node[data-cluster-id="${CSS.escape(id)}"]`);
                if (node) {
                    const stack = node.querySelector('.cluster-stack');
                    if (stack) stack.dataset.expanded = wasExpanded ? 'false' : 'true';
                    node.classList.toggle('is-expanded', !wasExpanded);
                }

                applyFocus();
                saveCanvasState();

                if (isMobile()) {
                    if (focusedNodeId !== id) {
                        focusedNodeId = id;
                    }
                    requestAnimationFrame(() => {
                        if (canvasLayout === 'array') {
                            packArray();
                        } else {
                            reflowMobileColumn();
                        }
                        updateMobileHud();
                        fitToFocus();
                        drawCanvasEdges();
                        queueMinimapLayout();
                    });
                } else {
                    setTimeout(() => {
                        drawCanvasEdges();
                        queueMinimapLayout();
                    }, 360);
                }
            }

            function collapseAllClusters() {
                if (expandedClusters.size === 0) return false;
                expandedClusters.clear();
                document.querySelectorAll('.cluster-stack').forEach(s => s.dataset.expanded = 'false');
                document.querySelectorAll('.canvas-node[data-kind="cluster"]').forEach(n => n.classList.remove('is-expanded'));
                applyFocus();
                saveCanvasState();
                if (isMobile()) {
                    requestAnimationFrame(() => {
                        if (canvasLayout === 'array') {
                            packArray();
                        } else {
                            reflowMobileColumn();
                        }
                        updateMobileHud();
                        fitToFocus();
                        drawCanvasEdges();
                        queueMinimapLayout();
                    });
                } else {
                    setTimeout(() => {
                        drawCanvasEdges();
                        queueMinimapLayout();
                    }, 360);
                }
                return true;
            }

            /* ═══ CANVAS PAN + PINCH ═══ */
            const canvasPointers = new Map();
            let canvasPanState = null;
            let canvasPinchState = null;

            function attachCanvasHandlers() {
                const canvasRoot = document.getElementById('canvasRoot');
                if (!canvasRoot || canvasRoot.dataset.bound === '1') return;
                canvasRoot.dataset.bound = '1';

                canvasRoot.addEventListener('pointerdown', (e) => {
                    if (e.target.closest('.canvas-widget, .canvas-context-menu, .canvas-minimap, .canvas-zoomhud')) return;
                    if (e.pointerType !== 'touch' && e.target.closest('.canvas-node')) return;
                    if (e.button !== 0 && e.button !== 1) return;
                    if (e.pointerType === 'touch' && e.target.closest('.canvas-node') && canvasPointers.size === 0) {
                        return;
                    }

                    canvasPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    try { canvasRoot.setPointerCapture(e.pointerId); } catch (err) {}

                    if (canvasPointers.size === 1) {
                        canvasPanState = {
                            startX: e.clientX, startY: e.clientY,
                            startPanX: panOffset.x, startPanY: panOffset.y,
                            pointerId: e.pointerId, moved: false, button: e.button
                        };
                        canvasRoot.classList.add('panning');
                    } else if (canvasPointers.size === 2) {
                        canvasPanState = null;
                        const pts = [...canvasPointers.values()];
                        const p1 = pts[0], p2 = pts[1];
                        canvasPinchState = {
                            startDist: Math.hypot(p2.x - p1.x, p2.y - p1.y),
                            startScale: scale,
                            startPanX: panOffset.x, startPanY: panOffset.y,
                            focalX: (p1.x + p2.x) / 2,
                            focalY: (p1.y + p2.y) / 2
                        };
                    }
                    e.preventDefault();
                });

                canvasRoot.addEventListener('pointermove', (e) => {
                    if (!canvasPointers.has(e.pointerId)) return;
                    canvasPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                    if (canvasPinchState && canvasPointers.size === 2) {
                        const pts = [...canvasPointers.values()];
                        const p1 = pts[0], p2 = pts[1];
                        const newDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                        let newScale = canvasPinchState.startScale * (newDist / canvasPinchState.startDist);
                        newScale = Math.max(getMinScale(), Math.min(getMaxScale(), newScale));

                        const worldX = (canvasPinchState.focalX - canvasPinchState.startPanX) / canvasPinchState.startScale;
                        const worldY = (canvasPinchState.focalY - canvasPinchState.startPanY) / canvasPinchState.startScale;

                        panOffset.x = canvasPinchState.focalX - worldX * newScale;
                        panOffset.y = canvasPinchState.focalY - worldY * newScale;
                        scale = newScale;
                        applyPanTransform();
                        return;
                    }

                    if (canvasPanState && e.pointerId === canvasPanState.pointerId) {
                        const dx = e.clientX - canvasPanState.startX;
                        const dy = e.clientY - canvasPanState.startY;
                        if (!canvasPanState.moved && Math.hypot(dx, dy) > 4) canvasPanState.moved = true;
                        const raw = { x: canvasPanState.startPanX + dx, y: canvasPanState.startPanY + dy };
                        const clamped = clampPanResistant(raw);
                        panOffset.x = clamped.x;
                        panOffset.y = clamped.y;
                        applyPanTransform();
                    }
                });

                const endPointer = (e) => {
                    if (!canvasPointers.has(e.pointerId)) return;
                    canvasPointers.delete(e.pointerId);

                    if (canvasPinchState) {
                        if (canvasPointers.size < 2) {
                            canvasPinchState = null;
                            if (canvasPointers.size === 1) {
                                const [id, p] = [...canvasPointers.entries()][0];
                                canvasPanState = {
                                    startX: p.x, startY: p.y,
                                    startPanX: panOffset.x, startPanY: panOffset.y,
                                    pointerId: id, moved: true, button: 0
                                };
                            } else {
                                canvasRoot.classList.remove('panning');
                                updateMobileHud();
                                runMobileGuardrails();
                            }
                        }
                    } else if (canvasPanState && e.pointerId === canvasPanState.pointerId) {
                        canvasRoot.classList.remove('panning');
                        const didMove = canvasPanState.moved;
                        if (!didMove && canvasPanState.button === 0 &&
                            expandedClusters.size > 0 && canvasLayout !== 'array') {
                            collapseAllClusters();
                        }
                        if (didMove) {
                            runMobileGuardrails();
                        }
                        saveCanvasState();
                        updateMobileHud();
                        canvasPanState = null;
                    }

                    try { canvasRoot.releasePointerCapture(e.pointerId); } catch (err) {}
                };
                canvasRoot.addEventListener('pointerup', endPointer);
                canvasRoot.addEventListener('pointercancel', endPointer);

                canvasRoot.addEventListener('wheel', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        const factor = Math.exp(-e.deltaY * 0.0025);
                        zoomAt(scale * factor, e.clientX, e.clientY);
                        return;
                    }
                    e.preventDefault();
                    panOffset.x -= e.deltaX;
                    panOffset.y -= e.deltaY;
                    applyPanTransform();
                }, { passive: false });

                let lastTap = 0;
                canvasRoot.addEventListener('pointerup', (e) => {
                    if (e.pointerType !== 'touch') return;
                    if (e.target.closest('.canvas-node')) return;
                    const now = Date.now();
                    if (now - lastTap < 300) {
                        if (isMobile()) {
                            fitToFocus({ force: true });
                        } else {
                            fitCanvasToViewport();
                        }
                        saveCanvasState();
                        lastTap = 0;
                    } else {
                        lastTap = now;
                    }
                });
            }

            /* ═══ PERSISTENCE ═══ */
            function currentVpClass() { return isMobile() ? 'mobile' : 'desktop'; }

            function saveCanvasState() {
                const positions = {};
                if (!isMobile()) {
                    restPositions.forEach((pos, id) => { positions[id] = { x: pos.x, y: pos.y }; });
                }

                const state = {
                    layout: canvasLayout,
                    positions,
                    pan: { x: panOffset.x, y: panOffset.y },
                    scale,
                    expanded: Array.from(expandedClusters),
                    focus: focusedNodeId,
                    vp: currentVpClass()
                };
                try { localStorage.setItem(CANVAS_STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
            }

            function loadCanvasState() {
                try {
                    const raw = localStorage.getItem(CANVAS_STORAGE_KEY);
                    if (!raw) return null;
                    const s = JSON.parse(raw);
                    if (s.vp && s.vp !== currentVpClass()) {
                        s.positions = {};
                    }
                    return s;
                } catch (e) { return null; }
            }

            /* ═══ CAROUSEL ═══ */
            function handleAccordion(e) {
                const trigger = e.currentTarget;
                const item = trigger.closest('.letter-accordion-item');
                if (!item) return;
                const nowOpen = item.classList.toggle('is-open');
                trigger.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
            }

            function handleNeverToggle(e) {
                const btn = e.currentTarget;
                const group = btn.closest('.letter-never-toggle');
                if (!group) return;
                const list = group.parentElement.querySelector('.letter-never-list');
                if (!list) return;
                const mode = btn.dataset.neverMode;
                list.classList.toggle('is-numbered', mode === 'numbered');
                list.classList.toggle('is-bulleted', mode === 'bulleted');
                group.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
            }

            function bindInteractions(container) {
                if (!container) return;
                container.querySelectorAll('.letter-accordion-trigger').forEach(trigger => {
                    trigger.removeEventListener('click', handleAccordion);
                    trigger.addEventListener('click', handleAccordion);
                });
                container.querySelectorAll('.letter-never-toggle button').forEach(btn => {
                    btn.removeEventListener('click', handleNeverToggle);
                    btn.addEventListener('click', handleNeverToggle);
                });
            }

            function renderTrack() {
                const track = document.getElementById('lettersTrack');
                track.innerHTML = '';
                currentCards.forEach((card, i) => {
                    track.appendChild(renderFullCard(card, i, currentCards.length));
                });
                const panels = track.querySelectorAll('.letter-panel');
                panels.forEach(p => p.classList.remove('active'));
                if (panels[activeIndex]) panels[activeIndex].classList.add('active');
                bindInteractions(track);
                updateBorderProgress();
                updateNavCounter(activeIndex + 1, currentCards.length);
                requestAnimationFrame(() => scrollToPanel(activeIndex, false));
                updateStatusText();
            }

            function updateNavCounter(current, total) {
                const cur = document.getElementById('navCurrent');
                const tot = document.getElementById('navTotal');
                if (cur) cur.textContent = String(current);
                if (tot) tot.textContent = String(total);
            }

            function activatePanel(newIndex, updateHash) {
                if (newIndex < 0) newIndex = currentCards.length - 1;
                if (newIndex >= currentCards.length) newIndex = 0;
                const panels = document.querySelectorAll('.letter-panel');
                panels.forEach(p => p.classList.remove('active'));
                activeIndex = newIndex;
                if (panels[activeIndex]) panels[activeIndex].classList.add('active');
                scrollToPanel(activeIndex, true);
                updateBorderProgress();
                updateNavCounter(activeIndex + 1, currentCards.length);
                if (updateHash !== false) {
                    const card = currentCards[activeIndex];
                    if (card && card.type !== 'cluster') {
                        navigate({ level: 'card', clusterId: card.clusterId || card.id, cardId: card.id }, true);
                        updateBreadcrumb();
                        updateMobileBack();
                    } else if (card && card.type === 'cluster') {
                        navigate({ level: 'cluster', clusterId: card.id }, true);
                        updateBreadcrumb();
                        updateMobileBack();
                    }
                }
            }

            function scrollToPanel(index, smooth) {
                const panel = document.querySelectorAll('.letter-panel')[index];
                if (!panel) return;
                const track = document.getElementById('lettersTrack');
                const trackRect = track.getBoundingClientRect();
                const panelRect = panel.getBoundingClientRect();
                const delta = panelRect.left + panelRect.width / 2 - (trackRect.left + trackRect.width / 2);
                track.scrollTo({ left: track.scrollLeft + delta, behavior: smooth ? 'smooth' : 'auto' });
            }

            function updateBorderProgress() {
                const total = currentCards.length;
                const topBar = document.getElementById('scrollBorderTop');
                const bottomBar = document.getElementById('scrollBorderBottom');
                const corners = ['cornerTL','cornerTR','cornerBL','cornerBR'].map(id => document.getElementById(id));
                if (total <= 1) {
                    topBar.style.width = '0%'; bottomBar.style.width = '0%';
                    corners.forEach(el => el && el.classList.remove('show'));
                    return;
                }
                const percent = Math.round((activeIndex / (total - 1)) * 100);
                topBar.style.width = percent + '%';
                bottomBar.style.width = percent + '%';
                topBar.setAttribute('aria-valuenow', String(percent));
                bottomBar.setAttribute('aria-valuenow', String(percent));
                corners.forEach(el => el && el.classList.toggle('show', percent > 0 || percent < 100));
            }

            /* ═══ MISC UI ═══ */
            function setupViewportBlur() {
                const top = document.getElementById('viewportBlurTop');
                const bottom = document.getElementById('viewportBlurBottom');
                if (!top || !bottom) return;
                function update() {
                    const scrollY = window.scrollY || 0;
                    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                    top.classList.toggle('scrolling', scrollY > 4);
                    bottom.classList.toggle('scrolling', scrollY < maxScroll - 4);
                }
                let ticking = false;
                function onScroll() {
                    if (ticking) return;
                    ticking = true;
                    requestAnimationFrame(() => { update(); ticking = false; });
                }
                window.addEventListener('scroll', onScroll, { passive: true });
                window.addEventListener('resize', onScroll);
                update();
            }

            (function initWriteCursor() {
                const dot = document.getElementById('writeCursorDot');
                const ellipse = document.getElementById('writeCursorEllipse');
                if (!dot || !ellipse) return;
                if (window.matchMedia('(hover: none)').matches) return;
                const NATIVE = ['button','a','input','textarea','select','[role="button"]','.letter-hotspot','.canvas-node','.canvas-widget','.canvas-context-menu','.prov-card','.cluster-peek-hit','.canvas-minimap','.canvas-zoomhud','.hud-top-grip','.mobile-sheet','.mobile-menu-btn'].join(', ');
                const ACCENT_SURFACE = '.prov-card[data-type="cluster"], .letter-card-frame.title-card-frame, .cluster-collapse-chip, .cluster-peek';
                const LIGHT_SURFACE = '.prov-card[data-type="identity"]';
                let ptrX = 0, ptrY = 0, prevX = 0, prevY = 0, init = false;
                let angle = 0, sx = 1, sy = 1, raf = null;
                function lerpAngle(cur, tgt, f) {
                    const d = ((tgt - cur + 540) % 360) - 180;
                    return cur + d * f;
                }
                function step() {
                    if (!init) { prevX = ptrX; prevY = ptrY; init = true; }
                    const dx = ptrX - prevX, dy = ptrY - prevY;
                    prevX = ptrX; prevY = ptrY;
                    const sp = Math.hypot(dx, dy);
                    const tgt = sp > 0.4 ? Math.atan2(dy, dx) * 180 / Math.PI : angle;
                    const stretch = Math.min(sp / 34, 1) * 0.6;
                    angle = lerpAngle(angle, tgt, 0.22);
                    sx += (1 + stretch - sx) * 0.22;
                    sy += (1 - stretch * 0.45 - sy) * 0.22;
                    ellipse.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px) rotate(' + angle + 'deg) scale(' + sx + ',' + sy + ')';
                    raf = requestAnimationFrame(step);
                }
                window.addEventListener('mousemove', (e) => {
                    const el = (e.target && e.target.nodeType === 1) ? e.target : null;
                    const overNative = !!(el && el.closest(NATIVE));
                    const overAccent = !!(el && el.closest(ACCENT_SURFACE));
                    const overLight = !overAccent && !!(el && el.closest(LIGHT_SURFACE));
                    document.body.classList.add('custom-cursor-active');
                    document.body.classList.toggle('write-native-cursor', overNative);
                    document.body.classList.toggle('cursor-on-accent', overAccent);
                    document.body.classList.toggle('cursor-on-light', overLight);
                    ptrX = e.clientX; ptrY = e.clientY;
                    dot.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px)';
                    dot.classList.add('visible');
                    ellipse.classList.add('visible');
                    if (!raf) raf = requestAnimationFrame(step);
                });
                document.addEventListener('mouseleave', () => {
                    dot.classList.remove('visible'); ellipse.classList.remove('visible');
                    document.body.classList.remove('write-native-cursor','custom-cursor-active','cursor-on-accent','cursor-on-light');
                    if (raf) { cancelAnimationFrame(raf); raf = null; }
                });
            })();

            function positionFloatingPanel(panel, trigger) {
                const r = trigger.getBoundingClientRect();
                const pr = panel.getBoundingClientRect();
                const vw = window.innerWidth, vh = window.innerHeight;
                panel.style.position = 'fixed';
                let top = r.bottom + 8;
                if (top + pr.height > vh - 10) top = r.top - pr.height - 8;
                let left = r.right - pr.width;
                left = Math.max(10, Math.min(left, vw - pr.width - 10));
                panel.style.top = top + 'px';
                panel.style.left = left + 'px';
            }

            function applyTheme(theme) {
                document.body.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
                try { localStorage.setItem(THEME_STORAGE_KEY, theme); } catch (e) {}
            }

            function setupAppearanceDropdown() {
                const trigger = document.getElementById('appearanceTrigger');
                const dropdown = document.getElementById('appearanceDropdown');
                const wrapper = document.querySelector('.topbar-appearance-wrapper');
                if (!trigger || !dropdown) return;
                const themes = [{ id: 'light', label: 'Light' }, { id: 'dark', label: 'Dark' }];
                function currentTheme() { return document.body.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
                function renderMenu() {
                    const ct = currentTheme();
                    dropdown.innerHTML = '';
                    themes.forEach(t => {
                        const item = document.createElement('button');
                        item.type = 'button';
                        item.className = 'menu-item' + (t.id === ct ? ' active' : '');
                        item.textContent = t.label;
                        item.addEventListener('click', (e) => {
                            e.stopPropagation();
                            applyTheme(t.id);
                            renderMenu();
                            dropdown.classList.remove('open');
                            trigger.setAttribute('aria-expanded', 'false');
                        });
                        dropdown.appendChild(item);
                    });
                }
                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isOpen = dropdown.classList.contains('open');
                    dropdown.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                    if (!isOpen) {
                        renderMenu();
                        dropdown.classList.add('open');
                        trigger.setAttribute('aria-expanded', 'true');
                        positionFloatingPanel(dropdown, trigger);
                    }
                });
                document.addEventListener('click', (e) => {
                    if (wrapper && !wrapper.contains(e.target)) {
                        dropdown.classList.remove('open');
                        trigger.setAttribute('aria-expanded', 'false');
                    }
                });
            }

            function setupGridToggle() {
                const toggle = document.getElementById('gridToggle');
                if (!toggle) return;
                toggle.addEventListener('click', () => {
                    const on = document.body.classList.toggle('show-grid');
                    toggle.classList.toggle('active', on);
                    updateCanvasToolbarUI();
                });
            }

            /* ═══ MOBILE SHEET ═══ */
            function buildMobileSheet() {
                const body = document.getElementById('mobileSheetBody');
                if (!body) return;
                const sectionsHtml = CLUSTER_ORDER.map(id => {
                    const c = CLUSTERS.get(id);
                    const cardsHtml = c.cardIds.map(cid => {
                        const card = CARDS.get(cid);
                        if (!card) return '';
                        return `<li><button class="mobile-card-row" data-cluster-id="${escapeHtml(c.id)}" data-card-id="${escapeHtml(card.id)}">
                            <span class="mobile-card-title">${escapeHtml(card.title)}</span>
                            <span class="mobile-card-status">${escapeHtml(card.provenance.status)}</span>
                        </button></li>`;
                    }).join('');
                    return `<li class="mobile-section" data-cluster-id="${escapeHtml(c.id)}">
                        <button class="mobile-section-header" type="button">
                            <span class="index-num" style="color:var(--ink-light);font-family:var(--font-mono);font-size:9px;font-weight:600;">${escapeHtml(c.num)}</span>
                            <span class="mobile-section-title">${escapeHtml(c.title)}</span>
                            <span class="mobile-section-count">${c.cardIds.length}</span>
                            <span class="mobile-expand-icon">+</span>
                        </button>
                        <ul class="mobile-section-cards" hidden>${cardsHtml}</ul>
                    </li>`;
                }).join('');

                body.innerHTML = `
                    <button class="mobile-identity-block" type="button" data-nav="identity">
                        <div class="identity-monogram">${escapeHtml(PROFILE.monogram)}</div>
                        <div style="min-width:0;">
                            <div class="mobile-identity-name">${escapeHtml(PROFILE.title)}</div>
                            <div class="mobile-identity-role">${escapeHtml(PROFILE.role)} · ${escapeHtml(PROFILE.org)}</div>
                        </div>
                        <span class="mobile-identity-status" data-availability="${escapeHtml(PROFILE.availability)}">${escapeHtml(PROFILE.availability)}</span>
                    </button>
                    <button class="mobile-index-row" type="button" data-nav="index">
                        <span class="index-num">—</span>
                        <span class="mobile-index-label">Index</span>
                        <span class="mobile-index-count">${CLUSTER_ORDER.length} sections</span>
                    </button>
                    <div class="mobile-section-label">Sections</div>
                    <ul class="mobile-sections">${sectionsHtml}</ul>
                    <div class="mobile-section-label">Canvas</div>
                    <div class="mobile-canvas-controls">
                        <button class="btn" type="button" data-canvas-layout="grid">Grid</button>
                        <button class="btn" type="button" data-canvas-layout="array">Array</button>
                        <button class="btn" type="button" data-action="fit">Fit view</button>
                        <button class="btn" type="button" data-action="toggle-grid">Layout</button>
                        <button class="btn" type="button" data-theme-toggle>Theme</button>
                    </div>
                `;
            }

            function updateMobileSheetActiveStates() {
                const body = document.getElementById('mobileSheetBody');
                if (!body) return;
                body.querySelectorAll('[data-canvas-layout]').forEach(b => {
                    b.classList.toggle('active', b.dataset.canvasLayout === canvasLayout);
                });
                body.querySelectorAll('[data-action="toggle-grid"]').forEach(b => b.classList.toggle('active', document.body.classList.contains('show-grid')));
                body.querySelectorAll('[data-theme-toggle]').forEach(b => {
                    b.textContent = document.body.getAttribute('data-theme') === 'light' ? 'Dark' : 'Light';
                });
            }

            function setupMobileSheet() {
                const btn = document.getElementById('mobileMenuBtn');
                const sheet = document.getElementById('mobileSheet');
                const backdrop = document.getElementById('mobileSheetBackdrop');
                const closeBtn = document.getElementById('mobileSheetClose');
                if (!btn || !sheet || !backdrop || !closeBtn) return;

                function openSheet() {
                    backdrop.hidden = false;
                    sheet.hidden = false;
                    updateMobileSheetActiveStates();
                    requestAnimationFrame(() => {
                        sheet.classList.add('open');
                        backdrop.classList.add('open');
                    });
                }
                function closeSheet() {
                    sheet.classList.remove('open');
                    backdrop.classList.remove('open');
                    setTimeout(() => {
                        sheet.hidden = true;
                        backdrop.hidden = true;
                    }, 320);
                }
                function toggleSheet() {
                    if (sheet.classList.contains('open')) closeSheet();
                    else openSheet();
                }

                btn.addEventListener('click', (e) => { e.stopPropagation(); toggleSheet(); });
                closeBtn.addEventListener('click', closeSheet);
                backdrop.addEventListener('click', closeSheet);

                const body = document.getElementById('mobileSheetBody');
                body.querySelectorAll('[data-nav]').forEach(el => {
                    el.addEventListener('click', () => {
                        const nav = el.dataset.nav;
                        if (nav === 'identity') { focusedNodeId = 'identity'; navigate({ level: 'cluster', clusterId: 'identity' }); }
                        else if (nav === 'index') { focusedNodeId = 'index'; navigate({ level: 'cluster', clusterId: 'index' }); }
                        closeSheet();
                    });
                });
                body.querySelectorAll('.mobile-section-header').forEach(h => {
                    h.addEventListener('click', () => {
                        const section = h.closest('.mobile-section');
                        const cards = section.querySelector('.mobile-section-cards');
                        section.classList.toggle('expanded');
                        cards.hidden = !section.classList.contains('expanded');
                    });
                });
                body.querySelectorAll('.mobile-card-row').forEach(r => {
                    r.addEventListener('click', () => {
                        navigate({ level: 'card', clusterId: r.dataset.clusterId, cardId: r.dataset.cardId });
                        closeSheet();
                    });
                });
                body.querySelectorAll('[data-canvas-layout]').forEach(b => {
                    b.addEventListener('click', () => {
                        setCanvasLayout(b.dataset.canvasLayout);
                        updateMobileSheetActiveStates();
                    });
                });
                body.querySelectorAll('[data-action="fit"]').forEach(b => b.addEventListener('click', () => { fitCanvas(); closeSheet(); }));
                body.querySelectorAll('[data-action="toggle-grid"]').forEach(b => b.addEventListener('click', () => {
                    const on = document.body.classList.toggle('show-grid');
                    document.getElementById('gridToggle')?.classList.toggle('active', on);
                    updateMobileSheetActiveStates();
                    updateCanvasToolbarUI();
                }));
                body.querySelectorAll('[data-theme-toggle]').forEach(b => b.addEventListener('click', () => {
                    const cur = document.body.getAttribute('data-theme');
                    applyTheme(cur === 'light' ? 'dark' : 'light');
                    updateMobileSheetActiveStates();
                }));

                sheet._closeSheet = closeSheet;
                sheet._openSheet = openSheet;
                sheet._isOpen = () => sheet.classList.contains('open');
            }

            function updateTopCount() {
                const el = document.getElementById('topCount');
                if (el) el.textContent = CLUSTER_ORDER.length + '§';
            }

            /* ═══ INIT ═══ */
            defineAllCards();
            updateTopCount();

            (function restorePrefs() {
                try {
                    const t = localStorage.getItem(THEME_STORAGE_KEY);
                    if (t === 'light' || t === 'dark') document.body.setAttribute('data-theme', t);
                } catch (e) {}
            })();

            migrateCanvasState();

            document.addEventListener('DOMContentLoaded', function() {
                setupViewportBlur();
                setupAppearanceDropdown();
                setupGridToggle();
                setupContextMenu();
                setupLetterNavContextMenu();
                setupWidget();
                setupMinimap();
                setupZoomHud();
                setupHudTop();
                buildMobileSheet();
                setupMobileSheet();

                const notif = document.getElementById('hudCanvasNotif');
                if (notif) {
                    notif.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const sheet = document.getElementById('mobileSheet');
                        if (sheet && sheet._openSheet) sheet._openSheet();
                    });
                }

                const saved = loadCanvasState();
                if (saved) {
                    if (saved.layout === 'grid' || saved.layout === 'array') canvasLayout = saved.layout;
                    else canvasLayout = 'grid';
                    document.body.dataset.layout = canvasLayout;
                    if (saved.expanded && Array.isArray(saved.expanded)) {
                        saved.expanded.forEach(id => expandedClusters.add(id));
                    }
                    if (saved.focus && typeof saved.focus === 'string') {
                        const valid = (saved.focus === 'identity' || saved.focus === 'index' || CLUSTER_ORDER.includes(saved.focus));
                        if (valid) focusedNodeId = saved.focus;
                    }
                    if (saved.pan) { panOffset.x = saved.pan.x; panOffset.y = saved.pan.y; }
                    if (typeof saved.scale === 'number') scale = Math.max(getMinScale(), Math.min(getMaxScale(), saved.scale));
                }

                handleRoute();

                if (canvasLayout === 'array') {
                    requestAnimationFrame(() => {
                        setTimeout(() => {
                            packArray();
                            fitCanvasToViewport();
                            drawCanvasEdges();
                            queueMinimapLayout();
                        }, 500);
                    });
                }

                window.addEventListener('hashchange', handleRoute);

                document.getElementById('hudPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
                document.getElementById('hudNext').addEventListener('click', () => activatePanel(activeIndex + 1));
                document.getElementById('letterHotspotPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
                document.getElementById('letterHotspotNext').addEventListener('click', () => activatePanel(activeIndex + 1));

                document.getElementById('hudCanvasPrev').addEventListener('click', () => stepMobileHud(-1));
                document.getElementById('hudCanvasNext').addEventListener('click', () => stepMobileHud(1));

                document.getElementById('mobileBackBtn').addEventListener('click', () => {
                    if (currentRoute.level === 'card') {
                        navigate({ level: 'cluster', clusterId: currentRoute.clusterId });
                    } else if (currentRoute.level === 'cluster') {
                        navigate({ level: 'canvas' });
                    }
                });

                document.getElementById('wordmark').addEventListener('click', () => navigate({ level: 'canvas' }));

                document.getElementById('topResetBtn').addEventListener('click', function() {
                    if (confirm('Reset everything?')) {
                        try { localStorage.removeItem(CANVAS_STORAGE_KEY); } catch (e) {}
                        canvasLayout = 'grid';
                        expandedClusters.clear();
                        restPositions.clear();
                        focusedNodeId = 'identity';
                        panOffset.x = 0; panOffset.y = 0; scale = 1;
                        document.body.dataset.layout = 'grid';
                        location.hash = '#/';
                        renderCanvas();
                    }
                });

                const track = document.getElementById('lettersTrack');
                let isDragging = false, dragStartX = 0, dragStartScroll = 0;
                track.addEventListener('pointerdown', (e) => {
                    if (e.pointerType === 'touch') return;
                    if (closestSafe(e.target, 'button, a, input, .letter-accordion-trigger')) return;
                    isDragging = true;
                    dragStartX = e.clientX;
                    dragStartScroll = track.scrollLeft;
                    track.classList.add('dragging');
                    try { track.setPointerCapture(e.pointerId); } catch (err) {}
                });
                track.addEventListener('pointermove', (e) => {
                    if (!isDragging) return;
                    track.scrollLeft = dragStartScroll - (e.clientX - dragStartX);
                });
                const endDragTrack = () => { isDragging = false; track.classList.remove('dragging'); };
                track.addEventListener('pointerup', endDragTrack);
                track.addEventListener('pointercancel', endDragTrack);

                let settleTimer = null;
                track.addEventListener('scroll', () => {
                    clearTimeout(settleTimer);
                    settleTimer = setTimeout(() => {
                        const rect = track.getBoundingClientRect();
                        const centerX = rect.left + rect.width / 2;
                        let best = 0, bestDist = Infinity;
                        Array.from(track.children).forEach((panel, i) => {
                            const r = panel.getBoundingClientRect();
                            const c = r.left + r.width / 2;
                            const d = Math.abs(c - centerX);
                            if (d < bestDist) { bestDist = d; best = i; }
                        });
                        if (best !== activeIndex) {
                            const panels = track.querySelectorAll('.letter-panel');
                            panels.forEach(p => p.classList.remove('active'));
                            activeIndex = best;
                            if (panels[best]) panels[best].classList.add('active');
                            updateBorderProgress();
                            updateNavCounter(activeIndex + 1, currentCards.length);
                            const card = currentCards[activeIndex];
                            if (card && card.type !== 'cluster') {
                                navigate({ level: 'card', clusterId: card.clusterId || card.id, cardId: card.id }, true);
                                updateBreadcrumb();
                                updateMobileBack();
                            } else if (card && card.type === 'cluster') {
                                navigate({ level: 'cluster', clusterId: card.id }, true);
                                updateBreadcrumb();
                                updateMobileBack();
                            }
                        } else updateBorderProgress();
                    }, 150);
                }, { passive: true });

                document.addEventListener('keydown', (e) => {
                    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;

                    if (e.key === 'Escape') {
                        const drop = document.getElementById('appearanceDropdown');
                        if (drop && drop.classList.contains('open')) {
                            drop.classList.remove('open');
                            document.getElementById('appearanceTrigger').setAttribute('aria-expanded', 'false');
                            e.preventDefault();
                            return;
                        }
                        const lnav = document.getElementById('letterNavContextMenu');
                        if (lnav && lnav.classList.contains('open')) {
                            closeLetterNavContextMenu();
                            e.preventDefault();
                            return;
                        }
                        const ctxMenu = document.getElementById('canvasContextMenu');
                        if (ctxMenu && ctxMenu.classList.contains('open')) {
                            closeContextMenu();
                            e.preventDefault();
                            return;
                        }
                        const sheet = document.getElementById('mobileSheet');
                        if (sheet && sheet._isOpen && sheet._isOpen()) {
                            sheet._closeSheet();
                            e.preventDefault();
                            return;
                        }
                        if (currentRoute.level === 'canvas' && expandedClusters.size > 0 && canvasLayout !== 'array') {
                            collapseAllClusters();
                            e.preventDefault();
                            return;
                        }
                        if (currentRoute.level === 'card') {
                            navigate({ level: 'cluster', clusterId: currentRoute.clusterId });
                            e.preventDefault();
                        } else if (currentRoute.level === 'cluster') {
                            navigate({ level: 'canvas' });
                            e.preventDefault();
                        }
                        return;
                    }

                    if (currentRoute.level !== 'canvas') {
                        if (e.key === 'ArrowLeft')  { activatePanel(activeIndex - 1); e.preventDefault(); }
                        if (e.key === 'ArrowRight') { activatePanel(activeIndex + 1); e.preventDefault(); }
                    } else {
                        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { stepMobileHud(1); e.preventDefault(); }
                        if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { stepMobileHud(-1); e.preventDefault(); }
                    }
                    if (e.key === 'g' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                        const toggle = document.getElementById('gridToggle');
                        if (toggle) toggle.click();
                        e.preventDefault();
                    }
                    if (currentRoute.level === 'canvas' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                        if (e.key === '=' || e.key === '+') { zoomStep(1); e.preventDefault(); }
                        else if (e.key === '-' || e.key === '_') { zoomStep(-1); e.preventDefault(); }
                        else if (e.key === '0') { zoomReset100(); e.preventDefault(); }
                        else if (e.key === 'f' || e.key === 'F') { fitCanvas(); e.preventDefault(); }
                    }
                });

                let lastMobile = isMobile();
                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        const nowMobile = isMobile();
                        const crossed = nowMobile !== lastMobile;
                        lastMobile = nowMobile;

                        if (currentRoute.level === 'canvas') {
                            if (crossed && nowMobile) {
                                restPositions.clear();
                                if (canvasLayout === 'array') {
                                    packArray();
                                } else {
                                    reflowMobileColumn();
                                }
                                fitToFocus({ force: true });
                            } else if (crossed && !nowMobile) {
                                restPositions.clear();
                                const specs = getCanvasNodes();
                                const computed = getLayoutPositions(canvasLayout, specs);
                                specs.forEach(s => {
                                    const pos = computed[s.id] || { x: 0, y: 0 };
                                    restPositions.set(s.id, { x: pos.x, y: pos.y });
                                    const n = document.querySelector(`.canvas-node[data-node-id="${CSS.escape(s.id)}"]`);
                                    if (n) { n.style.left = pos.x + 'px'; n.style.top = pos.y + 'px'; }
                                });
                                if (canvasLayout === 'array') packArray();
                                else refineIdentityIndexStack();
                                fitCanvasToViewport();
                            } else if (nowMobile) {
                                if (canvasLayout === 'array') {
                                    packArray();
                                } else {
                                    reflowMobileColumn();
                                }
                                fitToFocus();
                            } else {
                                fitCanvasToViewport();
                            }
                            if (canvasLayout === 'array') packArray();
                            if (nowMobile && scale < getMinScale()) scale = getMinScale();
                            drawCanvasEdges();
                            queueMinimapLayout();
                            syncView();
                        }
                        if (widgetVisible && widgetPos) {
                            const clamped = clampWidgetPos(widgetPos.x, widgetPos.y);
                            widgetPos = clamped;
                            applyWidgetPos();
                            try { localStorage.setItem(WIDGET_POS_KEY, JSON.stringify(widgetPos)); } catch (e) {}
                        }
                        if (minimapVisible && !isMobile()) {
                            if (minimapPos) {
                                const c = clampMinimapPos(minimapPos.x, minimapPos.y);
                                minimapPos = c;
                                applyMinimapPos();
                                try { localStorage.setItem(MINIMAP_POS_KEY, JSON.stringify(minimapPos)); } catch (e) {}
                            }
                            queueMinimapLayout();
                        }
                        if (zoomHudVisible && !isMobile()) {
                            if (zoomHudPos) {
                                const c = clampZoomHudPos(zoomHudPos.x, zoomHudPos.y);
                                zoomHudPos = c;
                                applyZoomHudPos();
                                try { localStorage.setItem(ZOOMHUD_POS_KEY, JSON.stringify(zoomHudPos)); } catch (e) {}
                            }
                        }
                        if (hudTopPos) {
                            const c = clampHudTopPos(hudTopPos.x, hudTopPos.y);
                            hudTopPos = c;
                            applyHudTopPos();
                            try { localStorage.setItem(HUDTOP_POS_KEY, JSON.stringify(hudTopPos)); } catch (e) {}
                        }
                    }, 220);
                });

                updateMobileHud();
            });
        })();
    </script>
</body>
</html>
