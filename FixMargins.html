                    fullContent: PROFILE.fullContent,
                    profile: PROFILE
                });
                definePseudoCluster({
                    id: 'index', type: 'index', num: '—',
                    title: INDEX_META.title, deck: INDEX_META.deck,
                    provenance: INDEX_META.provenance,
                    fullContent: INDEX_META.fullContent
                });
            }

            /* ═══ RENDERERS ═══ */
            function renderCompactCard(card, opts = {}) {
                const el = document.createElement('article');
                el.className = 'prov-card';
                el.dataset.cardId = card.id;
                el.dataset.type = card.type;
                const showStatus = opts.showStatus !== false;
                const rel = card.relationships || {};
                const relCount = (rel.references?.length || 0) + (rel.replies?.length || 0) + (rel.updates?.length || 0);
                const typeLabel = { cluster: 'Collection', statement: 'Statement', evidence: 'Evidence', reply: 'Reply', update: 'Update' }[card.type] || card.type;
                el.innerHTML = `
                    <div class="prov-card-kicker">
                        <span class="prov-card-type">${escapeHtml(typeLabel)}</span>
                        ${showStatus ? `<span class="prov-card-status" data-status="${escapeHtml(card.provenance.status)}">${escapeHtml(card.provenance.status)}</span>` : ''}
                    </div>
                    <h3 class="prov-card-title">${escapeHtml(card.title)}</h3>
                    <p class="prov-card-deck">${escapeHtml(card.deck)}</p>
                    <div class="prov-card-meta">
                        <span class="prov-card-source">${escapeHtml(card.provenance.source)}</span>
                        <span class="prov-card-relations">
                            ${relCount > 0 ? `<span class="prov-card-relation"><strong>${relCount}</strong> ref</span>` : ''}
                        </span>
                    </div>
                `;
                return el;
            }

            function renderIdentityCard(profile) {
                const el = document.createElement('article');
                el.className = 'prov-card';
                el.dataset.cardId = profile.id;
                el.dataset.type = 'identity';
                const sections = CLUSTER_ORDER.length;
                const cards = getTotalCardCount();
                el.innerHTML = `
                    <div class="prov-card-kicker">
                        <span class="prov-card-type">Identity</span>
                        <span class="prov-card-status" data-status="${escapeHtml(profile.provenance.status)}">${escapeHtml(profile.provenance.status)}</span>
                    </div>
                    <div class="identity-monogram">${escapeHtml(profile.monogram)}</div>
                    <h3 class="prov-card-title">${escapeHtml(profile.title)}</h3>
                    <p class="identity-role">${escapeHtml(profile.role)} · ${escapeHtml(profile.org)}</p>
                    <p class="prov-card-deck">${escapeHtml(profile.deck)}</p>
                    <div class="identity-meta">
                        <span>${escapeHtml(profile.location)}</span>
                        <span>Since ${escapeHtml(profile.since)}</span>
                    </div>
                    <div class="identity-stats">
                        <span><strong>${sections}</strong> sections</span>
                        <span><strong>${cards}</strong> cards</span>
                    </div>
                    <div class="prov-card-meta">
                        <span class="prov-card-source">${escapeHtml(profile.provenance.source)}</span>
                        <span class="identity-availability" data-availability="${escapeHtml(profile.availability)}">${escapeHtml(profile.availability)}</span>
                    </div>
                `;
                return el;
            }

            function renderIndexCard(indexMeta) {
                const el = document.createElement('article');
                el.className = 'prov-card';
                el.dataset.cardId = indexMeta.id;
                el.dataset.type = 'index';
                const rows = CLUSTER_ORDER.map(id => {
                    const c = CLUSTERS.get(id);
                    return `<li class="index-row" data-cluster-id="${escapeHtml(c.id)}">
                        <span class="index-num">${escapeHtml(c.num)}</span>
                        <span class="index-title">${escapeHtml(c.title)}</span>
                        <span class="index-count">${c.cardIds.length}</span>
                        <span class="index-status" data-status="${escapeHtml(c.provenance.status)}">${escapeHtml(c.provenance.status)}</span>
                    </li>`;
                }).join('');
                el.innerHTML = `
                    <div class="prov-card-kicker">
                        <span class="prov-card-type">Index</span>
                        <span class="prov-card-status" data-status="${escapeHtml(indexMeta.provenance.status)}">${escapeHtml(indexMeta.provenance.status)}</span>
                    </div>
                    <h3 class="prov-card-title">${escapeHtml(indexMeta.title)}</h3>
                    <ul class="index-list">${rows}</ul>
                `;
                return el;
            }

            function renderFullCard(card, index, total) {
                const panel = document.createElement('div');
                panel.className = 'letter-panel' + (index === 0 ? ' active' : '');
                panel.dataset.index = String(index);
                panel.dataset.cardId = card.id;
                panel.dataset.type = card.type;

                const frame = document.createElement('div');
                let frameClass = 'letter-card-frame';
                if (card.type === 'cluster') frameClass += ' title-card-frame';
                else if (card.type === 'identity') frameClass += ' identity-card-frame';
                frame.className = frameClass;

                const cover = document.createElement('div');
                cover.className = 'letter-cover';
                let label;
                if (card.type === 'cluster') label = 'SECTION';
                else if (card.type === 'identity') label = 'IDENTITY';
                else if (card.type === 'index') label = 'INDEX';
                else label = 'CARD ' + String(index + 1).padStart(2, '0');
                const p = card.provenance;
                cover.innerHTML = `
                    <div class="swiss-grid" style="gap:8px var(--swiss-gap,24px)">
                        <span class="swiss-col swiss-col-span-3 letter-cover-kicker">${label}</span>
                        <h2 class="swiss-col swiss-col-span-9 letter-cover-name">${escapeHtml(card.title)}</h2>
                        <p class="swiss-col swiss-col-span-6 swiss-offset-3 letter-cover-deck">${escapeHtml(card.deck)}</p>
                        <div class="swiss-col swiss-col-span-9 swiss-offset-3 letter-provenance">
                            <span class="letter-provenance-field"><strong>By</strong>${escapeHtml(p.author)}</span>
                            <span class="letter-provenance-field"><strong>On</strong>${escapeHtml(p.date)}</span>
                            <span class="letter-provenance-field"><strong>From</strong>${escapeHtml(p.source)}</span>
                            <span class="letter-provenance-status" data-status="${escapeHtml(p.status)}">${escapeHtml(p.status)}</span>
                        </div>
                    </div>
                `;
                frame.appendChild(cover);

                const toolbar = document.createElement('div');
                toolbar.className = 'letter-toolbar';
                const countEl = document.createElement('span');
                countEl.className = 'letter-count';
                countEl.textContent = (index + 1) + ' / ' + total;
                toolbar.appendChild(countEl);
                frame.appendChild(toolbar);

                const content = document.createElement('div');
                content.className = 'letter-content';
                content.innerHTML = card.fullContent || '';
                frame.appendChild(content);

                const rels = card.relationships || {};
                const allRels = [].concat(rels.references || [], rels.replies || [], rels.updates || []);
                if (allRels.length && card.type !== 'identity' && card.type !== 'index') {
                    const relStrip = document.createElement('div');
                    relStrip.className = 'conversation-stack-hint';
                    relStrip.textContent = allRels.length + ' related card' + (allRels.length === 1 ? '' : 's');
                    content.appendChild(relStrip);
                }

                panel.appendChild(frame);
                panel.addEventListener('click', () => {
                    const idx = Number(panel.dataset.index);
                    if (idx !== activeIndex) activatePanel(idx);
                });
                return panel;
            }

            /* ═══ STATE ═══ */
            let currentRoute = { level: 'canvas' };
            let currentCards = [];
            let activeIndex = 0;
            let canvasLayout = 'grid';
            let panOffset = { x: 0, y: 0 };
            let scale = 1;
            let topZ = 10;
            const expandedClusters = new Set();
            const restPositions = new Map();

            let focusedNodeId = 'identity';

            const CANVAS_STORAGE_KEY_OLD = 'intoview.canvas.v6';
            const CANVAS_STORAGE_KEY_V8 = 'intoview.canvas.v8';
            const CANVAS_STORAGE_KEY = 'intoview.canvas.v11';
            const THEME_STORAGE_KEY = 'intoview.theme';
            const WIDGET_ON_KEY = 'intoview.widget.on';
            const WIDGET_POS_KEY = 'intoview.widget.pos';
            const MINIMAP_ON_KEY  = 'intoview.minimap.on';
            const MINIMAP_POS_KEY = 'intoview.minimap.pos';
            const ZOOMHUD_ON_KEY  = 'intoview.zoomhud.on';
            const ZOOMHUD_POS_KEY = 'intoview.zoomhud.pos';
            const HUDTOP_POS_KEY  = 'intoview.hudtop.pos';

            let widgetVisible = false;
            let widgetPos = null;
            let minimapVisible = false;
            let minimapPos = null;
            let minimapBounds = null;
            const minimapNodeEls = new Map();
            let minimapLayoutQueued = false;
            let minimapFrameQueued  = false;

            let zoomHudVisible = false;
            let zoomHudPos = null;

            let hudTopPos = null;
            let resizeObserver = null;

            function migrateCanvasState() {
                try {
                    let migrated = null;
                    const v8 = localStorage.getItem(CANVAS_STORAGE_KEY_V8);
                    const old = localStorage.getItem(CANVAS_STORAGE_KEY_OLD);
                    if (v8) migrated = JSON.parse(v8);
                    else if (old) {
                        migrated = JSON.parse(old);
                        if (migrated.positions && migrated.positions.master) {
                            migrated.positions.identity = migrated.positions.master;
                            delete migrated.positions.master;
                        }
                        if (migrated.layout === 'radial' || migrated.layout === 'free') migrated.layout = 'grid';
                    }
                    if (migrated && !localStorage.getItem(CANVAS_STORAGE_KEY)) {
                        if (migrated.layout !== 'grid' && migrated.layout !== 'array') migrated.layout = 'grid';
                        delete migrated.displacements;
                        localStorage.setItem(CANVAS_STORAGE_KEY, JSON.stringify(migrated));
                    }
                    localStorage.removeItem(CANVAS_STORAGE_KEY_OLD);
                    localStorage.removeItem(CANVAS_STORAGE_KEY_V8);
                } catch (e) {}
            }

            /* ═══ ROUTING ═══ */
            function parseHash() {
                const raw = (location.hash || '').replace(/^#\/?/, '');
                if (!raw) return { level: 'canvas' };
                const parts = raw.split('/').filter(Boolean);
                if (parts.length === 1) return { level: 'cluster', clusterId: parts[0] };
                if (parts.length >= 2) return { level: 'card', clusterId: parts[0], cardId: parts.slice(1).join('/') };
                return { level: 'canvas' };
            }

            function navigate(route, replace) {
                const hash = routeHash(route);
                if (replace) history.replaceState(null, '', hash);
                else location.hash = hash;
            }

            function routeHash(route) {
                if (!route || route.level === 'canvas') return '#/';
                if (route.level === 'cluster') return '#/' + route.clusterId;
                if (route.level === 'card') return '#' + '/' + route.clusterId + '/' + route.cardId;
                return '#/';
            }

            function handleRoute() {
                const route = parseHash();
                currentRoute = route;
                closeLetterNavContextMenu();

                if (route.level === 'canvas') {
                    currentCards = [];
                    syncView();
                    renderCanvas();
                    updateBreadcrumb();
                    updateMobileBack();
                    updateMobileHud();
                    if (isMobile()) {
                        requestAnimationFrame(() => {
                            if (canvasLayout === 'array') {
                                packArray();
                            } else {
                                reflowMobileColumn();
                            }
                            updateMobileHud();
                            fitToFocus({ force: true });
                        });
                    }
                    return;
                }

                if (isMobile() && route.clusterId) {
                    const valid = (route.clusterId === 'identity' || route.clusterId === 'index' || CLUSTER_ORDER.includes(route.clusterId));
                    if (valid) focusedNodeId = route.clusterId;
                }

                const cluster = CLUSTERS.get(route.clusterId);
                if (!cluster) { navigate({ level: 'canvas' }, true); return; }

                const allCards = [cluster].concat(cluster.cardIds.map(id => CARDS.get(id)).filter(Boolean));

                if (route.level === 'cluster') {
                    currentCards = allCards;
                    activeIndex = 0;
                    syncView();
                    renderTrack();
                    updateBreadcrumb();
                    updateMobileBack();
                    return;
                }

                currentCards = allCards;
                const idx = allCards.findIndex(c => c.id === route.cardId);
                activeIndex = idx >= 0 ? idx : 0;
                syncView();
                renderTrack();
                scrollToPanel(activeIndex, false);
                updateBreadcrumb();
                updateMobileBack();
            }

            function updateBreadcrumb() {
                const bc = document.getElementById('breadcrumb');
                bc.innerHTML = '';
                const items = [];
                items.push({ label: 'Canvas', route: { level: 'canvas' } });
                if (currentRoute.level === 'cluster' || currentRoute.level === 'card') {
                    const cluster = CLUSTERS.get(currentRoute.clusterId);
                    if (cluster) items.push({ label: cluster.title, route: { level: 'cluster', clusterId: cluster.id } });
                }
                if (currentRoute.level === 'card') {
                    const card = CARDS.get(currentRoute.cardId);
                    if (card) items.push({ label: card.title, route: currentRoute, current: true });
                } else if (currentRoute.level === 'cluster') {
                    items[items.length - 1].current = true;
                }

                items.forEach((item, i) => {
                    if (i > 0) {
                        const sep = document.createElement('span');
                        sep.className = 'breadcrumb-sep';
                        sep.textContent = '/';
                        bc.appendChild(sep);
                    }
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'breadcrumb-item' + (item.current ? ' is-current' : '');
                    btn.textContent = item.label;
                    if (!item.current) btn.addEventListener('click', () => navigate(item.route));
                    bc.appendChild(btn);
                });
            }

            function updateMobileBack() {
                const btn = document.getElementById('mobileBackBtn');
                if (!btn) return;
                if (currentRoute.level === 'canvas') { btn.hidden = true; return; }
                btn.hidden = false;
                const cid = currentRoute.clusterId;
                if (currentRoute.level === 'cluster' && (cid === 'identity' || cid === 'index')) {
                    btn.textContent = '← Canvas';
                } else {
                    btn.textContent = currentRoute.level === 'card' ? '← Back' : '← Sections';
                }
            }

            /* ═══ VIEW SYNC ═══ */
            function syncView() {
                const inSection = currentRoute.level !== 'canvas';
                document.getElementById('canvasRoot').hidden = inSection;
                document.getElementById('carouselWrap').hidden = !inSection;
                document.getElementById('hudTop').hidden = !inSection;
                document.getElementById('hud').hidden = !inSection;
                document.getElementById('hudCanvas').hidden = inSection || !isMobile();
                applyWidgetVisibility();
                applyMinimapVisibility();
                applyZoomHudVisibility();
                applyHudTopPos();
                closeContextMenu();
                closeLetterNavContextMenu();
                updateStatusText();
            }

            function updateStatusText() {
                const statusCount = document.getElementById('hudStatusCount');
                const statusText = document.getElementById('hudStatusText');
                if (!statusCount || !statusText) return;
                if (currentRoute.level === 'canvas') {
                    statusCount.textContent = String(CARDS.size);
                    statusText.textContent = 'Cards · ' + canvasLayout;
                } else {
                    const cluster = CLUSTERS.get(currentRoute.clusterId);
                    statusCount.textContent = String(currentCards.length);
                    statusText.textContent = cluster ? cluster.title : '';
                }
            }

            /* ═══ CANVAS NODES ═══ */
            function getCanvasNodes() {
                return [
                    { id: 'identity', kind: 'identity', card: PROFILE },
                    { id: 'index',    kind: 'index',    card: INDEX_META }
                ].concat(CLUSTER_ORDER.map(id => ({
                    id, kind: 'cluster', card: CLUSTERS.get(id)
                })));
            }

            function getNodeOrder() {
                return ['identity', 'index', ...CLUSTER_ORDER];
            }

            function applyFocus() {
                const hasFocus = expandedClusters.size > 0 && canvasLayout !== 'array';
                document.body.classList.toggle('has-focus', hasFocus);
                document.querySelectorAll('.canvas-node[data-kind="cluster"]').forEach(node => {
                    const isFocused = expandedClusters.has(node.dataset.clusterId);
                    node.classList.toggle('is-focused', isFocused);
                });
            }

            function renderCanvas() {
                const surface = document.getElementById('canvasSurface');
                const edges = document.getElementById('canvasEdges');
                Array.from(surface.children).forEach(ch => { if (ch !== edges) ch.remove(); });
                edges.innerHTML = '';
                minimapNodeEls.clear();

                const nodes = getCanvasNodeSpecsWithPositions();
                nodes.forEach(spec => {
                    const wrap = document.createElement('div');
                    wrap.className = 'canvas-node';
                    wrap.dataset.nodeId = spec.id;
                    wrap.dataset.kind = spec.kind;

                    if (spec.kind === 'identity') {
                        wrap.appendChild(renderIdentityCard(spec.card));
                    } else if (spec.kind === 'index') {
                        wrap.appendChild(renderIndexCard(spec.card));
                    } else {
                        wrap.dataset.clusterId = spec.card.id;
                        renderClusterStack(wrap, spec.card);
                    }

                    surface.appendChild(wrap);
                    attachNodeHandlers(wrap);
                });

                restPositions.clear();

                nodes.forEach(spec => {
                    const node = surface.querySelector(`[data-node-id="${CSS.escape(spec.id)}"]`);
                    if (!node) return;
                    restPositions.set(spec.id, { x: spec.x, y: spec.y });
                    node.style.left = spec.x + 'px';
                    node.style.top = spec.y + 'px';
                    node.style.zIndex = String(++topZ);
                });

                if (isMobile()) {
                    if (canvasLayout === 'array') {
                        requestAnimationFrame(() => {
                            packArray();
                            setupResizeObserver();
                        });
                    } else {
                        requestAnimationFrame(() => {
                            reflowMobileColumn();
                            setTimeout(reflowMobileColumn, 100);
                            setTimeout(reflowMobileColumn, 500);
                            setTimeout(reflowMobileColumn, 1000);
                            setupResizeObserver();
                        });
                    }
                } else {
                    refineIdentityIndexStack();
                }

                document.body.dataset.layout = canvasLayout;
                applyFocus();

                if (panOffset.x === 0 && panOffset.y === 0) {
                    requestAnimationFrame(fitCanvasToViewport);
                } else {
                    applyPanTransform();
                }
                updateCanvasToolbarUI();
                attachCanvasHandlers();
                requestAnimationFrame(() => drawCanvasEdges());
                queueMinimapLayout();
                updateMobileHud();
            }

            function setupResizeObserver() {
                if (resizeObserver) {
                    resizeObserver.disconnect();
                    resizeObserver = null;
                }
                if (!isMobile()) return;

                resizeObserver = new ResizeObserver(() => {
                    if (canvasLayout === 'array') {
                        packArray();
                    } else {
                        reflowMobileColumn();
                    }
                });

                document.querySelectorAll('.canvas-node').forEach(n => {
                    resizeObserver.observe(n);
                });
            }

            function getCanvasNodeSpecsWithPositions() {
                const specs = getCanvasNodes();
                const saved = loadCanvasState();
                const savedPositions = (saved && saved.positions) || {};
                const computed = getLayoutPositions(canvasLayout, specs);
                return specs.map(spec => {
                    // On mobile, always use computed layout to ensure correct stacking
                    if (isMobile()) {
                        const compPos = computed[spec.id] || { x: 0, y: 0 };
                        return Object.assign({}, spec, { x: compPos.x, y: compPos.y });
                    }
                    const savedPos = savedPositions[spec.id];
                    const compPos = computed[spec.id] || { x: 0, y: 0 };
                    return Object.assign({}, spec, {
                        x: savedPos ? savedPos.x : compPos.x,
                        y: savedPos ? savedPos.y : compPos.y
                    });
                });
            }

            function renderClusterStack(wrap, cluster) {
                const stack = document.createElement('div');
                stack.className = 'cluster-stack';
                stack.dataset.expanded = expandedClusters.has(cluster.id) ? 'true' : 'false';

                const stackInner = document.createElement('div');
                stackInner.className = 'cluster-stack-inner';

                const title = document.createElement('div');
                title.className = 'cluster-title';

                const hit = document.createElement('div');
                hit.className = 'cluster-peek-hit';
                hit.dataset.action = 'expand';
                title.appendChild(hit);

                const peekCount = Math.min(cluster.cardIds.length, 4);
                for (let d = peekCount; d >= 1; d--) {
                    const peek = document.createElement('div');
                    peek.className = 'cluster-peek';
                    peek.dataset.depth = String(d);
                    title.appendChild(peek);
                }

                title.appendChild(renderCompactCard(cluster));
                stackInner.appendChild(title);
                stack.appendChild(stackInner);

                const leaves = document.createElement('div');
                leaves.className = 'cluster-leaves';
                cluster.cardIds.forEach(cardId => {
                    const card = CARDS.get(cardId);
                    if (!card) return;
                    const leaf = document.createElement('div');
                    leaf.className = 'cluster-leaf';
                    leaf.dataset.cardId = card.id;
                    leaf.dataset.clusterId = card.clusterId;
                    leaf.appendChild(renderCompactCard(card));
                    leaves.appendChild(leaf);
                });
                stack.appendChild(leaves);

                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'cluster-collapse-chip';
                chip.textContent = 'Collapse';
                chip.title = 'Collapse cluster';
                stack.appendChild(chip);

                wrap.appendChild(stack);

                // Add the is-expanded class if the cluster is currently expanded
                if (expandedClusters.has(cluster.id)) {
                    wrap.classList.add('is-expanded');
                }
            }

            /* ═══ LAYOUT ═══ */
            function getLayoutPositions(layout, nodes) {
                const positions = {};
                const colPitch = getColPitch();
                const rowPitch = getRowPitch();
                const mobile = isMobile();

                positions.identity = { x: 0, y: 0 };
                positions.index = { x: 0, y: rowPitch };

                const clusters = nodes.filter(n => n.kind === 'cluster');
                if (mobile && layout !== 'array') {
                    const startY = rowPitch * 2;
                    clusters.forEach((n, i) => {
                        positions[n.id] = { x: 0, y: startY + i * rowPitch };
                    });
                } else if (mobile) {
                    // Array on mobile - rough estimate, packArray will fix heights
                    const startY = rowPitch * 2;
                    clusters.forEach((n, i) => {
                        positions[n.id] = { x: 0, y: startY + i * rowPitch };
                    });
                } else {
                    clusters.forEach((n, i) => {
                        const col = i % 3;
                        const row = Math.floor(i / 3);
                        positions[n.id] = {
                            x: (col + 1) * colPitch,
                            y: row * rowPitch
                        };
                    });
                }
                return positions;
            }

            function reflowMobileColumn() {
                if (!isMobile()) return;
                if (canvasLayout === 'array') return; // Array layout handles its own packing
                const surface = document.getElementById('canvasSurface');
                if (!surface) return;

                const order = ['identity', 'index', ...CLUSTER_ORDER];
                const gap = 28;
                let cursorY = 0;

                const nodes = order.map(id => surface.querySelector(`.canvas-node[data-node-id="${CSS.escape(id)}"]`)).filter(Boolean);

                // Disable transitions to get accurate measurements and instant layout
                nodes.forEach(n => { n.style.transition = 'none'; });

                order.forEach(id => {
                    const node = surface.querySelector(`.canvas-node[data-node-id="${CSS.escape(id)}"]`);
                    if (!node) return;
                    node.style.left = '0px';
                    node.style.top = cursorY + 'px';
                    restPositions.set(id, { x: 0, y: cursorY });
                    // Use offsetHeight which is more reliable after forcing a reflow
                    cursorY += node.offsetHeight + gap;
                });

                // Force reflow
                void surface.offsetHeight;

                // Restore transitions
                nodes.forEach(n => { n.style.transition = ''; });
            }

            function refineIdentityIndexStack() {
                const surface = document.getElementById('canvasSurface');
                if (!surface) return;
                const identityNode = surface.querySelector('.canvas-node[data-node-id="identity"]');
                const indexNode = surface.querySelector('.canvas-node[data-node-id="index"]');
                if (!identityNode || !indexNode) return;

                const identityPos = restPositions.get('identity');
                const indexPos = restPositions.get('index');
                if (!identityPos || !indexPos) return;

                const rowPitch = getRowPitch();
                const standardCardH = 280;
                const gap = rowPitch - standardCardH;

                const isStacked = Math.abs(indexPos.x - identityPos.x) < 4 &&
                                  indexPos.y > identityPos.y &&
                                  indexPos.y <= identityPos.y + rowPitch + 8;
                if (!isStacked) return;

                const newY = identityPos.y + identityNode.offsetHeight + gap;
                if (Math.abs(newY - indexPos.y) < 2) return;

                indexNode.style.top = newY + 'px';
                restPositions.set('index', { x: indexPos.x, y: newY });
            }

            /* ═══ FOCUS + FIT ═══ */
            function getFocusRect(id) {
                const surface = document.getElementById('canvasSurface');
                const node = surface && surface.querySelector(`.canvas-node[data-node-id="${CSS.escape(id)}"]`);
                if (!node) return null;
                const nodeX = parseFloat(node.style.left) || 0;
                const nodeY = parseFloat(node.style.top) || 0;

                if (id === 'identity' || id === 'index') {
                    return { x: nodeX, y: nodeY, w: node.offsetWidth, h: node.offsetHeight };
                }

                const stack = node.querySelector('.cluster-stack');
                if (stack) {
                    const sx = nodeX + stack.offsetLeft;
                    const sy = nodeY + stack.offsetTop;
                    return { x: sx, y: sy, w: stack.offsetWidth, h: stack.offsetHeight };
                }
                return { x: nodeX, y: nodeY, w: node.offsetWidth, h: node.offsetHeight };
            }

            function focusNode(id, opts = {}) {
                if (!id) return;
                const valid = (id === 'identity' || id === 'index' || CLUSTER_ORDER.includes(id));
                if (!valid) return;

                const changed = (focusedNodeId !== id);
                focusedNodeId = id;

                if (changed || opts.force) {
                    updateMobileHud();
                    saveCanvasState();
                }

                if (isMobile() && opts.autoFit !== false) {
                    requestAnimationFrame(() => fitToFocus());
                }
            }

            function fitToFocus(opts = {}) {
                if (!isMobile()) return;
                const id = focusedNodeId;
                const rect = getFocusRect(id);
                if (!rect) return;

                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const topbarH = parseInt(getComputedStyle(document.documentElement)
                    .getPropertyValue('--topbar-height')) || 56;
                const hudReserve = 80;
                const padScreen = 10;

                const sLeft   = rect.x * scale + panOffset.x;
                const sTop    = rect.y * scale + panOffset.y;
                const sRight  = (rect.x + rect.w) * scale + panOffset.x;
                const sBottom = (rect.y + rect.h) * scale + panOffset.y;
                const fitsNow = sLeft >= padScreen &&
                                sTop >= topbarH + padScreen &&
                                sRight <= vw - padScreen &&
                                sBottom <= vh - hudReserve - padScreen;

                if (fitsNow && !opts.force) return;

                const availW = vw - padScreen * 2;
                const availH = vh - topbarH - hudReserve - padScreen * 2;
                const desired = Math.min(availW / rect.w, availH / rect.h);
                // Allow scale to go up to getMaxScale() on mobile for closer view of small cards
                let newScale = Math.min(getMaxScale(), desired);
                newScale = Math.max(getMinScale(), Math.min(getMaxScale(), newScale));

                const cx = rect.x + rect.w / 2;
                const cy = rect.y + rect.h / 2;
                const targetPanX = vw / 2 - cx * newScale;
                const targetPanY = (topbarH + vh - hudReserve) / 2 - cy * newScale;

                tweenCamera(newScale, targetPanX, targetPanY, 360);
            }

            function packArray() {
                const isMob = isMobile();
                const surface = document.getElementById('canvasSurface');
                if (!surface) return;

                const clusterNodes = [...surface.querySelectorAll('.canvas-node[data-kind="cluster"]')];
                if (!clusterNodes.length) return;

                clusterNodes.sort((a, b) => {
                    const ai = CLUSTER_ORDER.indexOf(a.dataset.clusterId);
                    const bi = CLUSTER_ORDER.indexOf(b.dataset.clusterId);
                    return ai - bi;
                });

                const identity = surface.querySelector('.canvas-node[data-node-id="identity"]');
                const index = surface.querySelector('.canvas-node[data-node-id="index"]');

                let cursorY = 0;
                const gap = 28;

                if (identity) {
                    identity.style.left = '0px';
                    identity.style.top = cursorY + 'px';
                    restPositions.set('identity', { x: 0, y: cursorY });
                    cursorY += identity.offsetHeight + gap;
                }
                if (index) {
                    index.style.left = '0px';
                    index.style.top = cursorY + 'px';
                    restPositions.set('index', { x: 0, y: cursorY });
                    cursorY += index.offsetHeight + gap;
                }

                if (isMob) {
                    // Mobile: Stack vertically
                    clusterNodes.forEach(node => {
                        node.style.left = '0px';
                        node.style.top = cursorY + 'px';
                        restPositions.set(node.dataset.nodeId, { x: 0, y: cursorY });
                        cursorY += node.offsetHeight + gap;
                    });
                } else {
                    // Desktop: Horizontal packing
                    const startX = getColPitch();
                    const gutterX = 40;
                    const gutterY = 28;
                    const margin = 32;
                    const maxRight = Math.min(window.innerWidth - margin, 3360);

                    let rowY = 0;
                    let rowH = 0;
                    let cursorX = startX;

                    clusterNodes.forEach(node => {
                        const w = node.offsetWidth;
                        const h = node.offsetHeight;

                        if (cursorX > startX && cursorX + w > maxRight) {
                            rowY += rowH + gutterY;
                            rowH = 0;
                            cursorX = startX;
                        }

                        node.style.left = cursorX + 'px';
                        node.style.top = rowY + 'px';
                        restPositions.set(node.dataset.nodeId, { x: cursorX, y: rowY });

                        cursorX += w + gutterX;
                        if (h > rowH) rowH = h;
                    });
                }
            }

            function relCenter(el) {
                if (!el) return null;
                const node = el.closest('.canvas-node');
                if (!node) return null;
                const nodeX = parseFloat(node.style.left) || 0;
                const nodeY = parseFloat(node.style.top) || 0;
                const nodeRect = node.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                return {
                    x: nodeX + (elRect.left - nodeRect.left) / scale + elRect.width / 2 / scale,
                    y: nodeY + (elRect.top - nodeRect.top) / scale + elRect.height / 2 / scale
                };
            }

            function drawCanvasEdges() {
                const svg = document.getElementById('canvasEdges');
                svg.innerHTML = '';

                const identityNode = document.querySelector('.canvas-node[data-node-id="identity"]');
                const indexNode = document.querySelector('.canvas-node[data-node-id="index"]');
                if (!identityNode || !indexNode) return;

                const identityCenter = relCenter(identityNode.querySelector('.prov-card'));
                const indexCenter = relCenter(indexNode.querySelector('.prov-card'));
                if (!identityCenter || !indexCenter) return;

                const ns = 'http://www.w3.org/2000/svg';
                const addPath = (a, b, fromId, toId) => {
                    if (!a || !b) return;
                    const path = document.createElementNS(ns, 'path');
                    path.setAttribute('class', 'canvas-edge');
                    const focused = expandedClusters.has(fromId) || expandedClusters.has(toId);
                    path.dataset.focus = focused ? 'true' : 'false';
                    const dx = b.x - a.x;
                    const d = `M ${a.x} ${a.y} C ${a.x + dx * 0.4} ${a.y}, ${b.x - dx * 0.4} ${b.y}, ${b.x} ${b.y}`;
                    path.setAttribute('d', d);
                    svg.appendChild(path);
                };

                addPath(identityCenter, indexCenter, 'identity', 'index');

                document.querySelectorAll('.canvas-node[data-kind="cluster"]').forEach(clusterNode => {
                    const cid = clusterNode.dataset.clusterId;
                    const titleCard = clusterNode.querySelector('.cluster-title > .prov-card');
                    const titleCenter = relCenter(titleCard);
                    addPath(indexCenter, titleCenter, 'index', cid);

                    const stack = clusterNode.querySelector('.cluster-stack');
                    if (stack && stack.dataset.expanded === 'true') {
                        clusterNode.querySelectorAll('.cluster-leaf').forEach(leafEl => {
                            const leafCard = leafEl.querySelector('.prov-card');
                            addPath(titleCenter, relCenter(leafCard), cid, leafCard.dataset.cardId);
                        });
                    }
                });
            }

            function updateCanvasToolbarUI() {
                document.querySelectorAll('[data-canvas-layout]').forEach(b => {
                    b.classList.toggle('active', b.dataset.canvasLayout === canvasLayout);
                });
                const toggle = document.querySelector('#canvasContextMenu [data-action="toggle-widget"]');
                if (toggle) toggle.classList.toggle('active', widgetVisible);
                const mmToggle = document.querySelector('#canvasContextMenu [data-action="toggle-minimap"]');
                if (mmToggle) mmToggle.classList.toggle('active', minimapVisible);
                const zhToggle = document.querySelector('#canvasContextMenu [data-action="toggle-zoomhud"]');
                if (zhToggle) zhToggle.classList.toggle('active', zoomHudVisible);
                updateMobileSheetActiveStates();
            }

            function applyPanTransform() {
                const surface = document.getElementById('canvasSurface');
                if (surface) {
                    surface.style.transform =
                        `translate3d(${panOffset.x}px, ${panOffset.y}px, 0) scale(${scale})`;
                }
                const pct = document.getElementById('zoomHudPercent');
                if (pct) pct.textContent = Math.round(scale * 100) + '%';
                queueMinimapFrame();
            }

            function fitCanvasToViewport() {
                const nodes = [...document.querySelectorAll('.canvas-node')];
                if (!nodes.length) return;
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                nodes.forEach(n => {
                    const x = parseFloat(n.style.left) || 0;
                    const y = parseFloat(n.style.top) || 0;
                    minX = Math.min(minX, x);
                    minY = Math.min(minY, y);
                    maxX = Math.max(maxX, x + n.offsetWidth);
                    maxY = Math.max(maxY, y + n.offsetHeight);
                });
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const topbarH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--topbar-height')) || 56;
                const hudReserve = isMobile() ? 100 : 40;
                const padX = 40;
                const availW = vw - padX * 2;
                const availH = vh - topbarH - hudReserve;

                const contentW = Math.max(1, maxX - minX);
                const contentH = Math.max(1, maxY - minY);
                const desired = Math.min(availW / contentW, availH / contentH);

                let newScale = Math.min(1, desired);
                newScale = Math.max(getMinScale(), Math.min(getMaxScale(), newScale));
                scale = newScale;

                const cx = (minX + maxX) / 2;
                const cy = (minY + maxY) / 2;
                panOffset.x = vw / 2 - cx * scale;
                panOffset.y = (topbarH + vh - hudReserve) / 2 - cy * scale;
                applyPanTransform();
                updateMobileHud();
            }

            /* ═══ ZOOM ═══ */
            function zoomAt(newScale, clientX, clientY) {
                const clamped = Math.max(getMinScale(), Math.min(getMaxScale(), newScale));
                if (clamped === scale) return;
                const worldX = (clientX - panOffset.x) / scale;
                const worldY = (clientY - panOffset.y) / scale;
                panOffset.x = clientX - worldX * clamped;
                panOffset.y = clientY - worldY * clamped;
                scale = clamped;
                applyPanTransform();
                saveCanvasState();
            }

            function zoomStep(direction) {
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                zoomAt(scale * (direction > 0 ? ZOOM_STEP : 1 / ZOOM_STEP), cx, cy);
            }

            function zoomReset100() {
                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                zoomAt(1, cx, cy);
            }

            /* ═══ CAMERA TWEEN ═══ */
            let cameraTweenRaf = null;

            function tweenCamera(targetScale, targetPanX, targetPanY, duration) {
                duration = duration || 320;
                if (cameraTweenRaf) cancelAnimationFrame(cameraTweenRaf);
                const startScale = scale;
                const startPanX = panOffset.x;
                const startPanY = panOffset.y;
                const startT = performance.now();
                function tick(t) {
                    const p = Math.min(1, (t - startT) / duration);
                    const e = 1 - Math.pow(1 - p, 3);
                    scale = startScale + (targetScale - startScale) * e;
                    panOffset.x = startPanX + (targetPanX - startPanX) * e;
                    panOffset.y = startPanY + (targetPanY - startPanY) * e;
                    applyPanTransform();
                    if (p < 1) cameraTweenRaf = requestAnimationFrame(tick);
                    else {
                        cameraTweenRaf = null;
                        saveCanvasState();
                        updateMobileHud();
                    }
                }
                cameraTweenRaf = requestAnimationFrame(tick);
            }

            /* ═══ MOBILE HUD ═══ */
            function updateMobileHud() {
                const hud = document.getElementById('hudCanvas');
                if (!hud || hud.hidden) return;
                const order = getNodeOrder();
                const idx = order.indexOf(focusedNodeId);
                const safeIdx = idx >= 0 ? idx : 0;
                const id = order[safeIdx];

                const path = document.getElementById('hudCanvasPath');
                const idxEl = document.getElementById('hudCanvasIdx');
                if (!path || !idxEl) return;

                const label = id === 'identity' ? 'All Sections' :
                              id === 'index' ? 'Index' :
                              (CLUSTERS.get(id)?.title || id);

                path.innerHTML = '';
                if (id !== 'identity') {
                    const parent = document.createElement('span');
                    parent.className = 'notif-crumb-parent';
                    parent.textContent = 'Sections';
                    path.appendChild(parent);

                    const sep = document.createElement('span');
                    sep.className = 'notif-sep';
                    sep.textContent = '›';
                    path.appendChild(sep);
                }
                const cur = document.createElement('span');
                cur.className = 'notif-crumb';
                cur.textContent = label;
                path.appendChild(cur);

                idxEl.textContent = (safeIdx + 1) + '/' + order.length;

                const notif = document.getElementById('hudCanvasNotif');
                if (notif) {
                    notif.classList.remove('updating');
                    void notif.offsetWidth;
                    notif.classList.add('updating');
                }
            }

            function stepMobileHud(delta) {
                const order = getNodeOrder();
                const idx = Math.max(0, order.indexOf(focusedNodeId));
                let next = idx + delta;
                if (next < 0) next = order.length - 1;
                if (next >= order.length) next = 0;
                focusNode(order[next], { autoFit: true, force: true });
            }

            /* ═══ MOBILE GUARDRAILS ═══ */
            function getContentBounds() {
                const nodes = [...document.querySelectorAll('.canvas-node')];
                if (!nodes.length) return null;
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                nodes.forEach(n => {
                    const x = parseFloat(n.style.left) || 0;
                    const y = parseFloat(n.style.top) || 0;
                    minX = Math.min(minX, x);
                    minY = Math.min(minY, y);
                    maxX = Math.max(maxX, x + n.offsetWidth);
                    maxY = Math.max(maxY, y + n.offsetHeight);
                });
                return { minX, minY, maxX, maxY };
            }

            function getPanLimits() {
                const b = getContentBounds();
                if (!b) return null;
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const contentW = (b.maxX - b.minX) * scale;
                const contentH = (b.maxY - b.minY) * scale;
                const slack = Math.min(vw, vh) * 0.18;

                let minX, maxX, minY, maxY;

                if (contentW < vw) {
                    const cx = (vw - contentW) / 2 - b.minX * scale;
                    minX = cx - slack;
                    maxX = cx + slack;
                } else {
                    minX = (vw - slack) - b.maxX * scale;
                    maxX = slack - b.minX * scale;
                }

                if (contentH < vh) {
                    const cy = (vh - contentH) / 2 - b.minY * scale;
                    minY = cy - slack;
                    maxY = cy + slack;
                } else {
                    minY = (vh - slack) - b.maxY * scale;
                    maxY = slack - b.minY * scale;
                }

                return { minX, maxX, minY, maxY };
            }

            function clampPanResistant(p) {
                if (!isMobile()) return p;
                const lim = getPanLimits();
                if (!lim) return p;
                const resist = 0.28;
                let x = p.x, y = p.y;
                if (x < lim.minX) x = lim.minX - (lim.minX - x) * resist;
                else if (x > lim.maxX) x = lim.maxX + (x - lim.maxX) * resist;
                if (y < lim.minY) y = lim.minY - (lim.minY - y) * resist;
                else if (y > lim.maxY) y = lim.maxY + (y - lim.maxY) * resist;
                return { x, y };
            }

            function settlePanIntoBounds() {
                if (!isMobile()) return false;
                const lim = getPanLimits();
                if (!lim) return false;
                const tx = Math.max(lim.minX, Math.min(lim.maxX, panOffset.x));
                const ty = Math.max(lim.minY, Math.min(lim.maxY, panOffset.y));
                if (Math.abs(tx - panOffset.x) > 1 || Math.abs(ty - panOffset.y) > 1) {
                    tweenCamera(scale, tx, ty, 280);
                    return true;
                }
                return false;
            }

            function maybeSnapToNearestNode() {
                if (!isMobile()) return false;
                const order = getNodeOrder();
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const worldX = (vw / 2 - panOffset.x) / scale;
                const worldY = (vh / 2 - panOffset.y) / scale;
                let best = null, bestDist = Infinity, bestId = null;
                order.forEach(id => {
                    const node = document.querySelector(`.canvas-node[data-node-id="${CSS.escape(id)}"]`);
                    if (!node) return;
                    const x = parseFloat(node.style.left) || 0;
                    const y = parseFloat(node.style.top) || 0;
                    const cx = x + node.offsetWidth / 2;
                    const cy = y + node.offsetHeight / 2;
                    const d = Math.hypot(cx - worldX, cy - worldY);
                    if (d < bestDist) { bestDist = d; best = { cx, cy }; bestId = id; }
                });
                if (!best) return false;
                const threshold = (Math.min(vw, vh) * 0.22) / scale;
                if (bestDist > threshold) return false;

                if (bestId && bestId !== focusedNodeId) {
                    focusedNodeId = bestId;
                    updateMobileHud();
                }

                const topbarH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--topbar-height')) || 56;
                const hudH = 96;
                let tx = vw / 2 - best.cx * scale;
                let ty = (topbarH + vh - hudH) / 2 - best.cy * scale;

                const lim = getPanLimits();
                if (lim) {
                    tx = Math.max(lim.minX, Math.min(lim.maxX, tx));
                    ty = Math.max(lim.minY, Math.min(lim.maxY, ty));
                }

                if (Math.abs(tx - panOffset.x) < 1 && Math.abs(ty - panOffset.y) < 1) return false;
                tweenCamera(scale, tx, ty, 260);
                return true;
            }

            function runMobileGuardrails() {
                if (!isMobile()) return;

                let nearest = ZOOM_LEVELS[0];
                let bestDist = Math.abs(scale - nearest);
                for (const z of ZOOM_LEVELS) {
                    const d = Math.abs(scale - z);
                    if (d < bestDist) { bestDist = d; nearest = z; }
                }
                const zoomClose = (bestDist / scale) < 0.06;
                const zoomNeedsTween = zoomClose && Math.abs(nearest - scale) > 0.005;

                if (zoomNeedsTween) {
                    const cx = window.innerWidth / 2;
                    const cy = window.innerHeight / 2;
                    const worldX = (cx - panOffset.x) / scale;
                    const worldY = (cy - panOffset.y) / scale;
                    const targetPanX = cx - worldX * nearest;
                    const targetPanY = cy - worldY * nearest;
                    tweenCamera(nearest, targetPanX, targetPanY, 220);
                    setTimeout(() => {
                        const snapped = maybeSnapToNearestNode();
                        if (!snapped) settlePanIntoBounds();
                    }, 240);
                } else {
                    const snapped = maybeSnapToNearestNode();
                    if (!snapped) settlePanIntoBounds();
                }
            }

            /* ═══ CANVAS ACTIONS ═══ */
            function setCanvasLayout(layout) {
                if (!layout) return;
                if (layout === canvasLayout && layout !== 'array') return;

                if (layout === 'array') {
                    canvasLayout = 'array';
                    document.body.dataset.layout = 'array';

                    CLUSTER_ORDER.forEach(id => expandedClusters.add(id));
                    document.querySelectorAll('.cluster-stack').forEach(s => s.dataset.expanded = 'true');
                    document.querySelectorAll('.canvas-node[data-kind="cluster"]').forEach(n => n.classList.add('is-expanded'));

                    applyFocus();
                    updateCanvasToolbarUI();
                    updateStatusText();

                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            setTimeout(() => {
                                packArray();
                                saveCanvasState();
                                drawCanvasEdges();
                                queueMinimapLayout();
                                fitCanvasToViewport();
                            }, 400);
                        });
                    });
                    return;
                }

                expandedClusters.clear();
                document.querySelectorAll('.cluster-stack').forEach(s => s.dataset.expanded = 'false');
                document.querySelectorAll('.canvas-node[data-kind="cluster"]').forEach(n => n.classList.remove('is-expanded'));

                canvasLayout = 'grid';
                document.body.dataset.layout = 'grid';
                restPositions.clear();

                const specs = getCanvasNodes();
                const computed = getLayoutPositions('grid', specs);

                setTimeout(() => {
                    specs.forEach(s => {
                        const pos = computed[s.id] || { x: 0, y: 0 };
                        restPositions.set(s.id, { x: pos.x, y: pos.y });
                        const node = document.querySelector(`.canvas-node[data-node-id="${CSS.escape(s.id)}"]`);
                        if (node) { node.style.left = pos.x + 'px'; node.style.top = pos.y + 'px'; }
                    });
                    if (isMobile()) {
                        reflowMobileColumn();
                    } else {
                        refineIdentityIndexStack();
                    }
                    applyFocus();
                    updateCanvasToolbarUI();
                    updateStatusText();
                    setTimeout(() => {
                        fitCanvasToViewport();
                        saveCanvasState();
                        drawCanvasEdges();
                        queueMinimapLayout();
                    }, 400);
                }, 20);
            }

            function fitCanvas() {
                if (isMobile()) {
                    fitToFocus({ force: true });
                } else {
                    fitCanvasToViewport();
                }
                saveCanvasState();
            }

            /* ═══ WIDGET / MINIMAP / ZOOM HUD VISIBILITY ═══ */
            function applyWidgetVisibility() {
                const widget = document.getElementById('canvasWidget');
                if (!widget) return;
                const inSection = currentRoute.level !== 'canvas';
                widget.hidden = !widgetVisible || inSection || isMobile();
            }

            function setWidgetVisible(on) {
                widgetVisible = !!on;
                try { localStorage.setItem(WIDGET_ON_KEY, widgetVisible ? '1' : '0'); } catch (e) {}
                applyWidgetVisibility();
                updateCanvasToolbarUI();
            }

            function applyMinimapVisibility() {
                const mm = document.getElementById('canvasMinimap');
                if (!mm) return;
                const inSection = currentRoute.level !== 'canvas';
                const shouldShow = minimapVisible && !inSection && !isMobile();
                const wasHidden = mm.hidden;
                mm.hidden = !shouldShow;
                if (shouldShow && wasHidden) requestAnimationFrame(() => updateMinimapLayout());
            }

            function setMinimapVisible(on) {
                minimapVisible = !!on;
                try { localStorage.setItem(MINIMAP_ON_KEY, minimapVisible ? '1' : '0'); } catch (e) {}
                applyMinimapVisibility();
                updateCanvasToolbarUI();
            }

            function applyZoomHudVisibility() {
                const zh = document.getElementById('canvasZoomHud');
                if (!zh) return;
                const inSection = currentRoute.level !== 'canvas';
                const shouldShow = zoomHudVisible && !inSection && !isMobile();
                const wasHidden = zh.hidden;
                zh.hidden = !shouldShow;
                if (shouldShow) {
                    const pct = document.getElementById('zoomHudPercent');
                    if (pct) pct.textContent = Math.round(scale * 100) + '%';
                    if (wasHidden) applyZoomHudPos();
                }
            }

            function setZoomHudVisible(on) {
                zoomHudVisible = !!on;
                try { localStorage.setItem(ZOOMHUD_ON_KEY, zoomHudVisible ? '1' : '0'); } catch (e) {}
                applyZoomHudVisibility();
                updateCanvasToolbarUI();
            }

            function applyMinimapPos() {
                const mm = document.getElementById('canvasMinimap');
                if (!mm) return;
                if (minimapPos && typeof minimapPos.x === 'number' && typeof minimapPos.y === 'number') {
                    mm.style.left = minimapPos.x + 'px';
                    mm.style.top  = minimapPos.y + 'px';
                    mm.style.right = 'auto';
                    mm.style.bottom = 'auto';
                } else {
                    mm.style.left = ''; mm.style.top = '';
                    mm.style.right = ''; mm.style.bottom = '';
                }
            }

            function applyZoomHudPos() {
                const zh = document.getElementById('canvasZoomHud');
                if (!zh) return;
                if (zoomHudPos && typeof zoomHudPos.x === 'number' && typeof zoomHudPos.y === 'number') {
                    zh.style.left = zoomHudPos.x + 'px';
                    zh.style.top  = zoomHudPos.y + 'px';
                    zh.style.right = 'auto';
                    zh.style.bottom = 'auto';
                    zh.style.transform = 'none';
                } else {
                    zh.style.left = ''; zh.style.top = '';
                    zh.style.right = ''; zh.style.bottom = '';
                    zh.style.transform = '';
                }
            }

            function applyHudTopPos() {
                const ht = document.getElementById('hudTop');
                if (!ht) return;
                if (hudTopPos && typeof hudTopPos.x === 'number' && typeof hudTopPos.y === 'number') {
                    ht.style.left = hudTopPos.x + 'px';

            function queueMinimapLayout() {
                if (minimapLayoutQueued) return;
                minimapLayoutQueued = true;
                requestAnimationFrame(() => {
                    minimapLayoutQueued = false;
                    updateMinimapLayout();
                });
            }

            function queueMinimapFrame() {
                if (minimapLayoutQueued || minimapFrameQueued) return;
                minimapFrameQueued = true;

            function updateMinimapLayout() {
                const mm = document.getElementById('canvasMinimap');
                const content = document.getElementById('minimapContent');
                const viewport = document.getElementById('minimapViewport');
                if (!mm || mm.hidden || !content || !viewport) return;

                const nodes = [...document.querySelectorAll('.canvas-node')];
                if (!nodes.length) {
                    content.style.transform = '';
                    minimapNodeEls.clear();
                    minimapBounds = null;
                    return;
                }

                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                const nodeData = nodes.map(n => {
                    const x = parseFloat(n.style.left) || 0;
                    const y = parseFloat(n.style.top)  || 0;
                    const w = n.offsetWidth;
                    const h = n.offsetHeight;
                    if (x < minX) minX = x;
                    if (y < minY) minY = y;
                    if (x + w > maxX) maxX = x + w;
                    if (y + h > maxY) maxY = y + h;
                    return { el: n, x, y, w, h };
                });

                const pad = 80;
                minX -= pad; minY -= pad; maxX += pad; maxY += pad;

                const worldW = Math.max(1, maxX - minX);
                const worldH = Math.max(1, maxY - minY);

                const mmW = viewport.clientWidth  || 220;
                const mmH = viewport.clientHeight || 140;
                const innerPad = 6;
                const usableW = mmW - innerPad * 2;
                const usableH = mmH - innerPad * 2;
                const mmScale = Math.min(usableW / worldW, usableH / worldH);
                const offsetX = innerPad + (usableW - worldW * mmScale) / 2;
                const offsetY = innerPad + (usableH - worldH * mmScale) / 2;

                minimapBounds = { minX, minY, maxX, maxY, scale: mmScale, offsetX, offsetY };

                const seen = new Set();
                nodeData.forEach(nd => {
                    const id = nd.el.dataset.nodeId;
                    seen.add(id);
                    let el = minimapNodeEls.get(id);
                    if (!el) {
                        el = document.createElement('div');
                        el.className = 'minimap-node';
                        minimapNodeEls.set(id, el);
                        content.appendChild(el);
                    }
                    el.dataset.kind = nd.el.dataset.kind || 'card';
                    el.style.left   = nd.x + 'px';
                    el.style.top    = nd.y + 'px';
                    el.style.width  = nd.w + 'px';
                    el.style.height = nd.h + 'px';
                });
                minimapNodeEls.forEach((el, id) => {
                    if (!seen.has(id)) { el.remove(); minimapNodeEls.delete(id); }
                });

                content.style.transform =
                    `translate(${offsetX - minX * mmScale}px, ${offsetY - minY * mmScale}px) scale(${mmScale})`;

                updateMinimapFrame();
            }

            function updateMinimapFrame() {
                const frame = document.getElementById('minimapFrame');
                if (!frame || !minimapBounds) return;
                const { scale: mmScale, offsetX, offsetY, minX, minY } = minimapBounds;
                const vw = window.innerWidth / scale;
                const vh = window.innerHeight / scale;
                const wx = -panOffset.x / scale;
                const wy = -panOffset.y / scale;
                frame.style.left   = (offsetX + (wx - minX) * mmScale) + 'px';
                frame.style.top    = (offsetY + (wy - minY) * mmScale) + 'px';
                frame.style.width  = (vw * mmScale) + 'px';
                frame.style.height = (vh * mmScale) + 'px';
            }

            function minimapJump(clientX, clientY) {
                const viewport = document.getElementById('minimapViewport');
                if (!viewport || !minimapBounds) return;
                const rect = viewport.getBoundingClientRect();
                const mx = clientX - rect.left;
                const my = clientY - rect.top;
                const { scale: mmScale, offsetX, offsetY, minX, minY } = minimapBounds;
                const wx = (mx - offsetX) / mmScale + minX;
                const wy = (my - offsetY) / mmScale + minY;
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const topbarH = parseInt(getComputedStyle(document.documentElement)
                    .getPropertyValue('--topbar-height')) || 72;
                panOffset.x = vw / 2 - wx * scale;
                panOffset.y = (vh + topbarH) / 2 - wy * scale;
                applyPanTransform();
            }

                try {

                    if (pos && typeof pos.x === 'number' && typeof pos.y === 'number') minimapPos = pos;

                applyMinimapPos();

                grip.addEventListener('pointerdown', (e) => {
                    if (e.button !== 0) return;
                    const rect = mm.getBoundingClientRect();
                    const startX = e.clientX, startY = e.clientY;
                    const startL = rect.left, startT = rect.top;
                    mm.style.right = 'auto'; mm.style.bottom = 'auto';
                    mm.style.left = startL + 'px'; mm.style.top = startT + 'px';
                    mm.classList.add('dragging');
                    try { grip.setPointerCapture(e.pointerId); } catch (err) {}
                    const onMove = (ev) => {
                        if (ev.pointerId !== e.pointerId) return;
                        const cx = startL + (ev.clientX - startX);
                        const cy = startT + (ev.clientY - startY);
                        const c = clampMinimapPos(cx, cy);
                        mm.style.left = c.x + 'px'; mm.style.top = c.y + 'px';
                        minimapPos = c;
                    };
                    const onUp = (ev) => {
                        if (ev.pointerId !== e.pointerId) return;
                        mm.classList.remove('dragging');
                        grip.removeEventListener('pointermove', onMove);
                        grip.removeEventListener('pointerup', onUp);
                        grip.removeEventListener('pointercancel', onUp);
                        try { grip.releasePointerCapture(e.pointerId); } catch (err) {}
                        try { if (minimapPos) localStorage.setItem(MINIMAP_POS_KEY, JSON.stringify(minimapPos)); } catch (err) {}
                    };
                    grip.addEventListener('pointermove', onMove);
                    grip.addEventListener('pointerup', onUp);
                    grip.addEventListener('pointercancel', onUp);
                    e.preventDefault();

                const viewport = mm.querySelector('.minimap-viewport');

                    if (e.button !== 0) return;

                    viewport.style.cursor = 'grabbing';
                    minimapJump(e.clientX, e.clientY);
                    e.preventDefault();
                });
                viewport.addEventListener('pointermove', (e) => {
                    if (!panState || e.pointerId !== panState.pointerId) return;
                    minimapJump(e.clientX, e.clientY);
                });
                const endPan = (e) => {
                    if (!panState || e.pointerId !== panState.pointerId) return;
                    panState = null;
                    viewport.style.cursor = '';
                    try { viewport.releasePointerCapture(e.pointerId); } catch (err) {}
                    saveCanvasState();
                };
                viewport.addEventListener('pointerup', endPan);
                viewport.addEventListener('pointercancel', endPan);
            }
