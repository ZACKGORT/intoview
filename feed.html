<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>intoview.pro · gallery</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='12' fill='%23E5E567'/%3E%3Ctext x='40' y='50' font-family='system-ui,sans-serif' font-size='28' font-weight='800' text-anchor='middle' fill='%231C1C1E' letter-spacing='-0.5'%3ECX%3C/text%3E%3C/svg%3E" />

    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2,3,4,5,6,7,8,9&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ═══════════════════════════════════════════════════════
           TOKENS — verbatim from intoview.nine.twelve.html
           ═══════════════════════════════════════════════════════ */
        :root {
            --bg: #f0f0f2;
            --fg: #1c1c1e;
            --fg-rgb: 28, 28, 30;
            --nav-bg-rgb: 240, 240, 242;
            --rule: rgba(0, 0, 0, .08);
            --faint: rgba(0, 0, 0, .04);
            --muted: rgba(0, 0, 0, .55);
            --accent: #E5E567;
            --card: #ffffff;
            --card-dark: #1c1c1e;
            --card-mid: #3a3a3c;
            --ink: #1c1c1e;
            --ink-mid: #3a3a3c;
            --ink-light: #8e8e93;
            --ink-lighter: #b0b0b6;
            --border: #e6e6e8;
            --peek-bg: #d0d0d5;
            --peek-border: rgba(28, 28, 30, .16);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.02);
            --shadow-floating: 0 8px 32px rgba(0, 0, 0, 0.1);
            --radius: 1.5rem;
            --radius-sm: 0.65rem;
            --font: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            --fs-body: 15px;
            --max-width: 1600px;
            --margin: 16px;
            --topbar-height: 56px;
            --hud-height: 64px;
            --scrollbar-height: 3px;
            --card-w: 240px;
            --col-pitch: 280px;
            --row-pitch: 320px;
            --grid-col-line: rgba(0, 0, 0, 0.07);
            --grid-row-line: rgba(0, 0, 0, 0.035);
            --impact-gain: #2F6B4F;
            --impact-loss: #C63A2A;
            --impact-accent: #8A7A1F;
        }
        @media (min-width: 640px) { :root { --margin: 24px; --topbar-height: 64px; --hud-height: 70px; } }
        @media (min-width: 1024px) { :root { --margin: 32px; --topbar-height: 72px; --hud-height: 76px; } }

        body[data-theme='dark'] {
            --bg: #1c1c1e;
            --fg: #ffffff;
            --fg-rgb: 255, 255, 255;
            --nav-bg-rgb: 28, 28, 30;
            --rule: rgba(255, 255, 255, .08);
            --faint: rgba(255, 255, 255, .04);
            --muted: rgba(255, 255, 255, .55);
            --card: #232325;
            --card-dark: #2c2c2e;
            --card-mid: #3a3a3c;
            --ink: #ffffff;
            --ink-mid: #b0b0b6;
            --ink-light: #8e8e93;
            --ink-lighter: #6e6e73;
            --border: rgba(255, 255, 255, .12);
            --peek-bg: #35353a;
            --peek-border: rgba(255, 255, 255, .14);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-floating: 0 8px 32px rgba(0, 0, 0, 0.6);
            --grid-col-line: rgba(255, 255, 255, 0.09);
            --grid-row-line: rgba(255, 255, 255, 0.04);
            --impact-gain: #6FCF97;
            --impact-loss: #FF6B6B;
            --impact-accent: #E5E567;
        }

        /* ═══════════════════════════════════════════════════════
           RESET
           ═══════════════════════════════════════════════════════ */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }
        html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg); color: var(--fg); font-family: var(--font);
            font-size: var(--fs-body); line-height: 1.6;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            min-height: 100vh; min-height: 100dvh;
            padding-bottom: calc(var(--hud-height) + 20px + var(--scrollbar-height));
            overflow-x: hidden;
            transition: background 0.2s ease, color 0.2s ease;
        }
        ::selection { background: var(--accent); color: #1c1c1e; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--ink-lighter); border-radius: var(--radius-sm); }
        html { scrollbar-width: thin; scrollbar-color: var(--ink-lighter) transparent; }

        /* ═══════════════════════════════════════════════════════
           BUTTONS — verbatim from reference
           ═══════════════════════════════════════════════════════ */
        .btn {
            font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.08em;
            text-transform: uppercase; background: transparent; border: 1px solid var(--border);
            color: var(--ink-mid); padding: 5px 12px; cursor: pointer;
            transition: all 0.2s ease; border-radius: var(--radius-sm); font-weight: 500;
            touch-action: manipulation; min-height: 30px; display: inline-flex;
            align-items: center; justify-content: center; white-space: nowrap; gap: 6px;
        }
        .btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
        .btn:active { transform: scale(0.96); }
        .btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

        /* ═══════════════════════════════════════════════════════
           TOPBAR — verbatim from reference
           ═══════════════════════════════════════════════════════ */
        .topbar {
            position: sticky; top: 0; z-index: 150; background: transparent;
            padding: 6px 0; min-height: var(--topbar-height); display: flex; align-items: center;
            pointer-events: none;
        }
        .topbar .wordmark,
        .topbar .btn,
        .topbar .breadcrumb-item,
        .topbar .view-pills { pointer-events: auto; }
        .topbar .wrap {
            display: flex; align-items: center; gap: 12px;
            padding: 0 var(--margin); max-width: var(--max-width);
            margin: 0 auto; width: 100%;
            pointer-events: none;
        }
        .wordmark {
            font-size: clamp(12px, 3.5vw, 20px); font-weight: 700; letter-spacing: -0.03em;
            display: flex; align-items: baseline; gap: 6px; color: var(--ink);
            flex-shrink: 0; cursor: pointer;
        }
        .wordmark .count {
            font-family: var(--font-mono); font-size: 8px; font-weight: 400;
            color: var(--ink-light); letter-spacing: 0.04em;
        }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: auto; }
        .topbar-right .btn { font-size: 9px; min-height: 32px; padding: 4px 10px; }
        .topbar-appearance-wrapper { position: relative; display: flex; align-items: center; }

        /* Breadcrumb — verbatim from reference */
        .breadcrumb {
            display: flex; align-items: center; gap: 4px;
            font-family: var(--font-mono); font-size: 9px; letter-spacing: .06em;
            text-transform: uppercase; color: var(--ink-light);
            flex: 1; min-width: 0; overflow: hidden; padding: 0 4px;
        }
        .breadcrumb-item {
            background: none; border: none; padding: 3px 6px; cursor: pointer;
            font: inherit; color: var(--ink-light);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 220px; border-radius: 4px;
            transition: color .15s ease, background .15s ease;
            font-family: var(--font-mono); font-size: 9px; letter-spacing: .06em;
            text-transform: uppercase;
        }
        .breadcrumb-item:hover { color: var(--ink); background: var(--faint); }
        .breadcrumb-item.is-current { color: var(--ink); font-weight: 600; cursor: default; }
        .breadcrumb-item.is-current:hover { background: none; }
        .breadcrumb-sep { color: var(--ink-lighter); opacity: .55; flex-shrink: 0; }

        /* View pills — segmented control, sitting in topbar-right like Layout/Aa/↺ */
        .view-pills {
            display: inline-flex; align-items: center; gap: 2px;
            padding: 2px;
            background: var(--faint);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }
        .view-pills .pill {
            font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em;
            text-transform: uppercase; background: transparent; border: none;
            color: var(--ink-light); padding: 4px 10px;
            border-radius: calc(var(--radius-sm) - 2px);
            cursor: pointer; font-weight: 500;
            min-height: 26px;
            display: inline-flex; align-items: center; justify-content: center;
            transition: color .15s ease, background .15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .view-pills .pill:hover { color: var(--ink); }
        .view-pills .pill.active { background: var(--ink); color: var(--bg); }

        @media (max-width: 640px) {
            .breadcrumb { display: none; }
            .view-pills .pill { font-size: 8px; padding: 3px 8px; }
        }

        /* ═══════════════════════════════════════════════════════
           VIEWPORT BLUR + SCROLL PROGRESS — verbatim
           ═══════════════════════════════════════════════════════ */
        .viewport-blur {
            position: fixed; left: 0; right: 0; z-index: 40; pointer-events: none;
            backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
            transition: backdrop-filter 0.3s ease, background 0.4s ease;
        }
        .viewport-blur.scrolling { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(8px); }
        .viewport-blur-top {
            top: 0; height: calc(var(--topbar-height) + 36px);
            background: linear-gradient(to bottom, rgba(var(--nav-bg-rgb), 0.7), rgba(var(--nav-bg-rgb), 0));
            mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
        }
        .viewport-blur-bottom {
            bottom: 0; height: calc(var(--hud-height) + 60px);
            background: linear-gradient(to top, rgba(var(--nav-bg-rgb), 0.7), rgba(var(--nav-bg-rgb), 0));
            mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
        }
        body[data-theme='dark'] .viewport-blur-top { background: linear-gradient(to bottom, rgba(28,28,30,0.7), rgba(28,28,30,0)); }
        body[data-theme='dark'] .viewport-blur-bottom { background: linear-gradient(to top, rgba(28,28,30,0.7), rgba(28,28,30,0)); }

        .scroll-border-top, .scroll-border-bottom {
            position: fixed; height: 3px; background: var(--accent);
            z-index: 160; width: 0%; pointer-events: none;
            box-shadow: 0 0 10px rgba(229, 229, 103, 0.35);
            transition: width 0.12s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .scroll-border-top { top: 0; left: 0; border-radius: 0 2px 2px 0; }
        .scroll-border-bottom { bottom: 0; right: 0; border-radius: 2px 0 0 2px; }
        .scroll-border-corner { position: fixed; z-index: 160; pointer-events: none; background: var(--accent); opacity: 0; transition: opacity 0.3s ease; }
        .scroll-border-corner.show { opacity: 1; }
        .scroll-border-corner-tl { top: 0; left: 0; width: 6px; height: 6px; }
        .scroll-border-corner-tr { top: 0; right: 0; width: 6px; height: 6px; }
        .scroll-border-corner-bl { bottom: 0; left: 0; width: 6px; height: 6px; }
        .scroll-border-corner-br { bottom: 0; right: 0; width: 6px; height: 6px; }

        /* ═══════════════════════════════════════════════════════
           CUSTOM CURSOR — verbatim, with z-index fixed above modal
           ═══════════════════════════════════════════════════════ */
        body.custom-cursor-active { cursor: none; }
        .write-cursor-dot, .write-cursor-ellipse {
            position: fixed; top: 0; left: 0; z-index: 9999; pointer-events: none;
            transform: translate(-9999px, -9999px); opacity: 0;
            transition: opacity 0.18s ease, background-color .2s ease, border-color .2s ease;
            will-change: transform;
        }
        .write-cursor-dot.visible, .write-cursor-ellipse.visible { opacity: 1; }
        .write-cursor-dot { width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--ink); }
        .write-cursor-ellipse { width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 1.5px solid var(--ink); border-radius: 50%; opacity: 0; }
        .write-cursor-ellipse.visible { opacity: 0.32; }
        body.custom-cursor-active.write-native-cursor { cursor: auto; }
        .write-native-cursor .write-cursor-dot, .write-native-cursor .write-cursor-ellipse { opacity: 0 !important; }
        @media (hover: none) {
            body.custom-cursor-active { cursor: auto; }
            .write-cursor-dot, .write-cursor-ellipse { display: none; }
        }

        /* ═══════════════════════════════════════════════════════
           VIEW CONTAINERS
           ═══════════════════════════════════════════════════════ */
        .view {
            position: relative; width: 100%; display: none;
            padding: 0 var(--margin) 1rem;
            max-width: var(--max-width);
            margin: 0 auto;
        }
        .view.active { display: block; }

        /* ═══════════════════════════════════════════════════════
           PROV CARD — square media, verbatim shape
           ═══════════════════════════════════════════════════════ */
        .prov-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); box-shadow: var(--shadow);
            padding: 16px 18px 14px;
            display: flex; flex-direction: column; gap: 10px;
            width: 100%; min-height: 260px;
            cursor: pointer; position: relative; overflow: hidden;
            transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease;
            color: var(--ink);
        }
        .prov-card:hover { box-shadow: var(--shadow-hover); }
        @media (hover: hover) and (pointer: fine) {
            .flow-item:hover .prov-card,
            .list-card:hover .prov-card,
            .g-item:hover .prov-card { transform: translateY(-2px); }
        }

        .prov-card-kicker {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            font-family: var(--font-mono); font-size: 8px; font-weight: 600;
            letter-spacing: .12em; text-transform: uppercase; color: var(--ink-light);
        }
        .prov-card-type { display: flex; align-items: center; gap: 6px; }
        .prov-card-type::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: var(--ink-lighter);
        }
        .prov-card[data-type="statement"] .prov-card-type::before { background: var(--ink); }
        .prov-card[data-type="evidence"]  .prov-card-type::before { background: var(--impact-gain); }
        .prov-card[data-type="reply"]     .prov-card-type::before { background: var(--impact-accent); }
        .prov-card[data-type="update"]    .prov-card-type::before { background: var(--impact-loss); }
        .prov-card[data-type="letter"]    .prov-card-type::before { background: var(--accent); }

        .prov-card-status {
            padding: 1px 7px; border-radius: 999px; font-size: 7px;
            border: 1px solid currentColor; color: var(--ink-light);
            letter-spacing: .08em; white-space: nowrap;
        }
        .prov-card-status[data-status="published"] { color: var(--ink); }
        .prov-card-status[data-status="verified"]  { color: var(--impact-gain); }
        .prov-card-status[data-status="contested"] { color: var(--impact-loss); }
        .prov-card-status[data-status="revised"]   { color: var(--impact-accent); }
        .prov-card-status[data-status="draft"]     { color: var(--ink-light); border-style: dashed; }
        .prov-card-status[data-status="archived"]  { color: var(--ink-lighter); }

        /* Square media */
        .prov-card-media {
            width: 100%; aspect-ratio: 1 / 1;
            border-radius: 6px; overflow: hidden; position: relative; flex-shrink: 0;
            background:
                repeating-linear-gradient(
                    -45deg,
                    var(--card-mid) 0 6px,
                    color-mix(in srgb, var(--card-mid) 82%, #000) 6px 12px
                );
        }
        .prov-card-media::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.35) 100%);
            pointer-events: none; z-index: 1;
        }
        .prov-card-media img,
        .prov-card-media video {
            width: 100%; height: 100%; object-fit: cover; display: block;
            position: relative; z-index: 0;
            filter: grayscale(0.55) contrast(1.05);
            transition: filter 0.35s ease;
        }
        .prov-card:hover .prov-card-media img,
        .prov-card:hover .prov-card-media video { filter: grayscale(0) contrast(1.02); }
        .prov-card-media::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.28), transparent 45%);
            pointer-events: none; z-index: 2;
        }
        .prov-card-media-badge {
            position: absolute; top: 8px; left: 8px; z-index: 3;
            font-family: var(--font-mono); font-size: 7px; letter-spacing: .1em;
            text-transform: uppercase; color: #fff;
            background: rgba(0,0,0,0.55); padding: 2px 6px; border-radius: 3px;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        }

        /* Letter teaser card — same slot, no media, editorial badge + deep-link affordance */
        .prov-card[data-type="letter"] .prov-card-letter-mark {
            display: flex; align-items: center; gap: 6px;
            font-family: var(--font-mono); font-size: 8px; letter-spacing: .12em;
            text-transform: uppercase; color: var(--ink-light);
            padding-bottom: 8px; border-bottom: 1px solid var(--border);
        }
        .prov-card[data-type="letter"] .prov-card-letter-mark svg { width: 11px; height: 11px; flex-shrink: 0; }
        .prov-card[data-type="letter"] .prov-card-title { font-size: 18px; margin-top: 4px; }
        .prov-card[data-type="letter"] .prov-card-deck { -webkit-line-clamp: 6; }
        .prov-card[data-type="letter"] .prov-card-letter-cta {
            margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            font-family: var(--font-mono); font-size: 8px; letter-spacing: .1em;
            text-transform: uppercase; color: var(--ink-light);
        }
        .prov-card[data-type="letter"] .prov-card-letter-cta .arrow {
            font-family: var(--font-mono); font-size: 12px;
            transition: transform .2s ease;
        }
        .prov-card[data-type="letter"]:hover .prov-card-letter-cta .arrow {
            transform: translateX(3px);
            color: var(--ink);
        }

        .prov-card-title {
            font-family: var(--font); font-size: 17px; font-weight: 700;
            letter-spacing: -.01em; line-height: 1.2; color: var(--ink); margin: 0;
        }
        .prov-card-deck {
            font-size: 12.5px; line-height: 1.5; color: var(--ink-mid); margin: 0;
            display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .prov-card-meta {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; margin-top: auto;
            padding-top: 12px; border-top: 1px solid var(--border);
            font-family: var(--font-mono); font-size: 8px; letter-spacing: .06em;
            text-transform: uppercase; color: var(--ink-light);
        }
        .prov-card-source { display: flex; align-items: center; gap: 4px; }
        .prov-card-relations { display: flex; gap: 8px; }
        .prov-card-relation { display: flex; align-items: center; gap: 3px; opacity: .75; }
        .prov-card-relation strong { font-weight: 600; color: var(--ink-mid); }

        /* ═══════════════════════════════════════════════════════
           FLOW VIEW — horizontal parallax timeline (unchanged)
           ═══════════════════════════════════════════════════════ */
        #view-flow { position: relative; overflow: hidden; width: 100%; padding: 0; margin: 0; max-width: 100%; }
        #flow-viewport {
            position: relative; overflow: hidden; cursor: grab;
            width: 100%;
            height: calc(100vh - var(--topbar-height) - var(--hud-height) - 100px);
            min-height: 420px;
        }
        #flow-viewport.grabbing { cursor: grabbing; }
        #flow-bgtext {
            position: absolute; top: 50%; left: 0; white-space: nowrap;
            font-family: var(--font); font-weight: 700;
            font-size: 15vw; line-height: 1;
            color: color-mix(in srgb, var(--ink) 5%, transparent);
            transform: translateY(-50%);
            will-change: transform; user-select: none; pointer-events: none;
            letter-spacing: -0.03em;
        }
        #flow-track { position: absolute; top: 0; left: 0; height: 100%; will-change: transform; }
        #flow-items-layer { position: absolute; top: 0; left: 0; height: 100%; will-change: transform; }
        .flow-col-items { will-change: transform; position: absolute; top: 0; height: 100%; }
        .flow-col-line { position: absolute; top: 14%; bottom: 16%; width: 1px; background: var(--rule); pointer-events: none; }
        .flow-col-label {
            position: absolute; bottom: 2.4rem;
            font-family: var(--font-mono); font-weight: 500;
            font-size: 0.62rem; letter-spacing: 0.22em;
            text-transform: uppercase; color: var(--ink-light);
            writing-mode: vertical-rl; transform: rotate(180deg);
            pointer-events: none; white-space: nowrap;
        }
        .flow-col-label .num { color: var(--ink-lighter); margin-bottom: 8px; font-weight: 600; }
        .flow-item {
            position: absolute; width: var(--card-w);
            cursor: pointer; transition: filter 0.3s, opacity 0.3s;
            will-change: transform; z-index: 1;
        }
        .flow-item:hover { z-index: 30; }
        .flow-item.dim { opacity: 0.22; }
        .flow-hero {
            position: absolute; left: var(--margin); bottom: calc(var(--margin) + 8px);
            z-index: 20; font-family: var(--font); font-weight: 300;
            font-size: clamp(2rem, 6.5vw, 4.6rem);
            line-height: 0.92; letter-spacing: -0.03em; pointer-events: none;
            color: var(--ink); opacity: 0.9; mix-blend-mode: difference;
        }
        .flow-hero .dot { color: var(--accent); }
        #flow-hint {
            position: fixed; bottom: calc(var(--hud-height) + 20px);
            right: var(--margin); z-index: 100;
            font-family: var(--font-mono); font-size: 0.6rem;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--ink-light); text-align: right;
            line-height: 1.7; pointer-events: none;
        }

        /* ═══════════════════════════════════════════════════════
           LIST VIEW
           ═══════════════════════════════════════════════════════ */
        #view-list { padding-top: 0.5rem; }
        #list-wrap {
            overflow-y: auto;
            max-height: calc(100vh - var(--topbar-height) - var(--hud-height) - 76px);
            scroll-behavior: smooth;
        }
        #list-wrap::-webkit-scrollbar { width: 0; }
        .list-row { border-bottom: 1px solid var(--border); }
        .list-row-head {
            display: flex; align-items: center; gap: 0.9rem;
            padding: 1rem 0.2rem; cursor: pointer; user-select: none;
        }
        .list-num { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-light); white-space: nowrap; min-width: 1.6rem; }
        .list-name {
            font-family: var(--font); font-weight: 300; flex: 1; min-width: 0;
            font-size: clamp(1.6rem, 4.2vw, 2.7rem);
            color: var(--ink-lighter);
            transition: color 0.3s, font-weight 0.3s;
        }
        .list-row.expanded .list-name { color: var(--ink); font-weight: 600; }
        .list-row-head-right { display: flex; align-items: center; gap: 0.7rem; flex-shrink: 0; }
        .list-count { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-light); white-space: nowrap; }
        .list-row-body {
            display: grid; grid-template-rows: 0fr;
            transition: grid-template-rows 0.55s cubic-bezier(0.65, 0, 0.35, 1);
        }
        .list-row-body-inner { overflow: hidden; }
        .list-row.expanded .list-row-body { grid-template-rows: 1fr; }
        .list-strip { display: flex; flex-wrap: wrap; gap: 0.9rem; padding: 0.2rem 0.2rem 1.6rem; }
        .list-card {
            flex: 0 0 auto; width: 220px; cursor: pointer;
            position: relative; z-index: 1;
            content-visibility: auto; contain-intrinsic-size: 220px 340px;
        }
        .list-card:hover { z-index: 30; }
        .list-card.dim { opacity: 0.22; }
        .list-empty { padding: 0 0.2rem 1.6rem; font-size: 0.72rem; color: var(--ink-light); letter-spacing: 0.04em; }

        /* ═══════════════════════════════════════════════════════
           GRID VIEW
           ═══════════════════════════════════════════════════════ */
        #view-grid { padding-top: 0.5rem; }
        #grid-scroll {
            overflow-y: auto;
            max-height: calc(100vh - var(--topbar-height) - var(--hud-height) - 76px);
        }
        #grid-scroll::-webkit-scrollbar { width: 0; }
        #grid-topline {
            display: flex; justify-content: space-between; align-items: baseline;
            padding-bottom: 1rem; margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        #grid-title { font-family: var(--font); font-weight: 700; font-size: 1rem; letter-spacing: 0.02em; }
        #grid-count { font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-light); }
        #grid-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem 1rem;
        }
        .g-item { cursor: pointer; position: relative; z-index: 1; }
        .g-item:hover { z-index: 30; }
        .g-item.dim { opacity: 0.22; }

        #grid-sections {
            position: sticky; bottom: 0; left: 0; width: 100%;
            z-index: 60; display: flex; gap: 0.4rem; flex-wrap: wrap;
            padding: 1rem 0;
            background: linear-gradient(to top, var(--bg) 55%, transparent);
            pointer-events: none;
        }
        #grid-sections > * { pointer-events: auto; }
        .cat-pill {
            padding: 0.5rem 1rem; border-radius: 2px;
            border: 1px solid var(--border); background: var(--card);
            font-family: var(--font-mono); font-size: 0.62rem;
            letter-spacing: 0.08em; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s; color: var(--ink);
            box-shadow: var(--shadow);
        }
        .cat-pill:hover { border-color: var(--ink); }
        .cat-pill.active { background: var(--accent); border-color: var(--accent); color: #1c1c1e; }

        /* ═══════════════════════════════════════════════════════
           HUD — verbatim from reference
           ═══════════════════════════════════════════════════════ */
        .hud {
            position: fixed; left: 50%; transform: translateX(-50%);
            z-index: 100;
            background: color-mix(in srgb, var(--bg) 92%, transparent);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: var(--radius);
            box-shadow: var(--shadow-floating);
            display: flex; align-items: center; justify-content: center;
            min-height: 44px; font-family: var(--font-mono);
            max-width: min(560px, calc(100vw - var(--margin) * 2));
        }
        .hud-bottom { bottom: calc(12px + var(--scrollbar-height)); padding: 10px 18px; min-height: 48px; gap: 12px; }
        .hud .btn { min-height: 30px; padding: 5px 10px; font-size: 8px; }
        .hud-count { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--fg); line-height: 1; flex-shrink: 0; }
        .hud-sep { width: 1px; height: 12px; background: var(--border); flex-shrink: 0; display: block; }
        .hud-text {
            font-size: 9px; font-weight: 500; letter-spacing: .12em;
            text-transform: uppercase; color: var(--ink-light);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            min-width: 0;
        }
        .hud-filter {
            font-family: var(--font-mono); font-size: 7px; letter-spacing: .08em;
            text-transform: uppercase;
            padding: 4px 10px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: transparent;
            color: var(--ink-mid); cursor: pointer;
            transition: background .15s ease, color .15s ease, border-color .15s ease;
            flex-shrink: 0;
            min-height: 24px;
            display: inline-flex; align-items: center;
        }
        .hud-filter:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
        .hud-filter.is-filtered { background: var(--accent); color: #1c1c1e; border-color: var(--accent); }

        .hud-mobile-only { display: none !important; }
        @media (max-width: 640px) {
            .hud-mobile-only:not([hidden]) { display: flex !important; }
            .hud-bottom { padding: 8px 14px; min-height: 44px; gap: 10px; }
            .hud .btn { font-size: 7px; padding: 4px 8px; min-height: 26px; }
            .hud-text { display: none; }
        }

        /* ═══ MOBILE HUD — notification breadcrumb, verbatim ═══ */
        #hudGallery {
            bottom: calc(14px + var(--scrollbar-height) + env(safe-area-inset-bottom, 0px));
            padding: 0; gap: 8px; min-height: 0;
            background: transparent; border: none; box-shadow: none;
            backdrop-filter: none; -webkit-backdrop-filter: none;
            max-width: calc(100vw - 24px);
            pointer-events: none;
        }
        #hudGallery > * { pointer-events: auto; }

        #hudGallery .hud-canvas-nav {
            display: flex; align-items: center; justify-content: center;
            width: 44px; height: 44px;
            background: color-mix(in srgb, var(--bg) 94%, transparent);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.10), 0 2px 6px rgba(0, 0, 0, 0.04);
            color: var(--ink);
            font-size: 18px; line-height: 1; padding: 0;
            cursor: pointer; flex-shrink: 0;
            transition: transform 0.15s ease, background 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        #hudGallery .hud-canvas-nav:active { transform: scale(0.94); }

        .hud-canvas-notif {
            display: flex; align-items: center; gap: 10px;
            min-width: 0; flex: 0 1 auto;
            padding: 10px 14px;
            background: color-mix(in srgb, var(--bg) 94%, transparent);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.10), 0 2px 6px rgba(0, 0, 0, 0.04);
            font-family: var(--font); color: var(--ink);
            cursor: pointer; max-width: 66vw; text-align: left;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .hud-canvas-notif:active {
            transform: scale(0.97);
            background: color-mix(in srgb, var(--bg) 86%, transparent);
        }
        .hud-canvas-notif.updating {
            animation: notif-pulse 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes notif-pulse {
            0%   { transform: scale(1);    }
            45%  { transform: scale(1.035); }
            100% { transform: scale(1);    }
        }

        .notif-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent); flex-shrink: 0;
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
        }
        .notif-path { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; overflow: hidden; }
        .notif-crumb {
            font-size: 13px; font-weight: 600; letter-spacing: -0.005em;
            color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            min-width: 0;
        }
        .notif-crumb-parent {
            font-family: var(--font-mono); font-size: 9px; font-weight: 600;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--ink-light); flex-shrink: 0;
        }
        .notif-sep { color: var(--ink-lighter); font-size: 11px; flex-shrink: 0; transform: translateY(-1px); }
        .notif-idx {
            font-family: var(--font-mono); font-size: 10px;
            color: var(--ink-light); font-variant-numeric: tabular-nums;
            letter-spacing: 0.02em; flex-shrink: 0;
            border-left: 1px solid var(--border);
            margin-left: 2px; padding-left: 10px;
        }

        /* ═══════════════════════════════════════════════════════
           APPEARANCE DROPDOWN — verbatim
           ═══════════════════════════════════════════════════════ */
        .topbar-appearance-dropdown {
            position: fixed; min-width: 132px; background: var(--card);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            box-shadow: var(--shadow-floating); padding: 4px 0; z-index: 200;
            display: none; flex-direction: column;
        }
        .topbar-appearance-dropdown.open { display: flex; }
        .topbar-appearance-dropdown .menu-item {
            padding: 7px 14px; font-family: var(--font-mono); font-size: 9px;
            letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-mid);
            cursor: pointer; border: none; background: none; text-align: left;
            width: 100%; white-space: nowrap;
        }
        .topbar-appearance-dropdown .menu-item:hover { background: var(--bg); color: var(--ink); }
        .topbar-appearance-dropdown .menu-item.active { background: var(--ink); color: var(--bg); }

        /* ═══════════════════════════════════════════════════════
           MOBILE SHEET — verbatim from reference
           ═══════════════════════════════════════════════════════ */
        .mobile-sheet-backdrop {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 400;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .mobile-sheet-backdrop.open { opacity: 1; }
        .mobile-sheet {
            position: fixed; left: 0; right: 0; bottom: 0;
            z-index: 401;
            background: var(--bg);
            border-top: 1px solid var(--border);
            border-radius: 18px 18px 0 0;
            max-height: 88vh;
            display: flex; flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 -8px 32px rgba(0,0,0,0.18);
        }
        .mobile-sheet.open { transform: translateY(0); }
        .mobile-sheet-header {
            position: relative; padding: 10px 12px 6px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .mobile-sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--ink-lighter); }
        .mobile-sheet-close {
            position: absolute; right: 8px; top: 4px;
            width: 40px; height: 40px;
            background: none; border: none;
            color: var(--ink-light); font-size: 24px; line-height: 1;
            cursor: pointer; border-radius: 8px;
        }
        .mobile-sheet-close:hover { background: var(--faint); color: var(--ink); }
        .mobile-sheet-body {
            overflow-y: auto;
            padding: 4px 14px calc(32px + env(safe-area-inset-bottom, 0px));
            flex: 1;
            -webkit-overflow-scrolling: touch;
        }
        .mobile-identity-block {
            width: 100%;
            display: flex; align-items: center; gap: 12px;
            padding: 14px 12px;
            background: #ffffff;
            border: 1px solid rgba(0,0,0,.10);
            border-radius: var(--radius-sm);
            text-align: left; cursor: pointer;
            margin-bottom: 8px; font-family: inherit;
            color: #1c1c1e;
            transition: transform 0.1s ease;
        }
        .mobile-identity-block:active { transform: scale(0.99); }
        .mobile-identity-block .identity-monogram {
            width: 40px; height: 40px; border-radius: 8px;
            background: var(--accent); color: #1c1c1e;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 16px; flex-shrink: 0;
            letter-spacing: -0.02em;
        }
        .mobile-identity-name { font-weight: 700; font-size: 15px; color: #1c1c1e; line-height: 1.2; }
        .mobile-identity-role {
            font-family: var(--font-mono); font-size: 9px;
            letter-spacing: .06em; text-transform: uppercase;
            color: rgba(28,28,30,.58); margin-top: 3px;
        }
        .mobile-identity-status {
            margin-left: auto;
            font-family: var(--font-mono); font-size: 8px;
            letter-spacing: .08em; text-transform: uppercase;
            padding: 3px 9px; border-radius: 999px;
            border: 1px solid currentColor;
            color: #2F6B4F; flex-shrink: 0;
        }

        .mobile-index-row {
            width: 100%;
            display: flex; align-items: center; gap: 12px;
            padding: 14px 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: var(--font-mono);
            color: var(--fg); font-size: 11px;
            letter-spacing: .06em; text-transform: uppercase;
            transition: transform 0.1s ease;
        }
        .mobile-index-row:active { transform: scale(0.99); }
        .mobile-index-row .index-num { color: var(--ink-light); font-weight: 600; font-size: 10px; }
        .mobile-index-row .mobile-index-label { flex: 1; text-align: left; color: var(--ink); font-weight: 600; }
        .mobile-index-row .mobile-index-count { font-size: 9px; color: var(--ink-light); }

        .mobile-section-label {
            font-family: var(--font-mono); font-size: 9px;
            font-weight: 600; letter-spacing: .14em;
            text-transform: uppercase; color: var(--ink-light);
            padding: 22px 4px 8px;
        }
        .mobile-sections { list-style: none; padding: 0; margin: 0; }
        .mobile-section { border-bottom: 1px solid var(--border); }
        .mobile-section-header {
            width: 100%;
            display: grid;
            grid-template-columns: 26px 1fr auto 22px;
            gap: 10px; align-items: center;
            padding: 16px 6px;
            background: none; border: none;
            color: var(--fg); font-family: inherit;
            text-align: left; cursor: pointer;
            font-size: 15px; border-radius: 6px;
        }
        .mobile-section-header:active { background: var(--faint); }
        .mobile-section-header .mobile-section-title { font-weight: 600; color: var(--ink); }
        .mobile-section-count { font-family: var(--font-mono); font-size: 10px; color: var(--ink-light); }
        .mobile-expand-icon {
            font-size: 15px; color: var(--ink-light);
            transition: transform 0.2s ease;
            display: inline-block; text-align: center;
        }
        .mobile-section.expanded .mobile-expand-icon { transform: rotate(45deg); }
        .mobile-section-cards { list-style: none; padding: 0 0 10px 38px; margin: 0; }
        .mobile-card-row {
            width: 100%;
            display: flex; justify-content: space-between;
            align-items: center; gap: 10px;
            padding: 12px 8px;
            background: none; border: none;
            color: var(--fg); font-family: inherit;
            text-align: left; cursor: pointer;
            font-size: 13px; border-radius: 6px;
        }
        .mobile-card-row:active { background: var(--faint); }
        .mobile-card-title { color: var(--ink-mid); }
        .mobile-card-status {
            font-family: var(--font-mono); font-size: 7px;
            letter-spacing: .06em; text-transform: uppercase;
            color: var(--ink-light);
        }
        .mobile-canvas-controls {
            display: flex; flex-wrap: wrap; gap: 6px;
            padding: 4px 0 12px;
        }
        .mobile-canvas-controls .btn {
            font-size: 10px; min-height: 36px; padding: 8px 14px;
            flex: 1 1 auto;
        }
        .mobile-canvas-controls .btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

        /* ═══════════════════════════════════════════════════════
           CONTEXT MENU — verbatim from reference
           ═══════════════════════════════════════════════════════ */
        .context-menu {
            position: fixed; z-index: 800;
            background: var(--card); border: 1px solid var(--border);
            min-width: 190px; max-height: 60vh; overflow-y: auto;
            box-shadow: var(--shadow-floating);
            opacity: 0; pointer-events: none;
            transform: scale(0.97);
            transition: opacity 0.12s, transform 0.12s;
            padding: 0.35rem; border-radius: var(--radius-sm);
        }
        .context-menu.show { opacity: 1; pointer-events: all; transform: scale(1); }
        .ctx-menu-label {
            font-family: var(--font-mono); font-size: 0.6rem;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--ink-light); padding: 0.4rem 0.6rem 0.3rem;
        }
        .ctx-menu-item {
            font-family: var(--font); font-size: 0.78rem;
            color: var(--ink); padding: 0.45rem 0.6rem;
            border-radius: 3px; cursor: pointer; white-space: nowrap;
        }
        .ctx-menu-item:hover { background: var(--faint); }

        /* ═══════════════════════════════════════════════════════
           RESPONSIVE — verbatim where applicable
           ═══════════════════════════════════════════════════════ */
        @media (max-width: 640px) {
            :root { --card-w: 172px; }
            #flow-viewport { min-height: 400px; }
            .list-card { width: 180px; }
            .flow-hero { font-size: clamp(1.8rem, 9vw, 3rem); }
            .hud-filter { font-size: 6px; padding: 3px 8px; min-height: 22px; }
        }
    </style>
</head>
<body data-theme="dark">

    <!-- ═══════ CUSTOM CURSOR ═══════ -->
    <div class="write-cursor-ellipse" id="writeCursorEllipse" aria-hidden="true"></div>
    <div class="write-cursor-dot" id="writeCursorDot" aria-hidden="true"></div>

    <!-- ═══════ SCROLL PROGRESS ═══════ -->
    <div class="scroll-border-top" id="scrollBorderTop" role="progressbar" aria-valuenow="0"></div>
    <div class="scroll-border-bottom" id="scrollBorderBottom" role="progressbar" aria-valuenow="0"></div>
    <div class="scroll-border-corner scroll-border-corner-tl" id="cornerTL"></div>
    <div class="scroll-border-corner scroll-border-corner-tr" id="cornerTR"></div>
    <div class="scroll-border-corner scroll-border-corner-bl" id="cornerBL"></div>
    <div class="scroll-border-corner scroll-border-corner-br" id="cornerBR"></div>

    <!-- ═══════ VIEWPORT BLUR ═══════ -->
    <div class="viewport-blur viewport-blur-top" id="viewportBlurTop" aria-hidden="true"></div>
    <div class="viewport-blur viewport-blur-bottom" id="viewportBlurBottom" aria-hidden="true"></div>

    <!-- ═══════ TOPBAR — mirrors reference exactly ═══════ -->
    <div class="topbar">
        <div class="wrap">
            <div class="wordmark" id="wordmark" title="Back to canvas">
                <span>intoview.pro</span>
                <span class="count" id="topCount">◈ gallery</span>
            </div>
            <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
                <button type="button" class="breadcrumb-item" id="breadcrumbCanvas">Canvas</button>
                <span class="breadcrumb-sep" aria-hidden="true">/</span>
                <button type="button" class="breadcrumb-item is-current" aria-current="page">Gallery</button>
            </nav>
            <div class="topbar-right">
                <div class="view-pills" id="viewPills" role="tablist" aria-label="Gallery view">
                    <button type="button" class="pill active" data-view="flow" role="tab" aria-selected="true">Flow</button>
                    <button type="button" class="pill" data-view="list" role="tab" aria-selected="false">List</button>
                    <button type="button" class="pill" data-view="grid" role="tab" aria-selected="false">Grid</button>
                </div>
                <div class="topbar-appearance-wrapper">
                    <button class="btn" id="appearanceTrigger" aria-haspopup="true" aria-expanded="false" title="Appearance">Aa</button>
                </div>
                <button class="btn" id="topResetBtn" title="Reset to first card">↺</button>
            </div>
        </div>
    </div>

    <!-- ═══════ FLOW VIEW ═══════ -->
    <section id="view-flow" class="view active">
        <div id="flow-viewport">
            <div id="flow-bgtext">intoview<span style="color:var(--accent)">.</span>pro</div>
            <div id="flow-track"></div>
            <div id="flow-items-layer"></div>
        </div>
        <div class="flow-hero">The<span class="dot">.</span>Room</div>
        <div id="flow-hint">Drag or scroll — sideways<br>Click a card to open</div>
    </section>

    <!-- ═══════ LIST VIEW ═══════ -->
    <section id="view-list" class="view">
        <div id="list-wrap"></div>
    </section>

    <!-- ═══════ GRID VIEW ═══════ -->
    <section id="view-grid" class="view">
