function cardsInSection(id) { return CARDS.filter(c => c.s === id); }
function matches(c) { return !filterSection || c.s === filterSection; }

/* ═══════════════════════════════════════════════════════════
   CARD RENDERER — one face per type (type→face-treatment map)
   ═══════════════════════════════════════════════════════════ */
function renderProvCard(card, opts) {
    opts = opts || {};
    const el = document.createElement('article');
    el.className = 'prov-card';
    el.dataset.type = card.t;
    el.dataset.status = card.st;
    el.dataset.cardId = card.id;

    const refCount = (card.refs?.length || 0) + (card.reps?.length || 0) + (card.upd?.length || 0);

    // ═══ LETTER FACE — teaser, no media, deep-link affordance ═══
    if (card.t === 'letter') {
        el.innerHTML = `
            <div class="prov-card-kicker">
                <span class="prov-card-type">Letter</span>
                <span class="prov-card-status" data-status="${escapeHtml(card.st)}">${escapeHtml(card.st)}</span>
            </div>
            <div class="prov-card-letter-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 4h13l3 3v13H4z"/>
                    <path d="M8 9h8M8 13h8M8 17h5"/>
                </svg>
                <span>Editorial · ${escapeHtml(card.clusterId || 'manifesto')}</span>
            </div>
            <h3 class="prov-card-title">${escapeHtml(card.title)}</h3>
            <p class="prov-card-deck">${escapeHtml(card.deck)}</p>
            <div class="prov-card-letter-cta">
                <span>Read the letter</span>
                <span class="arrow" aria-hidden="true">→</span>
            </div>
        `;
        return el;
    }

    // ═══ MEDIA-TYPE FACE — statement / evidence / reply / update ═══
    let mediaHTML = '';
    if (card.media && opts.showMedia !== false) {
        const isVideo = card.media.k === 'video';
        const badge = isVideo ? 'Video' : 'Photo';
        mediaHTML = `
            <div class="prov-card-media">
                <span class="prov-card-media-badge">${badge}</span>
                ${isVideo
                    ? `<video src="${card.media.src}" muted loop playsinline preload="auto"></video>`
                    : `<img src="${card.media.src}" loading="eager" decoding="async" alt="">`
                }
            </div>`;
    }

    el.innerHTML = `
        <div class="prov-card-kicker">
            <span class="prov-card-type">${escapeHtml(cardTypeLabel(card.t))}</span>
            <span class="prov-card-status" data-status="${escapeHtml(card.st)}">${escapeHtml(card.st)}</span>
        </div>
        ${mediaHTML}
        <h3 class="prov-card-title">${escapeHtml(card.title)}</h3>
        <p class="prov-card-deck">${escapeHtml(card.deck)}</p>
        <div class="prov-card-meta">
            <span class="prov-card-source">${escapeHtml(card.src)}</span>
            <span class="prov-card-relations">
                ${refCount > 0 ? `<span class="prov-card-relation"><strong>${refCount}</strong> ref</span>` : ''}
            </span>
        </div>
    `;
    return el;
}

/* ═══════════════════════════════════════════════════════════
   VIDEO
   ═══════════════════════════════════════════════════════════ */
function wireVideo(containerEl) {
    const video = containerEl.querySelector('video');
    if (!video) return;
    video.preload = 'auto';
    const seekFirstFrame = () => {
        if (video.readyState >= 1 && video.currentTime === 0) {
            try { video.currentTime = 0.1; } catch (e) {}
        }
    };
    if (video.readyState >= 1) seekFirstFrame();
    else video.addEventListener('loadedmetadata', seekFirstFrame, { once: true });
    video.addEventListener('loadeddata', () => {
        try { if (video.currentTime === 0) video.currentTime = 0.1; } catch (e) {}
    }, { once: true });

    if (IS_TOUCH) {
        const io = new IntersectionObserver(entries => {
            entries.forEach(en => {
                if (en.isIntersecting && en.intersectionRatio >= 0.5) video.play().catch(() => {});
                else video.pause();
            });
        }, { threshold: [0, .5, 1] });
        io.observe(containerEl);
    } else {
        containerEl.addEventListener('mouseenter', () => video.play().catch(() => {}));
        containerEl.addEventListener('mouseleave', () => { video.pause(); video.currentTime = 0; });
    }
}

/* ═══════════════════════════════════════════════════════════
   CARD INTERACTION
   ═══════════════════════════════════════════════════════════ */
function openCard(card) {
    if (card.t === 'letter') {
        // Letters deep-link to their real home on the canvas.
        window.location.href = `${CANVAS_URL}#/${card.clusterId}/${card.id.split('/')[1]}`;
        return;
    }
    // Non-letters: context menu shows options (copy link, filter, etc).
    // Real detail modal is deferred — letters are the only cards with
    // a native reading experience in the platform right now.
    // For demo, we just filter to their section.
    setFilter(card.s === filterSection ? null : card.s);
}

function wireCardInteractions(containerEl, card) {
    containerEl.addEventListener('click', (e) => {
        if (e.target.closest('.context-menu')) return;
        openCard(card);
    });
    containerEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        showCardContextMenu(e.clientX, e.clientY, card);
    });
}

/* ═══════════════════════════════════════════════════════════
   FLOW VIEW — horizontal parallax timeline (unchanged logic)
   ═══════════════════════════════════════════════════════════ */
const flowTrack = document.getElementById('flow-track');
const flowItemsLayer = document.getElementById('flow-items-layer');
const flowBg = document.getElementById('flow-bgtext');
const flowViewport = document.getElementById('flow-viewport');

const SUBCOL_GAP = 24;
const COL_GUTTER = 80;
const COL_PAD = 40;
const GAP = 26;

let colX = [], trackWidth = 0, colBobEls = [];
let scrollX = 0, scrollTarget = 0, maxScroll = 0;

function getCardW() {
    return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-w')) || 240;
}

function estimateCardHeight(card, cardW) {
    // Letter cards: no media, taller prose block
    if (card.t === 'letter') {
        let h = 30 + 12 + 10 + 10 + 8 + 24 + 10 + 6 + 130 + 10 + 30;
        return h;
    }
    let h = 30;
    h += 12 + 10;
    if (card.media) h += cardW + 10;
    h += 22 + 10;
    h += 94 + 10;
    h += 24;
    return h;
}

function planColumn(cards, viewportH) {
    if (!cards.length) return { width: 160, placed: [], subCols: 1 };
    const cardW = getCardW();
    const usableH = Math.max(300, viewportH - 24);

    const laid = cards.map(c => {
        const seed = hash(c.title);
        const h = estimateCardHeight(c, cardW) + Math.round(srand(seed) * 8);
        return { card: c, seed, h };
    });

    const totalH = laid.reduce((a, d) => a + d.h, 0) + (laid.length - 1) * GAP;
    let subCols = Math.max(1, Math.ceil(totalH / usableH));
    subCols = Math.min(subCols, 6);
    subCols = Math.min(subCols, laid.length);

    let colHeights, placed;
    for (let attempt = subCols; attempt <= 6; attempt++) {
        colHeights = new Array(attempt).fill(0);
        placed = laid.map(d => {
            let best = 0;
            for (let c = 1; c < attempt; c++) if (colHeights[c] < colHeights[best]) best = c;
            const y = colHeights[best];
            colHeights[best] = y + d.h + GAP;
            return Object.assign({ sub: best, y }, d);
        });
        const tallest = Math.max(...colHeights.map(h => h - GAP));
        if (tallest <= usableH || attempt >= 6) { subCols = attempt; break; }
    }

    const colH = colHeights.map(h => Math.max(0, h - GAP));
    placed.forEach(p => { p.topOffset = p.y - colH[p.sub] / 2; });

    const width = COL_PAD * 2 + subCols * cardW + (subCols - 1) * SUBCOL_GAP;
    return { width, subCols, placed };
}

function renderFlow() {
    flowTrack.innerHTML = '';
    flowItemsLayer.innerHTML = '';
    colBobEls = [];

    const cardW = getCardW();
    const viewportH = flowViewport.clientHeight || (window.innerHeight - 320);

    const bySection = SECTIONS.map(s => cardsInSection(s.id));
    const plans = bySection.map(cards => planColumn(cards, viewportH));

    let cursorX = 120;
    colX = plans.map(p => { const x = cursorX; cursorX += p.width + COL_GUTTER; return x; });
    trackWidth = cursorX + 120;

    SECTIONS.forEach((s, m) => {
        const line = document.createElement('div');
        line.className = 'flow-col-line';
        line.style.left = colX[m] + 'px';
        flowTrack.appendChild(line);

        const label = document.createElement('div');
        label.className = 'flow-col-label';
        label.style.left = (colX[m] - 12) + 'px';
        label.innerHTML = `<span class="num">${escapeHtml(s.num)}</span>${escapeHtml(s.title)}`;
        flowTrack.appendChild(label);
    });

    plans.forEach((plan, m) => {
        const colWrap = document.createElement('div');
        colWrap.className = 'flow-col-items';
        colWrap.style.left = colX[m] + 'px';
        colWrap.style.width = plan.width + 'px';
        colWrap.dataset.colSeed = hash('col' + m);
        colBobEls.push(colWrap);

        plan.placed.forEach(p => {
            const card = p.card;
            const i = CARDS.indexOf(card);
            const subX = COL_PAD + p.sub * (cardW + SUBCOL_GAP);
            const jitter = Math.round(srand(p.seed + 1) * 14) - 7;
            const left = subX + jitter;

            const halfVp = viewportH / 2;
            let top = p.topOffset;
            if (top < -halfVp) top = -halfVp;
            if (top + p.h > halfVp) top = halfVp - p.h;

            const el = document.createElement('div');
            el.className = 'flow-item';
            el.style.left = left + 'px';
            el.style.width = cardW + 'px';
            el.style.top = 'calc(50% + ' + Math.round(top) + 'px)';
            el.dataset.i = i;
            el.dataset.cardId = card.id;

            const cardEl = renderProvCard(card);
            el.appendChild(cardEl);
            wireVideo(cardEl);
            wireCardInteractions(el, card);

            colWrap.appendChild(el);
        });

        flowItemsLayer.appendChild(colWrap);
    });

    maxScroll = Math.max(0, trackWidth - window.innerWidth + 240);
    scrollTarget = Math.max(-120, Math.min(maxScroll, scrollTarget));
    rendered.flow = true;
    updateBorderProgress();
    refreshDim();
}

/* scroll + drag */
let dragging = false, lastX = 0;
flowViewport.addEventListener('wheel', e => {
    e.preventDefault();
    scrollTarget += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY);
    scrollTarget = Math.max(-120, Math.min(maxScroll, scrollTarget));
}, { passive: false });
flowViewport.addEventListener('mousedown', e => {
    if (e.target.closest('.flow-item')) return;
    e.preventDefault();
    dragging = true; lastX = e.clientX;
    flowViewport.classList.add('grabbing');
});
window.addEventListener('mouseup', () => { dragging = false; flowViewport.classList.remove('grabbing'); });
window.addEventListener('mousemove', e => {
    if (!dragging) return;
    scrollTarget -= (e.clientX - lastX) * 1.4;
    scrollTarget = Math.max(-120, Math.min(maxScroll, scrollTarget));
    lastX = e.clientX;
});
let lt = 0;
flowViewport.addEventListener('touchstart', e => { lt = e.touches[0].clientX; }, { passive: true });
flowViewport.addEventListener('touchmove', e => {
    const x = e.touches[0].clientX;
    scrollTarget -= (x - lt) * 1.4;
    scrollTarget = Math.max(-120, Math.min(maxScroll, scrollTarget));
    lt = x;
}, { passive: true });

const BG_SPEED = 0.35, ITEMS_SPEED = 0.72, LINES_SPEED = 1.0;

function flowTick() {
    scrollX += (scrollTarget - scrollX) * 0.085;
    flowTrack.style.transform = `translate3d(${-scrollX*LINES_SPEED}px,0,0)`;
    flowItemsLayer.style.transform = `translate3d(${-scrollX*ITEMS_SPEED}px,0,0)`;
    flowBg.style.transform = `translate3d(${-scrollX*BG_SPEED}px,-50%,0)`;
    colBobEls.forEach(col => {
        const seed = +col.dataset.colSeed;
        const bob = Math.sin(scrollX * 0.0016 + seed) * 8;
        col.style.transform = `translate3d(0, ${bob.toFixed(1)}px, 0)`;
    });
    updateBorderProgress();
    requestAnimationFrame(flowTick);
}
requestAnimationFrame(flowTick);

/* ═══════════════════════════════════════════════════════════
   LIST VIEW
   ═══════════════════════════════════════════════════════════ */
const listWrap = document.getElementById('list-wrap');

function renderList() {
    listWrap.innerHTML = '';

    SECTIONS.forEach((s, m) => {
        const items = cardsInSection(s.id);
        const row = document.createElement('div');
        row.className = 'list-row' + (openSections.has(m) ? ' expanded' : '');
        row.dataset.m = m;

        const head = document.createElement('div');
        head.className = 'list-row-head';
        head.innerHTML = `
            <div class="list-num">${escapeHtml(s.num)}</div>
            <div class="list-name">${escapeHtml(s.title)}</div>
            <div class="list-row-head-right">
                <div class="list-count">${items.length} card${items.length === 1 ? '' : 's'}</div>
            </div>`;
        head.addEventListener('click', () => toggleOpen(m));
        row.addEventListener('mouseenter', () => { hoveredSection = m; row.classList.add('expanded'); });
        row.addEventListener('mouseleave', () => {
            if (hoveredSection === m) hoveredSection = null;
            if (!openSections.has(m)) row.classList.remove('expanded');
        });

        row.appendChild(head);

        const body = document.createElement('div');
        body.className = 'list-row-body';
        const inner = document.createElement('div');
        inner.className = 'list-row-body-inner';
        if (items.length) {
            const strip = document.createElement('div');
            strip.className = 'list-strip';
            items.forEach(card => {
                const i = CARDS.indexOf(card);
                const wrap = document.createElement('div');
                wrap.className = 'list-card';
                wrap.dataset.i = i;
                const cardEl = renderProvCard(card);
                wrap.appendChild(cardEl);
                wireVideo(cardEl);
                wireCardInteractions(wrap, card);
                strip.appendChild(wrap);
            });
            inner.appendChild(strip);
        } else {
            const empty = document.createElement('div');
            empty.className = 'list-empty';
            empty.textContent = 'Nothing filed here yet.';
            inner.appendChild(empty);
        }
        body.appendChild(inner);
        row.appendChild(body);
        listWrap.appendChild(row);
    });

    rendered.list = true;
    refreshDim();
}

function toggleOpen(m) {
    if (openSections.has(m)) openSections.delete(m);
    else openSections.add(m);
    listWrap.querySelectorAll('.list-row').forEach((row, i) => {
        row.classList.toggle('expanded', openSections.has(i));
    });
}

/* ═══════════════════════════════════════════════════════════
   GRID VIEW
   ═══════════════════════════════════════════════════════════ */
const gridItemsEl = document.getElementById('grid-items');

function renderGrid() {
    gridItemsEl.innerHTML = '';
    document.getElementById('grid-count').textContent = `${CARDS.length} cards`;
    CARDS.forEach((card, i) => {
        const el = document.createElement('div');
        el.className = 'g-item';
        el.dataset.i = i;
        const cardEl = renderProvCard(card);
        el.appendChild(cardEl);
        wireVideo(cardEl);
        wireCardInteractions(el, card);
        gridItemsEl.appendChild(el);
    });
    rendered.grid = true;
    refreshDim();
}

const gridSectionsEl = document.getElementById('grid-sections');
function buildGridSections() {
    gridSectionsEl.innerHTML = '';
    const allPill = document.createElement('div');
    allPill.className = 'cat-pill' + (!filterSection ? ' active' : '');
    allPill.textContent = 'All';
    allPill.dataset.section = '';
    allPill.addEventListener('click', () => setFilter(null));
    gridSectionsEl.appendChild(allPill);
    SECTIONS.forEach(s => {
        const p = document.createElement('div');
        p.className = 'cat-pill' + (filterSection === s.id ? ' active' : '');
        p.textContent = s.title;
        p.dataset.section = s.id;
        p.addEventListener('click', () => setFilter(s.id));
        gridSectionsEl.appendChild(p);
    });
}
buildGridSections();

/* ═══════════════════════════════════════════════════════════
   FILTER
   ═══════════════════════════════════════════════════════════ */
const hudFilter = document.getElementById('hudFilter');

function setFilter(sectionId) {
    filterSection = (filterSection === sectionId) ? null : sectionId;
    const label = filterSection ? (sectionById(filterSection)?.title || 'All') : 'All';
    hudFilter.textContent = label;
    hudFilter.classList.toggle('is-filtered', !!filterSection);
    document.querySelectorAll('.cat-pill').forEach(p => {
        const isAll = p.dataset.section === '';
        p.classList.toggle('active', isAll ? !filterSection : p.dataset.section === filterSection);
    });
    refreshDim();
    updateStatusText();
    updateMobileHud();
}
hudFilter.addEventListener('click', () => {
    // Cycle: All → section 1 → section 2 → ... → All
    const idx = filterSection ? SECTIONS.findIndex(s => s.id === filterSection) : -1;
    const next = idx + 1;
    if (next >= SECTIONS.length) setFilter(null);
    else setFilter(SECTIONS[next].id);
});

function refreshDim() {
    document.querySelectorAll('.flow-item, .list-card, .g-item').forEach(el => {
        const c = CARDS[+el.dataset.i];
        if (!c) return;
        const dim = filterSection && c.s !== filterSection;
        el.classList.toggle('dim', dim);
    });
}

/* ═══════════════════════════════════════════════════════════
   VIEW SWITCHER — segmented pills in topbar
   ═══════════════════════════════════════════════════════════ */
const viewPills = document.getElementById('viewPills');
viewPills.querySelectorAll('.pill').forEach(pill => {
    pill.addEventListener('click', () => {
        const id = pill.dataset.view;
        if (id === view) return;
        viewPills.querySelectorAll('.pill').forEach(p => {
            p.classList.toggle('active', p === pill);
            p.setAttribute('aria-selected', p === pill ? 'true' : 'false');
        });
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + id).classList.add('active');
        view = id;
        renderCurrentView();
    });
});

/* ═══════════════════════════════════════════════════════════
   RENDER DISPATCH
   ═══════════════════════════════════════════════════════════ */
function renderCurrentView() {
    if (view === 'flow') renderFlow();
    else if (view === 'list') renderList();
    else renderGrid();
    refreshDim();
    updateStatusText();
    updateMobileHud();
}

function updateStatusText() {
    const count = document.getElementById('hudStatusCount');
    const text = document.getElementById('hudStatusText');
    const visible = filterSection
        ? CARDS.filter(matches).length
        : CARDS.length;
    count.textContent = String(visible);
    const modeLabel = view.charAt(0).toUpperCase() + view.slice(1);
    text.textContent = `Gallery · ${modeLabel}`;
}

/* ═══════════════════════════════════════════════════════════
   BORDER PROGRESS
   ═══════════════════════════════════════════════════════════ */
function updateBorderProgress() {
    const topBar = document.getElementById('scrollBorderTop');
    const bottomBar = document.getElementById('scrollBorderBottom');
    const corners = ['cornerTL','cornerTR','cornerBL','cornerBR'].map(id => document.getElementById(id));
    let progress = 0;
    if (view === 'flow') progress = maxScroll > 0 ? scrollX / maxScroll : 0;
    else if (view === 'list') {
        const el = listWrap;
        progress = el.scrollHeight > el.clientHeight ? el.scrollTop / (el.scrollHeight - el.clientHeight) : 0;
    } else {
        const el = document.getElementById('grid-scroll');
        progress = el.scrollHeight > el.clientHeight ? el.scrollTop / (el.scrollHeight - el.clientHeight) : 0;
    }
    const percent = Math.round(Math.min(1, Math.max(0, progress)) * 100);
    topBar.style.width = percent + '%';
    bottomBar.style.width = percent + '%';
    topBar.setAttribute('aria-valuenow', String(percent));
    bottomBar.setAttribute('aria-valuenow', String(percent));
    corners.forEach(el => el && el.classList.toggle('show', percent > 0 && percent < 100));
}
listWrap.addEventListener('scroll', updateBorderProgress, { passive: true });
document.getElementById('grid-scroll').addEventListener('scroll', updateBorderProgress, { passive: true });

/* ═══════════════════════════════════════════════════════════
   CONTEXT MENU
   ═══════════════════════════════════════════════════════════ */
const ctxMenuEl = document.getElementById('contextMenu');

function hideContextMenu() { ctxMenuEl.classList.remove('show'); }

function showCardContextMenu(x, y, card) {
    ctxMenuEl.innerHTML = '';

    if (card.t === 'letter') {
        const label = document.createElement('div');
        label.className = 'ctx-menu-label';
        label.textContent = 'Editorial';
        ctxMenuEl.appendChild(label);

        const openItem = document.createElement('div');
        openItem.className = 'ctx-menu-item';
        openItem.textContent = 'Open letter →';
        openItem.addEventListener('click', () => {
            window.location.href = `${CANVAS_URL}#/${card.clusterId}/${card.id.split('/')[1]}`;
        });
        ctxMenuEl.appendChild(openItem);
    } else {
        const label = document.createElement('div');
        label.className = 'ctx-menu-label';
        label.textContent = 'Section';
        ctxMenuEl.appendChild(label);

        SECTIONS.forEach(s => {
            if (s.id === card.s && !filterSection) return;
            const opt = document.createElement('div');
            opt.className = 'ctx-menu-item';
            opt.textContent = s.title;
            opt.addEventListener('click', () => { setFilter(s.id); hideContextMenu(); });
            ctxMenuEl.appendChild(opt);
        });
    }

    ctxMenuEl.style.left = '0px';
    ctxMenuEl.style.top = '0px';
    ctxMenuEl.classList.add('show');
    const r = ctxMenuEl.getBoundingClientRect();
    const cx = Math.min(x, window.innerWidth - r.width - 8);
    const cy = Math.min(y, window.innerHeight - r.height - 8);
    ctxMenuEl.style.left = Math.max(8, cx) + 'px';
    ctxMenuEl.style.top = Math.max(8, cy) + 'px';
}

document.addEventListener('click', hideContextMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideContextMenu(); });
window.addEventListener('scroll', hideContextMenu, true);
window.addEventListener('resize', hideContextMenu);

/* ═══════════════════════════════════════════════════════════
   VIEWPORT BLUR
   ═══════════════════════════════════════════════════════════ */
(function setupViewportBlur() {
    const top = document.getElementById('viewportBlurTop');
    const bottom = document.getElementById('viewportBlurBottom');
    if (!top || !bottom) return;
    function update() {
        const scrollY = window.scrollY || 0;
        const maxScrollY = document.documentElement.scrollHeight - window.innerHeight;
        top.classList.toggle('scrolling', scrollY > 4);
        bottom.classList.toggle('scrolling', scrollY < maxScrollY - 4);
    }
    let ticking = false;
    function onScroll() { if (ticking) return; ticking = true; requestAnimationFrame(() => { update(); ticking = false; }); }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    update();
})();

/* ═══════════════════════════════════════════════════════════
   CUSTOM CURSOR — verbatim
   ═══════════════════════════════════════════════════════════ */
(function initWriteCursor() {
    const dot = document.getElementById('writeCursorDot');
    const ellipse = document.getElementById('writeCursorEllipse');
    if (!dot || !ellipse) return;
    if (window.matchMedia('(hover: none)').matches) return;
    const NATIVE = ['button','a','input','textarea','select','[role="button"]','.view-pills','.pill','.hud-filter'].join(', ');
    let ptrX = 0, ptrY = 0, prevX = 0, prevY = 0, init = false;
    let angle = 0, sx = 1, sy = 1, raf = null;
    function lerpAngle(cur, tgt, f) { const d = ((tgt - cur + 540) % 360) - 180; return cur + d * f; }
    function step() {
        if (!init) { prevX = ptrX; prevY = ptrY; init = true; }
        const dx = ptrX - prevX, dy = ptrY - prevY;
        prevX = ptrX; prevY = ptrY;
        const sp = Math.hypot(dx, dy);
        const tgt = sp > 0.4 ? Math.atan2(dy, dx) * 180 / Math.PI : angle;
        const stretch = Math.min(sp / 34, 1) * 0.6;
        angle = lerpAngle(angle, tgt, 0.22);
        sx += (1 + stretch - sx) * 0.22;
        sy += (1 - stretch * 0.45 - sy) * 0.22;
        ellipse.style.transform = `translate(${ptrX}px,${ptrY}px) rotate(${angle}deg) scale(${sx},${sy})`;
        raf = requestAnimationFrame(step);
    }
    window.addEventListener('mousemove', e => {
        const el = (e.target && e.target.nodeType === 1) ? e.target : null;
        const overNative = !!(el && el.closest(NATIVE));
        document.body.classList.add('custom-cursor-active');
        document.body.classList.toggle('write-native-cursor', overNative);
        ptrX = e.clientX; ptrY = e.clientY;
        dot.style.transform = `translate(${ptrX}px,${ptrY}px)`;
        dot.classList.add('visible');
        ellipse.classList.add('visible');
        if (!raf) raf = requestAnimationFrame(step);
    });
    document.addEventListener('mouseleave', () => {
        dot.classList.remove('visible'); ellipse.classList.remove('visible');
        document.body.classList.remove('write-native-cursor','custom-cursor-active');
        if (raf) { cancelAnimationFrame(raf); raf = null; }
    });
})();

/* ═══════════════════════════════════════════════════════════
   APPEARANCE DROPDOWN — verbatim
   ═══════════════════════════════════════════════════════════ */
function positionFloatingPanel(panel, trigger) {
    const r = trigger.getBoundingClientRect();
    const pr = panel.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    panel.style.position = 'fixed';
    let top = r.bottom + 8;
    if (top + pr.height > vh - 10) top = r.top - pr.height - 8;
    let left = r.right - pr.width;
    left = Math.max(10, Math.min(left, vw - pr.width - 10));
    panel.style.top = top + 'px';
    panel.style.left = left + 'px';
}

function applyTheme(theme) {
    document.body.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
}

function setupAppearanceDropdown() {
    const trigger = document.getElementById('appearanceTrigger');
    const dropdown = document.getElementById('appearanceDropdown');
    const wrapper = document.querySelector('.topbar-appearance-wrapper');
    if (!trigger || !dropdown) return;
    const themes = [{ id: 'light', label: 'Light' }, { id: 'dark', label: 'Dark' }];
    function currentTheme() { return document.body.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
    function renderMenu() {
        const ct = currentTheme();
        dropdown.innerHTML = '';
        themes.forEach(t => {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'menu-item' + (t.id === ct ? ' active' : '');
            item.textContent = t.label;
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                applyTheme(t.id);
                renderMenu();
                dropdown.classList.remove('open');
                trigger.setAttribute('aria-expanded', 'false');
            });
            dropdown.appendChild(item);
        });
    }
    trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = dropdown.classList.contains('open');
        dropdown.classList.remove('open');
        trigger.setAttribute('aria-expanded', 'false');
        if (!isOpen) {
            renderMenu();
            dropdown.classList.add('open');
            trigger.setAttribute('aria-expanded', 'true');
            positionFloatingPanel(dropdown, trigger);
        }
    });
    document.addEventListener('click', (e) => {
        if (wrapper && !wrapper.contains(e.target)) {
            dropdown.classList.remove('open');
            trigger.setAttribute('aria-expanded', 'false');
        }
    });
}

/* ═══════════════════════════════════════════════════════════
   MOBILE SHEET — mirrors reference structure
   ═══════════════════════════════════════════════════════════ */
function buildMobileSheet() {
    const body = document.getElementById('mobileSheetBody');
    if (!body) return;
    const sectionsHtml = SECTIONS.map(s => {
        const items = cardsInSection(s.id);
        const cardsHtml = items.map(card => {
            const isLetter = card.t === 'letter';
            return `<li><button class="mobile-card-row" data-card-id="${escapeHtml(card.id)}" data-letter="${isLetter ? '1' : '0'}">
                <span class="mobile-card-title">${escapeHtml(card.title)}</span>
                <span class="mobile-card-status">${escapeHtml(card.st)}</span>
            </button></li>`;
        }).join('');
        return `<li class="mobile-section" data-section-id="${escapeHtml(s.id)}">
            <button class="mobile-section-header" type="button">
                <span class="index-num" style="color:var(--ink-light);font-family:var(--font-mono);font-size:9px;font-weight:600;">${escapeHtml(s.num)}</span>
                <span class="mobile-section-title">${escapeHtml(s.title)}</span>
                <span class="mobile-section-count">${items.length}</span>
                <span class="mobile-expand-icon">+</span>
            </button>
            <ul class="mobile-section-cards" hidden>${cardsHtml}</ul>
        </li>`;
    }).join('');

    body.innerHTML = `
        <button class="mobile-identity-block" type="button" id="mobileSheetCanvasLink">
            <div class="identity-monogram">ZG</div>
            <div style="min-width:0;">
                <div class="mobile-identity-name">Zack Gort</div>
                <div class="mobile-identity-role">Back to canvas</div>
            </div>
            <span class="mobile-identity-status">→</span>
        </button>
        <div class="mobile-section-label">View</div>
        <div class="mobile-canvas-controls" id="mobileViewControls">
            <button class="btn${view === 'flow' ? ' active' : ''}" type="button" data-view="flow">Flow</button>
            <button class="btn${view === 'list' ? ' active' : ''}" type="button" data-view="list">List</button>
            <button class="btn${view === 'grid' ? ' active' : ''}" type="button" data-view="grid">Grid</button>
        </div>
        <div class="mobile-section-label">Sections</div>
        <ul class="mobile-sections">${sectionsHtml}</ul>
        <div class="mobile-section-label">Filter</div>
        <div class="mobile-canvas-controls" id="mobileFilterControls">
            <button class="btn${!filterSection ? ' active' : ''}" type="button" data-filter="">All</button>
            ${SECTIONS.map(s => `<button class="btn${filterSection === s.id ? ' active' : ''}" type="button" data-filter="${escapeHtml(s.id)}">${escapeHtml(s.title)}</button>`).join('')}
        </div>
    `;
}

function setupMobileSheet() {
    const sheet = document.getElementById('mobileSheet');
    const backdrop = document.getElementById('mobileSheetBackdrop');
    const closeBtn = document.getElementById('mobileSheetClose');
    if (!sheet || !backdrop || !closeBtn) return;

    function openSheet() {
        buildMobileSheet();
        backdrop.hidden = false;
        sheet.hidden = false;
        requestAnimationFrame(() => {
            sheet.classList.add('open');
            backdrop.classList.add('open');
        });
    }
    function closeSheet() {
        sheet.classList.remove('open');
        backdrop.classList.remove('open');
        setTimeout(() => {
            sheet.hidden = true;
            backdrop.hidden = true;
        }, 320);
    }

    closeBtn.addEventListener('click', closeSheet);
    backdrop.addEventListener('click', closeSheet);

    const body = document.getElementById('mobileSheetBody');

    // Delegated handlers so rebuilds don't need re-binding
    body.addEventListener('click', (e) => {
        const canvasLink = e.target.closest('#mobileSheetCanvasLink');
        if (canvasLink) {
            window.location.href = CANVAS_URL;
            return;
        }
        const viewBtn = e.target.closest('#mobileViewControls [data-view]');
        if (viewBtn) {
            viewPills.querySelector(`[data-view="${viewBtn.dataset.view}"]`)?.click();
            closeSheet();
            return;
        }
        const filterBtn = e.target.closest('#mobileFilterControls [data-filter]');
        if (filterBtn) {
            const fid = filterBtn.dataset.filter || null;
            if (fid === filterSection) setFilter(null);
            else setFilter(fid);
            body.querySelectorAll('#mobileFilterControls .btn').forEach(b => {
                b.classList.toggle('active', (b.dataset.filter || null) === filterSection);
            });
            return;
        }
        const sectionHeader = e.target.closest('.mobile-section-header');
        if (sectionHeader) {
            const section = sectionHeader.closest('.mobile-section');
            const cards = section.querySelector('.mobile-section-cards');
            section.classList.toggle('expanded');
            cards.hidden = !section.classList.contains('expanded');
            return;
        }
        const cardRow = e.target.closest('.mobile-card-row');
        if (cardRow) {
            const card = CARD_BY_ID.get(cardRow.dataset.cardId);
            if (card) {
                closeSheet();
                setTimeout(() => openCard(card), 320);
            }
        }
    });

    sheet._openSheet = openSheet;
    sheet._closeSheet = closeSheet;
    sheet._isOpen = () => sheet.classList.contains('open');
}

/* ═══════════════════════════════════════════════════════════
   MOBILE HUD — notification breadcrumb
   ═══════════════════════════════════════════════════════════ */
function updateMobileHud() {
    const hud = document.getElementById('hudGallery');
    if (!hud || hud.hidden) return;
    const path = document.getElementById('hudGalleryPath');
    const idxEl = document.getElementById('hudGalleryIdx');
    if (!path || !idxEl) return;

    // The "current position" is the section filter, or All.
    path.innerHTML = '';
    if (filterSection) {
        const parent = document.createElement('span');
        parent.className = 'notif-crumb-parent';
        parent.textContent = 'Section';
        path.appendChild(parent);
        const sep = document.createElement('span');
        sep.className = 'notif-sep';
        sep.textContent = '›';
        path.appendChild(sep);
        const cur = document.createElement('span');
        cur.className = 'notif-crumb';
        cur.textContent = sectionById(filterSection)?.title || filterSection;
        path.appendChild(cur);
    } else {
        const cur = document.createElement('span');
        cur.className = 'notif-crumb';
        cur.textContent = 'Gallery';
        path.appendChild(cur);
    }

    const visibleCount = filterSection ? CARDS.filter(matches).length : CARDS.length;
    idxEl.textContent = `${visibleCount}/${CARDS.length}`;

    const notif = document.getElementById('hudGalleryNotif');
    if (notif) {
        notif.classList.remove('updating');
        void notif.offsetWidth;
        notif.classList.add('updating');
    }
}

function stepMobileSection(delta) {
    // Cycle: All → section 1 → section 2 → ... → All
    const idx = filterSection ? SECTIONS.findIndex(s => s.id === filterSection) : -1;
    let next = idx + delta;
    if (next < -1) next = SECTIONS.length - 1;
    if (next >= SECTIONS.length) next = -1;
    if (next === -1) setFilter(null);
    else setFilter(SECTIONS[next].id);
}

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
(function restoreTheme() {
    try {
        const t = localStorage.getItem(THEME_KEY);
        if (t === 'light' || t === 'dark') document.body.setAttribute('data-theme', t);
    } catch (e) {}
})();

document.addEventListener('DOMContentLoaded', () => {
    setupViewportBlur();
    setupAppearanceDropdown();
    setupMobileSheet();

    // Breadcrumb back to canvas
    document.getElementById('breadcrumbCanvas').addEventListener('click', () => {
        window.location.href = CANVAS_URL;
    });
    document.getElementById('wordmark').addEventListener('click', () => {
        window.location.href = CANVAS_URL;
    });

    // Top reset — scroll to start, clear filter, reset view
    document.getElementById('topResetBtn').addEventListener('click', () => {
        filterSection = null;
        hudFilter.textContent = 'All';
        hudFilter.classList.remove('is-filtered');
        scrollTarget = 0;
        scrollX = 0;
        listWrap.scrollTop = 0;
        document.getElementById('grid-scroll').scrollTop = 0;
        viewPills.querySelector('[data-view="flow"]')?.click();
        refreshDim();
        updateStatusText();
        updateMobileHud();
    });

    // Mobile HUD
    document.getElementById('hudGalleryPrev').addEventListener('click', () => stepMobileSection(-1));
    document.getElementById('hudGalleryNext').addEventListener('click', () => stepMobileSection(1));
    document.getElementById('hudGalleryNotif').addEventListener('click', () => {
        const sheet = document.getElementById('mobileSheet');
        if (sheet && sheet._openSheet) sheet._openSheet();
    });

    // Show mobile HUD on small screens
    if (window.innerWidth <= 640) {
        document.getElementById('hudGallery').hidden = false;
        document.getElementById('hud').hidden = true;
    }

    // Initial render
    buildGridSections();
    renderCurrentView();
    updateStatusText();
    updateMobileHud();

    // Resize
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            if (view === 'flow') renderFlow();
            if (window.innerWidth <= 640) {
                document.getElementById('hudGallery').hidden = false;
                document.getElementById('hud').hidden = true;
                updateMobileHud();
            } else {
                document.getElementById('hudGallery').hidden = true;
                document.getElementById('hud').hidden = false;
            }
        }, 200);
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
        if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
        if (e.key === 'Escape') {
            const m = document.querySelector('.context-menu.show');
            if (m) { hideContextMenu(); e.preventDefault(); return; }
            const sheet = document.getElementById('mobileSheet');
            if (sheet && sheet._isOpen && sheet._isOpen()) {
                sheet._closeSheet();
                e.preventDefault();
                return;
            }
            if (filterSection) { setFilter(null); e.preventDefault(); return; }
        }
        if (e.key === '1') viewPills.querySelector('[data-view="flow"]')?.click();
        if (e.key === '2') viewPills.querySelector('[data-view="list"]')?.click();
        if (e.key === '3') viewPills.querySelector('[data-view="grid"]')?.click();
    });
});

})();
</script>
