<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>intoview.pro · gallery</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='12' fill='%23E5E567'/%3E%3Ctext x='40' y='50' font-family='system-ui,sans-serif' font-size='28' font-weight='800' text-anchor='middle' fill='%231C1C1E' letter-spacing='-0.5'%3ECX%3C/text%3E%3C/svg%3E" />

    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2,3,4,5,6,7,8,9&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg: #f0f0f2;
            --fg: #1c1c1e;
            --fg-rgb: 28, 28, 30;
            --nav-bg-rgb: 240, 240, 242;
            --rule: rgba(0, 0, 0, .08);
            --faint: rgba(0, 0, 0, .04);
            --muted: rgba(0, 0, 0, .55);
            --accent: #E5E567;
            --card: #ffffff;
            --card-mid: #3a3a3c;
            --ink: #1c1c1e;
            --ink-mid: #3a3a3c;
            --ink-light: #8e8e93;
            --ink-lighter: #b0b0b6;
            --border: #e6e6e8;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.02);
            --shadow-floating: 0 8px 32px rgba(0, 0, 0, 0.1);
            --radius: 1.5rem;
            --radius-sm: 0.65rem;
            --font: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            --fs-body: 15px;
            --max-width: 1600px;
            --margin: 16px;
            --topbar-height: 56px;
            --hud-height: 64px;
            --scrollbar-height: 3px;
            --card-w: 260px;
            --impact-gain: #2F6B4F;
            --impact-loss: #C63A2A;
            --impact-accent: #8A7A1F;
        }
        @media (min-width: 640px) { :root { --margin: 24px; --topbar-height: 64px; --hud-height: 70px; } }
        @media (min-width: 1024px) { :root { --margin: 32px; --topbar-height: 72px; --hud-height: 76px; } }

        body[data-theme='dark'] {
            --bg: #1c1c1e;
            --fg: #ffffff;
            --fg-rgb: 255, 255, 255;
            --nav-bg-rgb: 28, 28, 30;
            --rule: rgba(255, 255, 255, .08);
            --faint: rgba(255, 255, 255, .04);
            --muted: rgba(255, 255, 255, .55);
            --card: #232325;
            --card-mid: #3a3a3c;
            --ink: #ffffff;
            --ink-mid: #b0b0b6;
            --ink-light: #8e8e93;
            --ink-lighter: #6e6e73;
            --border: rgba(255, 255, 255, .12);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-floating: 0 8px 32px rgba(0, 0, 0, 0.6);
            --impact-gain: #6FCF97;
            --impact-loss: #FF6B6B;
            --impact-accent: #E5E567;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }
        html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg); color: var(--fg); font-family: var(--font);
            font-size: var(--fs-body); line-height: 1.6;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            min-height: 100vh; min-height: 100dvh;
            padding-bottom: calc(var(--hud-height) + 20px + var(--scrollbar-height));
            overflow-x: hidden;
            transition: background 0.2s ease, color 0.2s ease;
        }
        ::selection { background: var(--accent); color: #1c1c1e; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--ink-lighter); border-radius: var(--radius-sm); }
        html { scrollbar-width: thin; scrollbar-color: var(--ink-lighter) transparent; }

        .btn {
            font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.08em;
            text-transform: uppercase; background: transparent; border: 1px solid var(--border);
            color: var(--ink-mid); padding: 5px 12px; cursor: pointer;
            transition: all 0.2s ease; border-radius: var(--radius-sm); font-weight: 500;
            touch-action: manipulation; min-height: 30px; display: inline-flex;
            align-items: center; justify-content: center; white-space: nowrap; gap: 6px;
        }
        .btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
        .btn:active { transform: scale(0.96); }
        .btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

        .topbar {
            position: sticky; top: 0; z-index: 150; background: transparent;
            padding: 6px 0; min-height: var(--topbar-height); display: flex; align-items: center;
        }
        .topbar .wrap {
            display: flex; align-items: center; gap: 12px;
            padding: 0 var(--margin); max-width: var(--max-width);
            margin: 0 auto; width: 100%;
        }
        .wordmark {
            font-size: clamp(12px, 3.5vw, 20px); font-weight: 700; letter-spacing: -0.03em;
            display: flex; align-items: baseline; gap: 6px; color: var(--ink);
            flex-shrink: 0; cursor: pointer;
        }
        .wordmark .count {
            font-family: var(--font-mono); font-size: 8px; font-weight: 400;
            color: var(--ink-light); letter-spacing: 0.04em;
        }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: auto; }
        .topbar-right .btn { font-size: 9px; min-height: 32px; padding: 4px 10px; }
        .topbar-appearance-wrapper { position: relative; display: flex; align-items: center; }

        .breadcrumb {
            display: flex; align-items: center; gap: 4px;
            font-family: var(--font-mono); font-size: 9px; letter-spacing: .06em;
            text-transform: uppercase; color: var(--ink-light);
            flex: 1; min-width: 0; overflow: hidden; padding: 0 4px;
        }
        .breadcrumb-item {
            background: none; border: none; padding: 3px 6px; cursor: pointer;
            font: inherit; color: var(--ink-light);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 220px; border-radius: 4px;
            transition: color .15s ease, background .15s ease;
        }
        .breadcrumb-item:hover { color: var(--ink); background: var(--faint); }
        .breadcrumb-item.is-current { color: var(--ink); font-weight: 600; cursor: default; }
        .breadcrumb-item.is-current:hover { background: none; }
        .breadcrumb-sep { color: var(--ink-lighter); opacity: .55; flex-shrink: 0; }

        .view-pills {
            display: inline-flex; align-items: center; gap: 2px;
            padding: 2px; background: var(--faint);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }
        .view-pills .pill {
            font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em;
            text-transform: uppercase; background: transparent; border: none;
            color: var(--ink-light); padding: 4px 10px;
            border-radius: calc(var(--radius-sm) - 2px);
            cursor: pointer; font-weight: 500;
            min-height: 26px;
            display: inline-flex; align-items: center; justify-content: center;
            transition: color .15s ease, background .15s ease;
        }
        .view-pills .pill:hover { color: var(--ink); }
        .view-pills .pill.active { background: var(--ink); color: var(--bg); }

        @media (max-width: 640px) {
            .breadcrumb { display: none; }
            .view-pills .pill { font-size: 8px; padding: 3px 8px; }
        }

        .viewport-blur {
            position: fixed; left: 0; right: 0; z-index: 40; pointer-events: none;
            backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
            transition: backdrop-filter 0.3s ease, background 0.4s ease;
        }
        .viewport-blur.scrolling { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(8px); }
        .viewport-blur-top {
            top: 0; height: calc(var(--topbar-height) + 36px);
            background: linear-gradient(to bottom, rgba(var(--nav-bg-rgb), 0.7), rgba(var(--nav-bg-rgb), 0));
        }
        .viewport-blur-bottom {
            bottom: 0; height: calc(var(--hud-height) + 60px);
            background: linear-gradient(to top, rgba(var(--nav-bg-rgb), 0.7), rgba(var(--nav-bg-rgb), 0));
        }

        .scroll-border-top, .scroll-border-bottom {
            position: fixed; height: 3px; background: var(--accent);
            z-index: 160; width: 0%; pointer-events: none;
            box-shadow: 0 0 10px rgba(229, 229, 103, 0.35);
            transition: width 0.12s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .scroll-border-top { top: 0; left: 0; border-radius: 0 2px 2px 0; }
        .scroll-border-bottom { bottom: 0; right: 0; border-radius: 2px 0 0 2px; }
        .scroll-border-corner { position: fixed; z-index: 160; pointer-events: none; background: var(--accent); opacity: 0; transition: opacity 0.3s ease; }
        .scroll-border-corner.show { opacity: 1; }
        .scroll-border-corner-tl { top: 0; left: 0; width: 6px; height: 6px; }
        .scroll-border-corner-tr { top: 0; right: 0; width: 6px; height: 6px; }
        .scroll-border-corner-bl { bottom: 0; left: 0; width: 6px; height: 6px; }
        .scroll-border-corner-br { bottom: 0; right: 0; width: 6px; height: 6px; }

        body.custom-cursor-active { cursor: none; }
        .write-cursor-dot, .write-cursor-ellipse {
            position: fixed; top: 0; left: 0; z-index: 9999; pointer-events: none;
            transform: translate(-9999px, -9999px); opacity: 0;
            transition: opacity 0.18s ease;
            will-change: transform;
        }
        .write-cursor-dot.visible, .write-cursor-ellipse.visible { opacity: 1; }
        .write-cursor-dot { width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--ink); }
        .write-cursor-ellipse { width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 1.5px solid var(--ink); border-radius: 50%; opacity: 0; }
        .write-cursor-ellipse.visible { opacity: 0.32; }
        body.custom-cursor-active.write-native-cursor { cursor: auto; }
        .write-native-cursor .write-cursor-dot, .write-native-cursor .write-cursor-ellipse { opacity: 0 !important; }
        @media (hover: none) {
            body.custom-cursor-active { cursor: auto; }
            .write-cursor-dot, .write-cursor-ellipse { display: none; }
        }

        .view {
            position: relative; width: 100%; display: none;
            padding: 0 var(--margin) 1rem;
            max-width: var(--max-width);
            margin: 0 auto;
        }
        .view.active { display: block; }

        /* PROV CARD */
        .prov-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); box-shadow: var(--shadow);
            display: flex; flex-direction: column; gap: 10px;
            width: 100%;
            cursor: pointer; position: relative; overflow: hidden;
            transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease;
            color: var(--ink);
        }
        .prov-card:hover { box-shadow: var(--shadow-hover); }

        .prov-card.face-media  { padding: 16px 18px 14px; min-height: 260px; }
        .prov-card.face-letter { padding: 16px 18px 14px; min-height: 260px; }
        .prov-card.face-compact { padding: 12px 16px 12px; gap: 8px; }

        .prov-card-kicker {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            font-family: var(--font-mono); font-size: 8px; font-weight: 600;
            letter-spacing: .12em; text-transform: uppercase; color: var(--ink-light);
        }
        .prov-card-type { display: flex; align-items: center; gap: 6px; }
        .prov-card-type::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: var(--ink-lighter);
        }
        .prov-card[data-type="statement"] .prov-card-type::before { background: var(--ink); }
        .prov-card[data-type="evidence"]  .prov-card-type::before { background: var(--impact-gain); }
        .prov-card[data-type="reply"]     .prov-card-type::before { background: var(--impact-accent); }
        .prov-card[data-type="update"]    .prov-card-type::before { background: var(--impact-loss); }
        .prov-card[data-type="letter"]    .prov-card-type::before { background: var(--accent); }

        .prov-card-status {
            padding: 1px 7px; border-radius: 999px; font-size: 7px;
            border: 1px solid currentColor; color: var(--ink-light);
            letter-spacing: .08em; white-space: nowrap;
        }
        .prov-card-status[data-status="published"] { color: var(--ink); }
        .prov-card-status[data-status="verified"]  { color: var(--impact-gain); }
        .prov-card-status[data-status="contested"] { color: var(--impact-loss); }
        .prov-card-status[data-status="revised"]   { color: var(--impact-accent); }
        .prov-card-status[data-status="draft"]     { color: var(--ink-light); border-style: dashed; }
        .prov-card-status[data-status="archived"]  { color: var(--ink-lighter); }

        .prov-card-media {
            width: 100%; aspect-ratio: 1 / 1;
            border-radius: 6px; overflow: hidden; position: relative; flex-shrink: 0;
            background: repeating-linear-gradient(-45deg, var(--card-mid) 0 6px, #1a1a1c 6px 12px);
        }
        .prov-card-media img,
        .prov-card-media video {
            width: 100%; height: 100%; object-fit: cover; display: block;
            filter: grayscale(0.55) contrast(1.05);
            transition: filter 0.35s ease;
        }
        .prov-card:hover .prov-card-media img,
        .prov-card:hover .prov-card-media video { filter: grayscale(0) contrast(1.02); }
        .prov-card-media-badge {
            position: absolute; top: 8px; left: 8px; z-index: 3;
            font-family: var(--font-mono); font-size: 7px; letter-spacing: .1em;
            text-transform: uppercase; color: #fff;
            background: rgba(0,0,0,0.55); padding: 2px 6px; border-radius: 3px;
        }

        .prov-card-byline {
            display: grid;
            grid-template-columns: 28px 1fr;
            gap: 10px; align-items: center;
        }
        .prov-card-monogram {
            width: 28px; height: 28px; border-radius: 6px;
            background: var(--accent); color: #1c1c1e;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font); font-size: 11px; font-weight: 800;
            letter-spacing: -0.02em; flex-shrink: 0;
        }
        .prov-card-byline-text { min-width: 0; display: flex; flex-direction: column; gap: 1px; line-height: 1.15; }
        .prov-card-byline-name {
            font-family: var(--font); font-size: 12px; font-weight: 600;
            color: var(--ink); letter-spacing: -.005em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .prov-card-byline-date {
            font-family: var(--font-mono); font-size: 9px;
            color: var(--ink-light); letter-spacing: .02em;
        }

        .prov-card-letter-mark {
            display: flex; align-items: center; gap: 6px;
            font-family: var(--font-mono); font-size: 8px; letter-spacing: .12em;
            text-transform: uppercase; color: var(--ink-light);
            padding-bottom: 8px; border-bottom: 1px solid var(--border);
        }
        .prov-card-letter-mark svg { width: 11px; height: 11px; flex-shrink: 0; }

        .prov-card-backlink {
            display: flex; align-items: flex-start; gap: 8px;
            padding: 6px 10px;
            background: var(--faint);
            border-left: 2px solid var(--impact-accent);
            border-radius: 0 4px 4px 0;
            font-family: var(--font-mono); font-size: 9px;
            letter-spacing: .02em; color: var(--ink-light);
            line-height: 1.4;
            cursor: pointer; text-decoration: none;
            transition: background .15s ease, color .15s ease;
        }
        .prov-card-backlink:hover {
            background: color-mix(in srgb, var(--impact-accent) 12%, var(--faint));
            color: var(--ink-mid);
        }
        .prov-card-backlink .arrow { flex-shrink: 0; opacity: .8; font-size: 11px; transform: translateY(-1px); }
        .prov-card-backlink .parent-title {
            font-family: var(--font); font-size: 11px; font-weight: 500;
            color: var(--ink); font-style: italic;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .prov-card-title {
            font-family: var(--font); font-weight: 700;
            letter-spacing: -.01em; color: var(--ink); margin: 0;
            line-height: 1.22;
        }
        .prov-card.face-media  .prov-card-title { font-size: 17px; }
        .prov-card.face-letter .prov-card-title { font-size: 18px; margin-top: 4px; }
        .prov-card.face-compact .prov-card-title { font-size: 15px; line-height: 1.25; }

        .prov-card-deck {
            color: var(--ink-mid); margin: 0;
            display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
        }
        .prov-card.face-media  .prov-card-deck { font-size: 12.5px; line-height: 1.5; -webkit-line-clamp: 5; }
        .prov-card.face-letter .prov-card-deck { font-size: 12.5px; line-height: 1.5; -webkit-line-clamp: 6; }
        .prov-card.face-compact .prov-card-deck { font-size: 12.5px; line-height: 1.45; -webkit-line-clamp: 4; }

        .prov-card-meta {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; margin-top: auto;
            padding-top: 12px; border-top: 1px solid var(--border);
            font-family: var(--font-mono); font-size: 8px; letter-spacing: .06em;
            text-transform: uppercase; color: var(--ink-light);
        }
        .prov-card.face-compact .prov-card-meta { padding-top: 8px; font-size: 7.5px; }
        .prov-card-source { display: flex; align-items: center; gap: 4px; }
        .prov-card-relations { display: flex; gap: 8px; }
        .prov-card-relation { display: flex; align-items: center; gap: 3px; opacity: .78; }
        .prov-card-relation strong { font-weight: 600; color: var(--ink-mid); }

        .prov-card-letter-cta {
            margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            font-family: var(--font-mono); font-size: 8px; letter-spacing: .1em;
            text-transform: uppercase; color: var(--ink-light);
        }
        .prov-card-letter-cta .arrow {
            font-family: var(--font-mono); font-size: 12px;
            transition: transform .2s ease;
        }
        .prov-card.face-letter:hover .prov-card-letter-cta .arrow { transform: translateX(3px); color: var(--ink); }

        #view-flow { position: relative; overflow: hidden; width: 100%; padding: 0; margin: 0; max-width: 100%; }
        #flow-viewport {
            position: relative; overflow: hidden; cursor: grab;
            width: 100%;
            height: calc(100vh - var(--topbar-height) - var(--hud-height) - 100px);
            min-height: 420px;
        }
        #flow-viewport.grabbing { cursor: grabbing; }
        #flow-bgtext {
            position: absolute; top: 50%; left: 0; white-space: nowrap;
            font-family: var(--font); font-weight: 700;
            font-size: 15vw; line-height: 1;
            color: color-mix(in srgb, var(--ink) 5%, transparent);
            transform: translateY(-50%);
            user-select: none; pointer-events: none;
            letter-spacing: -0.03em;
        }
        #flow-track { position: absolute; top: 0; left: 0; height: 100%; will-change: transform; }
        #flow-items-layer { position: absolute; top: 0; left: 0; height: 100%; will-change: transform; }
        .flow-col-items { will-change: transform; position: absolute; top: 0; height: 100%; }
        .flow-col-line { position: absolute; top: 14%; bottom: 16%; width: 1px; background: var(--rule); pointer-events: none; }
        .flow-col-label {
            position: absolute; bottom: 2.4rem;
            font-family: var(--font-mono); font-weight: 500;
            font-size: 0.62rem; letter-spacing: 0.22em;
            text-transform: uppercase; color: var(--ink-light);
            writing-mode: vertical-rl; transform: rotate(180deg);
            pointer-events: none; white-space: nowrap;
        }
        .flow-col-label .num { color: var(--ink-lighter); margin-bottom: 8px; font-weight: 600; }
        .flow-item {
            position: absolute; width: var(--card-w);
            cursor: pointer; transition: filter 0.3s, opacity 0.3s;
            z-index: 1;
        }
        .flow-item:hover { z-index: 30; }
        .flow-item.dim { opacity: 0.22; }
        .flow-hero {
            position: absolute; left: var(--margin); bottom: calc(var(--margin) + 8px);
            z-index: 20; font-family: var(--font); font-weight: 300;
            font-size: clamp(2rem, 6.5vw, 4.6rem);
            line-height: 0.92; letter-spacing: -0.03em; pointer-events: none;
            color: var(--ink); opacity: 0.9;
        }
        .flow-hero .dot { color: var(--accent); }
        #flow-hint {
            position: fixed; bottom: calc(var(--hud-height) + 20px);
            right: var(--margin); z-index: 100;
            font-family: var(--font-mono); font-size: 0.6rem;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--ink-light); text-align: right;
            line-height: 1.7; pointer-events: none;
        }

        #view-list { padding-top: 0.5rem; }
        #list-wrap {
            overflow-y: auto;
            max-height: calc(100vh - var(--topbar-height) - var(--hud-height) - 76px);
        }
        #list-wrap::-webkit-scrollbar { width: 0; }
        .list-row { border-bottom: 1px solid var(--border); }
        .list-row-head {
            display: flex; align-items: center; gap: 0.9rem;
            padding: 1rem 0.2rem; cursor: pointer; user-select: none;
        }
        .list-num { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-light); white-space: nowrap; min-width: 1.6rem; }
        .list-name {
            font-family: var(--font); font-weight: 300; flex: 1; min-width: 0;
            font-size: clamp(1.6rem, 4.2vw, 2.7rem);
            color: var(--ink-lighter);
            transition: color 0.3s, font-weight 0.3s;
        }
        .list-row.expanded .list-name { color: var(--ink); font-weight: 600; }

    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);

function renderProvCard(card) {
    var el = document.createElement('article');
    el.className = 'prov-card';
    el.setAttribute('data-type', card.t);
    el.setAttribute('data-status', card.st);

                '<span class="prov-card-type">Letter</span>' +
                '<span class="prov-card-status" data-status="' + escapeHtml(card.st) + '">' + escapeHtml(card.st) + '</span>' +
            '</div>' +

                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<path d="M4 4h13l3 3v13H4z"/>' +
                    '<path d="M8 9h8M8 13h8M8 17h5"/>' +
                '</svg>' +
                '<span>Editorial · ' + escapeHtml(card.clusterId || 'manifesto') + '</span>' +
            '</div>' +
            '<h3 class="prov-card-title">' + escapeHtml(card.title) + '</h3>' +
            '<p class="prov-card-deck">' + escapeHtml(card.deck) + '</p>' +
            '<div class="prov-card-letter-cta">' +
                '<span>Read the letter</span>' +
                '<span class="arrow" aria-hidden="true">→</span>' +
            '</div>';
        return el;
    }

    /* ── COMPACT ── */
    if (!card.media) {
        el.classList.add('face-compact');
        var initials = initialsFromName(card.by);
        var dateShort = formatDateShort(card.on);

        var backlinkHTML = '';
        if (card.t === 'reply' && card.parentId) {
            var parent = CARD_BY_ID[card.parentId];
            if (parent) {
                backlinkHTML =
                    '<a class="prov-card-backlink" data-parent-id="' + escapeHtml(card.parentId) + '" role="button" tabindex="0">' +
                        '<span class="arrow" aria-hidden="true">↩</span>' +

                    '</a>';
            }
        }

        var metaHTML = refCount > 0
            ? '<div class="prov-card-meta"><span class="prov-card-relations"><span class="prov-card-relation"><strong>' + refCount + '</strong> ref</span></span></div>'
            : '';

        el.innerHTML =
            '<div class="prov-card-kicker">' +
                '<span class="prov-card-type">' + escapeHtml(cardTypeLabel(card.t)) + '</span>' +
                '<span class="prov-card-status" data-status="' + escapeHtml(card.st) + '">' + escapeHtml(card.st) + '</span>' +
            '</div>' +
            '<div class="prov-card-byline">' +
                '<div class="prov-card-monogram" aria-hidden="true">' + escapeHtml(initials) + '</div>' +
                '<div class="prov-card-byline-text">' +
                    '<span class="prov-card-byline-name">' + escapeHtml(card.by) + '</span>' +
                    '<span class="prov-card-byline-date">' + escapeHtml(dateShort) + '</span>' +
                '</div>' +
            '</div>' +
            backlinkHTML +
            '<h3 class="prov-card-title">' + escapeHtml(card.title) + '</h3>' +
            '<p class="prov-card-deck">' + escapeHtml(card.deck) + '</p>' +
            metaHTML;
        return el;
    }

    /* ── MEDIA ── */
    el.classList.add('face-media');
    var isVideo = card.media.k === 'video';

                ? '<video src="' + escapeHtml(card.media.src) + '" muted loop playsinline preload="auto"></video>'

        '</div>';

    var backlinkHTML2 = '';
    if (card.t === 'reply' && card.parentId) {
        var parent2 = CARD_BY_ID[card.parentId];
        if (parent2) {
            backlinkHTML2 =
                '<a class="prov-card-backlink" data-parent-id="' + escapeHtml(card.parentId) + '" role="button" tabindex="0">' +
                    '<span class="arrow" aria-hidden="true">↩</span>' +
                    '<span>Replying to <span class="parent-title">“' + escapeHtml(parent2.title) + '”</span></span>' +
                '</a>';
        }
    }

    el.innerHTML =
        '<div class="prov-card-kicker">' +
            '<span class="prov-card-type">' + escapeHtml(cardTypeLabel(card.t)) + '</span>' +
            '<span class="prov-card-status" data-status="' + escapeHtml(card.st) + '">' + escapeHtml(card.st) + '</span>' +

function wireVideo(containerEl) {
    var video = containerEl.querySelector('video');
    if (!video) return;
    video.preload = 'auto';
    var seek = function() {
        if (video.readyState >= 1 && video.currentTime === 0) {
            try { video.currentTime = 0.1; } catch (e) {}
        }
    };
    if (video.readyState >= 1) seek();
    else video.addEventListener('loadedmetadata', seek, { once: true });
    video.addEventListener('loadeddata', function() {
        try { if (video.currentTime === 0) video.currentTime = 0.1; } catch (e) {}
    }, { once: true });

    if (IS_TOUCH) {
        var io = new IntersectionObserver(function(entries) {
            entries.forEach(function(en) {
                if (en.isIntersecting && en.intersectionRatio >= 0.5) video.play().catch(function() {});
                else video.pause();
            });
        }, { threshold: [0, 0.5, 1] });
        io.observe(containerEl);
    } else {
        containerEl.addEventListener('mouseenter', function() { video.play().catch(function() {}); });
        containerEl.addEventListener('mouseleave', function() { video.pause(); video.currentTime = 0; });
    }
}

        window.location.href = CANVAS_URL + '#/' + card.clusterId + '/' + slug;
        return;
    }
    setFilter(card.s === filterSection ? null : card.s);
}

function wireCardInteractions(containerEl, card) {
    containerEl.addEventListener('click', function(e) {
        var backlink = e.target.closest && e.target.closest('.prov-card-backlink');
        if (backlink) {
            e.preventDefault(); e.stopPropagation();
            var parent = CARD_BY_ID[backlink.getAttribute('data-parent-id')];
            if (parent) openCard(parent);
            return;
        }
        if (e.target.closest && e.target.closest('.context-menu')) return;
        openCard(card);
    });
    containerEl.addEventListener('contextmenu', function(e) {
        e.preventDefault(); e.stopPropagation();
        showCardContextMenu(e.clientX, e.clientY, card);
    });
}

    var totalH = laid.reduce(function(a, d) { return a + d.h; }, 0) + (laid.length - 1) * GAP;
    var subCols = Math.max(1, Math.ceil(totalH / usableH));
    subCols = Math.min(subCols, 6);
    subCols = Math.min(subCols, laid.length);

    var colHeights, placed;
    for (var attempt = subCols; attempt <= 6; attempt++) {
        colHeights = [];
        for (var k = 0; k < attempt; k++) colHeights.push(0);
        placed = laid.map(function(d) {
            var best = 0;
            for (var c = 1; c < attempt; c++) if (colHeights[c] < colHeights[best]) best = c;
            var y = colHeights[best];
            colHeights[best] = y + d.h + GAP;
            return Object.assign({ sub: best, y: y }, d);
        });
        var tallest = Math.max.apply(null, colHeights.map(function(h) { return h - GAP; }));
        if (tallest <= usableH || attempt >= 6) { subCols = attempt; break; }
    }

    var colH = colHeights.map(function(h) { return Math.max(0, h - GAP); });
    placed.forEach(function(p) { p.topOffset = p.y - colH[p.sub] / 2; });

    var width = COL_PAD * 2 + subCols * cardW + (subCols - 1) * SUBCOL_GAP;
    return { width: width, subCols: subCols, placed: placed };
}

function renderFlow() {
    if (!flowTrack || !flowItemsLayer || !flowViewport) return;
    flowTrack.innerHTML = '';
    flowItemsLayer.innerHTML = '';
    colBobEls = [];

    var cardW = getCardW();
    var rect = flowViewport.getBoundingClientRect();
    var viewportH = (rect && rect.height) ? rect.height : (window.innerHeight - 320);
    if (!viewportH || viewportH < 100) viewportH = window.innerHeight - 320;

    var bySection = SECTIONS.map(function(s) { return cardsInSection(s.id); });
    var plans = bySection.map(function(cards) { return planColumn(cards, viewportH); });

    var cursorX = 120;
    colX = plans.map(function(p) { var x = cursorX; cursorX += p.width + COL_GUTTER; return x; });
    trackWidth = cursorX + 120;

    SECTIONS.forEach(function(s, m) {
        var line = document.createElement('div');
        line.className = 'flow-col-line';
        line.style.left = colX[m] + 'px';
        flowTrack.appendChild(line);

        var label = document.createElement('div');
        label.className = 'flow-col-label';
        label.style.left = (colX[m] - 12) + 'px';
        label.innerHTML = '<span class="num">' + escapeHtml(s.num) + '</span>' + escapeHtml(s.title);
        flowTrack.appendChild(label);
    });

    plans.forEach(function(plan, m) {
        var colWrap = document.createElement('div');
        colWrap.className = 'flow-col-items';
        colWrap.style.left = colX[m] + 'px';
        colWrap.style.width = plan.width + 'px';
        colWrap.setAttribute('data-col-seed', hash('col' + m));
        colBobEls.push(colWrap);

        plan.placed.forEach(function(p) {
            var card = p.card;
            var i = CARDS.indexOf(card);
            var subX = COL_PAD + p.sub * (cardW + SUBCOL_GAP);
            var jitter = Math.round(srand(p.seed + 1) * 14) - 7;
            var left = subX + jitter;

            var halfVp = viewportH / 2;
            var top = p.topOffset;
            if (top < -halfVp) top = -halfVp;
            if (top + p.h > halfVp) top = halfVp - p.h;

            var el = document.createElement('div');
            el.className = 'flow-item';
            el.style.left = left + 'px';
            el.style.width = cardW + 'px';
            el.style.top = 'calc(50% + ' + Math.round(top) + 'px)';
            el.setAttribute('data-i', i);
            el.setAttribute('data-card-id', card.id);

            var cardEl = renderProvCard(card);
            el.appendChild(cardEl);
            wireVideo(cardEl);
            wireCardInteractions(el, card);

            colWrap.appendChild(el);
        });

        flowItemsLayer.appendChild(colWrap);
    });

    maxScroll = Math.max(0, trackWidth - window.innerWidth + 240);
    scrollTarget = Math.max(-120, Math.min(maxScroll, scrollTarget));
    updateBorderProgress();
    refreshDim();
}

function setupFlowInteractions() {
    if (!flowViewport || flowViewport.getAttribute('data-bound') === '1') return;
    flowViewport.setAttribute('data-bound', '1');

    var dragging = false, lastX = 0;
    flowViewport.addEventListener('wheel', function(e) {
        e.preventDefault();
        scrollTarget += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY);
        scrollTarget = Math.max(-120, Math.min(maxScroll, scrollTarget));
    }, { passive: false });
    flowViewport.addEventListener('mousedown', function(e) {
        if (e.target.closest('.flow-item')) return;
        e.preventDefault();
        dragging = true; lastX = e.clientX;
        flowViewport.classList.add('grabbing');
    });
    window.addEventListener('mouseup', function() { dragging = false; flowViewport.classList.remove('grabbing'); });
    window.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        scrollTarget -= (e.clientX - lastX) * 1.4;
        scrollTarget = Math.max(-120, Math.min(maxScroll, scrollTarget));
        lastX = e.clientX;
    });
    var lt = 0;
    flowViewport.addEventListener('touchstart', function(e) { lt = e.touches[0].clientX; }, { passive: true });
    flowViewport.addEventListener('touchmove', function(e) {
        var x = e.touches[0].clientX;
        scrollTarget -= (x - lt) * 1.4;
        scrollTarget = Math.max(-120, Math.min(maxScroll, scrollTarget));
        lt = x;
    }, { passive: true });
}

var BG_SPEED = 0.35, ITEMS_SPEED = 0.72, LINES_SPEED = 1.0;
function flowTick() {
    if (!flowTrack || !flowItemsLayer || !flowBg) { requestAnimationFrame(flowTick); return; }
    scrollX += (scrollTarget - scrollX) * 0.085;
    flowTrack.style.transform = 'translate3d(' + (-scrollX * LINES_SPEED) + 'px,0,0)';
    flowItemsLayer.style.transform = 'translate3d(' + (-scrollX * ITEMS_SPEED) + 'px,0,0)';
    flowBg.style.transform = 'translate3d(' + (-scrollX * BG_SPEED) + 'px,-50%,0)';
    colBobEls.forEach(function(col) {
        var seed = +col.getAttribute('data-col-seed');
        var bob = Math.sin(scrollX * 0.0016 + seed) * 8;
        col.style.transform = 'translate3d(0, ' + bob.toFixed(1) + 'px, 0)';
    });
    updateBorderProgress();
    requestAnimationFrame(flowTick);
}

function setupViewPills() {
    var viewPills = document.getElementById('viewPills');
    if (!viewPills) return;
    viewPills.querySelectorAll('.pill').forEach(function(pill) {
        pill.addEventListener('click', function() {
            var id = pill.getAttribute('data-view');
            if (id === view) return;
            viewPills.querySelectorAll('.pill').forEach(function(p) {
                var on = p === pill;
                p.classList.toggle('active', on);
                p.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
            var target = document.getElementById('view-' + id);
            if (target) target.classList.add('active');
            view = id;
            renderCurrentView();
        });
    });
}

function renderCurrentView() {
    if (view === 'flow') renderFlow();
    else if (view === 'list') renderList();
    else renderGrid();

    updateStatusText();

}

    var count = document.getElementById('hudStatusCount');

    var visible = filterSection ? CARDS.filter(matches).length : CARDS.length;

   BORDER PROGRESS
   ═══════════════════════════════════════════════════════════ */
function updateBorderProgress() {
    var topBar = document.getElementById('scrollBorderTop');
    var bottomBar = document.getElementById('scrollBorderBottom');
    if (!topBar || !bottomBar) return;
    var corners = ['cornerTL','cornerTR','cornerBL','cornerBR'].map(function(id) { return document.getElementById(id); });
    var progress = 0;
    if (view === 'flow') progress = maxScroll > 0 ? scrollX / maxScroll : 0;
    else if (view === 'list') {
        var lw = document.getElementById('list-wrap');
        if (lw && lw.scrollHeight > lw.clientHeight) progress = lw.scrollTop / (lw.scrollHeight - lw.clientHeight);
    } else {
        var gs = document.getElementById('grid-scroll');
        if (gs && gs.scrollHeight > gs.clientHeight) progress = gs.scrollTop / (gs.scrollHeight - gs.clientHeight);
    }
    var percent = Math.round(Math.min(1, Math.max(0, progress)) * 100);
    topBar.style.width = percent + '%';
    bottomBar.style.width = percent + '%';
    corners.forEach(function(el) { if (el) el.classList.toggle('show', percent > 0 && percent < 100); });
}

/* ═══════════════════════════════════════════════════════════
   CUSTOM CURSOR
   ═══════════════════════════════════════════════════════════ */
function initWriteCursor() {
    var dot = document.getElementById('writeCursorDot');
    var ellipse = document.getElementById('writeCursorEllipse');
    if (!dot || !ellipse) return;
    if (window.matchMedia && window.matchMedia('(hover: none)').matches) return;
    var NATIVE = ['button','a','input','textarea','select','[role="button"]','.view-pills','.pill','.hud-filter','.prov-card-backlink'].join(', ');
    var ptrX = 0, ptrY = 0, prevX = 0, prevY = 0, init = false;
    var angle = 0, sx = 1, sy = 1, raf = null;
    function lerpAngle(cur, tgt, f) { var d = ((tgt - cur + 540) % 360) - 180; return cur + d * f; }
    function step() {
        if (!init) { prevX = ptrX; prevY = ptrY; init = true; }
        var dx = ptrX - prevX, dy = ptrY - prevY;
        prevX = ptrX; prevY = ptrY;
        var sp = Math.hypot(dx, dy);
        var tgt = sp > 0.4 ? Math.atan2(dy, dx) * 180 / Math.PI : angle;
        var stretch = Math.min(sp / 34, 1) * 0.6;
        angle = lerpAngle(angle, tgt, 0.22);
        sx += (1 + stretch - sx) * 0.22;
        sy += (1 - stretch * 0.45 - sy) * 0.22;
        ellipse.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px) rotate(' + angle + 'deg) scale(' + sx + ',' + sy + ')';
        raf = requestAnimationFrame(step);
    }
    window.addEventListener('mousemove', function(e) {
        var el = (e.target && e.target.nodeType === 1) ? e.target : null;
        var overNative = !!(el && el.closest && el.closest(NATIVE));
        document.body.classList.add('custom-cursor-active');
        document.body.classList.toggle('write-native-cursor', overNative);
        ptrX = e.clientX; ptrY = e.clientY;
        dot.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px)';
        dot.classList.add('visible');
        ellipse.classList.add('visible');
        if (!raf) raf = requestAnimationFrame(step);
    });
    document.addEventListener('mouseleave', function() {
        dot.classList.remove('visible'); ellipse.classList.remove('visible');
        document.body.classList.remove('write-native-cursor','custom-cursor-active');
        if (raf) { cancelAnimationFrame(raf); raf = null; }
    });
}

/* ═══════════════════════════════════════════════════════════
   APPEARANCE
   ═══════════════════════════════════════════════════════════ */
function applyTheme(theme) {
    document.body.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
}

function setupAppearanceDropdown() {
    var trigger = document.getElementById('appearanceTrigger');
    var dropdown = document.getElementById('appearanceDropdown');
    if (!trigger || !dropdown) return;
    var themes = [{ id: 'light', label: 'Light' }, { id: 'dark', label: 'Dark' }];
    function currentTheme() { return document.body.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
    function renderMenu() {
        var ct = currentTheme();
        dropdown.innerHTML = '';
        themes.forEach(function(t) {
            var item = document.createElement('button');
            item.type = 'button';
            item.className = 'menu-item' + (t.id === ct ? ' active' : '');
            item.textContent = t.label;
            item.addEventListener('click', function(e) {
                e.stopPropagation();
                applyTheme(t.id);
                renderMenu();
                dropdown.classList.remove('open');
                trigger.setAttribute('aria-expanded', 'false');
            });
            dropdown.appendChild(item);
        });
    }
    trigger.addEventListener('click', function(e) {
        e.stopPropagation();
        var isOpen = dropdown.classList.contains('open');
        dropdown.classList.remove('open');
        trigger.setAttribute('aria-expanded', 'false');
        if (!isOpen) {
            renderMenu();
            dropdown.classList.add('open');
            trigger.setAttribute('aria-expanded', 'true');
            var r = trigger.getBoundingClientRect();
            var pr = dropdown.getBoundingClientRect();
            var vw = window.innerWidth, vh = window.innerHeight;
            var top = r.bottom + 8;
            if (top + pr.height > vh - 10) top = r.top - pr.height - 8;
            var left = r.right - pr.width;
            left = Math.max(10, Math.min(left, vw - pr.width - 10));
            dropdown.style.top = top + 'px';
            dropdown.style.left = left + 'px';
        }
    });
    document.addEventListener('click', function(e) {
        if (!trigger.contains(e.target)) {
            dropdown.classList.remove('open');
            trigger.setAttribute('aria-expanded', 'false');
        }
    });
}

function setupMobileSheet() {
    var sheet = document.getElementById('mobileSheet');
    var backdrop = document.getElementById('mobileSheetBackdrop');
    var closeBtn = document.getElementById('mobileSheetClose');
    if (!sheet || !backdrop || !closeBtn) return;

    function openSheet() {
        buildMobileSheet();
        backdrop.hidden = false;
        sheet.hidden = false;
        requestAnimationFrame(function() {
            sheet.classList.add('open');
            backdrop.classList.add('open');
        });
    }
    function closeSheet() {
        sheet.classList.remove('open');
        backdrop.classList.remove('open');
        setTimeout(function() { sheet.hidden = true; backdrop.hidden = true; }, 320);
    }
    closeBtn.addEventListener('click', closeSheet);
    backdrop.addEventListener('click', closeSheet);

    var body = document.getElementById('mobileSheetBody');
    body.addEventListener('click', function(e) {
        if (e.target.closest && e.target.closest('#mobileSheetCanvasLink')) {
            window.location.href = CANVAS_URL;
            return;
        }
        var viewBtn = e.target.closest && e.target.closest('#mobileViewControls [data-view]');
        if (viewBtn) {
            var pill = document.querySelector('#viewPills [data-view="' + viewBtn.getAttribute('data-view') + '"]');
            if (pill) pill.click();
            closeSheet();
            return;
        }
        var filterBtn = e.target.closest && e.target.closest('#mobileFilterControls [data-filter]');
        if (filterBtn) {
            var fid = filterBtn.getAttribute('data-filter') || null;
            if (fid === filterSection) setFilter(null);
            else setFilter(fid);
            body.querySelectorAll('#mobileFilterControls .btn').forEach(function(b) {
                b.classList.toggle('active', (b.getAttribute('data-filter') || null) === filterSection);
            });
            return;
        }
        var sectionHeader = e.target.closest && e.target.closest('.mobile-section-header');
        if (sectionHeader) {
            var section = sectionHeader.closest('.mobile-section');
            var cards = section.querySelector('.mobile-section-cards');
            section.classList.toggle('expanded');
            cards.hidden = !section.classList.contains('expanded');
            return;
        }
        var cardRow = e.target.closest && e.target.closest('.mobile-card-row');
        if (cardRow) {
            var card = CARD_BY_ID[cardRow.getAttribute('data-card-id')];
            if (card) { closeSheet(); setTimeout(function() { openCard(card); }, 320); }
        }
    });

    sheet._openSheet = openSheet;
    sheet._closeSheet = closeSheet;
    sheet._isOpen = function() { return sheet.classList.contains('open'); };
}

/* ═══════════════════════════════════════════════════════════
   MOBILE HUD
   ═══════════════════════════════════════════════════════════ */
function updateMobileHud() {
    var hud = document.getElementById('hudGallery');
    if (!hud || hud.hidden) return;
    var path = document.getElementById('hudGalleryPath');
    var idxEl = document.getElementById('hudGalleryIdx');
    if (!path || !idxEl) return;

    path.innerHTML = '';
    if (filterSection) {
        var parent = document.createElement('span');
        parent.className = 'notif-crumb-parent';
        parent.textContent = 'Section';
        path.appendChild(parent);
        var sep = document.createElement('span');
        sep.className = 'notif-sep';
        sep.textContent = '›';
        path.appendChild(sep);
        var cur = document.createElement('span');
        cur.className = 'notif-crumb';
        cur.textContent = (sectionById(filterSection) || {}).title || filterSection;
        path.appendChild(cur);
    } else {
        var cur2 = document.createElement('span');
        cur2.className = 'notif-crumb';
        cur2.textContent = 'Gallery';
        path.appendChild(cur2);
    }

    var visibleCount = filterSection ? CARDS.filter(matches).length : CARDS.length;
    idxEl.textContent = visibleCount + '/' + CARDS.length;
}

function stepMobileSection(delta) {
    var idx = filterSection ? SECTIONS.findIndex(function(s) { return s.id === filterSection; }) : -1;
    var next = idx + delta;
    if (next < -1) next = SECTIONS.length - 1;
    if (next >= SECTIONS.length) next = -1;
    if (next === -1) setFilter(null);
    else setFilter(SECTIONS[next].id);
}

/* ═══════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════ */
function boot() {
    try {
        /* Cache module-scope DOM refs now that the DOM is ready */
        flowTrack = document.getElementById('flow-track');
        flowItemsLayer = document.getElementById('flow-items-layer');
        flowBg = document.getElementById('flow-bgtext');
        flowViewport = document.getElementById('flow-viewport');

        /* Viewport blur */
        var topBlur = document.getElementById('viewportBlurTop');
        var bottomBlur = document.getElementById('viewportBlurBottom');
        if (topBlur && bottomBlur) {
            var updateBlur = function() {
                var scrollY = window.scrollY || 0;
                var maxScrollY = document.documentElement.scrollHeight - window.innerHeight;
                topBlur.classList.toggle('scrolling', scrollY > 4);
                bottomBlur.classList.toggle('scrolling', scrollY < maxScrollY - 4);
            };
            var ticking = false;
            var onScroll = function() {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(function() { updateBlur(); ticking = false; });
            };
            window.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('resize', onScroll);
            updateBlur();
        }

        /* Theme restore */
        try {
            var saved = localStorage.getItem(THEME_KEY);
            if (saved === 'light' || saved === 'dark') document.body.setAttribute('data-theme', saved);
        } catch (e) {}

        /* Setup modules */
        setupAppearanceDropdown();
        setupViewPills();
        setupFlowInteractions();
        setupMobileSheet();
        initWriteCursor();

        /* Breadcrumb + wordmark → canvas */
        var bc = document.getElementById('breadcrumbCanvas');
        if (bc) bc.addEventListener('click', function() { window.location.href = CANVAS_URL; });
        var wm = document.getElementById('wordmark');
        if (wm) wm.addEventListener('click', function() { window.location.href = CANVAS_URL; });

        /* Reset */
        var resetBtn = document.getElementById('topResetBtn');
        if (resetBtn) resetBtn.addEventListener('click', function() {
            filterSection = null;
            var hf = document.getElementById('hudFilter');
            if (hf) { hf.textContent = 'All'; hf.classList.remove('is-filtered'); }
            scrollTarget = 0; scrollX = 0;
            var lw = document.getElementById('list-wrap'); if (lw) lw.scrollTop = 0;
            var gs = document.getElementById('grid-scroll'); if (gs) gs.scrollTop = 0;
            var pill = document.querySelector('#viewPills [data-view="flow"]');
            if (pill) pill.click();
            refreshDim(); updateStatusText(); updateMobileHud();
        });

        /* HUD filter */
        var hudFilter = document.getElementById('hudFilter');
        if (hudFilter) hudFilter.addEventListener('click', function() {
            var idx = filterSection ? SECTIONS.findIndex(function(s) { return s.id === filterSection; }) : -1;
            var next = idx + 1;
            if (next >= SECTIONS.length) setFilter(null);
            else setFilter(SECTIONS[next].id);
        });

        /* Mobile HUD nav */
        var hgp = document.getElementById('hudGalleryPrev');
        if (hgp) hgp.addEventListener('click', function() { stepMobileSection(-1); });
        var hgn = document.getElementById('hudGalleryNext');
        if (hgn) hgn.addEventListener('click', function() { stepMobileSection(1); });
        var hgnn = document.getElementById('hudGalleryNotif');
        if (hgnn) hgnn.addEventListener('click', function() {
            var sheet = document.getElementById('mobileSheet');
            if (sheet && sheet._openSheet) sheet._openSheet();
        });

        /* Mobile HUD visibility */
        if (window.innerWidth <= 640) {
            var hg = document.getElementById('hudGallery'); if (hg) hg.hidden = false;
            var hd = document.getElementById('hud'); if (hd) hd.hidden = true;
        }

        /* Context menu dismissal */
        document.addEventListener('click', hideContextMenu);
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') hideContextMenu(); });
        window.addEventListener('scroll', hideContextMenu, true);
        window.addEventListener('resize', hideContextMenu);

        /* Scroll progress */
        var lw = document.getElementById('list-wrap');
        if (lw) lw.addEventListener('scroll', updateBorderProgress, { passive: true });
        var gs = document.getElementById('grid-scroll');
        if (gs) gs.addEventListener('scroll', updateBorderProgress, { passive: true });

        /* Grid section pills */
        buildGridSections();

        /* Keyboard shortcuts */
        document.addEventListener('keydown', function(e) {
            if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
            if (e.key === 'Escape') {
                var m = document.querySelector('.context-menu.show');
                if (m) { hideContextMenu(); e.preventDefault(); return; }
                var sheet = document.getElementById('mobileSheet');
                if (sheet && sheet._isOpen && sheet._isOpen()) { sheet._closeSheet(); e.preventDefault(); return; }
                if (filterSection) { setFilter(null); e.preventDefault(); return; }
            }
            if (e.key === '1') { var p1 = document.querySelector('#viewPills [data-view="flow"]'); if (p1) p1.click(); }
            if (e.key === '2') { var p2 = document.querySelector('#viewPills [data-view="list"]'); if (p2) p2.click(); }
            if (e.key === '3') { var p3 = document.querySelector('#viewPills [data-view="grid"]'); if (p3) p3.click(); }
        });

        /* Resize */
        var resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                if (view === 'flow') renderFlow();
                if (window.innerWidth <= 640) {
                    var hg2 = document.getElementById('hudGallery'); if (hg2) hg2.hidden = false;
                    var hd2 = document.getElementById('hud'); if (hd2) hd2.hidden = true;
                    updateMobileHud();
                } else {
                    var hg3 = document.getElementById('hudGallery'); if (hg3) hg3.hidden = true;
                    var hd3 = document.getElementById('hud'); if (hd3) hd3.hidden = false;
                }
            }, 200);
        });

        /* Render the initial view */
        renderCurrentView();
        updateStatusText();
        updateMobileHud();

        /* Kick the flow animation loop */
        requestAnimationFrame(flowTick);

        console.log('[intoview.gallery] booted ·', CARDS.length, 'cards ·', SECTIONS.length, 'sections');
    } catch (err) {
        console.error('[intoview.gallery] boot failed:', err);
        var be = document.getElementById('bootError');
        if (be) be.classList.add('show');
    }
}

/* Run boot as soon as the DOM is ready — with a fallback for the case
   where DOMContentLoaded has already fired by the time this script runs. */
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
} else {
    boot();
}

})();
</script>
