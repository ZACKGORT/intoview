/* ═══════════════════════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════════════════════ */
function getLayoutPositions(layout, nodes) {
  const positions = {};
  const colPitch = getColPitch();
  const rowPitch = getRowPitch();
  positions.identity = { x: 0, y: 0 };
  positions.index = { x: 0, y: rowPitch };
  const clusters = nodes.filter(n => n.kind === 'cluster');
  if (isMobile()) {
    const startY = rowPitch * 2;
    clusters.forEach((n, i) => { positions[n.id] = { x: 0, y: startY + i * rowPitch }; });
  } else {
    clusters.forEach((n, i) => {
      const col = i % 3;
      const row = Math.floor(i / 3);
      positions[n.id] = { x: (col + 1) * colPitch, y: row * rowPitch };
    });
  }
  return positions;
}

function reflowMobileColumn() {
  if (!isMobile()) return;
  if (canvasLayout === 'array') return;
  const surface = document.getElementById('canvasSurface');
  if (!surface) return;
  const order = ['identity', 'index', ...CLUSTER_ORDER];
  const gap = 28;
  let cursorY = 0;
  const nodes = order.map(id => surface.querySelector(`.canvas-node[data-node-id="${CSS.escape(id)}"]`)).filter(Boolean);
  nodes.forEach(n => { n.style.transition = 'none'; });
  order.forEach(id => {
    const node = surface.querySelector(`.canvas-node[data-node-id="${CSS.escape(id)}"]`);
    if (!node) return;
    node.style.left = '0px';
    node.style.top = cursorY + 'px';
    restPositions.set(id, { x: 0, y: cursorY });
    cursorY += node.offsetHeight + gap;
  });
  void surface.offsetHeight;
  nodes.forEach(n => { n.style.transition = ''; });
}

function packArray() {
  const surface = document.getElementById('canvasSurface');
  if (!surface) return;
  const nodes = [...surface.querySelectorAll('.canvas-node')];
  if (!nodes.length) return;

  const prevTransform = surface.style.transform;
  const prevTransition = surface.style.transition;
  surface.style.transition = 'none';
  surface.style.transform = 'translate3d(0,0,0) scale(1)';
  void surface.offsetHeight;

  nodes.forEach(n => { n.style.transition = 'none'; });

  const mobile = isMobile();
  const vw = window.innerWidth;
  const startX = 40;
  const startY = 40;
  const gapX = 40;
  const gapY = 40;
  const maxRight = vw - 40;

  let rowY = startY;
  let rowH = 0;
  let cursorX = startX;

  nodes.forEach(node => {
    const w = node.offsetWidth;
    const h = node.offsetHeight;

    if (mobile) {
      node.style.left = startX + 'px';
      node.style.top = rowY + 'px';
      restPositions.set(node.dataset.nodeId, { x: startX, y: rowY });
      rowY += h + gapY;
      return;
    }

    if (cursorX > startX && cursorX + w > maxRight) {
      rowY += rowH + gapY;
      rowH = 0;
      cursorX = startX;
    }

    node.style.left = cursorX + 'px';
    node.style.top = rowY + 'px';
    restPositions.set(node.dataset.nodeId, { x: cursorX, y: rowY });

    cursorX += w + gapX;
    if (h > rowH) rowH = h;
  });

  void surface.offsetHeight;
  nodes.forEach(n => { n.style.transition = ''; });

  surface.style.transition = prevTransition;
  surface.style.transform = prevTransform;

  fitCanvasToViewport();
  saveCanvasState();
  drawCanvasEdges();
  queueMinimapLayout();
}

function refineIdentityIndexStack() {
  const surface = document.getElementById('canvasSurface');
  if (!surface) return;
  const identityNode = surface.querySelector('.canvas-node[data-node-id="identity"]');
  const indexNode = surface.querySelector('.canvas-node[data-node-id="index"]');
  if (!identityNode || !indexNode) return;
  const identityPos = restPositions.get('identity');
  const indexPos = restPositions.get('index');
  if (!identityPos || !indexPos) return;
  const rowPitch = getRowPitch();
  const gap = rowPitch - 280;
  const isStacked = Math.abs(indexPos.x - identityPos.x) < 4 && indexPos.y > identityPos.y && indexPos.y <= identityPos.y + rowPitch + 8;
  if (!isStacked) return;
  const newY = identityPos.y + identityNode.offsetHeight + gap;
  if (Math.abs(newY - indexPos.y) < 2) return;
  indexNode.style.top = newY + 'px';
  restPositions.set('index', { x: indexPos.x, y: newY });
}

function setupResizeObserver() {
  if (resizeObserver) resizeObserver.disconnect();
  if (!isMobile()) return;
  resizeObserver = new ResizeObserver(() => {
    if (canvasLayout === 'array') packArray();
    else reflowMobileColumn();
  });
  document.querySelectorAll('.canvas-node').forEach(n => resizeObserver.observe(n));
}

function relCenter(el) {
  if (!el) return null;
  const node = el.closest('.canvas-node');
  if (!node) return null;
  const nodeX = parseFloat(node.style.left) || 0;
  const nodeY = parseFloat(node.style.top) || 0;
  const nr = node.getBoundingClientRect();
  const er = el.getBoundingClientRect();
  return {
    x: nodeX + (er.left - nr.left) / scale + er.width / 2 / scale,
    y: nodeY + (er.top - nr.top) / scale + er.height / 2 / scale
  };
}

function drawCanvasEdges() {
  const svg = document.getElementById('canvasEdges');
  svg.innerHTML = '';
  const identityNode = document.querySelector('.canvas-node[data-node-id="identity"]');
  const indexNode = document.querySelector('.canvas-node[data-node-id="index"]');
  if (!identityNode || !indexNode) return;
  const identityCenter = relCenter(identityNode.querySelector('.prov-card'));
  const indexCenter = relCenter(indexNode.querySelector('.prov-card'));
  if (!identityCenter || !indexCenter) return;
  const ns = 'http://www.w3.org/2000/svg';
  const addPath = (a, b, fromId, toId) => {
    if (!a || !b) return;
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('class', 'canvas-edge');
    path.dataset.focus = (expandedClusters.has(fromId) || expandedClusters.has(toId)) ? 'true' : 'false';
    const dx = b.x - a.x;
    path.setAttribute('d', `M ${a.x} ${a.y} C ${a.x + dx*.4} ${a.y}, ${b.x - dx*.4} ${b.y}, ${b.x} ${b.y}`);
    svg.appendChild(path);
  };
  addPath(identityCenter, indexCenter, 'identity', 'index');
  document.querySelectorAll('.canvas-node[data-kind="cluster"]').forEach(cn => {
    const cid = cn.dataset.clusterId;
    const tc = cn.querySelector('.cluster-title > .prov-card');
    addPath(indexCenter, relCenter(tc), 'index', cid);
    const stack = cn.querySelector('.cluster-stack');
    if (stack && stack.dataset.expanded === 'true') {
      cn.querySelectorAll('.cluster-leaf').forEach(le => {
        addPath(relCenter(tc), relCenter(le.querySelector('.prov-card')), cid, le.dataset.cardId);
      });
    }
  });
}

function applyPanTransform() {
  const surface = document.getElementById('canvasSurface');
  if (surface) surface.style.transform = `translate3d(${panOffset.x}px, ${panOffset.y}px, 0) scale(${scale})`;
  const pct = document.getElementById('zoomHudPercent');
  if (pct) pct.textContent = Math.round(scale * 100) + '%';
  queueMinimapFrame();
}

function fitCanvasToViewport() {
  const nodes = [...document.querySelectorAll('.canvas-node')];
  if (!nodes.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodes.forEach(n => {
    const x = parseFloat(n.style.left) || 0, y = parseFloat(n.style.top) || 0;
    minX = Math.min(minX, x); minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + n.offsetWidth); maxY = Math.max(maxY, y + n.offsetHeight);
  });
  const vw = window.innerWidth, vh = window.innerHeight;
  const topbarH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--topbar-height')) || 56;
  const hudReserve = isMobile() ? 100 : 80;
  const padX = 40;
  const availW = vw - padX * 2;
  const availH = vh - topbarH - hudReserve;
  const cw = Math.max(1, maxX - minX);
  const ch = Math.max(1, maxY - minY);
  const desired = Math.min(availW / cw, availH / ch);
  scale = Math.max(getMinScale(), Math.min(getMaxScale(), Math.min(1, desired)));
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  panOffset.x = vw / 2 - cx * scale;
  panOffset.y = (topbarH + vh - hudReserve) / 2 - cy * scale;
  applyPanTransform();
}

function zoomAt(newScale, clientX, clientY) {
  const clamped = Math.max(getMinScale(), Math.min(getMaxScale(), newScale));
  if (clamped === scale) return;
  const wx = (clientX - panOffset.x) / scale;
  const wy = (clientY - panOffset.y) / scale;
  panOffset.x = clientX - wx * clamped;
  panOffset.y = clientY - wy * clamped;
  scale = clamped;
  applyPanTransform();
  saveCanvasState();
}
function zoomStep(dir) {
  zoomAt(scale * (dir > 0 ? ZOOM_STEP : 1 / ZOOM_STEP), window.innerWidth / 2, window.innerHeight / 2);
}
function zoomReset100() { zoomAt(1, window.innerWidth / 2, window.innerHeight / 2); }

let cameraTweenRaf = null;
function tweenCamera(tScale, tPanX, tPanY, dur) {
  dur = dur || 320;
  if (cameraTweenRaf) cancelAnimationFrame(cameraTweenRaf);
  const s0 = scale, px0 = panOffset.x, py0 = panOffset.y, t0 = performance.now();
  function tick(t) {
    const p = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    scale = s0 + (tScale - s0) * e;
    panOffset.x = px0 + (tPanX - px0) * e;
    panOffset.y = py0 + (tPanY - py0) * e;
    applyPanTransform();
    if (p < 1) cameraTweenRaf = requestAnimationFrame(tick);
    else { cameraTweenRaf = null; saveCanvasState(); }
  }
  cameraTweenRaf = requestAnimationFrame(tick);
}

/* ═══════════════════════════════════════════════════════════
   GALLERY RENDER
   ═══════════════════════════════════════════════════════════ */
function getScopedCards() {
  if (!currentRoute.scope) return CARD_ORDER.map(id => CARDS.get(id));
  const cl = CLUSTERS.get(currentRoute.scope);
  if (!cl) return [];
  let ids = cl.cardIds;
  if (currentRoute.section) ids = ids.filter(id => CARDS.get(id)?.section === currentRoute.section);
  return ids.map(id => CARDS.get(id)).filter(Boolean);
}

function renderGalleryView() {
  document.querySelectorAll('.gallery-view').forEach(v => {
    v.classList.toggle('active', v.dataset.galleryView === galleryView);

  const cards = getScopedCards();
  if (galleryView === 'flow') renderGalleryFlow(cards);
  else if (galleryView === 'list') renderGalleryList(cards);
  else renderGalleryGrid(cards);
  requestAnimationFrame(() => {
    if (galleryView === 'flow') setupFlowInteractions();
  });
  updateBorderProgress();
}

function renderGalleryCard(card) {

    el.innerHTML =

        <span class="prov-card-type">Editorial</span>

      </div>
      <div class="prov-card-letter-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h13l3 3v13H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
        <span>Editorial · ${escapeHtml(card.clusterId)}</span>
      </div>
      <h3 class="prov-card-title">${escapeHtml(card.title)}</h3>
      <p class="prov-card-deck">${escapeHtml(card.deck)}</p>
      <div class="prov-card-letter-cta"><span>Read the letter</span><span class="arrow">→</span></div>`;
    return el;
  }

  if (!card.media) {
    el.classList.add('face-compact');
    const initials = initialsFromName(card.provenance.author);
    const dateShort = formatDateShort(card.provenance.date);
    let backlink = '';
    if (card.type === 'reply' && card.parentId && CARDS.has(card.parentId)) {
      const parent = CARDS.get(card.parentId);
      backlink = `<a class="prov-card-backlink" data-parent-id="${escapeHtml(card.parentId)}" role="button" tabindex="0"><span class="arrow">↩</span><span>Replying to <span class="parent-title">"${escapeHtml(parent.title)}"</span></span></a>`;
    }
    const meta = refCount > 0 ? `<div class="prov-card-meta"><span class="prov-card-relations"><span class="prov-card-relation"><strong>${refCount}</strong> ref</span></span></div>` : '';
    el.innerHTML =
      `<div class="prov-card-kicker">
        <span class="prov-card-type">${escapeHtml(cardTypeLabel(card.type))}</span>
        <span class="prov-card-status" data-status="${escapeHtml(card.provenance.status)}">${escapeHtml(card.provenance.status)}</span>
      </div>
      <div class="prov-card-byline">
        <div class="prov-card-monogram">${escapeHtml(initials)}</div>
        <div class="prov-card-byline-text">
          <span class="prov-card-byline-name">${escapeHtml(card.provenance.author)}</span>
          <span class="prov-card-byline-date">${escapeHtml(dateShort)}</span>
        </div>
      </div>
      ${backlink}
      <h3 class="prov-card-title">${escapeHtml(card.title)}</h3>
      <p class="prov-card-deck">${escapeHtml(card.deck)}</p>
      ${meta}`;
    return el;
  }

  el.classList.add('face-media');
  const isVideo = card.media.k === 'video';
  const badge = isVideo ? 'Video' : 'Photo';
  const mediaHTML =
    `<div class="prov-card-media">
      <span class="prov-card-media-badge">${badge}</span>
      ${isVideo
        ? `<video src="${escapeHtml(card.media.src)}" muted loop playsinline preload="auto"></video>`
        : `<img src="${escapeHtml(card.media.src)}" loading="eager" decoding="async" alt="">`}
    </div>`;
  let backlink2 = '';
  if (card.type === 'reply' && card.parentId && CARDS.has(card.parentId)) {
    const parent = CARDS.get(card.parentId);
    backlink2 = `<a class="prov-card-backlink" data-parent-id="${escapeHtml(card.parentId)}" role="button" tabindex="0"><span class="arrow">↩</span><span>Replying to <span class="parent-title">"${escapeHtml(parent.title)}"</span></span></a>`;
  }
  el.innerHTML =
    `<div class="prov-card-kicker">
      <span class="prov-card-type">${escapeHtml(cardTypeLabel(card.type))}</span>
      <span class="prov-card-status" data-status="${escapeHtml(card.provenance.status)}">${escapeHtml(card.provenance.status)}</span>
    </div>
    ${mediaHTML}
    ${backlink2}
    <h3 class="prov-card-title">${escapeHtml(card.title)}</h3>
    <p class="prov-card-deck">${escapeHtml(card.deck)}</p>
    <div class="prov-card-meta">
      <span class="prov-card-source">${escapeHtml(card.provenance.source)}</span>
      <span class="prov-card-relations">${refCount > 0 ? `<span class="prov-card-relation"><strong>${refCount}</strong> ref</span>` : ''}</span>
    </div>`;
  return el;
}

function cardTypeLabel(t) {
  return { statement:'Statement', evidence:'Evidence', reply:'Reply', update:'Update', editorial:'Editorial' }[t] || t;
}
function initialsFromName(name) {
  if (!name) return '—';
  const parts = String(name).trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}
function formatDateShort(iso) {
  if (!iso) return '';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if (!m) return iso;
  return m[3].replace(/^0/,'') + ' ' + months[parseInt(m[2],10)-1] + ' ' + m[1];
}

function wireVideo(containerEl) {
  const video = containerEl.querySelector('video');
  if (!video) return;
  video.preload = 'auto';
  const seek = () => { if (video.readyState >= 1 && video.currentTime === 0) try { video.currentTime = 0.1; } catch(e){} };
  if (video.readyState >= 1) seek(); else video.addEventListener('loadedmetadata', seek, { once:true });
  const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (isTouch) {
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting && en.intersectionRatio >= 0.5) video.play().catch(()=>{});
        else video.pause();
      });
    }, { threshold:[0,0.5,1] });
    io.observe(containerEl);
  } else {
    containerEl.addEventListener('mouseenter', () => video.play().catch(()=>{}));
    containerEl.addEventListener('mouseleave', () => { video.pause(); video.currentTime = 0; });
  }
}

function wireGalleryCard(container, card) {
  container.addEventListener('click', e => {
    const backlink = closestSafe(e.target, '.prov-card-backlink');
    if (backlink) {
      e.preventDefault(); e.stopPropagation();
      const pid = backlink.getAttribute('data-parent-id');
      if (pid) openReader(pid);
      return;
    }
    openReader(card.id);
  });
  container.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    showGalleryContextMenu(e.clientX, e.clientY, card);
  });
}

/* ── Flow view ── */
const SUBCOL_GAP = 24, COL_GUTTER = 80, COL_PAD = 40, GAP = 22;
const COVER_X = 120;
let flowTrack, flowItemsLayer, flowBg, flowViewport;
let flowColX = [], flowMaxScroll = 0, flowScrollX = 0, flowScrollTarget = 0;
let flowColBobEls = [], flowTrackBound = false;

function estimateCardHeight(card, cardW) {
  if (card.format === 'editorial') return 246;
  if (!card.media) {
    let h = 24 + 12 + 8 + 32 + 8 + 22 + 8 + 60;
    if (card.type === 'reply' && card.parentId) h += 34;
    if ((card.relationships.references.length||0) + (card.relationships.replies.length||0) + (card.relationships.updates.length||0) > 0) h += 22;
    return h;
  }
  let mh = 30 + 12 + 10 + cardW + 10 + 22 + 10 + 90 + 10 + 30;
  if (card.type === 'reply' && card.parentId) mh += 34;
  return mh;
}

function hashStr(s) { let h = 0; for (let i=0;i<s.length;i++) h = Math.imul(31,h) + s.charCodeAt(i) | 0; return h >>> 0; }
function srand(seed) { const x = Math.sin(seed + 1) * 10000; return x - Math.floor(x); }

function planColumn(cards, viewportH) {
  if (!cards.length) return { width: 160, subCols: 1, placed: [], cardW: 240 };
  const cardW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-w')) || 240;
  const usableH = Math.max(300, viewportH - 24);
  const laid = cards.map(c => {
    const seed = hashStr(c.title);
    const h = estimateCardHeight(c, cardW) + Math.round(srand(seed) * 8);
    return { card: c, seed, h };
  });
  const totalH = laid.reduce((a,d) => a + d.h, 0) + (laid.length - 1) * GAP;
  let subCols = Math.max(1, Math.min(6, Math.min(Math.ceil(totalH / usableH), laid.length)));
  let colHeights, placed;
  for (let attempt = subCols; attempt <= 6; attempt++) {
    colHeights = new Array(attempt).fill(0);
    placed = laid.map(d => {
      let best = 0;
      for (let c = 1; c < attempt; c++) if (colHeights[c] < colHeights[best]) best = c;
      const y = colHeights[best];
      colHeights[best] = y + d.h + GAP;
      return Object.assign({ sub: best, y }, d);
    });
    const tallest = Math.max(...colHeights.map(h => h - GAP));
    if (tallest <= usableH || attempt >= 6) { subCols = attempt; break; }
  }
  const colH = colHeights.map(h => Math.max(0, h - GAP));
  placed.forEach(p => { p.topOffset = p.y - colH[p.sub] / 2; });
  const width = COL_PAD * 2 + subCols * cardW + (subCols - 1) * SUBCOL_GAP;
  return { width, subCols, placed, cardW };
}

function renderGalleryFlow(cards) {
  flowTrack = document.getElementById('flow-track');
  flowItemsLayer = document.getElementById('flow-items-layer');
  flowBg = document.getElementById('flow-bgtext');
  flowViewport = document.getElementById('flow-viewport');
  if (!flowTrack || !flowItemsLayer || !flowViewport) return;

  flowTrack.innerHTML = '';
  flowItemsLayer.innerHTML = '';
  flowColBobEls = [];

  const rect = flowViewport.getBoundingClientRect();
  let vh = (rect && rect.height) ? rect.height : (window.innerHeight - 320);
  if (!vh || vh < 100) vh = window.innerHeight - 320;

  const cardW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-w')) || 240;
  const coverW = Math.round(cardW * 1.5);

  let cursorX = COVER_X;

  /* 1 ── Global cover (only when browsing the whole gallery) */
  if (!currentRoute.scope) {
    const globalCoverCol = document.createElement('div');
    globalCoverCol.className = 'flow-col-items';
    globalCoverCol.style.left = cursorX + 'px';
    globalCoverCol.style.width = coverW + 'px';
    globalCoverCol.setAttribute('data-col-seed', hashStr('col-cover-global'));
    flowColBobEls.push(globalCoverCol);

    const globalCoverItem = document.createElement('div');
    globalCoverItem.className = 'flow-item flow-cover-item';
    globalCoverItem.style.left = '0';
    globalCoverItem.style.width = '100%';
    globalCoverItem.style.top = '50%';
    globalCoverItem.style.transform = 'translateY(-50%)';
    globalCoverItem.style.cursor = 'default';
    globalCoverItem.appendChild(renderGalleryCoverCard());
    globalCoverCol.appendChild(globalCoverItem);
    flowItemsLayer.appendChild(globalCoverCol);

    const globalLine = document.createElement('div');
    globalLine.className = 'flow-col-line';
    globalLine.style.left = cursorX + 'px';
    flowTrack.appendChild(globalLine);
    const globalLbl = document.createElement('div');
    globalLbl.className = 'flow-col-label is-cover';
    globalLbl.style.left = (cursorX - 12) + 'px';
    globalLbl.innerHTML = `<span class="num">◈</span>GALLERY`;
    flowTrack.appendChild(globalLbl);

    cursorX += coverW + COL_GUTTER;
  }

  /* 2 ── Group cards by cluster and render each cluster as
         [cover column] + [month columns].  When scoped to a single
         cluster, only that cluster's cover is drawn. */
  const groups = currentRoute.scope
    ? [{ cluster: CLUSTERS.get(currentRoute.scope), cards }]
    : CLUSTER_ORDER.map(id => ({
        cluster: CLUSTERS.get(id),
        cards: CLUSTERS.get(id).cardIds.map(cid => CARDS.get(cid)).filter(Boolean)
      }));

  groups.forEach((group, gIdx) => {
    if (!group.cluster || !group.cards.length) return;

    /* Cluster cover column */
    const clusterCoverCol = document.createElement('div');
    clusterCoverCol.className = 'flow-col-items';
    clusterCoverCol.style.left = cursorX + 'px';
    clusterCoverCol.style.width = coverW + 'px';
    clusterCoverCol.setAttribute('data-col-seed', hashStr('col-cover-' + gIdx));
    flowColBobEls.push(clusterCoverCol);

    const clusterCoverItem = document.createElement('div');
    clusterCoverItem.className = 'flow-item flow-cover-item';
    clusterCoverItem.style.left = '0';
    clusterCoverItem.style.width = '100%';
    clusterCoverItem.style.top = '50%';
    clusterCoverItem.style.transform = 'translateY(-50%)';
    clusterCoverItem.style.cursor = 'default';
    clusterCoverItem.appendChild(renderGalleryCoverCard(group.cluster));
    clusterCoverCol.appendChild(clusterCoverItem);
    flowItemsLayer.appendChild(clusterCoverCol);

    const clLine = document.createElement('div');
    clLine.className = 'flow-col-line';
    clLine.style.left = cursorX + 'px';
    flowTrack.appendChild(clLine);
    const clLbl = document.createElement('div');
    clLbl.className = 'flow-col-label is-cover';
    clLbl.style.left = (cursorX - 12) + 'px';
    clLbl.innerHTML = `<span class="num">${escapeHtml(group.cluster.num || '—')}</span>${escapeHtml(group.cluster.title || '')}`;
    flowTrack.appendChild(clLbl);

    cursorX += coverW + COL_GUTTER;

    /* Month columns for this cluster */
    const monthKeys = [];
    const seen = {};
    group.cards.forEach(c => {
      const m = /^(\d{4})-(\d{2})/.exec(c.provenance.date || '');
      const k = m ? `${m[1]}-${m[2]}` : '0000-00';
      if (!seen[k]) { seen[k] = true; monthKeys.push(k); }
    });
    monthKeys.sort();
    const byMonth = monthKeys.map(k => group.cards.filter(c => (c.provenance.date || '').startsWith(k)));
    const plans = byMonth.map(cs => planColumn(cs, vh));

    monthKeys.forEach((k, m) => {
      const line = document.createElement('div');
      line.className = 'flow-col-line';
      line.style.left = cursorX + 'px';
      flowTrack.appendChild(line);
      const lbl = document.createElement('div');
      lbl.className = 'flow-col-label';
      lbl.style.left = (cursorX - 12) + 'px';
      const mn = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
      const mm = /-(\d{2})$/.exec(k);
      const yy = /^(\d{4})/.exec(k);
      lbl.innerHTML = `<span class="num">${mm ? mn[parseInt(mm[1],10)-1] : '—'}</span>${yy ? yy[1] : ''}`;
      flowTrack.appendChild(lbl);

      const plan = plans[m];
      const colWrap = document.createElement('div');
      colWrap.className = 'flow-col-items';
      colWrap.style.left = cursorX + 'px';
      colWrap.style.width = plan.width + 'px';
      colWrap.setAttribute('data-col-seed', hashStr('col' + gIdx + '_' + m));
      flowColBobEls.push(colWrap);

      plan.placed.forEach(p => {
        const card = p.card;
        const subX = COL_PAD + p.sub * (plan.cardW + SUBCOL_GAP);
        const jitter = Math.round(srand(p.seed + 1) * 14) - 7;
        const left = subX + jitter;
        const halfVp = vh / 2;
        let top = p.topOffset;
        if (top < -halfVp) top = -halfVp;
        if (top + p.h > halfVp) top = halfVp - p.h;

        const el = document.createElement('div');
        el.className = 'flow-item';
        el.style.left = left + 'px';
        el.style.width = plan.cardW + 'px';
        el.style.top = `calc(50% + ${Math.round(top)}px)`;
        el.dataset.cardId = card.id;

        const cardEl = renderGalleryCard(card);
        el.appendChild(cardEl);
        wireVideo(cardEl);
        wireGalleryCard(el, card);
        colWrap.appendChild(el);
      });
      flowItemsLayer.appendChild(colWrap);
      cursorX += plan.width + COL_GUTTER;
    });
  });

  const measure = () => {
    let maxRight = 0;
    flowItemsLayer.querySelectorAll('.flow-col-items').forEach(col => {
      const colLeft = parseFloat(col.style.left) || 0;
      col.querySelectorAll('.flow-item').forEach(item => {
        const itemLeft = parseFloat(item.style.left) || 0;
        const itemRight = colLeft + itemLeft + item.offsetWidth;
        if (itemRight > maxRight) maxRight = itemRight;
      });
    });
    const measured = Math.max(maxRight, cursorX) + 200;
    flowMaxScroll = Math.max(0, measured - window.innerWidth);
    flowScrollTarget = Math.max(-120, Math.min(flowMaxScroll, flowScrollTarget));
  };
  measure();
  requestAnimationFrame(measure);

  if (!flowTrackBound) {
    setupFlowInteractions();
    flowTrackBound = true;
    requestAnimationFrame(flowTick);
  }
}

function setupFlowInteractions() {
  flowViewport = document.getElementById('flow-viewport');
  if (!flowViewport || flowViewport.dataset.bound === '1') return;
  flowViewport.dataset.bound = '1';
  let dragging = false, lastX = 0;
  flowViewport.addEventListener('wheel', e => {
    e.preventDefault();
    const useX = Math.abs(e.deltaX) > Math.abs(e.deltaY);
    const raw = useX ? e.deltaX : e.deltaY;
    flowScrollTarget += raw * (useX ? 1.4 : 2.2);
    flowScrollTarget = Math.max(-120, Math.min(flowMaxScroll, flowScrollTarget));
  }, { passive: false });
  flowViewport.addEventListener('mousedown', e => {
    if (closestSafe(e.target, '.flow-item')) return;
    e.preventDefault();
    dragging = true; lastX = e.clientX;
    flowViewport.classList.add('grabbing');
  });
  window.addEventListener('mouseup', () => { dragging = false; flowViewport.classList.remove('grabbing'); });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    flowScrollTarget -= (e.clientX - lastX) * 1.0;
    flowScrollTarget = Math.max(-120, Math.min(flowMaxScroll, flowScrollTarget));
    flowScrollX = flowScrollTarget;
    lastX = e.clientX;
  });
  let lt = 0;
  flowViewport.addEventListener('touchstart', e => { lt = e.touches[0].clientX; }, { passive: true });
  flowViewport.addEventListener('touchmove', e => {
    const x = e.touches[0].clientX;
    flowScrollTarget -= (x - lt) * 1.4;
    flowScrollTarget = Math.max(-120, Math.min(flowMaxScroll, flowScrollTarget));
    flowScrollX = flowScrollTarget;
    lt = x;
  }, { passive: true });
}

const BG_SPEED = 0.35, ITEMS_SPEED = 1.0, LINES_SPEED = 1.0;
function flowTick() {
  if (!flowTrack || !flowItemsLayer || !flowBg) { requestAnimationFrame(flowTick); return; }
  flowScrollX += (flowScrollTarget - flowScrollX) * 0.14;
  flowTrack.style.transform = `translate3d(${-flowScrollX * LINES_SPEED}px,0,0)`;
  flowItemsLayer.style.transform = `translate3d(${-flowScrollX * ITEMS_SPEED}px,0,0)`;
  flowBg.style.transform = `translate3d(${-flowScrollX * BG_SPEED}px,-50%,0)`;
  flowColBobEls.forEach(col => {
    const seed = +col.getAttribute('data-col-seed');
    col.style.transform = `translate3d(0,${(Math.sin(flowScrollX * 0.0016 + seed) * 4).toFixed(1)}px,0)`;
  });
  if (browseMode === 'gallery') updateBorderProgress();
  requestAnimationFrame(flowTick);
}

function updateBorderProgress() {
  const topBar = document.getElementById('scrollBorderTop');
  const botBar = document.getElementById('scrollBorderBottom');
  if (!topBar || !botBar) return;
  const corners = ['cornerTL','cornerTR','cornerBL','cornerBR'].map(id => document.getElementById(id));
  let progress = 0;
  if (currentRoute.mode === 'reader') {
    progress = readerCards.length > 1 ? activeIndex / (readerCards.length - 1) : 0;
  } else if (browseMode === 'gallery') {
    if (galleryView === 'flow') progress = flowMaxScroll > 0 ? flowScrollX / flowMaxScroll : 0;
    else if (galleryView === 'list') {
      const lw = document.getElementById('list-wrap');
      if (lw && lw.scrollHeight > lw.clientHeight) progress = lw.scrollTop / (lw.scrollHeight - lw.clientHeight);
    } else {
      const gs = document.getElementById('grid-scroll');
      if (gs && gs.scrollHeight > gs.clientHeight) progress = gs.scrollTop / (gs.scrollHeight - gs.clientHeight);
    }
  } else if (browseMode === 'canvas') {
    const maxY = document.documentElement.scrollHeight - window.innerHeight;
    progress = maxY > 0 ? (window.scrollY || 0) / maxY : 0;
  }
  const percent = Math.round(Math.min(1, Math.max(0, progress)) * 100);
  topBar.style.width = percent + '%';
  botBar.style.width = percent + '%';
  corners.forEach(c => c && c.classList.toggle('show', percent > 0 && percent < 100));
}

/* ═══════════════════════════════════════════════════════════
   READER OVERLAY
   ═══════════════════════════════════════════════════════════ */
function openReader(cardId) {
  if (!CARDS.has(cardId)) return;
  navigate({ mode: 'reader', cardId });
}

function openReaderRoute(cardId) {
  const card = CARDS.get(cardId);
  if (!card) { navigate({ mode: 'canvas' }, true); return; }

  if (card.type === 'cluster') {
    const cl = CLUSTERS.get(card.id);
    readerCards = [card].concat(cl.cardIds.map(id => CARDS.get(id)).filter(Boolean));
    activeIndex = 0;
  } else if (card.clusterId && CLUSTERS.has(card.clusterId)) {
    const cl = CLUSTERS.get(card.clusterId);
    const clusterCard = CARDS.get(cl.id);
    readerCards = [clusterCard].concat(cl.cardIds.map(id => CARDS.get(id)).filter(Boolean));
    activeIndex = readerCards.findIndex(c => c.id === cardId);
    if (activeIndex < 0) activeIndex = 0;
  } else {
    readerCards = [card];
    activeIndex = 0;
  }

  syncView();
  renderTrack();
  requestAnimationFrame(() => scrollToPanel(activeIndex, false));
}

function closeReader() {
  navigate(lastBrowseRoute, true);
}

function isGeneralLetter(card) {
  if (!card) return false;
  if (card.fullContent) return false;
  if (card.type === 'cluster') return false;
  if (card.type === 'identity') return false;
  if (card.type === 'index') return false;
  return true;
}

function buildReaderCover(card, index, total, opts) {
  opts = opts || {};
  const cover = document.createElement('div');
  cover.className = 'letter-cover';
  let label;
  if (card.type === 'cluster') label = 'SECTION';
  else if (card.type === 'identity') label = 'IDENTITY';
  else if (card.type === 'index') label = 'INDEX';
  else label = 'LETTER ' + String(index + 1).padStart(2, '0');
  const p = card.provenance;
  const deckHTML = opts.hideDeck
    ? ''
    : `<p class="swiss-col swiss-col-span-6 swiss-offset-3 letter-cover-deck">${escapeHtml(card.deck)}</p>`;
  cover.innerHTML = `
    <div class="swiss-grid" style="gap:8px var(--swiss-gap,24px)">
      <span class="swiss-col swiss-col-span-3 letter-cover-kicker">${label}</span>
      <h2 class="swiss-col swiss-col-span-9 letter-cover-name">${escapeHtml(card.title)}</h2>
      ${deckHTML}
      <div class="swiss-col swiss-col-span-9 swiss-offset-3 letter-provenance">
        <span class="letter-provenance-field"><strong>By</strong>${escapeHtml(p.author)}</span>
        <span class="letter-provenance-field"><strong>On</strong>${escapeHtml(p.date)}</span>
        <span class="letter-provenance-field"><strong>From</strong>${escapeHtml(p.source)}</span>
        <span class="letter-provenance-status" data-status="${escapeHtml(p.status)}">${escapeHtml(p.status)}</span>
      </div>
    </div>
  `;
  return cover;
}

function renderLetterBentoBody(card) {
  const p = card.provenance;
  const rel = card.relationships || {};
  const refCount = (rel.references?.length || 0)
    + (rel.replies?.length || 0)
    + (rel.updates?.length || 0);

  const typeLabel = cardTypeLabel(card.type);

  const mediaCellHTML = card.media
    ? `<div class="letter-bento-cell letter-bento-media">
         ${card.media.k === 'video'
           ? `<video src="${escapeHtml(card.media.src)}" controls playsinline muted loop preload="metadata"></video>`
           : `<img src="${escapeHtml(card.media.src)}" alt="">`}
       </div>`
    : '';

  const taglineWideClass = card.media ? '' : ' is-wide';

  const relItems = [];
  if (card.parentId && CARDS.has(card.parentId)) {
    relItems.push({ label: 'Replying to', id: card.parentId, title: CARDS.get(card.parentId).title });
  }
  (rel.references || []).forEach(id => {
    const c = CARDS.get(id);
    if (c) relItems.push({ label: 'References', id, title: c.title });
  });
  (rel.updates || []).forEach(id => {
    const c = CARDS.get(id);
    if (c) relItems.push({ label: 'Updates', id, title: c.title });
  });

  const relBlock = relItems.length
    ? `<div class="statement-relations">
         <h4>Related</h4>
         <ul>${relItems.map(r => `<li>${escapeHtml(r.label)}: <a data-nav-card="${escapeHtml(r.id)}">${escapeHtml(r.title)}</a></li>`).join('')}</ul>
       </div>`
    : '';

  const hintText = relItems.length
    ? `Threads and responses follow beneath this ${escapeHtml(typeLabel.toLowerCase())}`
    : `End of ${escapeHtml(typeLabel.toLowerCase())} · ${escapeHtml(p.source)}`;

  return `
    <div class="letter-bento">
      <div class="letter-bento-cell">
        <div class="letter-bento-kicker">Name / Role</div>
        <div class="letter-bento-value">${escapeHtml(p.author)}</div>
        <div class="letter-bento-value is-sub">${escapeHtml(typeLabel)} · ${escapeHtml(card.section || card.clusterId || 'record')}</div>
      </div>
      <div class="letter-bento-cell">
        <div class="letter-bento-kicker">Discipline</div>
        <div class="letter-bento-value">${escapeHtml(typeLabel.toUpperCase())}</div>
      </div>
      <div class="letter-bento-cell">
        <div class="letter-bento-kicker">Status</div>
        <div class="letter-bento-value is-sub">Provenance</div>
        <div class="letter-bento-status" data-status="${escapeHtml(p.status)}">${escapeHtml(p.status)}</div>
      </div>
      <div class="letter-bento-cell">
        <div class="letter-bento-kicker">Record</div>
        <div class="letter-bento-num">${refCount}</div>
        <div class="letter-bento-kicker">${refCount === 1 ? 'Reference' : 'References'}</div>
      </div>
      <div class="letter-bento-cell${taglineWideClass}">
        <div class="letter-bento-kicker">Tagline</div>
        <div class="letter-bento-value is-quote">"${escapeHtml(card.deck)}"</div>
      </div>
      ${mediaCellHTML}
    </div>
    <div class="letter-bento-hint">${hintText}</div>
    ${relBlock}
  `;
}

function renderStatementBody(card) {
  const media = card.media ? `
    <div class="swiss-col swiss-col-span-10">
      <div class="statement-media">
        ${card.media.k === 'video'
          ? `<video src="${escapeHtml(card.media.src)}" controls playsinline muted loop preload="metadata"></video>`
          : `<img src="${escapeHtml(card.media.src)}" alt="">`}
      </div>
    </div>` : '';

  const rels = [];
  if (card.parentId && CARDS.has(card.parentId)) {
    rels.push(`<li>↩ Replying to <a data-nav-card="${escapeHtml(card.parentId)}">${escapeHtml(CARDS.get(card.parentId).title)}</a></li>`);
  }
  (card.relationships.references || []).forEach(id => {
    const c = CARDS.get(id);
    if (c) rels.push(`<li>→ References <a data-nav-card="${escapeHtml(id)}">${escapeHtml(c.title)}</a></li>`);
  });
  (card.relationships.updates || []).forEach(id => {
    const c = CARDS.get(id);
    if (c) rels.push(`<li>△ Updates <a data-nav-card="${escapeHtml(id)}">${escapeHtml(c.title)}</a></li>`);
  });
  const relBlock = rels.length ? `
    <div class="swiss-col swiss-col-span-10">
      <div class="statement-relations">
        <h4>Related</h4>
        <ul>${rels.join('')}</ul>
      </div>
    </div>` : '';

  return `
    <div class="swiss-grid">
      ${media}
      <div class="swiss-col swiss-col-span-9">
        <div class="letter-body"><p>${escapeHtml(card.deck)}</p></div>
      </div>
      ${relBlock}
    </div>
  `;
}

function renderClusterReaderBody(card) {
  const cl = CLUSTERS.get(card.id);
  if (!cl || !cl.cardIds.length) {
    return `
      <div class="swiss-grid">
        <div class="swiss-col swiss-col-span-9">
          <div class="letter-body"><p>Nothing filed here yet.</p></div>
        </div>
      </div>`;
  }
  const tiles = cl.cardIds.map(id => {
    const c = CARDS.get(id);
    if (!c) return '';
    return `
      <button class="cluster-reader-tile" data-nav-card="${escapeHtml(c.id)}" type="button">
        <div class="cluster-reader-tile-head">
          <span class="cluster-reader-tile-type">${escapeHtml(cardTypeLabel(c.type))}</span>
          <span class="cluster-reader-tile-status" data-status="${escapeHtml(c.provenance.status)}">${escapeHtml(c.provenance.status)}</span>
        </div>
        <div class="cluster-reader-tile-title">${escapeHtml(c.title)}</div>
        <div class="cluster-reader-tile-deck">${escapeHtml(c.deck)}</div>
        <div class="cluster-reader-tile-date">${escapeHtml(formatDateShort(c.provenance.date))}</div>
      </button>`;
  }).join('');
  return `
    <div class="swiss-grid">
      <div class="swiss-col swiss-col-span-9">
        <div class="letter-body"><p>${escapeHtml(cl.deck)}</p></div>
      </div>
      <div class="swiss-col swiss-col-span-12">
        <div class="cluster-reader-toolbar">
          <span class="cluster-reader-count">${cl.cardIds.length} card${cl.cardIds.length === 1 ? '' : 's'}</span>
          <button class="btn ghost" data-browse-gallery="${escapeHtml(cl.id)}" type="button">Browse as gallery →</button>
        </div>
        <div class="cluster-reader-grid">${tiles}</div>
      </div>
    </div>`;
}

function renderReaderCard(card, index, total) {
  const panel = document.createElement('div');
  panel.className = 'letter-panel' + (index === activeIndex ? ' active' : '');
  panel.dataset.index = String(index);
  panel.dataset.cardId = card.id;
  panel.dataset.type = card.type;

  const frame = document.createElement('div');
  let frameClass = 'letter-card-frame';
  if (card.type === 'cluster') frameClass += ' title-card-frame';
  else if (card.type === 'identity') frameClass += ' identity-card-frame';
  frame.className = frameClass;

  const useBento = isGeneralLetter(card);
  frame.appendChild(buildReaderCover(card, index, total, { hideDeck: useBento }));

  const toolbar = document.createElement('div');
  toolbar.className = 'letter-toolbar';
  const count = document.createElement('span');
  count.className = 'letter-count';
  count.textContent = (index + 1) + ' / ' + total;
  toolbar.appendChild(count);
  frame.appendChild(toolbar);

  const content = document.createElement('div');
  content.className = 'letter-content';
  if (card.fullContent) content.innerHTML = card.fullContent;
  else if (card.type === 'cluster') content.innerHTML = renderClusterReaderBody(card);
  else if (useBento) content.innerHTML = renderLetterBentoBody(card);
  else content.innerHTML = renderStatementBody(card);
  frame.appendChild(content);

  content.querySelectorAll('.letter-bento-media video').forEach(v => {
    v.muted = true;
    const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
    if (isTouch) {
      const io = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (en.isIntersecting && en.intersectionRatio >= 0.5) v.play().catch(()=>{});
          else v.pause();
        });
      }, { threshold: [0, 0.5, 1] });
      io.observe(v);
    } else {
      const cell = v.closest('.letter-bento-media') || v;
      cell.addEventListener('mouseenter', () => v.play().catch(()=>{}));
      cell.addEventListener('mouseleave', () => { v.pause(); v.currentTime = 0; });
    }
  });

  content.querySelectorAll('[data-nav-card]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      const targetId = el.getAttribute('data-nav-card');
      const idx = readerCards.findIndex(c => c.id === targetId);
      if (idx >= 0) activatePanel(idx);
      else openReader(targetId);
    });
  });

  content.querySelectorAll('[data-browse-gallery]').forEach(b => {
    b.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      navigate({ mode: 'gallery', scope: b.getAttribute('data-browse-gallery') });
    });
  });

  content.querySelectorAll('.index-row-link').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      const cid = a.getAttribute('data-cluster-id');
      if (cid) openReader(cid);
    });
  });

  panel.appendChild(frame);
  panel.addEventListener('click', e => {
    if (closestSafe(e.target, 'button, a, video, .letter-accordion-trigger, [data-nav-card], .index-row-link')) return;
    if (index !== activeIndex) activatePanel(index);
  });

  return panel;
}

function renderTrack() {
  const track = document.getElementById('lettersTrack');
  track.innerHTML = '';
  readerCards.forEach((card, i) => track.appendChild(renderReaderCard(card, i, readerCards.length)));
  bindInteractions(track);
  updateNavCounter(activeIndex + 1, readerCards.length);
  updateBorderProgress();
}

function updateNavCounter(c, t) {
  const cur = document.getElementById('navCurrent');
  const tot = document.getElementById('navTotal');
  if (cur) cur.textContent = String(c);
  if (tot) tot.textContent = String(t);
}

function activatePanel(newIndex, updateHash) {
  if (newIndex < 0) newIndex = readerCards.length - 1;
  if (newIndex >= readerCards.length) newIndex = 0;
  const panels = document.querySelectorAll('.letter-panel');
  panels.forEach(p => p.classList.remove('active'));
  activeIndex = newIndex;
  if (panels[activeIndex]) panels[activeIndex].classList.add('active');
  scrollToPanel(activeIndex, true);
  updateBorderProgress();
  updateNavCounter(activeIndex + 1, readerCards.length);
  if (updateHash !== false) {
    const card = readerCards[activeIndex];
    if (card) navigate({ mode: 'reader', cardId: card.id }, true);
  }
}

function scrollToPanel(index, smooth) {
  const panel = document.querySelectorAll('.letter-panel')[index];
  if (!panel) return;
  const track = document.getElementById('lettersTrack');
  const tr = track.getBoundingClientRect();
  const pr = panel.getBoundingClientRect();
  const delta = pr.left + pr.width / 2 - (tr.left + tr.width / 2);
  track.scrollTo({ left: track.scrollLeft + delta, behavior: smooth ? 'smooth' : 'auto' });
}

function bindInteractions(container) {
  container.querySelectorAll('.letter-accordion-trigger').forEach(t => {
    t.removeEventListener('click', handleAccordion);
    t.addEventListener('click', handleAccordion);
  });
  container.querySelectorAll('.letter-never-toggle button').forEach(b => {
    b.removeEventListener('click', handleNeverToggle);
    b.addEventListener('click', handleNeverToggle);
  });
}
function handleAccordion(e) {
  const trig = e.currentTarget;
  const item = trig.closest('.letter-accordion-item');
  if (!item) return;
  const open = item.classList.toggle('is-open');
  trig.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function handleNeverToggle(e) {
  const btn = e.currentTarget;
  const group = btn.closest('.letter-never-toggle');
  if (!group) return;
  const list = group.parentElement.querySelector('.letter-never-list');
  if (!list) return;
  const mode = btn.dataset.neverMode;
  list.classList.toggle('is-numbered', mode === 'numbered');
  list.classList.toggle('is-bulleted', mode === 'bulleted');
  group.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
}

/* ═══════════════════════════════════════════════════════════
   NODE INTERACTION (canvas)
   ═══════════════════════════════════════════════════════════ */
function handleNodeTap(node, target) {
  if (closestSafe(target, '.cluster-browse-all')) {
    const cid = closestSafe(target, '.cluster-browse-all').dataset.clusterId;
    navigate({ mode: 'gallery', scope: cid });
    return;
  }
  if (closestSafe(target, '.cluster-collapse-chip')) { toggleCluster(node.dataset.clusterId); return; }
  if (closestSafe(target, '.cluster-peek-hit')) { toggleCluster(node.dataset.clusterId); return; }
  const leaf = closestSafe(target, '.cluster-leaf');
  if (leaf) { openReader(leaf.dataset.cardId); return; }
  if (closestSafe(target, '.index-row')) {
    const cid = closestSafe(target, '.index-row').dataset.clusterId;
    if (cid) openReader(cid);
    return;
  }
  if (node.dataset.kind === 'identity') { openReader('identity'); return; }
  if (node.dataset.kind === 'index') { openReader('index'); return; }
  if (node.dataset.kind === 'cluster') {
    openReader(node.dataset.clusterId);
  }
}

function attachNodeHandlers(node) {
  let dragState = null;
  node.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    if (canvasLayout === 'array') return;
    // Interactive elements inside expanded clusters (leaves, the browse-all
    // button, the collapse chip) handle their own native clicks. Letting them
    // fall through here means the drag pipeline never preventDefaults or
    // captures the pointer, so their click events fire reliably.
    if (closestSafe(e.target, '.cluster-leaf, .cluster-browse-all, .cluster-collapse-chip')) return;
    if (e.pointerType === 'touch') {
      const sx = e.clientX, sy = e.clientY, target = e.target;
      const onUp = ev => {
        if (ev.pointerId !== e.pointerId) return;
        node.removeEventListener('pointerup', onUp);
        node.removeEventListener('pointercancel', onUp);
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 10) handleNodeTap(node, target);
      };
      node.addEventListener('pointerup', onUp);
      node.addEventListener('pointercancel', onUp);
      return;
    }
    dragState = {
      startX: e.clientX, startY: e.clientY,
      startLeft: parseFloat(node.style.left) || 0,
      startTop: parseFloat(node.style.top) || 0,
      origTarget: e.target, moved: false, pointerId: e.pointerId
    };
    try { node.setPointerCapture(e.pointerId); } catch(err){}
    node.classList.add('dragging');
    node.style.zIndex = String(++topZ);
    e.preventDefault();
    e.stopPropagation();
  });
  node.addEventListener('pointermove', e => {
    if (!dragState || e.pointerId !== dragState.pointerId) return;
    if (canvasLayout === 'array') return;
    if (node.classList.contains('is-expanded')) return;
    const dx = (e.clientX - dragState.startX) / scale;
    const dy = (e.clientY - dragState.startY) / scale;
    if (!dragState.moved && Math.hypot(dx * scale, dy * scale) > 4) {
      dragState.moved = true;
      document.body.classList.add('dragging-node');
    }
    if (!dragState.moved) return;
    const x = dragState.startLeft + dx;
    const y = dragState.startTop + dy;
    node.style.left = x + 'px';
    node.style.top = y + 'px';
    const mmEl = minimapNodeEls.get(node.dataset.nodeId);
    if (mmEl) { mmEl.style.left = x + 'px'; mmEl.style.top = y + 'px'; }
  });
  const endDrag = e => {
    if (!dragState || (e && e.pointerId !== dragState.pointerId)) return;
    const state = dragState;
    dragState = null;
    node.classList.remove('dragging');
    document.body.classList.remove('dragging-node');
    try { node.releasePointerCapture(state.pointerId); } catch(err){}
    if (state.moved) {
      const nx = snapTo(parseFloat(node.style.left) || 0, getColPitch());
      const ny = snapTo(parseFloat(node.style.top) || 0, getRowPitch());
      node.style.left = nx + 'px';
      node.style.top = ny + 'px';
      restPositions.set(node.dataset.nodeId, { x: nx, y: ny });
      saveCanvasState();
      requestAnimationFrame(() => drawCanvasEdges());
      queueMinimapLayout();
      return;
    }
    handleNodeTap(node, state.origTarget);
  };
  node.addEventListener('pointerup', endDrag);
  node.addEventListener('pointercancel', endDrag);
}

function toggleCluster(id) {
  if (!id) return;
  if (canvasLayout === 'array') return;
  const wasExpanded = expandedClusters.has(id);

  if (!wasExpanded) {
    const others = Array.from(expandedClusters).filter(other => other !== id);
    others.forEach(otherId => {
      expandedClusters.delete(otherId);
      const otherNode = document.querySelector(`.canvas-node[data-cluster-id="${CSS.escape(otherId)}"]`);
      if (!otherNode) return;
      const otherStack = otherNode.querySelector('.cluster-stack');
      if (otherStack) otherStack.dataset.expanded = 'false';
      otherNode.classList.remove('is-expanded');
    });
    expandedClusters.add(id);
  } else {
    expandedClusters.delete(id);
  }

  const node = document.querySelector(`.canvas-node[data-cluster-id="${CSS.escape(id)}"]`);
  if (node) {
    const stack = node.querySelector('.cluster-stack');
    if (stack) stack.dataset.expanded = wasExpanded ? 'false' : 'true';
    node.classList.toggle('is-expanded', !wasExpanded);
  }
  applyFocus();
  saveCanvasState();
  if (isMobile()) {
    if (focusedNodeId !== id) focusedNodeId = id;
    requestAnimationFrame(() => { reflowMobileColumn(); fitToFocus(); drawCanvasEdges(); queueMinimapLayout(); });
  } else {
    setTimeout(() => { drawCanvasEdges(); queueMinimapLayout(); }, 360);
  }
}

function collapseAllClusters() {
  if (expandedClusters.size === 0) return false;
  expandedClusters.clear();
  document.querySelectorAll('.cluster-stack').forEach(s => s.dataset.expanded = 'false');
  document.querySelectorAll('.canvas-node[data-kind="cluster"]').forEach(n => n.classList.remove('is-expanded'));
  applyFocus();
  saveCanvasState();
  setTimeout(() => { drawCanvasEdges(); queueMinimapLayout(); }, 360);
  return true;
}

/* ═══════════════════════════════════════════════════════════
   CANVAS PAN / PINCH
   ═══════════════════════════════════════════════════════════ */
const canvasPointers = new Map();
let canvasPanState = null, canvasPinchState = null;

function attachCanvasHandlers() {
  const root = document.getElementById('canvasRoot');
  if (!root || root.dataset.bound === '1') return;
  root.dataset.bound = '1';
  root.addEventListener('pointerdown', e => {
    if (closestSafe(e.target, '.canvas-widget, .canvas-context-menu, .canvas-minimap, .canvas-zoomhud, .browse-widget')) return;
    if (e.pointerType !== 'touch' && closestSafe(e.target, '.canvas-node')) return;
    if (e.button !== 0 && e.button !== 1) return;
    if (e.pointerType === 'touch' && closestSafe(e.target, '.canvas-node') && canvasPointers.size === 0) return;
    canvasPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { root.setPointerCapture(e.pointerId); } catch(err){}
    if (canvasPointers.size === 1) {
      canvasPanState = {
        startX: e.clientX, startY: e.clientY,
        startPanX: panOffset.x, startPanY: panOffset.y,
        pointerId: e.pointerId, moved: false, button: e.button
      };
      root.classList.add('panning');
    } else if (canvasPointers.size === 2) {
      canvasPanState = null;
      const [p1, p2] = [...canvasPointers.values()];
      canvasPinchState = {
        startDist: Math.hypot(p2.x - p1.x, p2.y - p1.y),
        startScale: scale, startPanX: panOffset.x, startPanY: panOffset.y,
        focalX: (p1.x + p2.x) / 2, focalY: (p1.y + p2.y) / 2
      };
    }
    e.preventDefault();
  });
  root.addEventListener('pointermove', e => {
    if (!canvasPointers.has(e.pointerId)) return;
    canvasPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (canvasPinchState && canvasPointers.size === 2) {
      const [p1, p2] = [...canvasPointers.values()];
      const nd = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      let ns = canvasPinchState.startScale * (nd / canvasPinchState.startDist);
      ns = Math.max(getMinScale(), Math.min(getMaxScale(), ns));
      const wx = (canvasPinchState.focalX - canvasPinchState.startPanX) / canvasPinchState.startScale;
      const wy = (canvasPinchState.focalY - canvasPinchState.startPanY) / canvasPinchState.startScale;
      panOffset.x = canvasPinchState.focalX - wx * ns;
      panOffset.y = canvasPinchState.focalY - wy * ns;
      scale = ns;
      applyPanTransform();
      return;
    }
    if (canvasPanState && e.pointerId === canvasPanState.pointerId) {
      const dx = e.clientX - canvasPanState.startX;
      const dy = e.clientY - canvasPanState.startY;
      if (!canvasPanState.moved && Math.hypot(dx, dy) > 4) canvasPanState.moved = true;
      panOffset.x = canvasPanState.startPanX + dx;
      panOffset.y = canvasPanState.startPanY + dy;
      applyPanTransform();
    }
  });
  const endP = e => {
    if (!canvasPointers.has(e.pointerId)) return;
    canvasPointers.delete(e.pointerId);
    if (canvasPinchState) {
      if (canvasPointers.size < 2) {
        canvasPinchState = null;
        if (canvasPointers.size === 1) {
          const [id, p] = [...canvasPointers.entries()][0];
          canvasPanState = {
            startX: p.x, startY: p.y, startPanX: panOffset.x, startPanY: panOffset.y,
            pointerId: id, moved: true, button: 0
          };
        } else {
          root.classList.remove('panning');
        }
      }
    } else if (canvasPanState && e.pointerId === canvasPanState.pointerId) {
      root.classList.remove('panning');
      const didMove = canvasPanState.moved;
      if (!didMove && canvasPanState.button === 0 && expandedClusters.size > 0 && canvasLayout !== 'array') {
        collapseAllClusters();
      }
      if (didMove) saveCanvasState();
      canvasPanState = null;
    }
    try { root.releasePointerCapture(e.pointerId); } catch(err){}
  };
  root.addEventListener('pointerup', endP);
  root.addEventListener('pointercancel', endP);
  root.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const factor = Math.exp(-e.deltaY * 0.0025);
      zoomAt(scale * factor, e.clientX, e.clientY);
      return;
    }
    e.preventDefault();
    panOffset.x -= e.deltaX;
    panOffset.y -= e.deltaY;
    applyPanTransform();
  }, { passive: false });
  let lastTap = 0;
  root.addEventListener('pointerup', e => {
    if (e.pointerType !== 'touch') return;
    if (closestSafe(e.target, '.canvas-node')) return;
    const now = Date.now();
    if (now - lastTap < 300) {
      if (isMobile()) fitToFocus({ force: true });
      else fitCanvasToViewport();
      saveCanvasState();
      lastTap = 0;
    } else lastTap = now;
  });
}

function getFocusRect(id) {
  const surface = document.getElementById('canvasSurface');
  const node = surface && surface.querySelector(`.canvas-node[data-node-id="${CSS.escape(id)}"]`);
  if (!node) return null;
  const x = parseFloat(node.style.left) || 0;
  const y = parseFloat(node.style.top) || 0;
  const stack = node.querySelector('.cluster-stack');
  if (stack) return { x: x + stack.offsetLeft, y: y + stack.offsetTop, w: stack.offsetWidth, h: stack.offsetHeight };
  return { x, y, w: node.offsetWidth, h: node.offsetHeight };
}

function focusNode(id, opts = {}) {
  if (!id) return;
  const valid = (id === 'identity' || id === 'index' || CLUSTER_ORDER.includes(id));
  if (!valid) return;
  const changed = focusedNodeId !== id;
  focusedNodeId = id;
  if (changed || opts.force) { updateMobileHud(); saveCanvasState(); }
  if (isMobile() && opts.autoFit !== false) requestAnimationFrame(() => fitToFocus());
}

function fitToFocus(opts = {}) {
  if (!isMobile()) return;
  const rect = getFocusRect(focusedNodeId);
  if (!rect) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const topbarH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--topbar-height')) || 56;
  const hudReserve = 80;
  const padSide = 28, padVert = 14;
  const sLeft = rect.x * scale + panOffset.x;
  const sTop = rect.y * scale + panOffset.y;
  const sRight = (rect.x + rect.w) * scale + panOffset.x;
  const sBottom = (rect.y + rect.h) * scale + panOffset.y;
  const fits = sLeft >= padSide && sTop >= topbarH + padVert && sRight <= vw - padSide && sBottom <= vh - hudReserve - padVert;
  if (fits && !opts.force) return;
  const availW = vw - padSide * 2;
  const availH = vh - topbarH - hudReserve - padVert * 2;
  const cardW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-w')) || 172;
  const twoColW = cardW * 2 + 8;
  const targetW = isMobile() ? Math.max(rect.w, twoColW) : rect.w;
  let ns = Math.min(availW / targetW, availH / rect.h);
  ns = Math.max(getMinScale(), Math.min(getMaxScale(), ns));
  const cx = rect.x + rect.w / 2;
  const cy = rect.y + rect.h / 2;
  tweenCamera(ns, vw / 2 - cx * ns, (topbarH + vh - hudReserve) / 2 - cy * ns, 360);
}

/* ═══════════════════════════════════════════════════════════
   MOBILE HUDs
   ═══════════════════════════════════════════════════════════ */
function updateMobileHud() {
  const hc = document.getElementById('hudCanvas');
  if (hc && !hc.hidden) {
    const order = getNodeOrder();
    const idx = Math.max(0, order.indexOf(focusedNodeId));
    const id = order[idx];
    const path = document.getElementById('hudCanvasPath');
    const idxEl = document.getElementById('hudCanvasIdx');
    if (path && idxEl) {
      path.innerHTML = '';
      const label = id === 'identity' ? 'All Sections' : id === 'index' ? 'Index' : (CLUSTERS.get(id)?.title || id);
      if (id !== 'identity') {
        const parent = document.createElement('span');
        parent.className = 'notif-crumb-parent';
        parent.textContent = 'Sections';
        path.appendChild(parent);
        const sep = document.createElement('span');
        sep.className = 'notif-sep';
        sep.textContent = '›';
        path.appendChild(sep);
      }
      const cur = document.createElement('span');
      cur.className = 'notif-crumb';
      cur.textContent = label;
      path.appendChild(cur);
      idxEl.textContent = (idx + 1) + '/' + order.length;
    }
  }

  const hg = document.getElementById('hudGallery');
  if (hg && !hg.hidden) {
    const path = document.getElementById('hudGalleryPath');
    const idxEl = document.getElementById('hudGalleryIdx');
    if (path && idxEl) {
      path.innerHTML = '';
      if (currentRoute.scope) {
        const cl = CLUSTERS.get(currentRoute.scope);
        const parent = document.createElement('span');
        parent.className = 'notif-crumb-parent';
        parent.textContent = 'Section';
        path.appendChild(parent);
        const sep = document.createElement('span');
        sep.className = 'notif-sep';
        sep.textContent = '›';
        path.appendChild(sep);
        const cur = document.createElement('span');
        cur.className = 'notif-crumb';
        cur.textContent = cl ? cl.title : currentRoute.scope;
        path.appendChild(cur);
      } else {
        const cur = document.createElement('span');
        cur.className = 'notif-crumb';
        cur.textContent = 'Gallery';
        path.appendChild(cur);
      }
      const cards = getScopedCards();
      idxEl.textContent = cards.length + '/' + getTotalCardCount();
    }
  }
}

function stepMobileHud(delta) {
  const order = getNodeOrder();
  const idx = Math.max(0, order.indexOf(focusedNodeId));
  let next = idx + delta;
  if (next < 0) next = order.length - 1;
  if (next >= order.length) next = 0;
  focusNode(order[next], { autoFit: true, force: true });
}

function stepGalleryScope(delta) {
  const order = [null, ...CLUSTER_ORDER];
  const cur = currentRoute.scope || null;
  const idx = order.indexOf(cur);
  let next = idx + delta;
  if (next < 0) next = order.length - 1;
  if (next >= order.length) next = 0;
  if (order[next] === null) navigate({ mode: 'gallery', scope: null });
  else navigate({ mode: 'gallery', scope: order[next] });
}

function queueMinimapLayout() {
  if (minimapLayoutQueued) return;
  minimapLayoutQueued = true;
  requestAnimationFrame(() => { minimapLayoutQueued = false; updateMinimapLayout(); });
}

  if (minimapLayoutQueued || minimapFrameQueued) return;
  minimapFrameQueued = true;
  requestAnimationFrame(() => { minimapFrameQueued = false; updateMinimapFrame(); });
}
function updateMinimapLayout() {
  const mm = document.getElementById('canvasMinimap');
  const content = document.getElementById('minimapContent');
  const viewport = document.getElementById('minimapViewport');
  if (!mm || mm.hidden || !content || !viewport) return;
  const nodes = [...document.querySelectorAll('.canvas-node')];
  if (!nodes.length) { content.style.transform = ''; minimapNodeEls.clear(); minimapBounds = null; return; }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const nd = nodes.map(n => {
    const x = parseFloat(n.style.left) || 0, y = parseFloat(n.style.top) || 0;
    const w = n.offsetWidth, h = n.offsetHeight;
    if (x < minX) minX = x; if (y < minY) minY = y;
    if (x + w > maxX) maxX = x + w; if (y + h > maxY) maxY = y + h;
    return { el: n, x, y, w, h };
  });
  const pad = 80;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const worldW = Math.max(1, maxX - minX);
  const worldH = Math.max(1, maxY - minY);
  const mmW = viewport.clientWidth || 220, mmH = viewport.clientHeight || 140;
  const innerPad = 6;
  const usableW = mmW - innerPad * 2, usableH = mmH - innerPad * 2;
  const mmScale = Math.min(usableW / worldW, usableH / worldH);
  const offsetX = innerPad + (usableW - worldW * mmScale) / 2;
  const offsetY = innerPad + (usableH - worldH * mmScale) / 2;
  minimapBounds = { minX, minY, maxX, maxY, scale: mmScale, offsetX, offsetY };
  const seen = new Set();
  nd.forEach(n => {
    const id = n.el.dataset.nodeId;
    seen.add(id);
    let el = minimapNodeEls.get(id);
    if (!el) {
      el = document.createElement('div');
      el.className = 'minimap-node';
      minimapNodeEls.set(id, el);
      content.appendChild(el);
    }
    el.dataset.kind = n.el.dataset.kind || 'card';
    el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
    el.style.width = n.w + 'px'; el.style.height = n.h + 'px';
  });
  minimapNodeEls.forEach((el, id) => { if (!seen.has(id)) { el.remove(); minimapNodeEls.delete(id); } });
  content.style.transform = `translate(${offsetX - minX * mmScale}px,${offsetY - minY * mmScale}px) scale(${mmScale})`;
  updateMinimapFrame();
}
function updateMinimapFrame() {
  const frame = document.getElementById('minimapFrame');
  if (!frame || !minimapBounds) return;
  const { scale: mmScale, offsetX, offsetY, minX, minY } = minimapBounds;
  const vw = window.innerWidth / scale, vh = window.innerHeight / scale;
  const wx = -panOffset.x / scale, wy = -panOffset.y / scale;
  frame.style.left = (offsetX + (wx - minX) * mmScale) + 'px';
  frame.style.top = (offsetY + (wy - minY) * mmScale) + 'px';
  frame.style.width = (vw * mmScale) + 'px';
  frame.style.height = (vh * mmScale) + 'px';
}
function minimapJump(clientX, clientY) {
  const vp = document.getElementById('minimapViewport');
  if (!vp || !minimapBounds) return;
  const rect = vp.getBoundingClientRect();
  const mx = clientX - rect.left, my = clientY - rect.top;
  const { scale: mmScale, offsetX, offsetY, minX, minY } = minimapBounds;
  const wx = (mx - offsetX) / mmScale + minX;
  const wy = (my - offsetY) / mmScale + minY;
  const vw = window.innerWidth, vh = window.innerHeight;
  const topbarH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--topbar-height')) || 72;
  panOffset.x = vw / 2 - wx * scale;
  panOffset.y = (vh + topbarH) / 2 - wy * scale;
  applyPanTransform();
}

    minimapVisible = stored === null ? !isMobile() : stored === '1';
  } catch(e){ minimapVisible = !isMobile(); }
  try {
    const pos = JSON.parse(localStorage.getItem(MINIMAP_POS_KEY) || 'null');
    if (pos && typeof pos.x === 'number') minimapPos = pos;
  } catch(e){}
  applyMinimapPos();
  mm.querySelector('.minimap-close').addEventListener('click', () => setMinimapVisible(false));
  const grip = mm.querySelector('.minimap-grip');
  grip.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const rect = mm.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY, sl = rect.left, st = rect.top;
    mm.style.right = 'auto'; mm.style.bottom = 'auto';
    mm.style.left = sl + 'px'; mm.style.top = st + 'px';
    try { grip.setPointerCapture(e.pointerId); } catch(err){}
    const onMove = ev => {
      if (ev.pointerId !== e.pointerId) return;
      const x = sl + (ev.clientX - sx), y = st + (ev.clientY - sy);
      const c = clampMinimapPos(x, y);
      mm.style.left = c.x + 'px'; mm.style.top = c.y + 'px';
      minimapPos = c;
    };
    const onUp = ev => {
      if (ev.pointerId !== e.pointerId) return;
      grip.removeEventListener('pointermove', onMove);
      grip.removeEventListener('pointerup', onUp);
      grip.removeEventListener('pointercancel', onUp);
      try { grip.releasePointerCapture(e.pointerId); } catch(err){}
      try { if (minimapPos) localStorage.setItem(MINIMAP_POS_KEY, JSON.stringify(minimapPos)); } catch(e){}
    };
    grip.addEventListener('pointermove', onMove);
    grip.addEventListener('pointerup', onUp);
    grip.addEventListener('pointercancel', onUp);
    e.preventDefault();
  });
  const vp = mm.querySelector('.minimap-viewport');
  let panState = null;
  vp.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    panState = { pointerId: e.pointerId };
    try { vp.setPointerCapture(e.pointerId); } catch(err){}
    vp.style.cursor = 'grabbing';
    minimapJump(e.clientX, e.clientY);
    e.preventDefault();
  });
  vp.addEventListener('pointermove', e => {
    if (!panState || e.pointerId !== panState.pointerId) return;
    minimapJump(e.clientX, e.clientY);
  });
  const end = e => {
    if (!panState || e.pointerId !== panState.pointerId) return;
    panState = null;
    vp.style.cursor = '';
    try { vp.releasePointerCapture(e.pointerId); } catch(err){}
    saveCanvasState();
  };
  vp.addEventListener('pointerup', end);
  vp.addEventListener('pointercancel', end);
}

/* ═══════════════════════════════════════════════════════════
   CANVAS ACTIONS
   ═══════════════════════════════════════════════════════════ */
function setCanvasLayout(layout) {
  if (!layout) return;
  if (layout === canvasLayout && layout !== 'array') return;
  if (layout === 'array') {
    canvasLayout = 'array';
    document.body.dataset.layout = 'array';
    CLUSTER_ORDER.forEach(id => expandedClusters.add(id));
    document.querySelectorAll('.cluster-stack').forEach(s => s.dataset.expanded = 'true');
    document.querySelectorAll('.canvas-node[data-kind="cluster"]').forEach(n => n.classList.add('is-expanded'));
    applyFocus();
    updateContextMenuBrowseState();
    updateStatusText();
    requestAnimationFrame(() => {
      requestAnimationFrame(() => packArray());
    });
    return;
  }
  expandedClusters.clear();
  document.querySelectorAll('.cluster-stack').forEach(s => s.dataset.expanded = 'false');
  document.querySelectorAll('.canvas-node[data-kind="cluster"]').forEach(n => n.classList.remove('is-expanded'));
  canvasLayout = 'grid';
  document.body.dataset.layout = 'grid';
  restPositions.clear();
  const specs = getCanvasNodes();
  const computed = getLayoutPositions('grid', specs);
  setTimeout(() => {
    specs.forEach(s => {
      const pos = computed[s.id] || { x: 0, y: 0 };
      restPositions.set(s.id, { x: pos.x, y: pos.y });
      const n = document.querySelector(`.canvas-node[data-node-id="${CSS.escape(s.id)}"]`);
      if (n) { n.style.left = pos.x + 'px'; n.style.top = pos.y + 'px'; }
    });
    if (isMobile()) reflowMobileColumn();
    else refineIdentityIndexStack();
    applyFocus(); updateContextMenuBrowseState(); updateStatusText();
    setTimeout(() => { fitCanvasToViewport(); saveCanvasState(); drawCanvasEdges(); queueMinimapLayout(); }, 400);
  }, 20);
}

function fitCanvas() {
  if (isMobile()) fitToFocus({ force: true });
  else fitCanvasToViewport();
  saveCanvasState();
}

/* ═══════════════════════════════════════════════════════════
   APPEARANCE / THEME
   ═══════════════════════════════════════════════════════════ */
function applyTheme(theme) {
  document.body.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
  try { localStorage.setItem(THEME_STORAGE_KEY, theme); } catch(e){}
}
function setupAppearanceDropdown() {
  const trigger = document.getElementById('appearanceTrigger');
  const dropdown = document.getElementById('appearanceDropdown');
  if (!trigger || !dropdown) return;
  const themes = [{ id:'light', label:'Light' }, { id:'dark', label:'Dark' }];
  function cur() { return document.body.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
  function renderMenu() {
    const c = cur();
    dropdown.innerHTML = '';
    themes.forEach(t => {
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'menu-item' + (t.id === c ? ' active' : '');
      item.textContent = t.label;
      item.addEventListener('click', e => {
        e.stopPropagation();
        applyTheme(t.id);
        renderMenu();
        dropdown.classList.remove('open');
        trigger.setAttribute('aria-expanded', 'false');
      });
      dropdown.appendChild(item);
    });
  }
  trigger.addEventListener('click', e => {
    e.stopPropagation();
    const isOpen = dropdown.classList.contains('open');
    dropdown.classList.remove('open');
    trigger.setAttribute('aria-expanded', 'false');
    if (!isOpen) {
      renderMenu();
      dropdown.classList.add('open');
      trigger.setAttribute('aria-expanded', 'true');
      const r = trigger.getBoundingClientRect();
      const pr = dropdown.getBoundingClientRect();
      let top = r.bottom + 8;
      if (top + pr.height > window.innerHeight - 10) top = r.top - pr.height - 8;
      let left = r.right - pr.width;
      left = Math.max(10, Math.min(left, window.innerWidth - pr.width - 10));
      dropdown.style.top = top + 'px';
      dropdown.style.left = left + 'px';
    }
  });
  document.addEventListener('click', e => {
    if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.classList.remove('open');
      trigger.setAttribute('aria-expanded', 'false');
    }
  });
}
function setupGridToggle() {
  const t = document.getElementById('gridToggle');
  if (!t) return;
  t.addEventListener('click', () => {
    const on = document.body.classList.toggle('show-grid');
    t.classList.toggle('active', on);
  });
}

function goGalleryView(viewId) {
  if (browseMode !== 'gallery') {
    navigate({ mode: 'gallery', scope: currentRoute.scope || null, view: viewId });
  } else {
    galleryView = viewId;
    if (!currentRoute.scope) navigate({ mode: 'gallery', scope: null, view: galleryView }, true);
    else { renderGalleryView(); updateContextMenuBrowseState(); }
  }
}
function toggleGalleryFromMenu() {
  if (browseMode === 'gallery') navigate({ mode: 'canvas' });
  else navigate({ mode: 'gallery', scope: null, view: galleryView });
}

function closeContextMenu() {
  const m = document.getElementById('canvasContextMenu');
  if (m) { m.classList.remove('open'); m.hidden = true; }
}
function openContextMenu(x, y) {
  const m = document.getElementById('canvasContextMenu');
  if (!m) return;
  updateContextMenuBrowseState();
  m.hidden = false;
  m.style.left = '0px'; m.style.top = '0px';
  m.classList.add('open');
  const r = m.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 8) x = window.innerWidth - r.width - 8;
  if (y + r.height > window.innerHeight - 8) y = window.innerHeight - r.height - 8;
  if (x < 8) x = 8;
  if (y < 8) y = 8;
  m.style.left = x + 'px'; m.style.top = y + 'px';
}

  const canvas = document.getElementById('canvasRoot');
  const m = document.getElementById('canvasContextMenu');
  const gallery = document.getElementById('galleryRoot');
  if (!m) return;

  const openHandler = e => {
    if (closestSafe(e.target, '.canvas-widget, .canvas-context-menu, .canvas-minimap, .canvas-zoomhud, .browse-widget, .letter-card-frame')) return;
    e.preventDefault();
    openContextMenu(e.clientX, e.clientY);
  };
  if (canvas) canvas.addEventListener('contextmenu', openHandler);
  if (gallery) gallery.addEventListener('contextmenu', openHandler);

  document.addEventListener('pointerdown', e => {
    if (!m.classList.contains('open')) return;
    if (m.contains(e.target)) return;
    closeContextMenu();
  }, true);

  m.querySelectorAll('[data-canvas-layout]').forEach(b => b.addEventListener('click', () => {

  }));

  const closeBtn = document.getElementById('mobileSheetClose');

    requestAnimationFrame(() => { sheet.classList.add('open'); backdrop.classList.add('open'); });

  function closeSheet() {

    backdrop.classList.remove('open');

    h.addEventListener('click', () => {
