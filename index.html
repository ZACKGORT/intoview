/* ═══════════════════════════════════════════════════════════
   VIEWPORT BLUR
   ═══════════════════════════════════════════════════════════ */
function setupViewportBlur() {
  const top = document.getElementById('viewportBlurTop');
  const bot = document.getElementById('viewportBlurBottom');
  if (!top || !bot) return;
  function update() {
    const scrollY = window.scrollY || 0;
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    top.classList.toggle('scrolling', scrollY > 4);
    bot.classList.toggle('scrolling', scrollY < maxScroll - 4);
  }
  let ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { update(); ticking = false; });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  update();
}

/* ═══════════════════════════════════════════════════════════
   CUSTOM CURSOR
   ═══════════════════════════════════════════════════════════ */
function initWriteCursor() {
  const dot = document.getElementById('writeCursorDot');
  const ellipse = document.getElementById('writeCursorEllipse');
  const chevron = document.getElementById('writeCursorChevron');
  if (!dot || !ellipse || !chevron) return;
  if (window.matchMedia('(hover: none)').matches) return;
  const NATIVE = 'button, a, input, textarea, select, [role="button"], .canvas-node, .canvas-widget, .canvas-context-menu, .prov-card, .cluster-peek-hit, .canvas-minimap, .canvas-zoomhud, .hud-top-grip, .mobile-sheet, .flow-item, .list-card, .g-item, .prov-card-backlink, .cluster-browse-all, .letter-accordion-trigger, .cluster-reader-tile, .browse-widget';
  const ACCENT_SURFACE = '.prov-card[data-type="cluster"], .letter-card-frame.title-card-frame, .cluster-collapse-chip, .cluster-peek';
  const LIGHT_SURFACE = '.prov-card[data-type="identity"]';
  let px = 0, py = 0, prevX = 0, prevY = 0, init = false;
  let angle = 0, sx = 1, sy = 1, raf = null;
  function lerpAngle(cur, tgt, f) {
    const d = ((tgt - cur + 540) % 360) - 180;
    return cur + d * f;
  }
  function step() {
    if (!init) { prevX = px; prevY = py; init = true; }
    const dx = px - prevX, dy = py - prevY;
    prevX = px; prevY = py;
    const sp = Math.hypot(dx, dy);
    const tgt = sp > 0.4 ? Math.atan2(dy, dx) * 180 / Math.PI : angle;
    const stretch = Math.min(sp / 34, 1) * 0.6;
    angle = lerpAngle(angle, tgt, 0.22);
    sx += (1 + stretch - sx) * 0.22;
    sy += (1 - stretch * 0.45 - sy) * 0.22;
    ellipse.style.transform = 'translate(' + px + 'px,' + py + 'px) rotate(' + angle + 'deg) scale(' + sx + ',' + sy + ')';
    raf = requestAnimationFrame(step);
  }
  window.addEventListener('mousemove', e => {
    const el = (e.target && e.target.nodeType === 1) ? e.target : null;
    /* Detect whether the cursor is inside a reader prev/next hotspot. When it
       is, the cursor becomes the chevron and the fallback circle markers go
       away (see CSS). This is the primary indicator path. */
    const overPrev = !!(el && el.closest && el.closest('.letter-hotspot-prev'));
    const overNext = !!(el && el.closest && el.closest('.letter-hotspot-next'));
    const chevronMode = overPrev || overNext;

    const overNative = !chevronMode && !!(el && el.closest && el.closest(NATIVE));
    const overAccent = !chevronMode && !!(el && el.closest && el.closest(ACCENT_SURFACE));
    const overLight = !chevronMode && !overAccent && !!(el && el.closest && el.closest(LIGHT_SURFACE));

    document.body.classList.add('custom-cursor-active');
    document.body.classList.toggle('write-native-cursor', overNative);
    document.body.classList.toggle('cursor-on-accent', overAccent);
    document.body.classList.toggle('cursor-on-light', overLight);
    document.body.classList.toggle('cursor-chevron-prev', overPrev);
    document.body.classList.toggle('cursor-chevron-next', overNext);

    px = e.clientX; py = e.clientY;
    dot.style.transform = 'translate(' + px + 'px,' + py + 'px)';
    chevron.style.transform = 'translate(' + px + 'px,' + py + 'px)';

    dot.classList.toggle('visible', !chevronMode);
    ellipse.classList.toggle('visible', !chevronMode);
    chevron.classList.toggle('visible', chevronMode);

    if (!raf) raf = requestAnimationFrame(step);
  });
  document.addEventListener('mouseleave', () => {
    dot.classList.remove('visible');
    ellipse.classList.remove('visible');
    chevron.classList.remove('visible');
    document.body.classList.remove(
      'write-native-cursor','custom-cursor-active','cursor-on-accent','cursor-on-light',
      'cursor-chevron-prev','cursor-chevron-next'
    );
    if (raf) { cancelAnimationFrame(raf); raf = null; }
  });
}

/* ═══════════════════════════════════════════════════════════
   KEYBOARD
   ═══════════════════════════════════════════════════════════ */
function closeAnyChrome() {
  const drop = document.getElementById('appearanceDropdown');
  if (drop && drop.classList.contains('open')) {
    drop.classList.remove('open');
    document.getElementById('appearanceTrigger').setAttribute('aria-expanded', 'false');
    return true;
  }
  const m = document.getElementById('canvasContextMenu');
  if (m && m.classList.contains('open')) { closeContextMenu(); return true; }
  const gm = document.getElementById('galleryContextMenu');
  if (gm && gm.classList.contains('open')) { closeGalleryContextMenu(); return true; }
  const sheet = document.getElementById('mobileSheet');
  if (sheet && sheet._isOpen && sheet._isOpen()) { sheet._closeSheet(); return true; }
  return false;
}

function escCascade() {
  if (closeAnyChrome()) return;
  if (currentRoute.mode === 'reader') { closeReader(); return; }
  if (browseMode === 'gallery' && currentRoute.scope) {
    navigate({ mode: 'gallery', scope: null, view: galleryView });
    return;
  }
  if (browseMode === 'gallery') { navigate({ mode: 'canvas' }); return; }
  if (browseMode === 'canvas' && expandedClusters.size > 0 && canvasLayout !== 'array') {
    collapseAllClusters();
  }
}

function setupKeyboard() {
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'Escape') { escCascade(); e.preventDefault(); return; }

    if (currentRoute.mode === 'reader') {
      if (e.key === 'ArrowLeft') { activatePanel(activeIndex - 1); e.preventDefault(); }
      if (e.key === 'ArrowRight') { activatePanel(activeIndex + 1); e.preventDefault(); }
      return;
    }
    if (browseMode === 'canvas') {
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { stepMobileHud(1); e.preventDefault(); }
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { stepMobileHud(-1); e.preventDefault(); }
      if (e.key === '=' || e.key === '+') { zoomStep(1); e.preventDefault(); }
      else if (e.key === '-' || e.key === '_') { zoomStep(-1); e.preventDefault(); }
      else if (e.key === '0') { zoomReset100(); e.preventDefault(); }
      else if (e.key === 'f' || e.key === 'F') { fitCanvas(); e.preventDefault(); }
    }
    if (e.key === 'g' && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const gt = document.getElementById('gridToggle');
      if (gt) gt.click();
      e.preventDefault();
    }
  });
}

/* ═══════════════════════════════════════════════════════════
   CAROUSEL INTERACTIONS
   ═══════════════════════════════════════════════════════════ */
function setupCarousel() {
  document.getElementById('hudPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
  document.getElementById('hudNext').addEventListener('click', () => activatePanel(activeIndex + 1));
  // Home button: jump to panel 0 of the current carousel — the provenance
  // card that leads it (cluster card for a section, identity/index card when
  // those are what's being read). Not a separate reader, just a slide back.
  document.getElementById('hudHome').addEventListener('click', () => activatePanel(0));
  document.getElementById('letterHotspotPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
  document.getElementById('letterHotspotNext').addEventListener('click', () => activatePanel(activeIndex + 1));

  const track = document.getElementById('lettersTrack');
  let isDragging = false, dragStartX = 0, dragStartScroll = 0;
  track.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;
    if (closestSafe(e.target, 'button, a, input, video, .letter-accordion-trigger, [data-nav-card], .index-row-link')) return;
    isDragging = true;
    dragStartX = e.clientX;
    dragStartScroll = track.scrollLeft;
    track.classList.add('dragging');
    try { track.setPointerCapture(e.pointerId); } catch(err){}
  });
  track.addEventListener('pointermove', e => {
    if (!isDragging) return;
    track.scrollLeft = dragStartScroll - (e.clientX - dragStartX);
  });
  const end = () => { isDragging = false; track.classList.remove('dragging'); };
  track.addEventListener('pointerup', end);
  track.addEventListener('pointercancel', end);

  let settleTimer = null;
  track.addEventListener('scroll', () => {
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => {
      const rect = track.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      let best = 0, bestDist = Infinity;
      Array.from(track.children).forEach((panel, i) => {
        const r = panel.getBoundingClientRect();
        const c = r.left + r.width / 2;
        const d = Math.abs(c - cx);
        if (d < bestDist) { bestDist = d; best = i; }
      });
      if (best !== activeIndex) {
        const panels = track.querySelectorAll('.letter-panel');
        panels.forEach(p => p.classList.remove('active'));
        activeIndex = best;
        if (panels[best]) panels[best].classList.add('active');
        updateBorderProgress();
        updateNavCounter(activeIndex + 1, readerCards.length);
        const card = readerCards[activeIndex];
        if (card) navigate({ mode: 'reader', cardId: card.id }, true);
      } else updateBorderProgress();
    }, 150);
  }, { passive: true });
}

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
function updateTopCount() {
  const el = document.getElementById('topCount');
  if (el) el.textContent = CLUSTER_ORDER.length + '§';
}

function init() {
  updateTopCount();

  try {
    const t = localStorage.getItem(THEME_STORAGE_KEY);
    if (t === 'light' || t === 'dark') document.body.setAttribute('data-theme', t);
  } catch(e){}

  setupWidget();
  setupMinimap();
  setupZoomHud();
  setupHudTop();
  setupBrowseWidget();

  setupViewportBlur();
  setupAppearanceDropdown();
  setupGridToggle();
  setupContextMenu();
  setupGalleryContextMenu();
  setupCarousel();
  setupKeyboard();
  buildMobileSheet();
  setupMobileSheet();
  initWriteCursor();

  document.getElementById('hudCanvasPrev').addEventListener('click', () => stepMobileHud(-1));
  document.getElementById('hudCanvasNext').addEventListener('click', () => stepMobileHud(1));
  document.getElementById('hudCanvasNotif').addEventListener('click', e => {
    e.stopPropagation();
    const sheet = document.getElementById('mobileSheet');
    if (sheet && sheet._openSheet) sheet._openSheet();
  });
  document.getElementById('hudGalleryPrev').addEventListener('click', () => stepGalleryScope(-1));
  document.getElementById('hudGalleryNext').addEventListener('click', () => stepGalleryScope(1));
  document.getElementById('hudGalleryNotif').addEventListener('click', e => {
    e.stopPropagation();
    const sheet = document.getElementById('mobileSheet');
    if (sheet && sheet._openSheet) sheet._openSheet();
  });

  document.getElementById('mobileBackBtn').addEventListener('click', escCascade);
  document.getElementById('wordmark').addEventListener('click', () => navigate({ mode: 'canvas' }));

  document.getElementById('topResetBtn').addEventListener('click', () => {
    if (!confirm('Reset everything?')) return;
    try { localStorage.removeItem(CANVAS_STORAGE_KEY); } catch(e){}
    canvasLayout = 'grid';
    expandedClusters.clear();
    restPositions.clear();
    focusedNodeId = 'identity';
    panOffset.x = 0; panOffset.y = 0; scale = 1;
    document.body.dataset.layout = 'grid';
    navigate({ mode: 'canvas' });
  });

  const saved = loadCanvasState();
  if (saved) {
    if (saved.layout === 'grid' || saved.layout === 'array') canvasLayout = saved.layout;
    document.body.dataset.layout = canvasLayout;
    if (Array.isArray(saved.expanded)) saved.expanded.forEach(id => expandedClusters.add(id));
    if (saved.focus && (saved.focus === 'identity' || saved.focus === 'index' || CLUSTER_ORDER.includes(saved.focus))) focusedNodeId = saved.focus;
    if (saved.pan) { panOffset.x = saved.pan.x; panOffset.y = saved.pan.y; }
    if (typeof saved.scale === 'number') scale = Math.max(getMinScale(), Math.min(getMaxScale(), saved.scale));
  }

  handleRoute();
  window.addEventListener('hashchange', handleRoute);

  let resizeTimer;
  let lastMobile = isMobile();
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const nowMobile = isMobile();
      const crossed = nowMobile !== lastMobile;
      lastMobile = nowMobile;
      if (browseMode === 'canvas' && currentRoute.mode !== 'reader') {
        if (canvasLayout === 'array') {
          if (crossed) restPositions.clear();
          packArray();
        } else if (crossed && nowMobile) {
          restPositions.clear();
          reflowMobileColumn();
          fitToFocus({ force: true });
        } else if (crossed && !nowMobile) {
          restPositions.clear();
          const specs = getCanvasNodes();
          const computed = getLayoutPositions(canvasLayout, specs);
          specs.forEach(s => {
            const pos = computed[s.id] || { x: 0, y: 0 };
            restPositions.set(s.id, { x: pos.x, y: pos.y });
            const n = document.querySelector(`.canvas-node[data-node-id="${CSS.escape(s.id)}"]`);
            if (n) { n.style.left = pos.x + 'px'; n.style.top = pos.y + 'px'; }
          });
          refineIdentityIndexStack();
          fitCanvasToViewport();
        } else if (nowMobile) {
          reflowMobileColumn();
          fitToFocus();
        } else {
          fitCanvasToViewport();
        }
        drawCanvasEdges();
        queueMinimapLayout();
      } else if (browseMode === 'gallery') {
        renderGalleryView();
      }
      if (browseWidgetPos) {
        const c = clampBrowseWidgetPos(browseWidgetPos.x, browseWidgetPos.y);
        browseWidgetPos = c;
        applyBrowseWidgetPos();
        try { localStorage.setItem(BROWSE_POS_KEY, JSON.stringify(browseWidgetPos)); } catch(e){}
      }
      applyBrowseWidgetVisibility();
      updateMobileHud();
    }, 220);
  });

  updateMobileHud();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
