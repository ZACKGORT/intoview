<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>intoview.pro · provenance</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='12' fill='%23E5E567'/%3E%3Ctext x='40' y='50' font-family='system-ui, -apple-system, sans-serif' font-size='28' font-weight='800' text-anchor='middle' fill='%231C1C1E' letter-spacing='-0.5'%3ECX%3C/text%3E%3C/svg%3E" />

    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2,3,4,5,6,7,8,9&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg: #f0f0f2;
            --fg: #1c1c1e;
            --fg-rgb: 28, 28, 30;
            --nav-bg-rgb: 240, 240, 242;
            --rule: rgba(0, 0, 0, .08);
            --faint: rgba(0, 0, 0, .04);
            --muted: rgba(0, 0, 0, .55);
            --accent: #E5E567;
            --card: #ffffff;
            --card-dark: #1c1c1e;
            --card-mid: #3a3a3c;
            --ink: #1c1c1e;
            --ink-mid: #3a3a3c;
            --ink-light: #8e8e93;
            --ink-lighter: #b0b0b6;
            --border: #e6e6e8;

            /* stacked cards sitting behind a cluster title card */
            --peek-bg: #dcdce1;
            --peek-border: rgba(28, 28, 30, .12);

            --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.02);
            --shadow-floating: 0 8px 32px rgba(0, 0, 0, 0.1);
            --radius: 1.5rem;
            --radius-sm: 0.65rem;
            --font: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            --fs-body: 15px;
            --max-width: 1600px;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --margin: 16px;
            --topbar-height: 56px;
            --hud-height: 64px;
            --scrollbar-height: 3px;
            --page-scale: 1;
            --l-sp-1: 8px; --l-sp-2: 16px; --l-sp-3: 24px;
            --l-sp-4: 32px; --l-sp-5: 40px; --l-sp-6: 56px;

            --swiss-columns: 12;
            --swiss-gap: 24px;
            --swiss-container-max: 1200px;
            --swiss-padding: 0px;
            --grid-outline: rgba(0, 160, 255, 0.45);
            --grid-fill: rgba(0, 160, 255, 0.06);
            --grid-gutter: rgba(0, 160, 255, 0.10);

            --impact-gain: #2F6B4F;
            --impact-loss: #C63A2A;
            --impact-accent: #8A7A1F;
        }
        @media (min-width: 640px) { :root { --margin: 24px; --topbar-height: 64px; --hud-height: 70px; } }
        @media (min-width: 1024px) { :root { --margin: 32px; --topbar-height: 72px; --hud-height: 76px; } }

        /* ═══════════════════════════════════════════════════════
           DARK THEME
           ═══════════════════════════════════════════════════════ */
        body[data-theme='dark'] {
            --bg: #1c1c1e;
            --fg: #ffffff;
            --fg-rgb: 255, 255, 255;
            --nav-bg-rgb: 28, 28, 30;
            --rule: rgba(255, 255, 255, .08);
            --faint: rgba(255, 255, 255, .04);
            --muted: rgba(255, 255, 255, .55);
            --card: #232325;
            --card-dark: #2c2c2e;
            --card-mid: #3a3a3c;
            --ink: #ffffff;
            --ink-mid: #b0b0b6;
            --ink-light: #8e8e93;
            --ink-lighter: #6e6e73;
            --border: rgba(255, 255, 255, .12);

            --peek-bg: #303032;
            --peek-border: rgba(255, 255, 255, .10);

            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-floating: 0 8px 32px rgba(0, 0, 0, 0.6);

            --impact-gain: #6FCF97;
            --impact-loss: #FF6B6B;
            --impact-accent: #E5E567;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }
        html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg); color: var(--fg); font-family: var(--font);
            font-size: var(--fs-body); line-height: 1.6;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            min-height: 100vh; min-height: 100dvh;
            padding-bottom: calc(var(--hud-height) + 20px + var(--scrollbar-height));
            overflow-x: hidden;
            transition: background 0.2s ease, color 0.2s ease;
        }
        ::selection { background: var(--accent); color: #1c1c1e; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--ink-lighter); border-radius: var(--radius-sm); }
        html { scrollbar-width: thin; scrollbar-color: var(--ink-lighter) transparent; }
        .letters-track::-webkit-scrollbar { display: none; }
        .letters-track { scrollbar-width: none; -ms-overflow-style: none; }

        .btn {
            font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.08em;
            text-transform: uppercase; background: transparent; border: 1px solid var(--border);
            color: var(--ink-mid); padding: 5px 12px; cursor: pointer;
            transition: all 0.2s ease; border-radius: var(--radius-sm); font-weight: 500;
            touch-action: manipulation; min-height: 30px; display: inline-flex;
            align-items: center; justify-content: center; white-space: nowrap; gap: 6px;
        }
        .btn:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
        .btn:active { transform: scale(0.96); }
        .btn.ghost { color: var(--ink-light); }
        .btn-grid {
            font-size: 9px; min-height: 32px; padding: 4px 10px;
            border-color: var(--border); color: var(--ink-light);
        }
        .btn-grid.active { background: var(--grid-outline); border-color: var(--grid-outline); color: white; }
        .btn-grid .dot-indicator { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.4; transition: opacity 0.2s ease; }
        .btn-grid.active .dot-indicator { opacity: 1; background: white; }

        .topbar {
            position: sticky; top: 0; z-index: 150; background: transparent;
            padding: 6px 0; min-height: var(--topbar-height); display: flex; align-items: center;
        }
        .topbar .wrap {
            display: flex; align-items: center; gap: 12px;
            padding: 0 var(--margin); max-width: var(--max-width);
            margin: 0 auto; width: 100%;
        }
        .wordmark {
            font-size: clamp(12px, 3.5vw, 20px); font-weight: 700; letter-spacing: -0.03em;
            display: flex; align-items: baseline; gap: 6px; color: var(--ink);
            flex-shrink: 0; cursor: pointer;
        }
        .wordmark .count {
            font-family: var(--font-mono); font-size: 8px; font-weight: 400;
            color: var(--ink-light); letter-spacing: 0.04em;
        }
        .topbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: auto; }
        .topbar-right .btn { font-size: 9px; min-height: 32px; padding: 4px 10px; }
        .topbar-appearance-wrapper { position: relative; display: flex; align-items: center; }

        .breadcrumb {
            display: flex; align-items: center; gap: 4px;
            font-family: var(--font-mono); font-size: 9px; letter-spacing: .06em;
            text-transform: uppercase; color: var(--ink-light);
            flex: 1; min-width: 0; overflow: hidden; padding: 0 4px;
        }
        .breadcrumb-item {
            background: none; border: none; padding: 3px 6px; cursor: pointer;
            font: inherit; color: var(--ink-light);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 220px; border-radius: 4px;
            transition: color .15s ease, background .15s ease;
        }
        .breadcrumb-item:hover { color: var(--ink); background: var(--faint); }
        .breadcrumb-item.is-current { color: var(--ink); font-weight: 600; cursor: default; }
        .breadcrumb-item.is-current:hover { background: none; }
        .breadcrumb-sep { color: var(--ink-lighter); opacity: .55; flex-shrink: 0; }
        @media (max-width: 640px) { .breadcrumb { display: none; } }

        .mobile-back {
            display: none;
            font-size: 9px; min-height: 32px; padding: 4px 10px;
            flex-shrink: 0;
        }
        @media (max-width: 640px) {
            .mobile-back:not([hidden]) { display: inline-flex; }
        }

        .viewport-blur {
            position: fixed; left: 0; right: 0; z-index: 40; pointer-events: none;
            backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
            transition: backdrop-filter 0.3s ease, background 0.4s ease;
        }
        .viewport-blur.scrolling { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(8px); }
        .viewport-blur-top {
            top: 0; height: calc(var(--topbar-height) + 36px);
            background: linear-gradient(to bottom, rgba(var(--nav-bg-rgb), 0.7), rgba(var(--nav-bg-rgb), 0));
            mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
        }
        .viewport-blur-bottom {
            bottom: 0; height: calc(var(--hud-height) + 60px);
            background: linear-gradient(to top, rgba(var(--nav-bg-rgb), 0.7), rgba(var(--nav-bg-rgb), 0));
            mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
        }

        /* ═══════════════════════════════════════════════════════
           CANVAS
           ═══════════════════════════════════════════════════════ */
        .canvas-root {
            position: fixed; inset: 0; z-index: 50; overflow: hidden;
            background: var(--bg);
            background-image: radial-gradient(circle, rgba(var(--fg-rgb), 0.07) 1px, transparent 1px);
            background-size: 24px 24px; background-position: 0 0;
            cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
        }
        .canvas-root.panning { cursor: grabbing; }
        .canvas-root.panning .canvas-node { pointer-events: none; }

        .canvas-surface {
            position: absolute; top: 0; left: 0; width: 0; height: 0;
            transform-origin: 0 0; will-change: transform;
        }
        .canvas-edges {
            position: absolute; top: 0; left: 0;
            width: 1px; height: 1px;
            overflow: visible; pointer-events: none; z-index: 0;
        }
        .canvas-edge {
            stroke: rgba(var(--fg-rgb), .18); stroke-width: 1;
            fill: none; stroke-dasharray: 2 4;
        }

        .canvas-node {
            position: absolute;
            cursor: grab; user-select: none; -webkit-user-select: none;
            transition:
                left 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.15s ease;
            will-change: left, top, transform;
        }
        .canvas-node.dragging {
            cursor: grabbing;
            transition: box-shadow 0.15s ease;
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.18), 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        .prov-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); box-shadow: var(--shadow);
            padding: 14px 16px 12px;
            display: flex; flex-direction: column; gap: 10px;
            width: 260px; min-height: 140px;
            cursor: pointer; position: relative; overflow: hidden;
            transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease;
        }
        .prov-card:hover { box-shadow: var(--shadow-hover); }
        .canvas-node:not(.dragging):hover .prov-card { transform: translateY(-2px); }

        .prov-card-kicker {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            font-family: var(--font-mono); font-size: 8px; font-weight: 600;
            letter-spacing: .12em; text-transform: uppercase; color: var(--ink-light);
        }
        .prov-card-type { display: flex; align-items: center; gap: 6px; }
        .prov-card-type::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: var(--ink-lighter);
        }
        .prov-card[data-type="cluster"] .prov-card-type::before { background: var(--ink); }
        .prov-card[data-type="statement"] .prov-card-type::before { background: var(--ink); }
        .prov-card[data-type="evidence"] .prov-card-type::before { background: var(--impact-gain); }
        .prov-card[data-type="reply"] .prov-card-type::before { background: var(--impact-accent); }
        .prov-card[data-type="update"] .prov-card-type::before { background: var(--impact-loss); }

        .prov-card-status {
            padding: 1px 7px; border-radius: 999px; font-size: 7px;
            border: 1px solid currentColor; color: var(--ink-light);
            letter-spacing: .08em; white-space: nowrap;
        }
        .prov-card-status[data-status="published"] { color: var(--ink); }
        .prov-card-status[data-status="verified"]  { color: var(--impact-gain); }
        .prov-card-status[data-status="contested"] { color: var(--impact-loss); }
        .prov-card-status[data-status="revised"]   { color: var(--impact-accent); }
        .prov-card-status[data-status="draft"]     { color: var(--ink-light); border-style: dashed; }

        .prov-card-title {
            font-family: var(--font); font-size: 16px; font-weight: 700;
            letter-spacing: -.01em; line-height: 1.22; color: var(--ink); margin: 0;
        }
        .prov-card-deck {
            font-size: 12px; line-height: 1.45; color: var(--ink-mid); margin: 0;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden; min-height: 2.9em;
        }
        .prov-card-meta {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; margin-top: auto;
            padding-top: 10px; border-top: 1px solid var(--border);
            font-family: var(--font-mono); font-size: 8px; letter-spacing: .06em;
            text-transform: uppercase; color: var(--ink-light);
        }
        .prov-card-source { display: flex; align-items: center; gap: 4px; }
        .prov-card-relations { display: flex; gap: 8px; }
        .prov-card-relation { display: flex; align-items: center; gap: 3px; opacity: .75; }
        .prov-card-relation strong { font-weight: 600; color: var(--ink-mid); }

        /* Cluster variant — always the yellow accent surface, in both themes.
           All ink variables are re-mapped so every descendant reads dark-on-yellow. */
        .prov-card[data-type="cluster"] {
            background: var(--accent); border-color: var(--accent); color: #1c1c1e;
            width: 280px; min-height: 160px;

            --fg: #1c1c1e;
            --fg-rgb: 28, 28, 30;
            --ink: #1c1c1e;
            --ink-mid: rgba(28, 28, 30, .78);
            --ink-light: rgba(28, 28, 30, .60);
            --ink-lighter: rgba(28, 28, 30, .40);
            --border: rgba(28, 28, 30, .18);
            --faint: rgba(28, 28, 30, .06);
            --card: #1c1c1e;
            --impact-gain: #2F6B4F;
            --impact-loss: #C63A2A;
            --impact-accent: #6b5f14;
        }
        .prov-card[data-type="cluster"] .prov-card-title,
        .prov-card[data-type="cluster"] .prov-card-deck,
        .prov-card[data-type="cluster"] .prov-card-kicker,
        .prov-card[data-type="cluster"] .prov-card-meta,
        .prov-card[data-type="cluster"] .prov-card-source,
        .prov-card[data-type="cluster"] .prov-card-relation { color: #1c1c1e; }
        .prov-card[data-type="cluster"] .prov-card-deck { color: rgba(28,28,30,.72); }
        .prov-card[data-type="cluster"] .prov-card-meta { border-top-color: rgba(28,28,30,.18); color: rgba(28,28,30,.62); }
        /* status pill — never white-on-yellow */
        .prov-card[data-type="cluster"] .prov-card-status,
        .prov-card[data-type="cluster"] .prov-card-status[data-status] {
            color: #1c1c1e;
            border-color: rgba(28, 28, 30, .45);
            border-style: solid;
        }

        /* Master variant — always dark ink, always light text */
        .prov-card[data-type="master"] {
            background: var(--card-dark); border-color: var(--card-dark); color: #fff;
            width: 300px; min-height: 180px;
        }
        .prov-card[data-type="master"] .prov-card-type::before { background: var(--accent); }
        .prov-card[data-type="master"] .prov-card-title,
        .prov-card[data-type="master"] .prov-card-deck,
        .prov-card[data-type="master"] .prov-card-kicker,
        .prov-card[data-type="master"] .prov-card-meta,
        .prov-card[data-type="master"] .prov-card-source,
        .prov-card[data-type="master"] .prov-card-relation { color: #fff; }
        .prov-card[data-type="master"] .prov-card-deck { color: rgba(255,255,255,.55); }
        .prov-card[data-type="master"] .prov-card-meta { border-top-color: rgba(255,255,255,.12); color: rgba(255,255,255,.55); }
        .prov-card[data-type="master"] .prov-card-status { color: rgba(255,255,255,.85); border-color: rgba(255,255,255,.35); }

        /* ═══════════════════════════════════════════════════════
           CLUSTER STACK
           ═══════════════════════════════════════════════════════ */
        .cluster-stack {
            display: flex;
            align-items: flex-start;
            gap: 24px;
            position: relative;
        }
        .cluster-stack[data-expanded="true"] {
            padding-bottom: 40px;
        }
        .cluster-stack-inner {
            position: relative;
            flex-shrink: 0;
        }
        .cluster-title {
            position: relative;
            z-index: 10;
        }
        .cluster-title > .prov-card {
            position: relative;
            z-index: 10;
        }

        /* stacked cards behind the title — theme aware, never the accent colour */
        .cluster-peek {
            position: absolute;
            inset: 0;
            background: var(--peek-bg);
            border: 1px solid var(--peek-border);
            border-radius: var(--radius-sm);
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        opacity 0.25s ease;
        }
        .cluster-peek[data-depth="1"] { transform: translate(2px, 6px);  z-index: 4; }
        .cluster-peek[data-depth="2"] { transform: translate(4px, 12px); z-index: 3; }
        .cluster-peek[data-depth="3"] { transform: translate(6px, 18px); z-index: 2; }
        .cluster-peek[data-depth="4"] { transform: translate(8px, 24px); z-index: 1; }

        .cluster-peek-hit {
            position: absolute;
            left: -2px;
            right: -14px;
            top: 100%;
            height: 40px;
            z-index: 20;
            cursor: pointer;
        }
        .cluster-stack[data-expanded="true"] .cluster-peek-hit { display: none; }

        .cluster-peek-hit:hover ~ .cluster-peek[data-depth="1"] { transform: translate(3px, 9px); }
        .cluster-peek-hit:hover ~ .cluster-peek[data-depth="2"] { transform: translate(6px, 17px); }
        .cluster-peek-hit:hover ~ .cluster-peek[data-depth="3"] { transform: translate(9px, 25px); }
        .cluster-peek-hit:hover ~ .cluster-peek[data-depth="4"] { transform: translate(12px, 33px); }

        .cluster-stack[data-expanded="true"] .cluster-peek {
            opacity: 0;
            transform: translate(0, 0) !important;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        opacity 0.2s ease;
        }

        .cluster-leaves {
            position: relative;
            display: none;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 16px;
            max-width: 552px;
            flex-shrink: 0;
        }
        .cluster-stack[data-expanded="true"] .cluster-leaves { display: flex; }

        /* ── Collapse chip: top-right corner of the expanded cluster ── */
        .cluster-collapse-chip {
            display: none;
            position: absolute;
            top: -32px;
            right: 0;
            padding: 4px 12px;
            background: var(--accent);
            color: #1c1c1e;
            border: 1px solid rgba(28, 28, 30, 0.18);
            border-radius: 999px;
            font-family: var(--font-mono);
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 15;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .cluster-collapse-chip:hover { background: #d8d855; }
        .cluster-collapse-chip:active { transform: scale(0.96); }
        .cluster-stack[data-expanded="true"] .cluster-collapse-chip { display: inline-flex; }

        .cluster-leaf {
            cursor: pointer;
            animation: leaf-in 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }
        .cluster-leaf:nth-child(1) { animation-delay: 0.02s; }
        .cluster-leaf:nth-child(2) { animation-delay: 0.06s; }
        .cluster-leaf:nth-child(3) { animation-delay: 0.10s; }
        .cluster-leaf:nth-child(4) { animation-delay: 0.14s; }
        .cluster-leaf:nth-child(5) { animation-delay: 0.18s; }
        .cluster-leaf:nth-child(6) { animation-delay: 0.22s; }

        @keyframes leaf-in {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .cluster-leaf > .prov-card { width: 260px; }

        /* ═══════════════════════════════════════════════════════
           MOBILE HOME VIEW — scrollable index
           ═══════════════════════════════════════════════════════ */
        .home-root {
            position: relative;
            z-index: 50;
            background: var(--bg);
            background-image: radial-gradient(circle, rgba(var(--fg-rgb), 0.07) 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: calc(100vh - var(--topbar-height));
            padding: 16px var(--margin) calc(var(--hud-height) + 40px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        @media (min-width: 641px) {
            .home-root { display: none !important; }
        }
        .home-page {
            max-width: 520px;
            margin: 0 auto;
            padding-top: 8px;
        }
        .home-card {
            background: var(--card-dark);
            border: 1px solid var(--card-dark);
            border-radius: var(--radius);
            box-shadow: var(--shadow-floating);
            padding: 22px 20px 12px;
            color: #fff;
        }
        .home-card-kicker {
            display: flex; align-items: center; justify-content: space-between;
            font-family: var(--font-mono); font-size: 9px; font-weight: 600;
            letter-spacing: .12em; text-transform: uppercase;
            color: rgba(255,255,255,.55);
        }
        .home-card-type { display: inline-flex; align-items: center; gap: 6px; }
        .home-card-type::before {
            content: ''; width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent);
        }
        .home-card-status {
            padding: 2px 9px; border-radius: 999px;
            border: 1px solid rgba(255,255,255,.4);
            color: rgba(255,255,255,.85);
            font-size: 8px; letter-spacing: .08em;
        }
        .home-card-title {
            font-family: var(--font); font-size: clamp(26px, 8vw, 34px); font-weight: 800;
            letter-spacing: -.02em; line-height: 1.05;
            color: #fff; margin: 16px 0 8px;
        }
        .home-card-deck {
            font-size: 14px; line-height: 1.5;
            color: rgba(255,255,255,.55); margin: 0 0 18px;
        }
        .home-card-list {
            list-style: none; margin: 0; padding: 0;
            display: flex; flex-direction: column;
        }
        .home-card-row {
            display: flex; align-items: center; gap: 14px;
            width: 100%; padding: 16px 2px;
            background: none; border: none; border-top: 1px solid rgba(255,255,255,.1);
            cursor: pointer; text-align: left;
            font-family: inherit; color: #fff;
            transition: color .15s ease, background .15s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .home-card-row:last-child { border-bottom: 1px solid rgba(255,255,255,.1); }
        .home-card-row:active { background: rgba(255,255,255,.04); }
        .home-card-num {
            font-family: var(--font-mono); font-size: 12px;
            color: rgba(255,255,255,.45); flex-shrink: 0;
            letter-spacing: .04em; min-width: 24px;
        }
        .home-card-name {
            flex: 1; min-width: 0;
            font-family: var(--font); font-size: 16px; font-weight: 600;
            letter-spacing: -.005em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .home-card-count {
            font-family: var(--font-mono); font-size: 9px;
            color: rgba(255,255,255,.4);
            letter-spacing: .06em; text-transform: uppercase;
            flex-shrink: 0;
        }
        .home-card-arrow {
            color: rgba(255,255,255,.45); font-size: 16px;
            flex-shrink: 0;
            transition: transform .15s ease, color .15s ease;
        }
        .home-card-row:active .home-card-arrow {
            color: var(--accent); transform: translateX(3px);
        }

        /* Canvas toolbar */
        .canvas-toolbar {
            position: fixed; top: calc(var(--topbar-height) + 8px); right: var(--margin);
            z-index: 90; display: flex; align-items: center; gap: 4px;
            background: color-mix(in srgb, var(--bg) 92%, transparent);
            backdrop-filter: blur(16px) saturate(1.1); -webkit-backdrop-filter: blur(16px) saturate(1.1);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 5px 8px; box-shadow: var(--shadow-floating); font-family: var(--font-mono);
            max-width: calc(100vw - var(--margin) * 2);
        }
        .canvas-toolbar .btn { min-height: 26px; font-size: 8px; padding: 3px 8px; }
        .canvas-toolbar .btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
        .canvas-toolbar-divider { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
        .canvas-toolbar-hint {
            font-size: 8px; color: var(--ink-light); letter-spacing: 0.04em;
            padding: 0 6px; opacity: 0.7;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        @media (max-width: 800px) { .canvas-toolbar-hint { display: none; } }

        /* carousel */
        .letters-viewport { position: relative; overflow: hidden; width: 100vw; left: 50%; margin-left: -50vw; }
        .letters-track {
            display: flex; align-items: flex-start; gap: 22px;
            padding-top: clamp(20px, 4vh, 60px); padding-bottom: 60px;
            padding-left: max(4vw, calc(50% - 520px));
            padding-right: max(4vw, calc(50% - 520px));
            overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; cursor: grab; user-select: none; box-sizing: border-box;
        }
        .letters-track.dragging { cursor: grabbing; scroll-snap-type: none; scroll-behavior: auto; }
        .letter-panel {
            flex: 0 0 auto; width: min(92vw, 1000px); max-width: 1000px;
            scroll-snap-align: center; box-sizing: border-box;
            opacity: 0.35; transition: opacity 0.3s ease, transform 0.3s ease; cursor: pointer;
        }
        .letter-panel.active { opacity: 1; cursor: auto; }
        .letter-hotspot { position: absolute; top: 0; bottom: 0; width: clamp(56px, 9vw, 180px); z-index: 20; cursor: pointer; }
        .letter-hotspot-prev { left: 0; }
        .letter-hotspot-next { right: 0; }

        .letter-card-frame {
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 28px clamp(20px, 3vw, 36px) 40px;
            background: var(--card); box-shadow: var(--shadow);
            transition: box-shadow 0.3s ease, transform 0.3s ease; position: relative;
        }
        .letter-panel.active .letter-card-frame { box-shadow: var(--shadow-hover); }
        .letter-cover {
            display: flex; flex-direction: column; gap: 6px;
            padding-bottom: 18px; margin-bottom: 24px; border-bottom: 1px solid var(--border);
        }
        .letter-cover-kicker {
            font-family: var(--font-mono); font-size: 9px; font-weight: 600;
            letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-light);
        }
        .letter-cover-name {
            font-family: var(--font); font-size: clamp(22px, 3vw, 34px);
            font-weight: 700; letter-spacing: -0.02em; color: var(--ink);
        }
        .letter-cover-deck {
            font-size: clamp(13px, 1vw, 16px); line-height: 1.5;
            color: var(--ink-light); max-width: 520px;
        }

        .letter-provenance {
            display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center;
            padding-top: 14px; margin-top: 6px; border-top: 1px dashed var(--border);
            font-family: var(--font-mono); font-size: 9px; letter-spacing: .06em;
            text-transform: uppercase; color: var(--ink-light);
        }
        .letter-provenance-field { display: inline-flex; gap: 6px; align-items: baseline; }
        .letter-provenance-field strong {
            font-weight: 600; color: var(--ink-mid); letter-spacing: .1em;
        }
        .letter-provenance-status {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor;
            font-size: 8px; font-weight: 600; color: var(--ink);
        }
        .letter-provenance-status[data-status="verified"]  { color: var(--impact-gain); }
        .letter-provenance-status[data-status="contested"] { color: var(--impact-loss); }
        .letter-provenance-status[data-status="draft"]     { color: var(--ink-light); border-style: dashed; }
        .letter-provenance-status[data-status="revised"]   { color: var(--impact-accent); }

        .letter-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
        .letter-toolbar .letter-count { font-family: var(--font-mono); font-size: 8px; color: var(--ink-light); margin-left: auto; }

        .swiss-grid {
            display: grid; grid-template-columns: repeat(var(--swiss-columns), 1fr);
            gap: var(--swiss-gap); width: 100%; position: relative;
        }
        .swiss-grid > * { min-width: 0; }
        .swiss-col, [class*="swiss-col-span-"] {
            grid-column: var(--swiss-col-start, auto) / span var(--swiss-col-span, 1);
            position: relative; transition: outline 0.2s ease, background 0.2s ease; min-width: 0;
        }
        .swiss-col-span-1  { --swiss-col-span: 1; }
        .swiss-col-span-2  { --swiss-col-span: 2; }
        .swiss-col-span-3  { --swiss-col-span: 3; }
        .swiss-col-span-4  { --swiss-col-span: 4; }
        .swiss-col-span-5  { --swiss-col-span: 5; }
        .swiss-col-span-6  { --swiss-col-span: 6; }
        .swiss-col-span-7  { --swiss-col-span: 7; }
        .swiss-col-span-8  { --swiss-col-span: 8; }
        .swiss-col-span-9  { --swiss-col-span: 9; }
        .swiss-col-span-10 { --swiss-col-span: 10; }
        .swiss-col-span-11 { --swiss-col-span: 11; }
        .swiss-col-span-12 { --swiss-col-span: 12; }
        .swiss-offset-1  { --swiss-col-start: 2; }
        .swiss-offset-2  { --swiss-col-start: 3; }
        .swiss-offset-3  { --swiss-col-start: 4; }
        .swiss-offset-4  { --swiss-col-start: 5; }
        .swiss-offset-5  { --swiss-col-start: 6; }
        .swiss-offset-6  { --swiss-col-start: 7; }
        .swiss-offset-7  { --swiss-col-start: 8; }
        .swiss-offset-8  { --swiss-col-start: 9; }
        .swiss-offset-9  { --swiss-col-start: 10; }
        .swiss-offset-10 { --swiss-col-start: 11; }
        .swiss-offset-11 { --swiss-col-start: 12; }

        body.show-grid .swiss-col,
        body.show-grid [class*="swiss-col-span-"] {
            outline: 1px solid var(--grid-outline); outline-offset: -1px;
            background: var(--grid-fill); border-radius: 0;
        }
        body.show-grid .swiss-grid::before {
            content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
            background: repeating-linear-gradient(90deg,
                transparent 0px, transparent calc(var(--swiss-gap) / 2 - 0.5px),
                var(--grid-gutter) calc(var(--swiss-gap) / 2 - 0.5px),
                var(--grid-gutter) calc(var(--swiss-gap) / 2 + 0.5px),
                transparent calc(var(--swiss-gap) / 2 + 0.5px), transparent var(--swiss-gap));
        }

        .letter-accordion { max-width: 820px; margin: 0 0 40px; border-top: 1px solid var(--border); }
        .letter-accordion-item { border-bottom: 1px solid var(--border); }
        .letter-accordion-trigger {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            gap: 16px; padding: 20px 0; background: none; border: none; cursor: pointer;
            text-align: left; font-family: inherit; color: var(--fg); transition: color 0.15s ease;
        }
        .letter-accordion-trigger:hover { color: rgba(var(--fg-rgb), .7); }
        .letter-accordion-num { font-family: var(--font-mono); font-size: 11px; color: var(--ink-light); margin-right: 14px; flex-shrink: 0; }
        .letter-accordion-title { flex: 1; font-size: clamp(17px, 1.9vw, 21px); font-weight: 700; letter-spacing: -.005em; color: var(--fg); }
        .letter-accordion-icon {
            flex-shrink: 0; width: 22px; height: 22px; display: flex; align-items: center;
            justify-content: center; font-size: 16px; color: var(--ink-light);
            transition: transform .3s cubic-bezier(.16, 1, .3, 1);
        }
        .letter-accordion-item.is-open .letter-accordion-icon { transform: rotate(45deg); }
        .letter-accordion-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s cubic-bezier(.16, 1, .3, 1); }
        .letter-accordion-item.is-open .letter-accordion-panel { grid-template-rows: 1fr; }
        .letter-accordion-panel-inner { overflow: hidden; min-height: 0; }
        .letter-accordion-panel-inner p { font-size: 15px; line-height: 1.7; color: var(--ink-mid); margin: 0 0 20px; }
        .letter-accordion-item.is-open .letter-accordion-panel-inner { padding-bottom: 22px; }

        .letter-never-toggle { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; font-family: var(--font-mono); }
        .letter-never-toggle button {
            padding: 5px 12px; border: 1px solid var(--border); background: none;
            color: var(--ink-light); cursor: pointer; font-family: inherit;
            font-size: 10px; letter-spacing: .04em; text-transform: uppercase;
            border-radius: 2px; transition: color .15s, border-color .15s, background .15s;
        }
        .letter-never-toggle button.active { color: var(--fg); border-color: var(--fg); background: rgba(var(--fg-rgb), .06); }
        .letter-never-list {
            list-style: none; display: flex; flex-direction: column; gap: 26px;
            margin: 0 0 44px; padding: 0; max-width: 820px; counter-reset: never-item;
        }
        .letter-never-item { display: flex; gap: 16px; align-items: baseline; counter-increment: never-item; }
        .letter-never-marker { flex: 0 0 auto; min-width: 22px; font-family: var(--font-mono); font-size: 13px; color: var(--ink-light); }
        .letter-never-list.is-numbered .letter-never-marker::before { content: counter(never-item) "."; }
        .letter-never-list.is-bulleted .letter-never-marker::before { content: "—"; }
        .letter-never-body { flex: 1; min-width: 0; }
        .letter-never-statement {
            font-size: clamp(18px, 2vw, 22px); font-weight: 700;
            line-height: 1.3; letter-spacing: -.005em; color: var(--fg); margin: 0;
        }
        .letter-never-context { margin: 6px 0 0; font-size: 13px; line-height: 1.5; font-style: italic; color: var(--ink-light); }

        /* ═══════════════════════════════════════════════════════
           HUD — centred, clamped against surrounding chrome
           ═══════════════════════════════════════════════════════ */
        .hud {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: color-mix(in srgb, var(--bg) 92%, transparent);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-floating);
            display: flex; align-items: center; justify-content: center;
            min-height: 44px; font-family: var(--font-mono);
            max-width: min(520px, calc(100vw - var(--margin) * 2));
        }
        .hud-top {
            top: calc(var(--topbar-height) + 8px);
            padding: 6px 12px;
            gap: 4px;
        }
        .hud-bottom {
            bottom: calc(12px + var(--scrollbar-height));
            padding: 10px 18px;
            min-height: 48px;
            gap: 12px;
        }
        .hud .btn { min-height: 30px; padding: 5px 10px; font-size: 8px; }
        .hud-nav-counter {
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--ink); color: var(--bg); padding: 1px 6px;
            border-radius: var(--radius-sm); font-size: 7px; font-weight: 600;
            min-width: 18px; text-align: center;
        }
        .hud-count {
            font-size: 10px; font-weight: 700; letter-spacing: .06em;
            color: var(--fg); line-height: 1; flex-shrink: 0;
        }
        .hud-sep {
            width: 1px; height: 12px; background: var(--border);
            flex-shrink: 0; display: block;
        }
        .hud-text {
            font-size: 9px; font-weight: 500; letter-spacing: .12em;
            text-transform: uppercase; color: var(--ink-light);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            min-width: 0;
        }
        @media (max-width: 640px) {
            .hud-bottom { padding: 8px 14px; min-height: 44px; gap: 10px; }
            .hud .btn { font-size: 7px; padding: 4px 8px; min-height: 26px; }
        }

        .scroll-border-top, .scroll-border-bottom {
            position: fixed; height: 3px; background: var(--accent);
            z-index: 160; width: 0%; pointer-events: none;
            box-shadow: 0 0 10px rgba(229, 229, 103, 0.35);
            transition: width 0.12s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .scroll-border-top { top: 0; left: 0; border-radius: 0 2px 2px 0; }
        .scroll-border-bottom { bottom: 0; right: 0; border-radius: 2px 0 0 2px; }
        .scroll-border-corner { position: fixed; z-index: 160; pointer-events: none; background: var(--accent); opacity: 0; transition: opacity 0.3s ease; }
        .scroll-border-corner.show { opacity: 1; }
        .scroll-border-corner-tl { top: 0; left: 0; width: 6px; height: 6px; }
        .scroll-border-corner-tr { top: 0; right: 0; width: 6px; height: 6px; }
        .scroll-border-corner-bl { bottom: 0; left: 0; width: 6px; height: 6px; }
        .scroll-border-corner-br { bottom: 0; right: 0; width: 6px; height: 6px; }

        /* ═══════════════════════════════════════════════════════
           CUSTOM CURSOR — contrast-aware
           ═══════════════════════════════════════════════════════ */
        body.custom-cursor-active { cursor: none; }
        .write-cursor-dot, .write-cursor-ellipse {
            position: fixed; top: 0; left: 0; z-index: 500; pointer-events: none;
            transform: translate(-9999px, -9999px); opacity: 0;
            transition: opacity 0.18s ease, background-color .2s ease, border-color .2s ease;
            will-change: transform;
        }
        .write-cursor-dot.visible, .write-cursor-ellipse.visible { opacity: 1; }
        .write-cursor-dot { width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--ink); }
        .write-cursor-ellipse { width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 1.5px solid var(--ink); border-radius: 50%; opacity: 0; }
        .write-cursor-ellipse.visible { opacity: 0.32; }

        body.cursor-on-accent .write-cursor-dot { background: #1c1c1e; }
        body.cursor-on-accent .write-cursor-ellipse { border-color: #1c1c1e; }

        body.cursor-on-dark .write-cursor-dot { background: #ffffff; }
        body.cursor-on-dark .write-cursor-ellipse { border-color: #ffffff; }

        body.custom-cursor-active.write-native-cursor { cursor: auto; }
        .write-native-cursor .write-cursor-dot, .write-native-cursor .write-cursor-ellipse { opacity: 0 !important; }

        .topbar-appearance-dropdown {
            position: fixed; min-width: 132px; background: var(--card);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            box-shadow: var(--shadow-floating); padding: 4px 0; z-index: 200;
            display: none; flex-direction: column;
        }
        .topbar-appearance-dropdown.open { display: flex; }
        .topbar-appearance-dropdown .menu-item {
            padding: 7px 14px; font-family: var(--font-mono); font-size: 9px;
            letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-mid);
            cursor: pointer; border: none; background: none; text-align: left;
            width: 100%; white-space: nowrap;
        }
        .topbar-appearance-dropdown .menu-item:hover { background: var(--bg); color: var(--ink); }
        .topbar-appearance-dropdown .menu-item.active { background: var(--ink); color: var(--bg); }

        .index-letter { display: grid; grid-template-rows: repeat(6, auto); grid-auto-flow: column; gap: 0.2rem 2rem; max-width: 480px; overflow: hidden; }
        .index-letter a.idx-row {
            display: flex; align-items: baseline; gap: 0.6rem; padding: 0.35rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer;
            transition: color 0.2s, transform 0.15s; color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
        }
        .index-letter a.idx-row:hover { color: var(--accent); transform: translateX(4px); }
        .index-letter .idx-num { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.04em; opacity: 0.45; flex-shrink: 0; min-width: 2.6em; color: rgba(255, 255, 255, 0.55); }
        .index-letter .idx-title { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; color: #ffffff; }

        .letter-heading {
            font-size: clamp(40px, 6vw, 96px);
            line-height: .98; letter-spacing: -.02em; color: var(--fg); margin: 0;
        }
        .letter-tagline {
            font-size: clamp(9px, .8vw, 10px); font-weight: 700;
            letter-spacing: .14em; text-transform: uppercase; line-height: 1.5; color: var(--fg); margin: 0;
        }
        .letter-body p { font-size: 15px; line-height: 1.7; color: var(--ink-mid); margin: 0 0 20px; }
        .letter-card-caption {
            margin-top: auto; padding-top: var(--l-sp-4);
            font-family: var(--font-mono); font-size: 8px; font-weight: 600;
            letter-spacing: .08em; text-transform: uppercase; color: var(--ink-light);
        }
        .conversation-stack-hint {
            margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border);
            font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--ink-light);
            display: flex; align-items: center; gap: 8px;
        }
        .conversation-stack-hint::before { content: '⤵'; font-size: 1rem; opacity: 0.4; }

        /* ── Accent title-card frame ──────────────────────────
           Yellow surface in BOTH themes. Every ink variable is re-mapped
           so all nested content renders dark-on-yellow with real contrast. */
        .letter-card-frame.title-card-frame {
            background: var(--accent);
            border-color: var(--accent);

            --fg: #1c1c1e;
            --fg-rgb: 28, 28, 30;
            --ink: #1c1c1e;
            --ink-mid: rgba(28, 28, 30, .78);
            --ink-light: rgba(28, 28, 30, .60);
            --ink-lighter: rgba(28, 28, 30, .40);
            --border: rgba(28, 28, 30, .18);
            --faint: rgba(28, 28, 30, .06);
            --bg: rgba(255, 255, 255, .42);
            --card: rgba(255, 255, 255, .55);
            --impact-gain: #2F6B4F;
            --impact-loss: #C63A2A;
            --impact-accent: #6b5f14;
            color: #1c1c1e;
        }
        .letter-card-frame.title-card-frame .letter-cover { border-bottom-color: rgba(28, 28, 30, 0.15); }
        .letter-card-frame.title-card-frame .letter-cover-kicker,
        .letter-card-frame.title-card-frame .letter-cover-deck { color: rgba(28, 28, 30, 0.62); }
        .letter-card-frame.title-card-frame .letter-cover-name { color: #1c1c1e; }
        .letter-card-frame.title-card-frame .letter-provenance { border-top-color: rgba(28,28,30,.22); color: rgba(28,28,30,.62); }
        .letter-card-frame.title-card-frame .letter-provenance-field strong { color: #1c1c1e; }
        .letter-card-frame.title-card-frame .letter-provenance-status,

            /* ═══════════════════════════════════════════════════════
               STATE
               ═══════════════════════════════════════════════════════ */
            let currentRoute = { level: 'canvas' };
            let currentCards = [];
            let activeIndex = 0;
            let canvasLayout = 'free';
            let panOffset = { x: 0, y: 0 };
            let topZ = 10;
            const expandedClusters = new Set();
            const restPositions = new Map();
            const CANVAS_STORAGE_KEY = 'intoview.canvas.v4';
            const THEME_STORAGE_KEY = 'intoview.theme';

            /* ═══════════════════════════════════════════════════════
               ROUTING
               ═══════════════════════════════════════════════════════ */
            function parseHash() {
                const raw = (location.hash || '').replace(/^#\/?/, '');
                if (!raw) return { level: 'canvas' };
                const parts = raw.split('/').filter(Boolean);
                if (parts.length === 1) return { level: 'cluster', clusterId: parts[0] };
                if (parts.length >= 2) return { level: 'card', clusterId: parts[0], cardId: parts.slice(1).join('/') };
                return { level: 'canvas' };
            }

            function navigate(route, replace) {
                const hash = routeHash(route);
                if (replace) history.replaceState(null, '', hash);
                else location.hash = hash;
            }

            function routeHash(route) {
                if (!route || route.level === 'canvas') return '#/';
                if (route.level === 'cluster') return '#/' + route.clusterId;
                if (route.level === 'card') return '#' + '/' + route.clusterId + '/' + route.cardId;
                return '#/';
            }

            function handleRoute() {
                const route = parseHash();
                currentRoute = route;

                if (route.level === 'canvas') {
                    currentCards = [];
                    syncView();
                    if (isMobileView()) {
                        renderHome();
                    } else {
                        renderCanvas();
                    }
                    updateBreadcrumb();
                    updateMobileBack();
                    return;
                }

                const cluster = CLUSTERS.get(route.clusterId);
                if (!cluster) { navigate({ level: 'canvas' }, true); return; }

                const allCards = [cluster].concat(cluster.cardIds.map(id => CARDS.get(id)).filter(Boolean));

                if (route.level === 'cluster') {
                    currentCards = allCards;
                    activeIndex = 0;
                    syncView();
                    renderTrack();
                    updateBreadcrumb();
                    updateMobileBack();
                    return;
                }

                currentCards = allCards;
                const idx = allCards.findIndex(c => c.id === route.cardId);
                activeIndex = idx >= 0 ? idx : 0;
                syncView();
                renderTrack();
                scrollToPanel(activeIndex, false);
                updateBreadcrumb();
                updateMobileBack();
            }

            function updateBreadcrumb() {
                const bc = document.getElementById('breadcrumb');
                bc.innerHTML = '';
                const items = [];
                items.push({ label: 'Canvas', route: { level: 'canvas' } });
                if (currentRoute.level === 'cluster' || currentRoute.level === 'card') {
                    const cluster = CLUSTERS.get(currentRoute.clusterId);
                    if (cluster) items.push({ label: cluster.title, route: { level: 'cluster', clusterId: cluster.id } });
                }
                if (currentRoute.level === 'card') {
                    const card = CARDS.get(currentRoute.cardId);
                    if (card) items.push({ label: card.title, route: currentRoute, current: true });
                } else if (currentRoute.level === 'cluster') {
                    items[items.length - 1].current = true;
                }

                items.forEach((item, i) => {
                    if (i > 0) {
                        const sep = document.createElement('span');
                        sep.className = 'breadcrumb-sep';
                        sep.textContent = '/';
                        bc.appendChild(sep);
                    }
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'breadcrumb-item' + (item.current ? ' is-current' : '');
                    btn.textContent = item.label;
                    if (!item.current) btn.addEventListener('click', () => navigate(item.route));
                    bc.appendChild(btn);
                });
            }

            function updateMobileBack() {
                const btn = document.getElementById('mobileBackBtn');
                if (!btn) return;
                if (currentRoute.level === 'canvas') {
                    btn.hidden = true;
                    return;
                }
                btn.hidden = false;
                btn.textContent = currentRoute.level === 'card' ? '← Back' : '← Sections';
            }

            /* ═══════════════════════════════════════════════════════
               VIEW SYNC — canvas vs home vs carousel
               ═══════════════════════════════════════════════════════ */
            function syncView() {
                const inSection = currentRoute.level !== 'canvas';
                const mobile = isMobileView();
                const canvasRoot = document.getElementById('canvasRoot');
                const homeRoot = document.getElementById('homeRoot');

                canvasRoot.hidden = inSection || mobile;
                homeRoot.hidden = inSection || !mobile;

                document.getElementById('carouselWrap').hidden = !inSection;
                document.getElementById('hudTop').hidden = !inSection;
                document.getElementById('hud').hidden = !inSection;
                updateStatusText();
            }

            function updateStatusText() {
                const statusCount = document.getElementById('hudStatusCount');
                const statusText = document.getElementById('hudStatusText');
                if (!statusCount || !statusText) return;
                if (currentRoute.level === 'canvas') {
                    statusCount.textContent = String(CARDS.size);
                    statusText.textContent = 'Cards';
                } else {
                    const cluster = CLUSTERS.get(currentRoute.clusterId);
                    statusCount.textContent = String(currentCards.length);
                    statusText.textContent = cluster ? cluster.title : '';
                }
            }

            /* ═══════════════════════════════════════════════════════
               HOME VIEW — mobile index
               ═══════════════════════════════════════════════════════ */

                card.innerHTML = `
