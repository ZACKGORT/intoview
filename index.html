                    `;
                    surface.appendChild(node);
                });

                // Attach drag + click handlers
                surface.querySelectorAll('.canvas-node').forEach(attachNodeHandlers);
            }

            function getLayoutPositions(layout) {
                const secs = getSectionDefs();
                const positions = {};

                if (layout === 'grid') {
                    positions.master = { x: -560, y: -260 };
                    secs.forEach((s, i) => {
                        const col = i % 3;
                        const row = Math.floor(i / 3);
                        positions[s.id] = {
                            x: -180 + col * 300,
                            y: -260 + row * 260
                        };
                    });
                } else if (layout === 'radial') {
                    positions.master = { x: -170, y: -220 };
                    const radius = 400;
                    secs.forEach((s, i) => {
                        const angle = (i / secs.length) * Math.PI * 2 - Math.PI / 2;
                        const cx = Math.cos(angle) * radius;
                        const cy = Math.sin(angle) * radius;
                        positions[s.id] = { x: cx - 140, y: cy - 90 };
                    });
                } else {
                    // free — desktop scatter
                    positions.master    = { x: -520, y: -240 };
                    positions.manifesto = { x: -100, y: -340 };
                    positions.record    = { x:  260, y: -240 };
                    positions.otw       = { x: -100, y:  -60 };
                    positions.hiring    = { x:  260, y:   60 };
                    positions.archive   = { x: -100, y:  200 };
                }

                return positions;
            }

            function applyCanvasLayout(layout, animate) {
                canvasLayout = layout;
                const positions = getLayoutPositions(layout);
                const nodes = document.querySelectorAll('.canvas-node');

                if (!animate) {
                    nodes.forEach(n => { n.style.transition = 'none'; });
                }

                nodes.forEach(n => {
                    const id = n.dataset.nodeId;
                    const pos = positions[id];
                    if (!pos) return;
                    n.style.left = pos.x + 'px';
                    n.style.top = pos.y + 'px';
                });

                if (!animate) {
                    // force reflow, then restore transition
                    void document.body.offsetHeight;
                    nodes.forEach(n => { n.style.transition = ''; });
                }

                updateCanvasLayoutUI();
            }

            function updateCanvasLayoutUI() {
                document.querySelectorAll('[data-canvas-layout]').forEach(b => {
                    b.classList.toggle('active', b.dataset.canvasLayout === canvasLayout);
                });
                const snapBtn = document.getElementById('canvasSnapToggle');
                if (snapBtn) snapBtn.classList.toggle('active', canvasSnapEnabled);
            }

            function applyPanTransform() {
                const surface = document.getElementById('canvasSurface');
                if (!surface) return;
                surface.style.transform = `translate3d(${panOffset.x}px, ${panOffset.y}px, 0)`;
            }

            function fitCanvasToViewport() {
                const nodes = [...document.querySelectorAll('.canvas-node')];
                if (!nodes.length) return;
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                nodes.forEach(n => {
                    const x = parseFloat(n.style.left) || 0;
                    const y = parseFloat(n.style.top) || 0;
                    minX = Math.min(minX, x);
                    minY = Math.min(minY, y);
                    maxX = Math.max(maxX, x + n.offsetWidth);
                    maxY = Math.max(maxY, y + n.offsetHeight);
                });
                const bw = maxX - minX;
                const bh = maxY - minY;
                const cx = (minX + maxX) / 2;
                const cy = (minY + maxY) / 2;
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const topbarH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--topbar-height')) || 72;
                panOffset.x = vw / 2 - cx;
                panOffset.y = (vh + topbarH) / 2 - cy;
                applyPanTransform();
            }

            /* ═══════════════════════════════════════════════════════
               CANVAS INTERACTION: DRAG / PAN / WHEEL
               ═══════════════════════════════════════════════════════ */
            function attachNodeHandlers(node) {
                let dragState = null;

                node.addEventListener('pointerdown', (e) => {
                    if (e.button !== 0) return;
                    dragState = {
                        startX: e.clientX,
                        startY: e.clientY,
                        startLeft: parseFloat(node.style.left) || 0,
                        startTop: parseFloat(node.style.top) || 0,
                        origTarget: e.target,
                        moved: false,
                        pointerId: e.pointerId
                    };
                    try { node.setPointerCapture(e.pointerId); } catch (err) {}
                    node.classList.add('dragging');
                    node.style.zIndex = String(++topZ);
                    e.preventDefault();
                    e.stopPropagation();
                });

                node.addEventListener('pointermove', (e) => {
                    if (!dragState || e.pointerId !== dragState.pointerId) return;
                    const dx = e.clientX - dragState.startX;
                    const dy = e.clientY - dragState.startY;
                    if (!dragState.moved && Math.hypot(dx, dy) > 4) dragState.moved = true;
                    if (!dragState.moved) return;

                    let x = dragState.startLeft + dx;
                    let y = dragState.startTop + dy;
                    if (canvasSnapEnabled) {
                        x = Math.round(x / SNAP_STEP) * SNAP_STEP;
                        y = Math.round(y / SNAP_STEP) * SNAP_STEP;
                    }
                    node.style.left = x + 'px';
                    node.style.top = y + 'px';
                });

                const endDrag = (e) => {
                    if (!dragState || (e && e.pointerId !== dragState.pointerId)) return;
                    const state = dragState;
                    dragState = null;
                    node.classList.remove('dragging');
                    try { node.releasePointerCapture(state.pointerId); } catch (err) {}

                    if (state.moved) {
                        if (canvasLayout !== 'free') {
                            canvasLayout = 'free';
                            updateCanvasLayoutUI();
                        }
                        saveCanvasState();
                    } else {
                        // click — check for a drill target
                        const drill = closestSafe(state.origTarget, '[data-drill-section]');
                        if (drill) {
                            drillIntoSection(drill.dataset.drillSection);
                            return;
                        }
                        if (node.dataset.sectionId) {
                            drillIntoSection(node.dataset.sectionId);
                        }
                    }
                };

                node.addEventListener('pointerup', endDrag);
                node.addEventListener('pointercancel', endDrag);
            }

            function attachCanvasHandlers() {
                const canvasRoot = document.getElementById('canvasRoot');
                if (!canvasRoot || canvasRoot.dataset.bound === '1') return;
                canvasRoot.dataset.bound = '1';

                // Pan on empty space
                canvasRoot.addEventListener('pointerdown', (e) => {
                    if (e.target.closest('.canvas-node')) return;
                    if (e.target.closest('.canvas-toolbar')) return;
                    if (e.button !== 0 && e.button !== 1) return;

                    const state = {
                        startX: e.clientX,
                        startY: e.clientY,
                        startPanX: panOffset.x,
                        startPanY: panOffset.y,
                        pointerId: e.pointerId
                    };

                    try { canvasRoot.setPointerCapture(e.pointerId); } catch (err) {}
                    canvasRoot.classList.add('panning');
                    e.preventDefault();

                    const onMove = (ev) => {
                        if (ev.pointerId !== state.pointerId) return;
                        panOffset.x = state.startPanX + (ev.clientX - state.startX);
                        panOffset.y = state.startPanY + (ev.clientY - state.startY);
                        applyPanTransform();
                    };
                    const onUp = (ev) => {
                        if (ev.pointerId !== state.pointerId) return;
                        canvasRoot.classList.remove('panning');
                        canvasRoot.removeEventListener('pointermove', onMove);
                        canvasRoot.removeEventListener('pointerup', onUp);
                        canvasRoot.removeEventListener('pointercancel', onUp);
                        try { canvasRoot.releasePointerCapture(state.pointerId); } catch (err) {}
                        saveCanvasState();
                    };
                    canvasRoot.addEventListener('pointermove', onMove);
                    canvasRoot.addEventListener('pointerup', onUp);
                    canvasRoot.addEventListener('pointercancel', onUp);
                });

                // Wheel to pan
                canvasRoot.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    panOffset.x -= e.deltaX;
                    panOffset.y -= e.deltaY;
                    applyPanTransform();
                }, { passive: false });
            }

            /* ═══════════════════════════════════════════════════════
               CANVAS PERSISTENCE
               ═══════════════════════════════════════════════════════ */
            function saveCanvasState() {
                const positions = {};
                document.querySelectorAll('.canvas-node').forEach(n => {
                    positions[n.dataset.nodeId] = {
                        x: parseFloat(n.style.left) || 0,
                        y: parseFloat(n.style.top) || 0
                    };
                });
                const state = {
                    layout: canvasLayout,
                    positions,
                    pan: { x: panOffset.x, y: panOffset.y },
                    snap: canvasSnapEnabled
                };
                try { localStorage.setItem(CANVAS_STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
            }

            function loadCanvasState() {
                try {
                    const raw = localStorage.getItem(CANVAS_STORAGE_KEY);
                    if (!raw) return null;
                    return JSON.parse(raw);
                } catch (e) { return null; }
            }

            function renderRootCanvas() {
                buildCanvasNodes();

                const saved = loadCanvasState();
                if (saved && saved.positions && saved.layout) {
                    canvasLayout = saved.layout;
                    canvasSnapEnabled = !!saved.snap;
                    const positions = saved.positions;
                    document.querySelectorAll('.canvas-node').forEach(n => {
                        const pos = positions[n.dataset.nodeId];
                        if (!pos) return;
                        n.style.left = pos.x + 'px';
                        n.style.top = pos.y + 'px';
                    });
                    if (saved.pan) {
                        panOffset.x = saved.pan.x;
                        panOffset.y = saved.pan.y;
                    } else {
                        fitCanvasToViewport();
                    }
                } else {
                    canvasLayout = 'free';
                    canvasSnapEnabled = false;
                    applyCanvasLayout('free', false);
                    fitCanvasToViewport();
                }

                applyPanTransform();
                updateCanvasLayoutUI();
                attachCanvasHandlers();
            }

            /* ═══════════════════════════════════════════════════════
               CAROUSEL RENDER (unchanged, for drilled-in sections)
               ═══════════════════════════════════════════════════════ */
            function handleAccordion(e) {
                const trigger = e.currentTarget;
                const item = trigger.closest('.letter-accordion-item');
                if (!item) return;
                const nowOpen = item.classList.toggle('is-open');
                trigger.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
            }

            function handleNeverToggle(e) {
                const btn = e.currentTarget;
                const group = btn.closest('[data-never-toggle-group]');
                if (!group) return;
                const list = group.parentElement.querySelector('[data-never-list]');
                if (!list) return;
                const mode = btn.dataset.neverMode;
                list.classList.toggle('is-numbered', mode === 'numbered');
                list.classList.toggle('is-bulleted', mode === 'bulleted');
                group.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
            }

            function bindInteractions(container) {
                if (!container) return;
                container.querySelectorAll('.letter-accordion-trigger').forEach(trigger => {
                    trigger.removeEventListener('click', handleAccordion);
                    trigger.addEventListener('click', handleAccordion);
                });
                container.querySelectorAll('[data-never-toggle-group] button').forEach(btn => {
                    btn.removeEventListener('click', handleNeverToggle);
                    btn.addEventListener('click', handleNeverToggle);
                });
                container.querySelectorAll('.letter-accordion-item.is-open .letter-accordion-trigger').forEach(tr => {
                    tr.setAttribute('aria-expanded', 'true');
                });
                container.querySelectorAll('.letter-accordion-item:not(.is-open) .letter-accordion-trigger').forEach(tr => {
                    tr.setAttribute('aria-expanded', 'false');
                });
            }

            function buildLetterPanel(index, data) {
                const panel = document.createElement('div');
                panel.className = 'letter-panel' + (index === 0 ? ' active' : '');
                panel.dataset.index = String(index);

                const frame = document.createElement('div');
                let frameClass = 'letter-card-frame';
                if (data.isTitleCard) frameClass += ' title-card-frame';
                if (data.isIndexCard) frameClass += ' index-card-frame';
                frame.className = frameClass;

                const cover = document.createElement('div');
                cover.className = 'letter-cover';
                const label = data.isIndexCard ? 'INDEX' : (data.isTitleCard ? 'SECTION' : 'LETTER ' + String(index + 1).padStart(2, '0'));
                cover.innerHTML = `
                        <div class="swiss-grid letter-cover-grid">
                            <span class="swiss-col swiss-col-span-3 letter-cover-kicker">${label}</span>
                            <h2 class="swiss-col swiss-col-span-9 letter-cover-name"${data.coverFont ? ` data-cover-font="${data.coverFont}"` : ''}>${escapeHtml(data.title)}</h2>
                            <p class="swiss-col swiss-col-span-6 swiss-offset-3 letter-cover-deck">${escapeHtml(data.deck || '')}</p>
                        </div>
                    `;
                frame.appendChild(cover);

                const toolbar = document.createElement('div');
                toolbar.className = 'letter-toolbar';
                const countEl = document.createElement('span');
                countEl.className = 'letter-count';
                countEl.textContent = data.viewMode || 'info';
                toolbar.appendChild(countEl);
                frame.appendChild(toolbar);

                const content = document.createElement('div');
                content.className = 'letter-content';
                frame.appendChild(content);

                panel.appendChild(frame);

                panel.addEventListener('click', () => {
                    const idx = Number(panel.dataset.index);
                    if (idx !== activeIndex) activatePanel(idx);
                });

                return panel;
            }

            function injectLetterContent(index) {
                const panels = document.querySelectorAll('.letter-panel');
                if (!panels.length) return;
                const panel = panels[index];
                if (!panel) return;
                const data = letterData[index];
                if (!data) return;

                const frame = panel.querySelector('.letter-card-frame');
                const content = frame.querySelector('.letter-content');
                if (!content) return;

                if (data.staticContent) {
                    content.innerHTML = data.staticContent;
                } else if (data.contentFn) {
                    content.innerHTML = data.contentFn();
                } else {
                    content.innerHTML = `<div class="sample-letter"><p>This letter is empty.</p></div>`;
                }

                const isSpecial = data.isIndexCard || data.isSectionTitle;
                if (!isSpecial) {
                    const hint = document.createElement('div');
                    hint.className = 'conversation-stack-hint';
                    hint.textContent = 'Conversation & replies live below this letter';
                    content.appendChild(hint);
                }

                bindInteractions(content);
            }

            function assignColumnLabels() {
                if (window.innerWidth <= 640) return;
                document.querySelectorAll('.swiss-grid').forEach(grid => {
                    const children = Array.from(grid.children).filter(el =>
                        el.nodeType === 1 && (
                            el.classList.contains('swiss-col') ||
                            /(^|\s)swiss-col-span-\d+(\s|$)/.test(el.className)
                        )
                    );
                    let cursor = 1;
                    children.forEach(col => {
                        const spanMatch = col.className.match(/swiss-col-span-(\d+)/);
                        const spanNum = spanMatch ? parseInt(spanMatch[1], 10) : 1;
                        const offsetMatch = col.className.match(/swiss-offset-(\d+)/);
                        if (offsetMatch) cursor = parseInt(offsetMatch[1], 10) + 1;
                        const start = cursor;
                        const end = Math.min(start + spanNum - 1, 12);
                        col.setAttribute('data-col-label', `${start}–${end}`);
                        cursor = end + 1;
                        if (cursor > 12) cursor = 1;
                    });
                });
            }

            function renderTrack() {
                const track = document.getElementById('lettersTrack');
                track.innerHTML = '';
                letterData.forEach((data, i) => track.appendChild(buildLetterPanel(i, data)));
                letterData.forEach((_, i) => injectLetterContent(i));
                const panels = track.querySelectorAll('.letter-panel');
                panels.forEach(p => p.classList.remove('active'));
                if (panels[0]) panels[0].classList.add('active');
                activeIndex = 0;
                updateBorderProgress();
                const counter = document.getElementById('hudNavCounter');
                if (counter) counter.textContent = `1/${letterData.length}`;
                assignColumnLabels();
                syncViewRail();
                updateStatusText();
            }

            function setViewMode(mode) {
                if (!letterData[activeIndex]) return;
                letterData[activeIndex].viewMode = mode;
                injectLetterContent(activeIndex);
                assignColumnLabels();
                syncViewRail();
            }

            function syncViewRail() {
                const current = (letterData[activeIndex] && letterData[activeIndex].viewMode) || 'info';
                document.querySelectorAll('.rail-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === current);
                });
            }

            function activatePanel(newIndex) {
                if (newIndex < 0) newIndex = letterData.length - 1;
                if (newIndex >= letterData.length) newIndex = 0;
                if (newIndex === activeIndex) { scrollToPanel(newIndex); updateBorderProgress(); syncViewRail(); return; }
                const panels = document.querySelectorAll('.letter-panel');
                panels.forEach(p => p.classList.remove('active'));
                activeIndex = newIndex;
                panels[activeIndex].classList.add('active');
                injectLetterContent(activeIndex);
                scrollToPanel(activeIndex);
                updateBorderProgress();
                syncViewRail();
                const counter = document.getElementById('hudNavCounter');
                if (counter) counter.textContent = `${activeIndex+1}/${letterData.length}`;
                assignColumnLabels();
            }

            function scrollToPanel(index) {
                const panel = document.querySelectorAll('.letter-panel')[index];
                if (!panel) return;
                const track = document.getElementById('lettersTrack');
                const trackRect = track.getBoundingClientRect();
                const panelRect = panel.getBoundingClientRect();
                const delta = panelRect.left + panelRect.width / 2 - (trackRect.left + trackRect.width / 2);
                track.scrollTo({ left: track.scrollLeft + delta, behavior: 'smooth' });
            }

            function updateBorderProgress() {
                const total = letterData.length;
                const topBar = document.getElementById('scrollBorderTop');
                const bottomBar = document.getElementById('scrollBorderBottom');
                const cornerTL = document.getElementById('cornerTL');
                const cornerTR = document.getElementById('cornerTR');
                const cornerBL = document.getElementById('cornerBL');
                const cornerBR = document.getElementById('cornerBR');

                if (total <= 1) {
                    topBar.style.width = '0%'; bottomBar.style.width = '0%';
                    topBar.setAttribute('aria-valuenow', '0'); bottomBar.setAttribute('aria-valuenow', '0');
                    [cornerTL, cornerTR, cornerBL, cornerBR].forEach(el => el.classList.remove('show'));
                    return;
                }

                const progress = activeIndex / (total - 1);
                const percent = Math.round(progress * 100);
                topBar.style.width = percent + '%';
                topBar.setAttribute('aria-valuenow', String(percent));
                bottomBar.style.width = percent + '%';
                bottomBar.setAttribute('aria-valuenow', String(percent));

                cornerTL.classList.toggle('show', percent > 0);
                cornerTR.classList.toggle('show', percent > 0 && percent < 100);
                cornerBR.classList.toggle('show', percent < 100);
                cornerBL.classList.toggle('show', percent > 0 && percent < 100);

                if (percent === 0) {
                    cornerTL.classList.add('show');
                    cornerTR.classList.remove('show');
                    cornerBL.classList.remove('show');
                    cornerBR.classList.remove('show');
                }
                if (percent === 100) {
                    [cornerTL, cornerTR, cornerBL, cornerBR].forEach(el => el.classList.add('show'));
                }
            }

            /* ═══════════════════════════════════════════════════════
               VIEWPORT BLUR / CURSOR / DROPDOWN / GRID
               ═══════════════════════════════════════════════════════ */
            function setupViewportBlur() {
                const top = document.getElementById('viewportBlurTop'),
                      bottom = document.getElementById('viewportBlurBottom');
                if (!top || !bottom) return;
                function update() {
                    const scrollY = window.scrollY || window.pageYOffset || 0;
                    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                    top.classList.toggle('scrolling', scrollY > 4);
                    bottom.classList.toggle('scrolling', scrollY < maxScroll - 4);
                }
                let ticking = false;
                function onScrollOrResize() {
                    if (ticking) return;
                    ticking = true;
                    requestAnimationFrame(() => { update(); ticking = false; });
                }
                window.addEventListener('scroll', onScrollOrResize, { passive: true });
                window.addEventListener('resize', onScrollOrResize);
                update();
            }

            (function initWriteCursor() {
                const dot = document.getElementById('writeCursorDot');
                const ellipse = document.getElementById('writeCursorEllipse');
                if (!dot || !ellipse) return;
                const NATIVE_SELECTOR = ['button', 'a', 'input', 'textarea', 'select', '[role="button"]',
                    '.letter-hotspot', '.canvas-node', '.canvas-toolbar'].join(', ');
                let ptrX = 0, ptrY = 0, prevFrameX = 0, prevFrameY = 0, frameInit = false;
                let ellAngle = 0, ellScaleX = 1, ellScaleY = 1, rafId = null;
                const ELLIPSE_LERP = 0.22, SPEED_SATURATE = 34, MAX_STRETCH = 0.6;

                function shortAngleLerp(current, target, factor) {
                    const diff = ((target - current + 540) % 360) - 180;
                    return current + diff * factor;
                }

                function step() {
                    if (!frameInit) { prevFrameX = ptrX; prevFrameY = ptrY; frameInit = true; }
                    const dx = ptrX - prevFrameX, dy = ptrY - prevFrameY;
                    prevFrameX = ptrX; prevFrameY = ptrY;
                    const speed = Math.hypot(dx, dy);
                    const angleTarget = speed > 0.4 ? Math.atan2(dy, dx) * (180 / Math.PI) : ellAngle;
                    const stretch = Math.min(speed / SPEED_SATURATE, 1) * MAX_STRETCH;
                    ellAngle = shortAngleLerp(ellAngle, angleTarget, ELLIPSE_LERP);
                    ellScaleX += (1 + stretch - ellScaleX) * ELLIPSE_LERP;
                    ellScaleY += (1 - stretch * 0.45 - ellScaleY) * ELLIPSE_LERP;
                    ellipse.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px) rotate(' + ellAngle +
                        'deg) scale(' + ellScaleX + ',' + ellScaleY + ')';
                    rafId = requestAnimationFrame(step);
                }
                function startLoop() { if (!rafId) rafId = requestAnimationFrame(step); }
                function stopLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
                function hideAll() {
                    dot.classList.remove('visible');
                    ellipse.classList.remove('visible');
                    document.body.classList.remove('write-native-cursor', 'custom-cursor-active');
                    stopLoop();
                }
                window.addEventListener('mousemove', (e) => {
                    const overNative = !!(e.target && e.target.nodeType === 1 && e.target.closest(NATIVE_SELECTOR));
                    document.body.classList.add('custom-cursor-active');
                    document.body.classList.toggle('write-native-cursor', overNative);
                    ptrX = e.clientX; ptrY = e.clientY;
                    dot.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px)';
                    dot.classList.add('visible');
                    ellipse.classList.add('visible');
                    startLoop();
                });
                document.addEventListener('mouseleave', hideAll);
            })();

            function setupAppearanceDropdown() {
                const trigger = document.getElementById('appearanceTrigger');
                const dropdown = document.getElementById('appearanceDropdown');
                const wrapper = document.querySelector('.topbar-appearance-wrapper');
                if (!trigger || !dropdown) return;

                const scales = ['xxl', 'xl', 'l', 'm', 's'];
                const fonts = ['satoshi', 'serif', 'special'];
                const labelMap = { satoshi: 'Sat', serif: 'Ser', special: 'SpG' };
                const scaleMap = { s: 'S', m: 'M', l: 'L', xl: 'XL', xxl: 'XXL' };

                function renderMenu() {
                    const currentFont = document.body.getAttribute('data-font') || 'satoshi';
                    const currentScale = document.body.getAttribute('data-scale') || 'xl';
                    dropdown.innerHTML = '';
                    fonts.forEach(font => {
                        scales.forEach(scale => {
                            const item = document.createElement('button');
                            item.className = 'menu-item';
                            const isActive = font === currentFont && scale === currentScale;
                            if (isActive) item.classList.add('active');
                            item.textContent = `${labelMap[font]} ${scaleMap[scale]}`;
                            item.addEventListener('click', (e) => {
                                e.stopPropagation();
                                document.body.setAttribute('data-font', font);
                                document.body.setAttribute('data-scale', scale);
                                renderMenu();
                                dropdown.classList.remove('open');
                            });
                            dropdown.appendChild(item);
                        });
                    });
                }

                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isOpen = dropdown.classList.contains('open');
                    document.querySelectorAll('.topbar-appearance-dropdown.open').forEach(d => d.classList.remove('open'));
                    if (!isOpen) {
                        renderMenu();
                        dropdown.classList.add('open');
                        positionFloatingPanel(dropdown, trigger, { align: 'right' });
                    }
                });
                document.addEventListener('click', (e) => {
                    if (wrapper && !wrapper.contains(e.target)) dropdown.classList.remove('open');
                });
            }

            function setupGridToggle() {
                const toggle = document.getElementById('gridToggle');
                const gapSpan = document.getElementById('gridInfoGap');
                if (!toggle) return;
                const rootStyles = getComputedStyle(document.documentElement);
                const gapVal = rootStyles.getPropertyValue('--swiss-gap').trim() || '24px';
                if (gapSpan) gapSpan.textContent = gapVal;
                if (document.body.classList.contains('show-grid')) toggle.classList.add('active');
                toggle.addEventListener('click', () => {
                    const currentlyActive = document.body.classList.contains('show-grid');
                    if (currentlyActive) {
                        document.body.classList.remove('show-grid');
                        toggle.classList.remove('active');
                    } else {
                        document.body.classList.add('show-grid');
                        toggle.classList.add('active');
                        assignColumnLabels();
                    }
                });
            }

            function resetDemo() {
                try { localStorage.removeItem(CANVAS_STORAGE_KEY); } catch (e) {}
                currentSectionId = null;
                letterData = buildRootData();
                activeIndex = 0;
                renderRootCanvas();
                syncView();
                updateBackButton();
                updateStatusText();
            }

            /* ═══════════════════════════════════════════════════════
               INITIAL DATA
               ═══════════════════════════════════════════════════════ */
            letterData = buildRootData();

            document.addEventListener('DOMContentLoaded', function() {
                setupViewportBlur();
                setupAppearanceDropdown();
                setupGridToggle();

                // Decide initial view
                if (currentSectionId) {
                    renderTrack();
                } else {
                    renderRootCanvas();
                }
                syncView();
                updateBackButton();
                updateStatusText();

                // HUD nav
                document.getElementById('hudPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
                document.getElementById('hudNext').addEventListener('click', () => activatePanel(activeIndex + 1));
                document.getElementById('letterHotspotPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
                document.getElementById('letterHotspotNext').addEventListener('click', () => activatePanel(activeIndex + 1));

                // Canvas toolbar
                document.querySelectorAll('[data-canvas-layout]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        applyCanvasLayout(btn.dataset.canvasLayout, true);
                        saveCanvasState();
                    });
                });
                document.getElementById('canvasSnapToggle').addEventListener('click', () => {
                    canvasSnapEnabled = !canvasSnapEnabled;
                    updateCanvasLayoutUI();
                    saveCanvasState();
                });
                document.getElementById('canvasFitBtn').addEventListener('click', () => {
                    fitCanvasToViewport();
                    saveCanvasState();
                });
                document.getElementById('canvasResetBtn').addEventListener('click', () => {
                    if (confirm('Reset canvas to default layout?')) {
                        try { localStorage.removeItem(CANVAS_STORAGE_KEY); } catch (e) {}
                        canvasLayout = 'free';
                        canvasSnapEnabled = false;
                        applyCanvasLayout('free', true);
                        setTimeout(() => { fitCanvasToViewport(); saveCanvasState(); }, 380);
                    }
                });

                // Back / wordmark
                document.getElementById('backToSectionsBtn').addEventListener('click', returnToRoot);
                document.getElementById('wordmark').addEventListener('click', () => {
                    if (currentSectionId) returnToRoot();
                });

                // View rail
                document.querySelectorAll('.rail-btn').forEach(btn => {
                    btn.addEventListener('click', () => setViewMode(btn.dataset.view));
                });

                document.getElementById('hudNew').addEventListener('click', () => {
                    alert('Add your own "New" action here.');
                });

                document.getElementById('topResetBtn').addEventListener('click', function() {
                    if (confirm('Reset everything?')) resetDemo();
                });

                // Unified click delegation (for section index cards + legacy data-jump)
                document.addEventListener('click', function(e) {
                    const jumpIdx = closestSafe(e.target, '[data-jump-index]');
                    if (jumpIdx) {
                        e.preventDefault();
                        const idx = parseInt(jumpIdx.dataset.jumpIndex, 10);
                        if (!isNaN(idx) && idx >= 0 && idx < letterData.length) activatePanel(idx);
                        return;
                    }
                    const link = closestSafe(e.target, '.idx-row') || closestSafe(e.target, '.icg-card');
                    if (link && link.dataset.jump !== undefined) {
                        e.preventDefault();
                        const idx = parseInt(link.dataset.jump, 10);
                        if (!isNaN(idx) && idx >= 0 && idx < letterData.length) activatePanel(idx);
                    }
                });

                // Carousel drag / snap
                const track = document.getElementById('lettersTrack');
                let isDragging = false, dragStartX = 0, dragStartScroll = 0;
                track.addEventListener('pointerdown', (e) => {
                    if (e.pointerType === 'touch') return;
                    if (closestSafe(e.target, 'button, a, input')) return;
                    isDragging = true;
                    dragStartX = e.clientX;
                    dragStartScroll = track.scrollLeft;
                    track.classList.add('dragging');
                    track.setPointerCapture(e.pointerId);
                });
                track.addEventListener('pointermove', (e) => {
                    if (!isDragging) return;
                    track.scrollLeft = dragStartScroll - (e.clientX - dragStartX);
                });
                track.addEventListener('pointerup', () => { isDragging = false; track.classList.remove('dragging'); });
                track.addEventListener('pointercancel', () => { isDragging = false; track.classList.remove('dragging'); });

                let settleTimer = null;
                track.addEventListener('scroll', () => {
                    clearTimeout(settleTimer);
                    settleTimer = setTimeout(() => {
                        const rect = track.getBoundingClientRect();
                        const centerX = rect.left + rect.width / 2;
                        let best = 0, bestDist = Infinity;
                        Array.from(track.children).forEach((panel, i) => {
                            const r = panel.getBoundingClientRect();
                            const c = r.left + r.width / 2;
                            const d = Math.abs(c - centerX);
                            if (d < bestDist) { bestDist = d; best = i; }
                        });
                        if (best !== activeIndex) {
                            const panels = track.querySelectorAll('.letter-panel');
                            panels.forEach(p => p.classList.remove('active'));
                            activeIndex = best;
                            panels[best].classList.add('active');
                            injectLetterContent(activeIndex);
                            updateBorderProgress();
                            syncViewRail();
                            assignColumnLabels();
                            const counter = document.getElementById('hudNavCounter');
                            if (counter) counter.textContent = `${activeIndex+1}/${letterData.length}`;
                        } else updateBorderProgress();
                    }, 150);
                }, { passive: true });

                // Keyboard
                document.addEventListener('keydown', (e) => {
                    // Ignore if typing in an input
                    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;

                    if (currentSectionId) {
                        if (e.key === 'ArrowLeft')  { activatePanel(activeIndex - 1); e.preventDefault(); }
                        if (e.key === 'ArrowRight') { activatePanel(activeIndex + 1); e.preventDefault(); }
                    }
                    if (e.key === 'Escape') {
                        const drop = document.getElementById('appearanceDropdown');
                        if (drop && drop.classList.contains('open')) { drop.classList.remove('open'); return; }
                        if (currentSectionId) { returnToRoot(); e.preventDefault(); }
                    }
                    if (e.key === 'g' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                        const toggle = document.getElementById('gridToggle');
                        if (toggle && currentSectionId) { toggle.click(); e.preventDefault(); }
                    }
                });

                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        assignColumnLabels();
                        if (!currentSectionId) {
                            // Re-fit only if not saved
                            const saved = loadCanvasState();
                            if (!saved || !saved.pan) fitCanvasToViewport();
                        }
                    }, 200);
                });
            });
        })();
    </script>
</body>
</html>
