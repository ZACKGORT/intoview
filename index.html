<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
<title>intoview.pro</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='12' fill='%23E5E567'/%3E%3Ctext x='40' y='50' font-family='system-ui,sans-serif' font-size='28' font-weight='800' text-anchor='middle' fill='%231C1C1E' letter-spacing='-0.5'%3ECX%3C/text%3E%3C/svg%3E" />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2,3,4,5,6,7,8,9&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
/* ═══ TOKENS ═══ */
:root {
  --bg:#f0f0f2; --fg:#1c1c1e; --fg-rgb:28,28,30; --nav-bg-rgb:240,240,242;
  --rule:rgba(0,0,0,.08); --faint:rgba(0,0,0,.04); --muted:rgba(0,0,0,.55);
  --accent:#E5E567; --card:#ffffff; --card-mid:#3a3a3c;
  --ink:#1c1c1e; --ink-mid:#3a3a3c; --ink-light:#8e8e93; --ink-lighter:#b0b0b6;
  --border:#e6e6e8; --peek-bg:#d0d0d5; --peek-border:rgba(28,28,30,.16);
  --shadow:0 4px 12px rgba(0,0,0,0.04);
  --shadow-hover:0 16px 40px rgba(0,0,0,0.08),0 4px 12px rgba(0,0,0,0.02);
  --shadow-floating:0 8px 32px rgba(0,0,0,0.1);
  --radius:1.5rem; --radius-sm:0.65rem;
  --font:'Satoshi',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --fs-body:15px; --max-width:1600px; --margin:16px;
  --topbar-height:56px; --hud-height:64px; --scrollbar-height:3px;
  --swiss-columns:12; --swiss-gap:24px;
  --grid-outline:rgba(0,160,255,.45); --grid-fill:rgba(0,160,255,.06);
  --card-w:240px; --col-pitch:280px; --row-pitch:320px;
  --grid-col-line:rgba(0,0,0,.07); --grid-row-line:rgba(0,0,0,.035);
  --grid-overlay-opacity:0.55;
  --impact-gain:#2F6B4F; --impact-loss:#C63A2A; --impact-accent:#8A7A1F;
}
@media (min-width:640px){:root{--margin:24px;--topbar-height:64px;--hud-height:70px}}
@media (min-width:1024px){:root{--margin:32px;--topbar-height:72px;--hud-height:76px}}
body[data-theme='dark']{
  --bg:#1c1c1e; --fg:#fff; --fg-rgb:255,255,255; --nav-bg-rgb:28,28,28;
  --rule:rgba(255,255,255,.08); --faint:rgba(255,255,255,.04); --muted:rgba(255,255,255,.55);
  --card:#232325; --card-mid:#3a3a3c;
  --ink:#fff; --ink-mid:#b0b0b6; --ink-light:#8e8e93; --ink-lighter:#6e6e73;
  --border:rgba(255,255,255,.12); --peek-bg:#35353a; --peek-border:rgba(255,255,255,.14);
  --shadow:0 4px 12px rgba(0,0,0,.4);
  --shadow-hover:0 16px 40px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.3);
  --shadow-floating:0 8px 32px rgba(0,0,0,.6);
  --grid-col-line:rgba(255,255,255,.09); --grid-row-line:rgba(255,255,255,.04);
  --impact-gain:#6FCF97; --impact-loss:#FF6B6B; --impact-accent:#E5E567;
}

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--ink-lighter) transparent}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs-body);line-height:1.6;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100vh;min-height:100dvh;
  overflow-x:hidden;transition:background .2s ease,color .2s ease;
}
body[data-browse="canvas"]{padding-bottom:calc(var(--hud-height)+20px + var(--scrollbar-height))}
body[data-reader="open"]{overflow:hidden}
::selection{background:var(--accent);color:#1c1c1e}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--ink-lighter);border-radius:var(--radius-sm)}

/* ═══ BUTTONS ═══ */
.btn{
  font-family:var(--font-mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:1px solid var(--border);color:var(--ink-mid);
  padding:5px 12px;cursor:pointer;border-radius:var(--radius-sm);font-weight:500;
  touch-action:manipulation;min-height:30px;display:inline-flex;align-items:center;justify-content:center;
  white-space:nowrap;gap:6px;transition:all .2s ease;
}
.btn:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:active{transform:scale(.96)}
.btn.ghost{color:var(--ink-light)}
.btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-grid{font-size:9px;min-height:32px;padding:4px 10px;border-color:var(--border);color:var(--ink-light)}
.btn-grid.active{background:var(--grid-outline);border-color:var(--grid-outline);color:#fff}
.btn-grid .dot-indicator{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4}
.btn-grid.active .dot-indicator{opacity:1;background:#fff}

/* ═══ TOPBAR ═══ */
.topbar{position:sticky;top:0;z-index:150;background:transparent;padding:6px 0;min-height:var(--topbar-height);display:flex;align-items:center;pointer-events:none}
.topbar .wordmark,.topbar .btn,.topbar .breadcrumb-item{pointer-events:auto}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding:0 var(--margin);max-width:var(--max-width);margin:0 auto;width:100%;pointer-events:none}
.wordmark{font-size:clamp(12px,3.5vw,20px);font-weight:700;letter-spacing:-.03em;display:flex;align-items:baseline;gap:6px;color:var(--ink);flex-shrink:0;cursor:pointer}
.wordmark .count{font-family:var(--font-mono);font-size:8px;font-weight:400;color:var(--ink-light);letter-spacing:.04em}
.topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:auto}
.topbar-right .btn{font-size:9px;min-height:32px;padding:4px 10px}
.topbar-appearance-wrapper{position:relative;display:flex;align-items:center}

.breadcrumb{display:flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-light);flex:1;min-width:0;overflow:hidden;padding:0 4px}
.breadcrumb-item{background:none;border:none;padding:3px 6px;cursor:pointer;font:inherit;color:var(--ink-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;border-radius:4px;transition:color .15s ease,background .15s ease}
.breadcrumb-item:hover{color:var(--ink);background:var(--faint)}
.breadcrumb-item.is-current{color:var(--ink);font-weight:600;cursor:default}
.breadcrumb-sep{color:var(--ink-lighter);opacity:.55;flex-shrink:0}
.mobile-back{display:none;font-size:9px;min-height:32px;padding:4px 10px;flex-shrink:0}
@media (max-width:640px){.breadcrumb{display:none}.mobile-back:not([hidden]){display:inline-flex}}

.viewport-blur{position:fixed;left:0;right:0;z-index:40;pointer-events:none;backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0);transition:backdrop-filter .3s ease,background .4s ease}
.viewport-blur.scrolling{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(8px)}
.viewport-blur-top{top:0;height:calc(var(--topbar-height) + 36px);background:linear-gradient(to bottom,rgba(var(--nav-bg-rgb),.7),rgba(var(--nav-bg-rgb),0));mask-image:linear-gradient(to bottom,black 0%,black 60%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,black 0%,black 60%,transparent 100%)}
.viewport-blur-bottom{bottom:0;height:calc(var(--hud-height) + 60px);background:linear-gradient(to top,rgba(var(--nav-bg-rgb),.7),rgba(var(--nav-bg-rgb),0));mask-image:linear-gradient(to top,black 0%,black 45%,transparent 100%);-webkit-mask-image:linear-gradient(to top,black 0%,black 45%,transparent 100%)}

/* ═══ SCROLL BORDER ═══ */
.scroll-border-top,.scroll-border-bottom{position:fixed;height:3px;background:var(--accent);z-index:160;width:0;pointer-events:none;box-shadow:0 0 10px rgba(229,229,103,.35);transition:width .12s cubic-bezier(.25,.46,.45,.94)}
.scroll-border-top{top:0;left:0;border-radius:0 2px 2px 0}
.scroll-border-bottom{bottom:0;right:0;border-radius:2px 0 0 2px}
.scroll-border-corner{position:fixed;z-index:160;pointer-events:none;background:var(--accent);opacity:0;transition:opacity .3s ease}
.scroll-border-corner.show{opacity:1}
.scroll-border-corner-tl{top:0;left:0;width:6px;height:6px}
.scroll-border-corner-tr{top:0;right:0;width:6px;height:6px}
.scroll-border-corner-bl{bottom:0;left:0;width:6px;height:6px}
.scroll-border-corner-br{bottom:0;right:0;width:6px;height:6px}

/* ═══ CURSOR ═══ */
body.custom-cursor-active{cursor:none}
.write-cursor-dot,.write-cursor-ellipse{position:fixed;top:0;left:0;z-index:500;pointer-events:none;transform:translate(-9999px,-9999px);opacity:0;transition:opacity .18s ease;will-change:transform}
.write-cursor-dot.visible,.write-cursor-ellipse.visible{opacity:1}
.write-cursor-dot{width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ink)}
.write-cursor-ellipse{width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--ink);border-radius:50%;opacity:0}
.write-cursor-ellipse.visible{opacity:.32}
body.custom-cursor-active.write-native-cursor{cursor:auto}
.write-native-cursor .write-cursor-dot,.write-native-cursor .write-cursor-ellipse{opacity:0 !important}

/* Chevron cursor — engaged when hovering a prev/next reader hotspot.
   Takes over from dot/ellipse; the circular hotspot markers are suppressed
   in this state (see .letter-hotspot rules below). */
.write-cursor-chevron{
  position:fixed;top:0;left:0;z-index:501;pointer-events:none;
  width:36px;height:36px;margin:-18px 0 0 -18px;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);
  opacity:0;transform:translate(-9999px,-9999px);
  transition:opacity .18s ease;
  will-change:transform;
}
.write-cursor-chevron svg{width:22px;height:22px;display:block;transition:transform .22s cubic-bezier(.22,1,.36,1)}
.write-cursor-chevron.visible{opacity:1}
body.cursor-chevron-prev .write-cursor-chevron svg{transform:rotate(180deg)}

/* Force-hide any native cursor when the chevron is engaged — some elements
   (like .letter-hotspot) declare their own pointer cursor that would
   otherwise override the body rule. */
body.cursor-chevron-prev,
body.cursor-chevron-next,
body.cursor-chevron-prev *,
body.cursor-chevron-next *{cursor:none !important}

@media (hover:none){
  body.custom-cursor-active{cursor:auto}
  .write-cursor-dot,.write-cursor-ellipse,.write-cursor-chevron{display:none}
}

/* ═══ CANVAS ═══ */
#canvasRoot{position:fixed;inset:0;z-index:50;overflow:hidden;background:var(--bg);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#canvasRoot.panning{cursor:grabbing}
#canvasRoot.panning .canvas-node{pointer-events:none}
body[data-browse="gallery"] #canvasRoot,
body[data-reader="open"] #canvasRoot{display:none}

.canvas-surface{position:absolute;top:0;left:0;width:0;height:0;transform-origin:0 0;will-change:transform}
.canvas-surface::before{content:'';position:absolute;top:-10000px;left:-10000px;width:20000px;height:20000px;background-image:repeating-linear-gradient(to right,var(--grid-col-line) 0 1px,transparent 1px var(--col-pitch)),repeating-linear-gradient(to bottom,var(--grid-row-line) 0 1px,transparent 1px var(--row-pitch));background-position:10000px 0,0 10000px;background-repeat:repeat;pointer-events:none;z-index:0;opacity:var(--grid-overlay-opacity);transition:opacity .2s ease}
body.show-grid .canvas-surface::before{opacity:1}
body.dragging-node .canvas-surface::before{opacity:1}

.canvas-edges{position:absolute;top:0;left:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:1}
.canvas-edge{stroke:rgba(var(--fg-rgb),.22);stroke-width:1;fill:none;stroke-dasharray:2 4;transition:opacity .4s cubic-bezier(.22,1,.36,1)}
body.has-focus .canvas-edge[data-focus="false"]{opacity:.15}

.canvas-node{position:absolute;cursor:grab;user-select:none;-webkit-user-select:none;z-index:2;transition:left .35s cubic-bezier(.22,1,.36,1),top .35s cubic-bezier(.22,1,.36,1),box-shadow .15s ease,filter .4s cubic-bezier(.22,1,.36,1),opacity .4s cubic-bezier(.22,1,.36,1);will-change:left,top,filter}
.canvas-node.is-expanded{cursor:default !important}
.canvas-node:not(.dragging){box-shadow:none !important}
.canvas-node.dragging{cursor:grabbing;transition:box-shadow .15s ease;box-shadow:0 24px 56px rgba(0,0,0,.18),0 8px 20px rgba(0,0,0,.06)}
body.has-focus .canvas-node:not(.is-focused){filter:blur(2.5px) saturate(.7);opacity:.45}
body.has-focus .canvas-node.is-focused{z-index:200 !important}

/* ═══ PROV CARD ═══ */
.prov-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px;width:var(--card-w);min-height:260px;cursor:pointer;position:relative;overflow:hidden;transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease;color:var(--ink)}
@media (hover:hover) and (pointer:fine){.prov-card:hover{box-shadow:var(--shadow-hover)}.canvas-node:not(.dragging):hover .prov-card{transform:translateY(-2px)}}
.prov-card-kicker{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--font-mono);font-size:8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light)}
.prov-card-type{display:flex;align-items:center;gap:6px}
.prov-card-type::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ink-lighter)}
.prov-card[data-type="cluster"] .prov-card-type::before,.prov-card[data-type="statement"] .prov-card-type::before{background:var(--ink)}
.prov-card[data-type="evidence"] .prov-card-type::before{background:var(--impact-gain)}
.prov-card[data-type="reply"] .prov-card-type::before{background:var(--impact-accent)}
.prov-card[data-type="update"] .prov-card-type::before{background:var(--impact-loss)}
.prov-card[data-type="identity"] .prov-card-type::before{background:var(--accent)}
.prov-card-status{padding:1px 7px;border-radius:999px;font-size:7px;border:1px solid currentColor;color:var(--ink-light);letter-spacing:.08em;white-space:nowrap}
.prov-card-status[data-status="published"]{color:var(--ink)}
.prov-card-status[data-status="verified"]{color:var(--impact-gain)}
.prov-card-status[data-status="contested"]{color:var(--impact-loss)}
.prov-card-status[data-status="revised"]{color:var(--impact-accent)}
.prov-card-status[data-status="draft"]{color:var(--ink-light);border-style:dashed}
.prov-card-status[data-status="archived"]{color:var(--ink-lighter)}
.prov-card-title{font-family:var(--font);font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--ink);margin:0}
.prov-card-deck{font-size:12.5px;line-height:1.5;color:var(--ink-mid);margin:0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.prov-card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-light)}
.prov-card-source{display:flex;align-items:center;gap:4px}
.prov-card-relations{display:flex;gap:8px}
.prov-card-relation{display:flex;align-items:center;gap:3px;opacity:.75}
.prov-card-relation strong{font-weight:600;color:var(--ink-mid)}

.prov-card[data-type="cluster"]{background:var(--accent);border-color:var(--accent);color:#1c1c1e;width:var(--card-w);min-height:280px;--fg:#1c1c1e;--fg-rgb:28,28,30;--ink:#1c1c1e;--ink-mid:rgba(28,28,30,.78);--ink-light:rgba(28,28,30,.60);--ink-lighter:rgba(28,28,30,.40);--border:rgba(28,28,30,.18);--faint:rgba(28,28,30,.06);--card:#1c1c1e;--impact-gain:#2F6B4F;--impact-loss:#C63A2A;--impact-accent:#6b5f14}
.prov-card[data-type="cluster"] .prov-card-title,.prov-card[data-type="cluster"] .prov-card-deck,.prov-card[data-type="cluster"] .prov-card-kicker,.prov-card[data-type="cluster"] .prov-card-meta{color:#1c1c1e}
.prov-card[data-type="cluster"] .prov-card-deck{color:rgba(28,28,30,.72)}
.prov-card[data-type="cluster"] .prov-card-meta{border-top-color:rgba(28,28,30,.18);color:rgba(28,28,30,.62)}
.prov-card[data-type="cluster"] .prov-card-status{color:#1c1c1e;border-color:rgba(28,28,30,.45);border-style:solid}

.prov-card[data-type="identity"]{background:#fff;border-color:rgba(0,0,0,.10);color:#1c1c1e;width:var(--card-w);min-height:300px;--fg:#1c1c1e;--ink:#1c1c1e;--ink-mid:rgba(28,28,30,.78);--ink-light:rgba(28,28,30,.58);--ink-lighter:rgba(28,28,30,.35);--border:rgba(28,28,30,.14);--faint:rgba(28,28,30,.06);--impact-gain:#2F6B4F;--impact-loss:#C63A2A;--impact-accent:#8A7A1F}
.prov-card[data-type="identity"] .prov-card-title,.prov-card[data-type="identity"] .prov-card-deck,.prov-card[data-type="identity"] .prov-card-kicker,.prov-card[data-type="identity"] .prov-card-meta{color:#1c1c1e}
.prov-card[data-type="identity"] .prov-card-deck{color:rgba(28,28,30,.62)}
.prov-card[data-type="identity"] .prov-card-meta{border-top-color:rgba(28,28,30,.14);color:rgba(28,28,30,.55)}
.prov-card[data-type="identity"] .prov-card-status{color:#1c1c1e;border-color:rgba(28,28,30,.45)}
.identity-monogram{width:48px;height:48px;border-radius:10px;background:var(--accent);color:#1c1c1e;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;letter-spacing:-.02em;flex-shrink:0}
.identity-role{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-light);margin:0}
.identity-meta{display:flex;gap:12px;font-family:var(--font-mono);font-size:9px;color:var(--ink-light);letter-spacing:.04em;text-transform:uppercase}
.identity-stats{display:flex;gap:16px;font-family:var(--font-mono);font-size:9px;color:var(--ink-light);padding-top:10px;border-top:1px solid var(--border)}
.identity-stats strong{color:var(--ink);font-weight:600;margin-right:4px}
.identity-availability{font-family:var(--font-mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:999px;border:1px solid currentColor;color:var(--ink-light)}
.identity-availability[data-availability="open"]{color:var(--impact-gain)}
.identity-availability[data-availability="engaged"]{color:var(--impact-accent)}
.identity-availability[data-availability="hiring"]{color:var(--impact-loss)}

.prov-card[data-type="index"]{width:var(--card-w);min-height:280px;padding:14px 14px 12px;gap:8px}
.prov-card[data-type="index"] .prov-card-title{font-size:15px}
.index-list{list-style:none;display:flex;flex-direction:column;margin:2px 0 0;padding:0;font-family:var(--font-mono);font-size:10px;flex:1}
.index-row{display:grid;grid-template-columns:22px 1fr auto auto;gap:8px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s ease;border-radius:4px;color:var(--ink-mid)}
.index-row:last-child{border-bottom:none}
.index-row:hover{background:var(--faint);color:var(--ink)}
.index-num{color:var(--ink-light);font-weight:600;font-size:9px}
.index-title{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.index-count{color:var(--ink-light);font-size:9px}
.index-status{font-size:6.5px;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:999px;border:1px solid currentColor;color:var(--ink-light);white-space:nowrap}
.index-status[data-status="published"]{color:var(--ink)}
.index-status[data-status="verified"]{color:var(--impact-gain)}
.index-status[data-status="contested"]{color:var(--impact-loss)}
.index-status[data-status="revised"]{color:var(--impact-accent)}
.index-status[data-status="draft"]{color:var(--ink-light);border-style:dashed}
.index-status[data-status="archived"]{color:var(--ink-lighter)}

.cluster-stack{display:flex;align-items:flex-start;gap:24px;position:relative}
.cluster-stack[data-expanded="true"]{padding-bottom:40px}
.cluster-stack-inner{position:relative;flex-shrink:0}
.cluster-title{position:relative;z-index:10}
.cluster-title > .prov-card{position:relative;z-index:10}
.cluster-peek{position:absolute;inset:0;background:var(--peek-bg);border:1px solid var(--peek-border);border-radius:var(--radius-sm);pointer-events:none;transition:transform .35s cubic-bezier(.25,.46,.45,.94),opacity .25s ease}
.cluster-peek[data-depth="1"]{transform:translate(4px,8px);z-index:4}
.cluster-peek[data-depth="2"]{transform:translate(8px,16px);z-index:3}
.cluster-peek[data-depth="3"]{transform:translate(12px,24px);z-index:2}
.cluster-peek[data-depth="4"]{transform:translate(16px,32px);z-index:1}
.cluster-peek-hit{position:absolute;left:-2px;right:-14px;top:100%;height:48px;z-index:20;cursor:pointer}
.cluster-stack[data-expanded="true"] .cluster-peek-hit{display:none}
@media (hover:none){.cluster-peek{display:none !important}}
.cluster-stack[data-expanded="true"] .cluster-peek,
.cluster-stack[data-expanded="true"] .cluster-peek-hit{display:none !important}
.cluster-leaves{position:relative;display:none;flex-wrap:wrap;align-content:flex-start;gap:16px;max-width:var(--card-w);flex-shrink:0}
.cluster-stack[data-expanded="true"] .cluster-leaves{display:flex}
@media (min-width:720px){.cluster-leaves{max-width:calc(var(--card-w) * 2 + 16px * 2 + 4px)}}
@media (min-width:1080px){.cluster-leaves{max-width:calc(var(--card-w) * 3 + 16px * 2 + 4px)}}
.cluster-leaf{cursor:pointer;animation:leaf-in .4s cubic-bezier(.25,.46,.45,.94) both}
.cluster-leaf:nth-child(1){animation-delay:.02s}
.cluster-leaf:nth-child(2){animation-delay:.06s}
.cluster-leaf:nth-child(3){animation-delay:.10s}
.cluster-leaf:nth-child(4){animation-delay:.14s}
.cluster-leaf:nth-child(5){animation-delay:.18s}
.cluster-leaf:nth-child(6){animation-delay:.22s}
@keyframes leaf-in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.cluster-leaf > .prov-card{width:var(--card-w);min-height:260px}
.cluster-collapse-chip{display:none;position:absolute;top:-32px;right:0;padding:4px 12px;background:var(--accent);color:#1c1c1e;border:1px solid rgba(28,28,30,.18);border-radius:999px;font-family:var(--font-mono);font-size:8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;z-index:15;transition:background .15s ease,transform .15s ease}
.cluster-collapse-chip:hover{background:#d8d855}
.cluster-stack[data-expanded="true"] .cluster-collapse-chip{display:inline-flex}
.cluster-browse-all{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 12px;background:none;border:1px solid var(--border);color:var(--ink-mid);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .15s ease}
.cluster-browse-all:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Array layout overrides */
body[data-layout="array"] .cluster-collapse-chip { display: none !important; }
body[data-layout="array"] .cluster-peek,
body[data-layout="array"] .cluster-peek-hit { display: none !important; }
body[data-layout="array"] .cluster-stack { padding-bottom: 0; }
body[data-layout="array"] .cluster-leaf { animation: none; }
body[data-layout="array"] .cluster-browse-all { display: none; }
body[data-layout="array"] .canvas-node { width: max-content; max-width: none; }
body[data-layout="array"] .cluster-stack { width: max-content; max-width: none; }
body[data-layout="array"] .cluster-leaves { max-width: calc(var(--card-w) * 3 + 16px * 2 + 4px); }

/* ═══ GALLERY ═══ */

#galleryBody{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}

#flow-bgtext{position:absolute;top:50%;left:0;white-space:nowrap;font-family:var(--font);font-weight:700;font-size:15vw;line-height:1;color:color-mix(in srgb,var(--ink) 5%,transparent);transform:translateY(-50%);user-select:none;pointer-events:none;letter-spacing:-.03em}

.flow-col-label{position:absolute;bottom:2.4rem;font-family:var(--font-mono);font-weight:500;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-light);writing-mode:vertical-rl;transform:rotate(180deg);pointer-events:none;white-space:nowrap}

#list-wrap{overflow-y:auto;height:100%;padding:0 var(--margin);max-width:var(--max-width);margin:0 auto}

.list-num{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-light);white-space:nowrap;min-width:1.6rem}
.list-name{font-family:var(--font);font-weight:300;flex:1;min-width:0;font-size:clamp(1.6rem,4.2vw,2.7rem);color:var(--ink-lighter);transition:color .3s,font-weight .3s}
.list-row.expanded .list-name{color:var(--ink);font-weight:600}
.list-row-head-right{display:flex;align-items:center;gap:.7rem;flex-shrink:0}
.list-count{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-light);white-space:nowrap}
.list-row-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.65,0,.35,1)}
.list-row-body-inner{overflow:hidden}
.list-row.expanded .list-row-body{grid-template-rows:1fr}
.list-strip{display:flex;flex-wrap:wrap;gap:.9rem;padding:.2rem .2rem 1.6rem;align-items:flex-start}

#grid-scroll{overflow-y:auto;height:100%;padding:0 var(--margin);max-width:var(--max-width);margin:0 auto}
#grid-scroll::-webkit-scrollbar{width:0}
#grid-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.2rem 1rem;align-items:start;padding-bottom:24px}
.g-item{cursor:pointer;position:relative;z-index:1}
.g-item:hover{z-index:30}
.g-cover-item{grid-column:1 / -1;cursor:default}
.g-cover-item .prov-card.gallery-cover-card{max-width:640px;margin:0 auto}

#galleryRoot .prov-card{width:100%;min-height:0;padding:0;gap:10px}
#galleryRoot .prov-card.face-media{padding:16px 18px 14px;min-height:260px}
#galleryRoot .prov-card.face-letter{padding:16px 18px 14px;min-height:260px}
#galleryRoot .prov-card.face-compact{padding:12px 16px 12px;gap:8px;min-height:0}
#galleryRoot .prov-card.face-media .prov-card-title{font-size:17px}
#galleryRoot .prov-card.face-letter .prov-card-title{font-size:18px;margin-top:4px}
#galleryRoot .prov-card.face-compact .prov-card-title{font-size:15px;line-height:1.25}
#galleryRoot .prov-card.face-compact .prov-card-deck{-webkit-line-clamp:4;font-size:12.5px;line-height:1.45}
#galleryRoot .prov-card.face-compact .prov-card-meta{padding-top:8px;font-size:7.5px}

.prov-card-media{width:100%;aspect-ratio:1/1;border-radius:6px;overflow:hidden;position:relative;flex-shrink:0;background:repeating-linear-gradient(-45deg,var(--card-mid) 0 6px,#1a1a1c 6px 12px)}
.prov-card-media img,.prov-card-media video{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.55) contrast(1.05);transition:filter .35s ease}
.prov-card:hover .prov-card-media img,.prov-card:hover .prov-card-media video{filter:grayscale(0) contrast(1.02)}
.prov-card-media-badge{position:absolute;top:8px;left:8px;z-index:3;font-family:var(--font-mono);font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:3px}
.prov-card-byline{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center}
.prov-card-monogram{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#1c1c1e;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-size:11px;font-weight:800;letter-spacing:-.02em;flex-shrink:0}
.prov-card-byline-text{min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.15}
.prov-card-byline-name{font-family:var(--font);font-size:12px;font-weight:600;color:var(--ink);letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prov-card-byline-date{font-family:var(--font-mono);font-size:9px;color:var(--ink-light);letter-spacing:.02em}
.prov-card-letter-mark{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);padding-bottom:8px;border-bottom:1px solid var(--border)}
.prov-card-letter-mark svg{width:11px;height:11px;flex-shrink:0}
.prov-card-backlink{display:flex;align-items:flex-start;gap:8px;padding:6px 10px;background:var(--faint);border-left:2px solid var(--impact-accent);border-radius:0 4px 4px 0;font-family:var(--font-mono);font-size:9px;letter-spacing:.02em;color:var(--ink-light);line-height:1.4;cursor:pointer;text-decoration:none;transition:background .15s ease,color .15s ease}
.prov-card-backlink:hover{background:color-mix(in srgb,var(--impact-accent) 12%,var(--faint));color:var(--ink-mid)}
.prov-card-backlink .arrow{flex-shrink:0;opacity:.8;font-size:11px;transform:translateY(-1px)}
.prov-card-backlink .parent-title{font-family:var(--font);font-size:11px;font-weight:500;color:var(--ink);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prov-card-letter-cta{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-family:var(--font-mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light)}
.prov-card-letter-cta .arrow{font-family:var(--font-mono);font-size:12px;transition:transform .2s ease}
.prov-card.face-letter:hover .prov-card-letter-cta .arrow{transform:translateX(3px);color:var(--ink)}

/* ═══ READER OVERLAY ═══ */
#carouselWrap{position:fixed;inset:0;z-index:120;background:var(--bg);overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity .28s cubic-bezier(.25,.46,.45,.94);padding-top:var(--topbar-height);padding-bottom:calc(var(--hud-height) + 40px)}
body[data-reader="open"] #carouselWrap{opacity:1;pointer-events:auto}
body[data-reader="open"] .hud-top,body[data-reader="open"] .hud-bottom{z-index:140}

.letters-viewport{position:relative;overflow:hidden;width:100vw;left:50%;margin-left:-50vw}
.letters-track{display:flex;align-items:flex-start;gap:22px;padding-top:clamp(20px,4vh,60px);padding-bottom:60px;padding-left:max(4vw,calc(50% - 520px));padding-right:max(4vw,calc(50% - 520px));overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;cursor:grab;user-select:none;box-sizing:border-box}
.letters-track.dragging{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
.letters-track::-webkit-scrollbar{display:none}
.letters-track{scrollbar-width:none;-ms-overflow-style:none}
.letter-panel{flex:0 0 auto;width:min(92vw,1000px);max-width:1000px;scroll-snap-align:center;box-sizing:border-box;opacity:.35;transition:opacity .3s ease,transform .3s ease;cursor:pointer}
.letter-panel.active{opacity:1;cursor:auto}

/* ── LETTER HOTSPOT ──
   Invisible by default. The circular chevron markers are a fallback that
   only appears on hover when the custom cursor system is unavailable.
   When the chevron cursor is engaged (body.cursor-chevron-prev/next),
   the circular markers stay hidden and the cursor itself becomes the
   directional indicator. */
.letter-hotspot{position:absolute;top:0;bottom:0;width:clamp(72px,11vw,220px);z-index:20;cursor:pointer;display:flex;align-items:center;-webkit-tap-highlight-color:transparent}
.letter-hotspot-prev{left:0;justify-content:flex-start;padding-left:clamp(12px,2.5vw,36px)}
.letter-hotspot-next{right:0;justify-content:flex-end;padding-right:clamp(12px,2.5vw,36px)}
.hotspot-chevron{
  display:flex;align-items:center;justify-content:center;
  width:48px;height:48px;border-radius:50%;
  background:var(--card);border:1px solid var(--border);
  box-shadow:var(--shadow);color:var(--ink);
  opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s cubic-bezier(.22,1,.36,1),box-shadow .2s ease,background .2s ease;
}
.hotspot-chevron svg{width:18px;height:18px;display:block}
.letter-hotspot:hover .hotspot-chevron{opacity:1}
.letter-hotspot-prev:hover .hotspot-chevron{transform:translateX(-4px);box-shadow:var(--shadow-hover)}
.letter-hotspot-next:hover .hotspot-chevron{transform:translateX(4px);box-shadow:var(--shadow-hover)}
/* Chevron cursor takes over — suppress the fallback markers entirely. */
body.cursor-chevron-prev .letter-hotspot .hotspot-chevron,
body.cursor-chevron-next .letter-hotspot .hotspot-chevron{opacity:0 !important;transform:none !important}
@media (max-width:640px){.letter-hotspot{display:none}}

.letter-card-frame{border:1px solid var(--border);border-radius:var(--radius);padding:28px clamp(20px,3vw,36px) 40px;background:var(--card);box-shadow:var(--shadow);transition:box-shadow .3s ease,transform .3s ease;position:relative}

.letter-cover{display:flex;flex-direction:column;gap:6px;padding-bottom:18px;margin-bottom:24px;border-bottom:1px solid var(--border)}

.letter-cover-name{font-family:var(--font);font-size:clamp(22px,3vw,34px);font-weight:700;letter-spacing:-.02em;color:var(--ink)}

.letter-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.letter-toolbar .letter-count{font-family:var(--font-mono);font-size:8px;color:var(--ink-light);margin-left:auto}

.statement-media{margin:0 0 24px;border-radius:var(--radius-sm);overflow:hidden;background:var(--card-mid)}
.statement-media img,.statement-media video{width:100%;display:block;max-height:70vh;object-fit:contain;background:#0e0e10}
.statement-relations{margin-top:24px;padding-top:20px;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:11px;color:var(--ink-light)}
.statement-relations h4{font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);margin:0 0 10px}
.statement-relations ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}

.cluster-reader-count{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-light);flex:1}
.cluster-reader-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cluster-reader-tile{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);text-align:left;cursor:pointer;font-family:inherit;color:var(--fg);transition:border-color .15s ease,transform .1s ease,background .15s ease}
.cluster-reader-tile:hover{border-color:var(--ink);background:var(--card)}
.cluster-reader-tile:active{transform:scale(.99)}
.cluster-reader-tile-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--font-mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase}
.cluster-reader-tile-type{color:var(--ink-light)}
.cluster-reader-tile-status{padding:1px 6px;border-radius:999px;border:1px solid currentColor;font-size:7px;font-weight:600;color:var(--ink-light)}
.cluster-reader-tile-status[data-status="published"]{color:var(--ink)}
.cluster-reader-tile-status[data-status="verified"] {color:var(--impact-gain)}
.cluster-reader-tile-status[data-status="revised"]  {color:var(--impact-accent)}
.cluster-reader-tile-status[data-status="draft"]    {color:var(--ink-light);border-style:dashed}
.cluster-reader-tile-status[data-status="archived"] {color:var(--ink-lighter)}
.cluster-reader-tile-title{font-family:var(--font);font-size:14px;font-weight:700;letter-spacing:-.005em;line-height:1.25;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.letter-bento-status[data-status="published"]{color:var(--ink)}
.letter-bento-status[data-status="verified"] {color:var(--impact-gain)}
.letter-bento-status[data-status="revised"]  {color:var(--impact-accent)}
.letter-bento-status[data-status="contested"]{color:var(--impact-loss)}
.letter-bento-status[data-status="draft"]    {color:var(--ink-light);border-style:dashed}
.letter-bento-status[data-status="archived"] {color:var(--ink-lighter)}

.letter-bento-cell.letter-bento-media{
  padding:0;
  background:var(--card-mid);
  aspect-ratio:4 / 3;
  min-height:0;
  overflow:hidden;
  position:relative;
}
.letter-bento-cell.letter-bento-media img,
.letter-bento-cell.letter-bento-media video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#0e0e10;
}
.letter-bento-cell.letter-bento-media-empty{
  background:repeating-linear-gradient(
    -45deg,
    var(--card-mid) 0 10px,
    color-mix(in srgb, var(--card-mid) 75%, var(--bg)) 10px 20px
  );
}
.letter-bento-cell.is-wide{grid-column:span 2;}

.letter-bento-hint{
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid var(--border);
  font-family:var(--font-mono);
  font-size:10px;
  font-weight:500;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-light);
  display:flex;
  align-items:center;
  gap:10px;
}
.letter-bento-hint::before{
  content:'↳';
  font-size:15px;
  opacity:.55;
  transform:translateY(-1px);
}

@media (max-width:720px){
  .letter-bento{grid-template-columns:repeat(2,minmax(0,1fr));}
  .letter-bento-cell.is-wide{grid-column:span 2;}
  .letter-bento-cell.letter-bento-media{aspect-ratio:16 / 9;}
}
@media (max-width:480px){
  .letter-bento{grid-template-columns:minmax(0,1fr);}
  .letter-bento-cell{padding:16px 18px 14px;min-height:88px;}
  .letter-bento-cell.is-wide{grid-column:span 1;}
}

/* ═══ SWISS / LETTER CONTENT ═══ */

.swiss-col-span-1{--swiss-col-span:1}.swiss-col-span-2{--swiss-col-span:2}.swiss-col-span-3{--swiss-col-span:3}.swiss-col-span-4{--swiss-col-span:4}.swiss-col-span-5{--swiss-col-span:5}.swiss-col-span-6{--swiss-col-span:6}.swiss-col-span-7{--swiss-col-span:7}.swiss-col-span-8{--swiss-col-span:8}.swiss-col-span-9{--swiss-col-span:9}.swiss-col-span-10{--swiss-col-span:10}.swiss-col-span-11{--swiss-col-span:11}.swiss-col-span-12{--swiss-col-span:12}
.swiss-offset-1{--swiss-col-start:2}.swiss-offset-2{--swiss-col-start:3}.swiss-offset-3{--swiss-col-start:4}.swiss-offset-4{--swiss-col-start:5}.swiss-offset-5{--swiss-col-start:6}.swiss-offset-6{--swiss-col-start:7}.swiss-offset-7{--swiss-col-start:8}.swiss-offset-8{--swiss-col-start:9}.swiss-offset-9{--swiss-col-start:10}.swiss-offset-10{--swiss-col-start:11}.swiss-offset-11{--swiss-col-start:12}
body.show-grid .swiss-col,body.show-grid [class*="swiss-col-span-"]{outline:1px solid var(--grid-outline);outline-offset:-1px;background:var(--grid-fill)}

.letter-heading{font-size:clamp(40px,6vw,96px);line-height:.98;letter-spacing:-.02em;color:var(--fg);margin:0}
.letter-tagline{font-size:clamp(9px,.8vw,10px);font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1.5;color:var(--fg);margin:0}
.letter-body p{font-size:15px;line-height:1.7;color:var(--ink-mid);margin:0 0 20px}

.letter-card-caption{font-size:12px;line-height:1.6;font-style:italic;color:var(--ink-light);border-left:2px solid var(--border);padding-left:12px;margin:4px 0 0}
.conversation-stack-hint{margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light);display:flex;align-items:center;gap:8px}
.conversation-stack-hint::before{content:'⤵';font-size:1rem;opacity:.4}

.letter-accordion{max-width:820px;margin:0 0 40px;border-top:1px solid var(--border)}
.letter-accordion-item{border-bottom:1px solid var(--border)}
.letter-accordion-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0;background:none;border:none;cursor:pointer;text-align:left;font-family:inherit;color:var(--fg);transition:color .15s ease}
.letter-accordion-trigger:hover{color:rgba(var(--fg-rgb),.7)}
.letter-accordion-num{font-family:var(--font-mono);font-size:11px;color:var(--ink-light);margin-right:14px;flex-shrink:0}
.letter-accordion-title{flex:1;font-size:clamp(17px,1.9vw,21px);font-weight:700;letter-spacing:-.005em;color:var(--fg)}
.letter-accordion-icon{flex-shrink:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink-light);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.letter-accordion-item.is-open .letter-accordion-icon{transform:rotate(45deg)}
.letter-accordion-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.16,1,.3,1)}
.letter-accordion-item.is-open .letter-accordion-panel{grid-template-rows:1fr}
.letter-accordion-panel-inner{overflow:hidden;min-height:0}

.letter-accordion-item.is-open .letter-accordion-panel-inner{padding-bottom:22px}

.letter-never-toggle{display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;font-family:var(--font-mono)}
.letter-never-toggle button{padding:5px 12px;border:1px solid var(--border);background:none;color:var(--ink-light);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:.04em;text-transform:uppercase;border-radius:2px;transition:color .15s,border-color .15s,background .15s}
.letter-never-toggle button.active{color:var(--fg);border-color:var(--fg);background:rgba(var(--fg-rgb),.06)}
.letter-never-list{list-style:none;display:flex;flex-direction:column;gap:26px;margin:0 0 44px;padding:0;max-width:820px;counter-reset:never-item}
.letter-never-item{display:flex;gap:16px;align-items:baseline;counter-increment:never-item}
.letter-never-marker{flex:0 0 auto;min-width:22px;font-family:var(--font-mono);font-size:13px;color:var(--ink-light)}
.letter-never-list.is-numbered .letter-never-marker::before{content:counter(never-item) "."}
.letter-never-list.is-bulleted .letter-never-marker::before{content:"—"}
.letter-never-body{flex:1;min-width:0}
.letter-never-statement{font-size:clamp(18px,2vw,22px);font-weight:700;line-height:1.3;letter-spacing:-.005em;color:var(--fg);margin:0}
.letter-never-context{margin:6px 0 0;font-size:13px;line-height:1.5;font-style:italic;color:var(--ink-light)}

.letter-index-list{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--border)}
.letter-index-list li{border-bottom:1px solid var(--border)}
.letter-index-list a,.letter-index-list .index-row-link{display:grid;grid-template-columns:32px 1fr auto auto;gap:16px;align-items:center;padding:16px 4px;text-decoration:none;color:var(--ink);font-size:15px;transition:background .15s ease;border-radius:6px;cursor:pointer}
.letter-index-list .index-row-link:hover{background:var(--faint)}
.letter-index-list .letter-index-num{font-family:var(--font-mono);font-size:10px;color:var(--ink-light);font-weight:600}
.letter-index-list .letter-index-count{font-family:var(--font-mono);font-size:10px;color:var(--ink-light)}
.letter-index-list .letter-index-status{font-family:var(--font-mono);font-size:8px;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:999px;border:1px solid currentColor;color:var(--ink-light)}
.letter-index-list .letter-index-status[data-status="published"]{color:var(--ink)}
.letter-index-list .letter-index-status[data-status="draft"]{color:var(--ink-light);border-style:dashed}
.letter-index-list .letter-index-status[data-status="archived"]{color:var(--ink-lighter)}

.edit-flow-mock{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1.5rem 1.2rem;margin:1.5rem 0}
.edit-flow-mock .step{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}

.edit-flow-mock .step-indicator{font-family:var(--font-mono);font-size:8px;font-weight:700;letter-spacing:.04em;color:var(--ink-light);min-width:28px}
.edit-flow-mock .step-desc{font-size:13px;color:var(--ink-mid)}
.edit-flow-mock .step-desc strong{color:var(--fg)}
.edit-flow-mock .timer-bar{display:flex;align-items:center;gap:10px;margin:10px 0 4px}
.edit-flow-mock .timer-bar .bar-bg{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.edit-flow-mock .timer-bar .bar-fill{height:100%;background:var(--accent);border-radius:2px}
.edit-flow-mock .timer-bar .bar-label{font-family:var(--font-mono);font-size:8px;color:var(--ink-light);min-width:36px;text-align:right}
.edit-flow-mock .btn-group{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.edit-flow-mock .btn-group .btn{font-size:7px;padding:4px 10px;min-height:26px}
.edit-flow-mock .btn-opt{background:var(--accent);border-color:var(--accent);color:#1c1c1e}
.edit-flow-mock .mock-post{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-top:12px;display:flex;gap:10px}
.edit-flow-mock .mock-post .avatar{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--fg)}
.edit-flow-mock .mock-post .post-content{flex:1;font-size:13px;color:var(--ink-mid)}
.edit-flow-mock .mock-post .post-content .meta{font-family:var(--font-mono);font-size:7px;color:var(--ink-light);display:flex;gap:8px;margin-top:4px}
.edit-flow-mock .mock-post .post-content .hold-up{font-size:7px;color:var(--ink-light);background:rgba(229,229,103,.3);padding:2px 6px;border-radius:2px;display:inline-block;margin-bottom:4px;font-family:var(--font-mono)}
.edit-flow-mock .mock-post .post-content .hold-up::before{content:'⚠️ '}

.letter-impact-doc{color:var(--ink-mid);font-family:var(--font);margin:0 0 40px}
.letter-impact-mono{font-family:var(--font-mono)}
.letter-impact-ticker-wrap{background:var(--faint);overflow:hidden;white-space:nowrap;border-top:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:var(--radius-sm)}
.letter-impact-ticker-track{display:inline-block;padding-left:100%;animation:letterImpactScroll 42s linear infinite;font-family:var(--font-mono);font-size:11.5px;padding:8px 0}
@keyframes letterImpactScroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.letter-impact-tick{margin-right:2.5em;color:var(--ink-light)}
.letter-impact-tick .up{color:var(--impact-gain);font-weight:600}
.letter-impact-tick .dn{color:var(--impact-loss);font-weight:600}
@media (prefers-reduced-motion:reduce){.letter-impact-ticker-track{animation:none;padding-left:2em}}
.letter-impact-body{padding:24px 0 8px}
.letter-impact-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-light);display:flex;gap:12px;align-items:center;margin-bottom:16px}
.letter-impact-eyebrow::before{content:'';width:22px;height:1px;background:var(--ink-lighter)}
.letter-impact-title{font-family:var(--font);font-size:clamp(30px,5vw,46px);line-height:.98;font-weight:800;letter-spacing:-.025em;margin:0 0 14px;color:var(--ink)}
.letter-impact-title em{font-style:italic;font-weight:400;color:var(--impact-accent)}
.letter-impact-subtitle{font-size:15px;max-width:56ch;color:var(--ink-light);margin:0 0 20px;line-height:1.55}
.letter-impact-filing-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;font-size:12px;color:var(--ink-light);border-top:1px solid var(--border);padding-top:16px;font-family:var(--font-mono)}
.letter-impact-filing-meta strong{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.letter-impact-method{font-size:13px;color:var(--ink-light);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:16px 0;margin:20px 0 0}

.letter-impact-exhibit{padding:4px 0 20px}
.letter-impact-exhibit-head{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--impact-accent);margin-bottom:10px}
.letter-impact-exhibit-filed{color:var(--ink-light);text-transform:none;letter-spacing:0}
.letter-impact-exhibit-title{font-family:var(--font);font-size:clamp(20px,2.6vw,27px);font-weight:700;letter-spacing:-.015em;margin:0 0 4px;color:var(--ink)}
.letter-impact-exhibit-role{font-size:12px;font-weight:600;color:var(--ink-light);margin-bottom:10px}
.letter-impact-cert{background:var(--faint);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:16px}
.letter-impact-cert-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.letter-impact-ticker-badge{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--ink-light)}
.letter-impact-status-pill{font-family:var(--font-mono);font-size:10px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--ink-light)}
.letter-impact-status-pill.is-gain{color:var(--impact-gain);border-color:var(--impact-gain)}
.letter-impact-status-pill.is-loss{color:var(--impact-loss);border-color:var(--impact-loss)}
.letter-impact-cert-body h4{font-family:var(--font);font-style:italic;font-weight:600;font-size:17px;margin:0 0 8px;color:var(--ink)}
.letter-impact-cert-body p{font-size:13.5px;line-height:1.6;color:var(--ink-light);margin:0 0 10px}
.letter-impact-refs{padding:20px 0 4px}
.letter-impact-refs h2{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink-light);margin:0 0 12px;border-top:1px solid var(--border);padding-top:16px}
.letter-impact-refs ol{margin:0;padding-left:20px}
.letter-impact-refs li{font-size:12.5px;line-height:1.6;color:var(--ink-light);margin-bottom:8px}
.letter-impact-colophon{text-align:center;font-style:italic;font-size:12px;color:var(--ink-light);padding:16px 0 20px}

/* ═══ CONTEXT MENUS ═══ */
.canvas-context-menu{position:fixed;z-index:300;min-width:208px;padding:6px 0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-floating),0 0 0 1px rgba(0,0,0,.02);font-family:var(--font-mono);display:none;user-select:none;-webkit-user-select:none;max-height:calc(100vh - 24px);overflow-y:auto}
.canvas-context-menu.open{display:block;animation:ctx-in .12s cubic-bezier(.25,.46,.45,.94)}
@keyframes ctx-in{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.ctx-section-label{padding:4px 14px 6px;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-light)}
.ctx-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 14px;background:none;border:none;text-align:left;font-family:inherit;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mid);cursor:pointer}
.ctx-item:hover{background:var(--bg);color:var(--ink)}
.ctx-item:disabled,.ctx-item[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.ctx-item:disabled:hover,.ctx-item[aria-disabled="true"]:hover{background:none;color:var(--ink-mid)}
.ctx-indicator{width:8px;height:8px;border-radius:50%;border:1px solid var(--ink-lighter);flex-shrink:0}
.ctx-item.active .ctx-indicator{background:var(--ink);border-color:var(--ink)}
.ctx-item.no-indicator .ctx-indicator{visibility:hidden}
.ctx-divider{height:1px;background:var(--border);margin:5px 0}
.ctx-hint{padding:4px 14px 6px;font-size:8px;letter-spacing:.06em;color:var(--ink-light);text-transform:none;opacity:.75;border-top:1px solid var(--border);margin-top:5px;padding-top:8px}

/* ═══ WIDGETS (canvas / zoom / minimap / browse) ═══ */
.canvas-widget{position:fixed;top:calc(var(--topbar-height) + 8px);right:var(--margin);z-index:95;display:flex;align-items:center;gap:2px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 6px 4px 4px;box-shadow:var(--shadow-floating);font-family:var(--font-mono);max-width:calc(100vw - 16px)}
.widget-grip{display:flex;align-items:center;justify-content:center;width:20px;height:26px;background:none;border:none;color:var(--ink-light);cursor:grab;border-radius:4px;flex-shrink:0;padding:0;touch-action:none}
.widget-grip:hover{background:var(--faint);color:var(--ink)}
.widget-controls{display:flex;align-items:center;gap:2px}
.widget-controls .btn{min-height:26px;font-size:8px;padding:3px 8px;border-color:transparent;color:var(--ink-mid)}
.widget-controls .btn:hover{border-color:var(--ink)}
.widget-controls .btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.widget-divider{width:1px;height:16px;background:var(--border);margin:0 4px;flex-shrink:0}
.widget-close{display:flex;align-items:center;justify-content:center;width:20px;height:26px;background:none;border:none;color:var(--ink-light);font-size:14px;line-height:1;cursor:pointer;border-radius:4px;flex-shrink:0;padding:0;margin-left:2px}
.widget-close:hover{background:var(--faint);color:var(--ink)}

.browse-widget{
  position:fixed;
  bottom:calc(12px + var(--scrollbar-height));
  left:50%;
  transform:translateX(-50%);
  z-index:98;
  display:flex;align-items:center;gap:10px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(16px) saturate(1.1);
  -webkit-backdrop-filter:blur(16px) saturate(1.1);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:4px 6px 4px 4px;
  box-shadow:var(--shadow-floating);

  max-width:calc(100vw - 16px);
  user-select:none;-webkit-user-select:none;
}
.browse-widget.dragging{cursor:grabbing;box-shadow:0 16px 40px rgba(0,0,0,.18),0 4px 12px rgba(0,0,0,.06)}
.browse-widget-scope{
  font-family:var(--font-mono);
  font-size:9px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-light);
  white-space:nowrap;
  padding:0 8px 0 6px;
  max-width:44vw;
  overflow:hidden;text-overflow:ellipsis;
}
.browse-widget-scope::before{
  content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--accent);margin-right:7px;vertical-align:middle;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 24%,transparent);
}
body[data-browse="canvas"] .browse-widget-scope::before{background:var(--ink-lighter);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink-lighter) 24%,transparent)}
#browseWidgetToggle{min-height:26px;font-size:8px;padding:4px 10px;border-color:var(--border)}
@media (max-width:640px){.browse-widget{display:none !important}}

.canvas-minimap{position:fixed;z-index:96;bottom:24px;right:var(--margin);width:220px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-floating);font-family:var(--font-mono);user-select:none;-webkit-user-select:none;overflow:hidden}
@media (max-width:640px){.canvas-minimap{width:180px}.minimap-viewport{height:110px}}
.minimap-header{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 4px;border-bottom:1px solid var(--border)}
.minimap-grip{display:flex;align-items:center;justify-content:center;width:20px;height:22px;background:none;border:none;color:var(--ink-light);cursor:grab;border-radius:4px;flex-shrink:0;padding:0;touch-action:none}

#hudCanvas,#hudGallery{bottom:calc(14px + var(--scrollbar-height) + env(safe-area-inset-bottom,0px));padding:0;gap:8px;min-height:0;background:transparent;border:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;max-width:calc(100vw - 24px);pointer-events:none}

.topbar-appearance-dropdown{position:fixed;min-width:132px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-floating);padding:4px 0;z-index:200;display:none;flex-direction:column}

const CARDS = new Map();
const CLUSTERS = new Map();
const CLUSTER_ORDER = [];
const CARD_ORDER = [];

function buildData() {
  CLUSTER_SPECS.forEach(spec => {
    const c = {
      id: spec.id, type: 'cluster', num: spec.num, title: spec.title, deck: spec.deck,
      clusterId: spec.id, section: null,
      cardIds: [],
      provenance: spec.provenance,
      relationships: { references: [], replies: [], updates: [] },
      parentId: null, media: null, fullContent: null
    };
    CLUSTERS.set(c.id, c);
    CARDS.set(c.id, c);
    CLUSTER_ORDER.push(c.id);
  });

  EDITORIAL_SPECS.forEach(spec => {
    const c = Object.assign({}, spec, { section: null, parentId: null, media: null });
    CARDS.set(c.id, c);
    const cl = CLUSTERS.get(c.clusterId);
    if (cl) cl.cardIds.push(c.id);
  });

  GALLERY_CARD_SPECS.forEach(r => {
    const c = {
      id: r.id, type: r.type, format: 'writing',
      title: r.title, deck: r.deck,
      clusterId: r.clusterId, section: r.section || null,
      provenance: {
        author: 'Zack Gort', date: r.date,
        source: 'intoview.pro / ' + (r.section || r.clusterId),
        status: r.status || 'published'
      },
      relationships: { references: r.refs || [], replies: [], updates: r.upd || [] },
      parentId: r.parentId || null, media: r.media || null, fullContent: null
    };
    CARDS.set(c.id, c);
    const cl = CLUSTERS.get(c.clusterId);
    if (cl) cl.cardIds.push(c.id);
  });

  CLUSTERS.forEach(c => {
    c.cardIds.sort((a, b) => {
      const ca = CARDS.get(a), cb = CARDS.get(b);
      return (ca.provenance.date || '') < (cb.provenance.date || '') ? -1 : 1;
    });
  });

  CLUSTERS.forEach(cl => cl.cardIds.forEach(id => CARD_ORDER.push(id)));
  CARD_ORDER.sort((a, b) => {
    const ca = CARDS.get(a), cb = CARDS.get(b);
    return (ca.provenance.date || '') < (cb.provenance.date || '') ? -1 : 1;
  });

  const indexMeta = {
    id: 'index', type: 'index', num: '—',
    title: 'Index', deck: 'Every section, with card counts and provenance status.',
    provenance: { status: 'published', source: 'intoview.pro', author: 'Zack Gort', date: '2026' },
    relationships: { references: [], replies: [], updates: [] },
    clusterId: null, section: null, parentId: null, media: null,
    fullContent: buildIndexContent()
  };
  CARDS.set('index', indexMeta);

  CARDS.set('identity', Object.assign({}, PROFILE, {
    relationships: { references: [], replies: [], updates: [] },
    clusterId: null, section: null, parentId: null, media: null, num: '—'
  }));
}

function buildIndexContent() {
  const rows = CLUSTER_ORDER.map(id => {
    const c = CLUSTERS.get(id);
    return `<li><a class="index-row-link" data-cluster-id="${escapeHtml(c.id)}" role="button" tabindex="0">
      <span class="letter-index-num">${escapeHtml(c.num)}</span>
      <span>${escapeHtml(c.title)}</span>
      <span class="letter-index-count">${c.cardIds.length} ${c.cardIds.length === 1 ? 'card' : 'cards'}</span>
      <span class="letter-index-status" data-status="${escapeHtml(c.provenance.status)}">${escapeHtml(c.provenance.status)}</span>
    </a></li>`;
  }).join('');
  return `
    <div class="swiss-grid">
      <h2 class="swiss-col swiss-col-span-9 letter-heading" style="font-weight:800">Index</h2>
      <p class="swiss-col swiss-col-span-7 letter-tagline">Every section on this canvas, with card counts and provenance status.</p>
      <div class="swiss-col swiss-col-span-10">
        <ol class="letter-index-list">${rows}</ol>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════
   ROUTER
   ═══════════════════════════════════════════════════════════ */
function parseHash() {
  const raw = (location.hash || '').replace(/^#\/?/, '');
  if (!raw) return { mode: 'canvas' };
  const parts = raw.split('/').filter(Boolean);

  if (parts[0] === 'gallery') {
    return { mode: 'gallery', scope: null, view: ['flow','list','grid'].includes(parts[1]) ? parts[1] : 'flow' };
  }
  if (parts[0] === 'g') {
    if (!parts[1]) return { mode: 'gallery', scope: null, view: null };
    if (!CLUSTERS.has(parts[1])) return { mode: 'canvas' };
    return { mode: 'gallery', scope: parts[1], section: parts[2] || null, view: null };
  }
  if (parts[0] === 'card' || parts[0] === 'c') {
    const id = parts.slice(1).join('/');
    if (!CARDS.has(id)) return { mode: 'canvas' };
    return { mode: 'reader', cardId: id };
  }
  if (CLUSTERS.has(parts[0])) {
    const id = parts.length === 1 ? parts[0] : parts.join('/');
    if (CARDS.has(id)) return { mode: 'reader', cardId: id };
    return { mode: 'gallery', scope: parts[0], section: null, view: null };
  }
  return { mode: 'canvas' };
}

function routeHash(route) {
  if (!route || route.mode === 'canvas') return '#/';
  if (route.mode === 'gallery') {
    if (!route.scope) return '#/g' + (route.view && route.view !== 'flow' ? '/' + route.view : '');
    return '#/g/' + route.scope + (route.section ? '/' + route.section : '');
  }
  if (route.mode === 'reader') return '#/card/' + route.cardId;
  return '#/';
}

function navigate(route, replace) {
  const hash = routeHash(route);
  if (hash === (location.hash || '#/')) {
    handleRoute();
    return;
  }
  if (replace) history.replaceState(null, '', hash);
  else location.hash = hash;
  if (replace) handleRoute();
}

function handleRoute() {
  const route = parseHash();
  currentRoute = route;
  closeContextMenu();
  closeGalleryContextMenu();

  if (route.mode === 'reader') {
    openReaderRoute(route.cardId);
  } else {
    lastBrowseRoute = route;
    if (route.mode === 'canvas') browseMode = 'canvas';
    else if (route.mode === 'gallery') {
      browseMode = 'gallery';
      if (route.view) galleryView = route.view;
    }
    syncView();
    if (browseMode === 'canvas') renderCanvas();
    else renderGalleryView();
  }
  updateBreadcrumb();
  updateMobileBack();
  updateMobileHud();
}

/* ═══════════════════════════════════════════════════════════
   VIEW SYNC
   ═══════════════════════════════════════════════════════════ */
function syncView() {
  const readerOpen = currentRoute.mode === 'reader';
  document.body.dataset.browse = browseMode;
  document.body.dataset.reader = readerOpen ? 'open' : 'closed';

  document.getElementById('canvasRoot').hidden = readerOpen || browseMode !== 'canvas';
  document.getElementById('galleryRoot').hidden = readerOpen || browseMode !== 'gallery';
  document.getElementById('carouselWrap').style.display = readerOpen ? '' : 'none';

  document.getElementById('hudTop').hidden = !readerOpen;
  document.getElementById('hud').hidden = !readerOpen;

  const showMobileCanvas = !readerOpen && browseMode === 'canvas' && isMobile();
  const showMobileGallery = !readerOpen && browseMode === 'gallery' && isMobile();
  document.getElementById('hudCanvas').hidden = !showMobileCanvas;
  document.getElementById('hudGallery').hidden = !showMobileGallery;

  applyWidgetVisibility();
  applyMinimapVisibility();
  applyZoomHudVisibility();
  applyHudTopPos();
  applyBrowseWidgetVisibility();
  updateBrowseChrome();
  updateStatusText();
}

function updateBrowseChrome() {
  const scope = document.getElementById('browseWidgetScope');
  const toggle = document.getElementById('browseWidgetToggle');
  if (scope) {
    if (browseMode === 'canvas') scope.textContent = 'Canvas';
    else {
      const cl = currentRoute.scope ? CLUSTERS.get(currentRoute.scope) : null;
      scope.textContent = cl ? cl.title : 'Gallery';
    }
  }
  if (toggle) {
    toggle.textContent = browseMode === 'gallery' ? 'Canvas' : 'Gallery ↗';
    toggle.title = browseMode === 'gallery' ? 'Back to canvas' : 'Open the gallery';
  }
  updateContextMenuBrowseState();
}

function updateContextMenuBrowseState() {
  const menu = document.getElementById('canvasContextMenu');
  if (!menu) return;
  const toggleGal = menu.querySelector('[data-action="toggle-gallery"]');
  if (toggleGal) toggleGal.classList.toggle('active', browseMode === 'gallery');
  menu.querySelectorAll('[data-gallery-view]').forEach(b => {
    const isCurrent = browseMode === 'gallery' && b.dataset.galleryView === galleryView;
    b.classList.toggle('active', isCurrent);
  });
  const bw = menu.querySelector('[data-action="toggle-browse-widget"]');
  if (bw) bw.classList.toggle('active', browseWidgetVisible);
  const w = menu.querySelector('[data-action="toggle-widget"]');
  if (w) w.classList.toggle('active', widgetVisible);
  const m = menu.querySelector('[data-action="toggle-minimap"]');
  if (m) m.classList.toggle('active', minimapVisible);
  const z = menu.querySelector('[data-action="toggle-zoomhud"]');
  if (z) z.classList.toggle('active', zoomHudVisible);
  menu.querySelectorAll('[data-canvas-layout]').forEach(b => {
    b.classList.toggle('active', b.dataset.canvasLayout === canvasLayout);
  });
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = '';
  const items = [];
  if (browseMode === 'canvas' && currentRoute.mode === 'canvas') {
    items.push({ label: 'Canvas', current: true, route: { mode: 'canvas' } });
  } else if (browseMode === 'gallery') {
    items.push({ label: 'Canvas', route: { mode: 'canvas' } });
    items.push({ label: 'Gallery', current: !currentRoute.scope, route: { mode: 'gallery', scope: null, view: galleryView } });
    if (currentRoute.scope) {
      const cl = CLUSTERS.get(currentRoute.scope);
      if (cl) items.push({ label: cl.title, current: !currentRoute.section, route: { mode: 'gallery', scope: currentRoute.scope } });
      if (currentRoute.section) items.push({ label: currentRoute.section, current: true, route: null });
    }
  } else if (currentRoute.mode === 'reader') {
    items.push({ label: 'Canvas', route: { mode: 'canvas' } });
    const card = CARDS.get(currentRoute.cardId);
    if (card) {
      if (card.clusterId && CLUSTERS.has(card.clusterId)) {
        const cl = CLUSTERS.get(card.clusterId);
        items.push({ label: cl.title, route: { mode: 'reader', cardId: cl.id } });
      } else {
        items.push({ label: 'Gallery', route: { mode: 'gallery', scope: null } });
      }
      items.push({ label: card.title, current: true, route: null });
    }
  }
  items.forEach((item, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'breadcrumb-sep';
      sep.textContent = '/';
      bc.appendChild(sep);
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'breadcrumb-item' + (item.current ? ' is-current' : '');
    btn.textContent = item.label;
    if (!item.current && item.route) btn.addEventListener('click', () => navigate(item.route));
    bc.appendChild(btn);
  });
}

function updateMobileBack() {
  const btn = document.getElementById('mobileBackBtn');
  if (!btn) return;
  if (currentRoute.mode === 'canvas' && browseMode === 'canvas') { btn.hidden = true; return; }
  btn.hidden = false;
  if (currentRoute.mode === 'reader') btn.textContent = '← Back';
  else if (currentRoute.scope) btn.textContent = '← Gallery';
  else btn.textContent = '← Canvas';
}

function updateStatusText() {
  const sc = document.getElementById('hudStatusCount');
  const st = document.getElementById('hudStatusText');
  if (!sc || !st) return;
  if (currentRoute.mode === 'reader') {
    const card = CARDS.get(currentRoute.cardId);
    sc.textContent = String(readerCards.length);
    st.textContent = card ? card.title : '';
  } else if (browseMode === 'gallery') {
    const n = currentRoute.scope
      ? (CLUSTERS.get(currentRoute.scope)?.cardIds.length || 0)
      : getTotalCardCount();
    sc.textContent = String(n);
    st.textContent = currentRoute.scope ? CLUSTERS.get(currentRoute.scope).title : 'Gallery';
  } else {
    sc.textContent = String(CARDS.size);
    st.textContent = 'Canvas · ' + canvasLayout;
  }
}

/* ═══════════════════════════════════════════════════════════
   CANVAS RENDER
   ═══════════════════════════════════════════════════════════ */
function getCanvasNodes() {
  return [
    { id: 'identity', kind: 'identity', card: CARDS.get('identity') },
    { id: 'index',    kind: 'index',    card: CARDS.get('index') }
  ].concat(CLUSTER_ORDER.map(id => ({ id, kind: 'cluster', card: CLUSTERS.get(id) })));
}
function getNodeOrder() { return ['identity', 'index', ...CLUSTER_ORDER]; }

function applyFocus() {
  const hasFocus = expandedClusters.size > 0 && canvasLayout !== 'array';
  document.body.classList.toggle('has-focus', hasFocus);
  document.querySelectorAll('.canvas-node[data-kind="cluster"]').forEach(node => {
    node.classList.toggle('is-focused', expandedClusters.has(node.dataset.clusterId));
  });
}

function renderCanvas() {
  const surface = document.getElementById('canvasSurface');
  const edges = document.getElementById('canvasEdges');
  Array.from(surface.children).forEach(ch => { if (ch !== edges) ch.remove(); });
  edges.innerHTML = '';
  minimapNodeEls.clear();

  const specs = getCanvasNodeSpecsWithPositions();
  specs.forEach(spec => {
    const wrap = document.createElement('div');
    wrap.className = 'canvas-node';
    wrap.dataset.nodeId = spec.id;
    wrap.dataset.kind = spec.kind;
    if (spec.kind === 'identity') wrap.appendChild(renderIdentityCard(spec.card));
    else if (spec.kind === 'index') wrap.appendChild(renderIndexCard(spec.card));
    else {
      wrap.dataset.clusterId = spec.card.id;
      renderClusterStack(wrap, spec.card);
    }
    surface.appendChild(wrap);
    attachNodeHandlers(wrap);
  });

  restPositions.clear();
  specs.forEach(spec => {
    const node = surface.querySelector(`[data-node-id="${CSS.escape(spec.id)}"]`);
    if (!node) return;
    restPositions.set(spec.id, { x: spec.x, y: spec.y });
    node.style.left = spec.x + 'px';
    node.style.top = spec.y + 'px';
    node.style.zIndex = String(++topZ);
  });

  if (canvasLayout === 'array') {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => packArray());
    });
  } else if (isMobile()) {
    requestAnimationFrame(() => {
      reflowMobileColumn();
      setTimeout(reflowMobileColumn, 100);
      setupResizeObserver();
    });
  } else {
    refineIdentityIndexStack();
  }

  document.body.dataset.layout = canvasLayout;
  applyFocus();

  if (canvasLayout !== 'array') {
    if (panOffset.x === 0 && panOffset.y === 0) requestAnimationFrame(fitCanvasToViewport);
    else applyPanTransform();
  }

  attachCanvasHandlers();
  requestAnimationFrame(() => drawCanvasEdges());
  queueMinimapLayout();
}

function getCanvasNodeSpecsWithPositions() {
  const specs = getCanvasNodes();
  const saved = loadCanvasState();
  const savedPositions = (saved && saved.positions) || {};
  const computed = getLayoutPositions(canvasLayout, specs);
  return specs.map(spec => {
    if (isMobile() || canvasLayout === 'array') {
      const pos = computed[spec.id] || { x: 0, y: 0 };
      return Object.assign({}, spec, { x: pos.x, y: pos.y });
    }
    const sp = savedPositions[spec.id];
    const cp = computed[spec.id] || { x: 0, y: 0 };
    return Object.assign({}, spec, { x: sp ? sp.x : cp.x, y: sp ? sp.y : cp.y });
  });
}

function renderClusterStack(wrap, cluster) {
  const stack = document.createElement('div');
  stack.className = 'cluster-stack';
  stack.dataset.expanded = expandedClusters.has(cluster.id) ? 'true' : 'false';

  const stackInner = document.createElement('div');
  stackInner.className = 'cluster-stack-inner';

  const title = document.createElement('div');
  title.className = 'cluster-title';

  const hit = document.createElement('div');
  hit.className = 'cluster-peek-hit';
  hit.dataset.action = 'expand';
  title.appendChild(hit);

  const peekCount = Math.min(cluster.cardIds.length, 4);
  for (let d = peekCount; d >= 1; d--) {
    const peek = document.createElement('div');
    peek.className = 'cluster-peek';
    peek.dataset.depth = String(d);
    title.appendChild(peek);
  }
  title.appendChild(renderCompactCard(cluster));
  stackInner.appendChild(title);
  stack.appendChild(stackInner);

  const leaves = document.createElement('div');
  leaves.className = 'cluster-leaves';

  const MAX_LEAVES = 6;
  const visible = cluster.cardIds.slice(0, MAX_LEAVES);
  const overflow = cluster.cardIds.length - visible.length;

  visible.forEach(cardId => {
    const card = CARDS.get(cardId);
    if (!card) return;
    const leaf = document.createElement('div');
    leaf.className = 'cluster-leaf';
    leaf.dataset.cardId = card.id;
    leaf.dataset.clusterId = card.clusterId;
    leaf.appendChild(renderCompactCard(card));
    // Native click handler — bypasses the drag pipeline so leaves are always
    // clickable even inside an expanded cluster.
    leaf.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      openReader(card.id);
    });
    leaves.appendChild(leaf);
  });

  if (overflow > 0) {
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'cluster-browse-all';
    more.textContent = `Browse all ${cluster.cardIds.length} →`;
    more.dataset.clusterId = cluster.id;
    more.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      navigate({ mode: 'gallery', scope: cluster.id });
    });
    leaves.appendChild(more);
  }

  stack.appendChild(leaves);

  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'cluster-collapse-chip';
  chip.textContent = 'Collapse';
  chip.addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    toggleCluster(cluster.id);
  });
  stack.appendChild(chip);

  wrap.appendChild(stack);
  if (expandedClusters.has(cluster.id)) wrap.classList.add('is-expanded');
}

/* ═══════════════════════════════════════════════════════════
   COMPACT CARD RENDERERS (canvas)
