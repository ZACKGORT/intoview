<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>intoview.pro · manifesto</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='12' fill='%23E5E567'/%3E%3Ctext x='40' y='50' font-family='system-ui, -apple-system, sans-serif' font-size='28' font-weight='800' text-anchor='middle' fill='%231C1C1E' letter-spacing='-0.5'%3ECX%3C/text%3E%3C/svg%3E" />

    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2,3,4,5,6,7,8,9&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Space+Grotesk:wght@300;400;500;700&family=Syne:wght@400;600;700;800&family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Outfit:wght@900&family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,900;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Special+Gothic:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ── design system ── */
        :root {
            --bg: #f0f0f2;
            --fg: #1c1c1e;
            --fg-rgb: 28, 28, 30;
            --nav-bg-rgb: 240, 240, 242;
            --rule: rgba(0, 0, 0, .08);
            --faint: rgba(0, 0, 0, .04);
            --muted: rgba(0, 0, 0, .55);
            --accent: #E5E567;
            --accent-text: #E5E567;
            --card: #ffffff;
            --card-dark: #1c1c1e;
            --card-mid: #3a3a3c;
            --ink: #1c1c1e;
            --ink-mid: #3a3a3c;
            --ink-light: #8e8e93;
            --ink-lighter: #b0b0b6;
            --border: #e6e6e8;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.02);
            --shadow-floating: 0 8px 32px rgba(0, 0, 0, 0.1);
            --radius: 1.5rem;
            --radius-sm: 0.65rem;
            --font: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
            --fs-body: 15px;
            --fs-display: 54px;
            --max-width: 1600px;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --margin: 16px;
            --topbar-height: 56px;
            --hud-height: 64px;
            --hud-top-height: 44px;
            --scrollbar-height: 3px;
            --page-scale: 1;
            --scale-mult: 1;
            --nav-scale: 1;
            --l-sp-1: 8px;
            --l-sp-2: 16px;
            --l-sp-3: 24px;
            --l-sp-4: 32px;
            --l-sp-5: 40px;
            --l-sp-6: 56px;
            --l-hud-clearance: 96px;

            /* Swiss grid vars */
            --swiss-columns: 12;
            --swiss-gap: 24px;
            --swiss-container-max: 1200px;
            --swiss-padding: 0px;
            --grid-outline: rgba(0, 160, 255, 0.45);
            --grid-fill: rgba(0, 160, 255, 0.06);
            --grid-gutter: rgba(0, 160, 255, 0.10);
            --grid-label-bg: rgba(0, 160, 255, 0.12);
        }
        @media (min-width: 640px) {
            :root {
                --margin: 24px;
                --topbar-height: 64px;
                --hud-height: 70px;
                --hud-top-height: 48px;
            }
        }
        @media (min-width: 1024px) {
            :root {
                --margin: 32px;
                --topbar-height: 72px;
                --hud-height: 76px;
                --hud-top-height: 52px;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            font-size: var(--fs-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: calc(var(--hud-height) + 20px + var(--scrollbar-height));
            overflow-x: hidden;
            transition: background 0.2s ease, color 0.2s ease;
        }
        ::selection {
            background: var(--accent);
            color: var(--ink);
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--ink-lighter);
            border-radius: var(--radius-sm);
        }
        html {
            scrollbar-width: thin;
            scrollbar-color: var(--ink-lighter) transparent;
        }

        .letters-track::-webkit-scrollbar {
            display: none;
        }
        .letters-track {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .t-micro {
            font-family: var(--font-mono);
            font-size: 7px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink-light);
            line-height: 1.4;
        }
        .btn {
            font-family: var(--font-mono);
            font-size: 8px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--ink-mid);
            padding: 5px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: var(--radius-sm);
            font-weight: 500;
            touch-action: manipulation;
            min-height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            gap: 6px;
        }
        .btn:hover {
            background: var(--ink);
            color: var(--card);
            border-color: var(--ink);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn.ghost {
            border-color: var(--border);
            color: var(--ink-light);
        }
        .btn.ghost:hover {
            background: var(--ink);
            color: var(--card);
            border-color: var(--ink);
        }
        .btn-primary {
            background: var(--ink);
            color: var(--card);
            border-color: var(--ink);
        }
        .btn-primary:hover {
            background: var(--ink-mid);
            border-color: var(--ink-mid);
        }
        .btn-grid {
            font-size: 9px;
            letter-spacing: 0.06em;
            min-height: 32px;
            padding: 4px 10px;
            border-color: var(--border);
            color: var(--ink-light);
            transition: all 0.2s ease;
            position: relative;
        }
        .btn-grid.active {
            background: var(--grid-outline);
            border-color: var(--grid-outline);
            color: white;
            box-shadow: 0 0 0 1px var(--grid-outline);
        }
        .btn-grid.active:hover {
            background: rgba(0, 160, 255, 0.7);
            border-color: rgba(0, 160, 255, 0.7);
            color: white;
        }
        .btn-grid .dot-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.4;
            transition: opacity 0.2s ease;
        }
        .btn-grid.active .dot-indicator {
            opacity: 1;
            background: white;
        }

        /* ── topbar ── */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 150;
            background: transparent;
            padding: 6px 0;
            min-height: var(--topbar-height);
            display: flex;
            align-items: center;
        }
        .topbar .wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 0 var(--margin);
            max-width: var(--max-width);
            margin: 0 auto;
            width: 100%;
        }
        .wordmark {
            font-family: var(--font);
            font-size: clamp(12px, 3.5vw, 20px);
            font-weight: 700;
            letter-spacing: -0.03em;
            display: flex;
            align-items: baseline;
            gap: 6px;
            color: var(--ink);
            flex-shrink: 0;
        }
        .wordmark .count {
            font-family: var(--font-mono);
            font-size: 8px;
            font-weight: 400;
            color: var(--ink-light);
            letter-spacing: 0.04em;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .topbar-right .btn {
            font-size: 9px;
            min-height: 32px;
            padding: 4px 10px;
        }
        .topbar-right .btn-icon {
            width: 32px;
            padding: 0;
            font-size: 15px;
        }

        /* ── viewport blur ── */
        .viewport-blur {
            position: fixed;
            left: 0;
            right: 0;
            z-index: 40;
            pointer-events: none;
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            transition: backdrop-filter 0.3s ease, background 0.4s ease;
        }
        .viewport-blur.scrolling {
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(8px);
        }
        .viewport-blur-top {
            top: 0;
            height: calc(var(--topbar-height) + 36px);
            background: linear-gradient(to bottom, rgba(var(--nav-bg-rgb), 0.7), rgba(var(--nav-bg-rgb), 0));
            mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
        }
        .viewport-blur-bottom {
            bottom: 0;
            height: calc(var(--hud-height) + 60px);
            background: linear-gradient(to top, rgba(var(--nav-bg-rgb), 0.7), rgba(var(--nav-bg-rgb), 0));
            mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
        }

        /* ── carousel ── */
        .letters-viewport {
            position: relative;
            overflow: hidden;
            width: 100vw;
            left: 50%;
            margin-left: -50vw;
        }
        .letters-track {
            display: flex;
            align-items: flex-start;
            gap: 22px;
            padding-top: clamp(20px, 4vh, 60px);
            padding-bottom: 60px;
            padding-left: max(4vw, calc(50% - 520px));
            padding-right: max(4vw, calc(50% - 520px));
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            cursor: grab;
            user-select: none;
            box-sizing: border-box;
        }
        .letters-track.dragging {
            cursor: grabbing;
            scroll-snap-type: none;
            scroll-behavior: auto;
        }
        .letter-panel {
            flex: 0 0 auto;
            width: min(92vw, 1000px);
            max-width: 1000px;
            scroll-snap-align: center;
            box-sizing: border-box;
            opacity: 0.35;
            transition: opacity 0.3s ease, transform 0.3s ease;
            cursor: pointer;
        }
        .letter-panel.active {
            opacity: 1;
            cursor: auto;
            transform: scale(1);
        }
        .letter-hotspot {
            position: absolute;
            top: 0;
            bottom: 0;
            width: clamp(56px, 9vw, 180px);
            z-index: 20;
        }
        .letter-hotspot-prev {
            left: 0;
            cursor: url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2744%27%20height%3D%2744%27%3E%3Ccircle%20cx%3D%2722%27%20cy%3D%2722%27%20r%3D%2720%27%20fill%3D%27rgba%2820%2C20%2C20%2C0.55%29%27/%3E%3Cpath%20d%3D%27M26%2012%20L16%2022%20L26%2032%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E') 22 22, w-resize;
        }
        .letter-hotspot-next {
            right: 0;
            cursor: url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2744%27%20height%3D%2744%27%3E%3Ccircle%20cx%3D%2722%27%20cy%3D%2722%27%20r%3D%2720%27%20fill%3D%27rgba%2820%2C20%2C20%2C0.55%29%27/%3E%3Cpath%20d%3D%27M18%2012%20L28%2022%20L18%2032%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E') 22 22, e-resize;
        }

        .letter-card-frame {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px clamp(20px, 3vw, 36px) 40px;
            background: var(--card);
            box-shadow: var(--shadow);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            position: relative;
        }
        .letter-panel.active .letter-card-frame {
            box-shadow: var(--shadow-hover);
        }
        .letter-panel.active .letter-card-frame:hover {
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.04);
            transform: translateY(-2px);
        }
        .letter-cover {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 18px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .letter-cover-kicker {
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-light);
        }
        .letter-cover-name {
            font-family: var(--font);
            font-size: clamp(22px, 3vw, 34px);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--ink);
        }
        .letter-cover-deck {
            font-family: var(--font);
            font-size: clamp(13px, 1vw, 16px);
            line-height: 1.5;
            color: var(--ink-light);
            max-width: 520px;
        }
        .letter-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .letter-toolbar .letter-count {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--ink-light);
            margin-left: auto;
        }

        /* ── Swiss Grid System ──
           Column placement composed from two custom properties so that
           `swiss-col-span-6 swiss-offset-3` resolves to `grid-column: 4 / span 6`. */
        .swiss-container {
            max-width: var(--swiss-container-max);
            margin: 0 auto;
            padding: 0 var(--swiss-padding);
            width: 100%;
        }
        .swiss-grid {
            display: grid;
            grid-template-columns: repeat(var(--swiss-columns), 1fr);
            gap: var(--swiss-gap);
            width: 100%;
            position: relative;
        }
        .swiss-grid > * {
            min-width: 0;
        }
        .swiss-col,
        [class*="swiss-col-span-"] {
            grid-column: var(--swiss-col-start, auto) / span var(--swiss-col-span, 1);
            position: relative;
            transition: outline 0.2s ease, background 0.2s ease;
            min-width: 0;
        }
        .swiss-col-span-1  { --swiss-col-span: 1; }
        .swiss-col-span-2  { --swiss-col-span: 2; }
        .swiss-col-span-3  { --swiss-col-span: 3; }
        .swiss-col-span-4  { --swiss-col-span: 4; }
        .swiss-col-span-5  { --swiss-col-span: 5; }
        .swiss-col-span-6  { --swiss-col-span: 6; }
        .swiss-col-span-7  { --swiss-col-span: 7; }
        .swiss-col-span-8  { --swiss-col-span: 8; }
        .swiss-col-span-9  { --swiss-col-span: 9; }
        .swiss-col-span-10 { --swiss-col-span: 10; }
        .swiss-col-span-11 { --swiss-col-span: 11; }
        .swiss-col-span-12 { --swiss-col-span: 12; }

        .swiss-offset-1  { --swiss-col-start: 2; }
        .swiss-offset-2  { --swiss-col-start: 3; }
        .swiss-offset-3  { --swiss-col-start: 4; }
        .swiss-offset-4  { --swiss-col-start: 5; }
        .swiss-offset-5  { --swiss-col-start: 6; }
        .swiss-offset-6  { --swiss-col-start: 7; }
        .swiss-offset-7  { --swiss-col-start: 8; }
        .swiss-offset-8  { --swiss-col-start: 9; }
        .swiss-offset-9  { --swiss-col-start: 10; }
        .swiss-offset-10 { --swiss-col-start: 11; }
        .swiss-offset-11 { --swiss-col-start: 12; }

        .swiss-meta {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-light);
            margin-bottom: 0.5rem;
        }
        .swiss-title {
            font-family: var(--font);
            font-size: clamp(32px, 5vw, 64px);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.05;
            color: var(--ink);
        }
        .swiss-subtitle {
            font-family: var(--font);
            font-size: clamp(14px, 1.2vw, 20px);
            font-weight: 400;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink-mid);
        }
        .swiss-body {
            font-family: var(--font);
            font-size: clamp(14px, 1vw, 18px);
            line-height: 1.7;
            color: var(--ink-mid);
        }
        .swiss-large {
            font-family: var(--font);
            font-size: clamp(48px, 8vw, 96px);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            color: var(--ink);
        }
        .swiss-border-top {
            border-top: 2px solid var(--ink);
            padding-top: 1rem;
        }

        /* ── FIGMA-STYLE GRID OUTLINES ── */
        body.show-grid .swiss-col,
        body.show-grid [class*="swiss-col-span-"] {
            outline: 1px solid var(--grid-outline);
            outline-offset: -1px;
            background: var(--grid-fill);
            border-radius: 0;
            transition: outline 0.15s ease, background 0.15s ease;
        }
        body.show-grid .swiss-col:hover,
        body.show-grid [class*="swiss-col-span-"]:hover {
            background: rgba(0, 160, 255, 0.12);
        }
        body.show-grid .swiss-grid::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            background:
                repeating-linear-gradient(90deg,
                    transparent 0px,
                    transparent calc(var(--swiss-gap) / 2 - 0.5px),
                    var(--grid-gutter) calc(var(--swiss-gap) / 2 - 0.5px),
                    var(--grid-gutter) calc(var(--swiss-gap) / 2 + 0.5px),
                    transparent calc(var(--swiss-gap) / 2 + 0.5px),
                    transparent var(--swiss-gap));
        }
        body.show-grid .swiss-col::after,
        body.show-grid [class*="swiss-col-span-"]::after {
            content: attr(data-col-label);
            position: absolute;
            top: 2px;
            left: 2px;
            font-family: var(--font-mono);
            font-size: 6px;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: rgba(0, 160, 255, 0.5);
            background: var(--grid-label-bg);
            padding: 0 4px;
            border-radius: 2px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            line-height: 1.4;
            z-index: 6;
        }
        body.show-grid .swiss-col:hover::after,
        body.show-grid [class*="swiss-col-span-"]:hover::after {
            opacity: 1;
        }
        .grid-info-badge {
            display: none;
            position: fixed;
            bottom: calc(var(--hud-height) + 24px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            font-family: var(--font-mono);
            font-size: 7px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-light);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 4px 12px;
            box-shadow: var(--shadow-floating);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateX(-50%) translateY(8px);
        }
        body.show-grid .grid-info-badge {
            display: block;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .grid-info-badge span {
            opacity: 0.6;
        }

        /* ── UPGRADED: ACCORDION ── */
        .letter-accordion {
            max-width: 820px;
            margin: 0 0 40px;
            border-top: 1px solid var(--border);
        }
        .letter-accordion-item {
            border-bottom: 1px solid var(--border);
        }
        .letter-accordion-trigger {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 0;
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            color: var(--fg);
            transition: color 0.15s ease;
        }
        .letter-accordion-trigger:hover {
            color: rgba(var(--fg-rgb), .7);
        }
        .letter-accordion-num {
            font-family: 'DM Mono', monospace;
            font-size: calc(11px * var(--page-scale, 1));
            color: var(--ink-light);
            margin-right: 14px;
            flex-shrink: 0;
        }
        .letter-accordion-title {
            flex: 1;
            font-size: calc(clamp(17px, 1.9vw, 21px) * var(--page-scale, 1));
            font-weight: 700;
            letter-spacing: -.005em;
            color: var(--fg);
        }
        .letter-accordion-icon {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 400;
            color: var(--ink-light);
            transition: transform .3s cubic-bezier(.16, 1, .3, 1);
        }
        .letter-accordion-item.is-open .letter-accordion-icon {
            transform: rotate(45deg);
        }
        .letter-accordion-panel {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows .35s cubic-bezier(.16, 1, .3, 1);
        }
        .letter-accordion-item.is-open .letter-accordion-panel {
            grid-template-rows: 1fr;
        }
        .letter-accordion-panel-inner {
            overflow: hidden;
            min-height: 0;
        }
        .letter-accordion-panel-inner p {
            font-size: calc(15px * var(--page-scale, 1));
            line-height: 1.7;
            color: var(--ink-mid);
            margin: 0 0 20px;
            padding-bottom: 4px;
        }
        .letter-accordion-panel-inner p:last-child {
            margin-bottom: 0;
        }
        .letter-accordion-item.is-open .letter-accordion-panel-inner {
            padding-bottom: 22px;
        }

        /* ── UPGRADED: CHECKLIST / RADIOS ── */
        .letter-checklist {
            list-style: none;
            margin: 0 0 40px;
            padding: 0;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .letter-checklist-item {
            border-bottom: 1px solid var(--border);
        }
        .letter-checklist-item label {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px 0;
            cursor: pointer;
        }
        .letter-checklist-box {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        .letter-checklist-mark {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            margin-top: 2px;
            border: 1.5px solid var(--ink-light);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color .15s, background .15s;
        }
        .letter-checklist-box:focus-visible~.letter-checklist-mark {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .letter-checklist-mark::after {
            content: '';
            width: 12px;
            height: 9px;
            clip-path: polygon(9% 45%, 0 63%, 35% 100%, 100% 20%, 85% 5%, 33% 70%);
            background: var(--bg);
            transform: scale(0);
            transition: transform .15s cubic-bezier(.34, 1.56, .64, 1);
        }
        .letter-checklist-box:checked~.letter-checklist-mark {
            background: var(--fg);
            border-color: var(--fg);
        }
        .letter-checklist-box:checked~.letter-checklist-mark::after {
            transform: scale(1);
            background: var(--bg);
        }
        .letter-checklist-text {
            flex: 1;
            font-size: calc(15px * var(--page-scale, 1));
            line-height: 1.6;
            color: var(--ink-mid);
            transition: color .2s, opacity .2s;
        }
        .letter-checklist-box:checked~.letter-checklist-text {
            font-weight: 700;
            color: var(--fg);
        }

        /* ── NEVER HAVE I EVER (bonus toggle) ── */
        .letter-never-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            font-family: 'DM Mono', monospace;
        }
        .letter-never-toggle button {
            padding: 5px 12px;
            border: 1px solid var(--border);
            background: none;
            color: var(--ink-light);
            cursor: pointer;
            font-family: inherit;
            font-size: calc(10px * var(--page-scale, 1));
            letter-spacing: .04em;
            text-transform: uppercase;
            border-radius: 2px;
            transition: color .15s, border-color .15s, background .15s;
        }
        .letter-never-toggle button:hover {
            color: var(--ink);
        }
        .letter-never-toggle button.active {
            color: var(--fg);
            border-color: var(--fg);
            background: rgba(var(--fg-rgb), .06);
        }
        .letter-never-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 26px;
            margin: 0 0 44px;
            padding: 0;
            max-width: 820px;
            counter-reset: never-item;
        }
        .letter-never-item {
            display: flex;
            gap: 16px;
            align-items: baseline;
            counter-increment: never-item;
        }
        .letter-never-marker {
            flex: 0 0 auto;
            min-width: 22px;
            font-family: 'DM Mono', monospace;
            font-size: calc(13px * var(--page-scale, 1));
            color: var(--ink-light);
        }
        .letter-never-list.is-numbered .letter-never-marker::before {
            content: counter(never-item) ".";
        }
        .letter-never-list.is-bulleted .letter-never-marker::before {
            content: "—";
        }
        .letter-never-body {
            flex: 1;
            min-width: 0;
        }
        .letter-never-statement {
            font-size: calc(clamp(18px, 2vw, 22px) * var(--page-scale, 1));
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -.005em;
            color: var(--fg);
            margin: 0;
        }
        .letter-never-context {
            margin: 6px 0 0;
            font-size: calc(13px * var(--page-scale, 1));
            line-height: 1.5;
            font-style: italic;
            color: var(--ink-light);
        }

        /* ── HUD ── */
        .hud {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-floating);
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 44px;
            font-family: var(--font-mono);
        }
        .hud-bottom {
            bottom: calc(12px + var(--scrollbar-height));
            padding: 10px 18px;
            min-height: 56px;
            gap: 6px;
        }
        .hud .btn {
            min-height: 30px;
            padding: 5px 10px;
            font-size: 8px;
        }
        .hud .hud-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
            flex-shrink: 0;
            margin: 0 2px;
        }
        .hud .filter-count {
            background: var(--ink);
            color: var(--card);
            padding: 1px 6px;
            border-radius: var(--radius-sm);
            font-size: 7px;
            font-weight: 600;
            min-width: 18px;
            text-align: center;
        }
        .hud .hud-label {
            font-size: 6px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-light);
            opacity: 0.5;
        }
        .hud-nav-counter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--ink);
            color: var(--card);
            padding: 1px 6px;
            border-radius: var(--radius-sm);
            font-size: 7px;
            font-weight: 600;
            min-width: 18px;
            text-align: center;
        }
        @media (max-width: 640px) {
            .hud-bottom {
                padding: 8px 12px;
                min-height: 48px;
                gap: 4px;
            }
            .hud .btn {
                font-size: 7px;
                padding: 4px 8px;
                min-height: 26px;
            }
            .hud .hud-label {
                display: none;
            }
        }
        @media (max-width: 480px) {
            .hud-bottom {
                padding: 6px 10px;
                gap: 3px;
                min-height: 42px;
            }
            .hud .btn {
                font-size: 6px;
                padding: 3px 6px;
                min-height: 24px;
            }
        }

        /* ── SCROLL PROGRESS: BORDER WRAP ── */
        .scroll-border-top {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: var(--accent);
            z-index: 160;
            width: 0%;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(229, 229, 103, 0.35), 0 0 24px rgba(229, 229, 103, 0.12);
            border-radius: 0 2px 2px 0;
            transition: width 0.12s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: width;
        }
        .scroll-border-bottom {
            position: fixed;
            bottom: 0;
            right: 0;
            height: 3px;
            background: var(--accent);
            z-index: 160;
            width: 0%;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(229, 229, 103, 0.35), 0 0 24px rgba(229, 229, 103, 0.12);
            border-radius: 2px 0 0 2px;
            transition: width 0.12s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: width;
        }
        .scroll-border-corner {
            position: fixed;
            z-index: 160;
            pointer-events: none;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scroll-border-corner.show {
            opacity: 1;
        }
        .scroll-border-corner-tl {
            top: 0;
            left: 0;
            width: 6px;
            height: 6px;
            border-radius: 0 0 3px 0;
        }
        .scroll-border-corner-tr {
            top: 0;
            right: 0;
            width: 6px;
            height: 6px;
            border-radius: 0 0 0 3px;
        }
        .scroll-border-corner-bl {
            bottom: 0;
            left: 0;
            width: 6px;
            height: 6px;
            border-radius: 0 3px 0 0;
        }
        .scroll-border-corner-br {
            bottom: 0;
            right: 0;
            width: 6px;
            height: 6px;
            border-radius: 3px 0 0 0;
        }

        /* ── custom cursor ── */
        body.custom-cursor-active {
            cursor: none;
        }
        .write-cursor-dot,
        .write-cursor-ellipse {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 500;
            pointer-events: none;
            transform: translate(-9999px, -9999px);
            opacity: 0;
            transition: opacity 0.18s ease;
            will-change: transform;
        }
        .write-cursor-dot.visible,
        .write-cursor-ellipse.visible {
            opacity: 1;
        }
        .write-cursor-dot {
            width: 6px;
            height: 6px;
            margin: -3px 0 0 -3px;
            border-radius: 50%;
            background: var(--ink);
        }
        .write-cursor-ellipse {
            width: 34px;
            height: 34px;
            margin: -17px 0 0 -17px;
            border: 1.5px solid var(--ink);
            border-radius: 50%;
            opacity: 0;
        }
        .write-cursor-ellipse.visible {
            opacity: 0.32;
        }
        body.custom-cursor-active.write-native-cursor {
            cursor: auto;
        }
        .write-native-cursor .write-cursor-dot,
        .write-native-cursor .write-cursor-ellipse {
            opacity: 0 !important;
        }

        /* ── appearance dropdown ── */
        .topbar-appearance-dropdown {
            position: fixed;
            min-width: 100px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-floating);
            padding: 4px 0;
            z-index: 200;
            display: none;
            flex-direction: column;
        }
        .topbar-appearance-dropdown.open {
            display: flex;
        }
        .topbar-appearance-dropdown .menu-item {
            padding: 4px 12px;
            font-family: var(--font-mono);
            font-size: 8px;
            letter-spacing: 0.04em;
            color: var(--ink-mid);
            cursor: pointer;
            transition: background 0.12s ease, color 0.12s ease;
            border: none;
            background: none;
            text-align: left;
            width: 100%;
            white-space: nowrap;
        }
        .topbar-appearance-dropdown .menu-item:hover {
            background: var(--bg);
            color: var(--ink);
        }
        .topbar-appearance-dropdown .menu-item.active {
            background: var(--ink);
            color: var(--card);
        }
        .topbar-appearance-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* ── responsive tweaks ── */
        @media (max-width: 820px) {
            .letter-panel {
                width: 94vw;
            }
            .letters-track {
                gap: 16px;
                padding-left: max(2vw, calc(50% - 400px));
                padding-right: max(2vw, calc(50% - 400px));
            }
        }
        @media (max-width: 640px) {
            .letter-card-frame {
                padding: 16px 14px 28px;
                border-radius: var(--radius-sm);
            }
            .scroll-border-top,
            .scroll-border-bottom {
                height: 2px;
            }
            .scroll-border-corner {
                width: 4px !important;
                height: 4px !important;
            }
            body.show-grid .swiss-col::after,
            body.show-grid [class*="swiss-col-span-"]::after {
                font-size: 5px;
                top: 1px;
                left: 1px;
                padding: 0 3px;
            }
        }
        @media (max-width: 480px) {
            .btn-grid {
                font-size: 7px;
                padding: 2px 6px;
                min-height: 26px;
            }
            .btn-grid .dot-indicator {
                width: 4px;
                height: 4px;
            }
        }

        /* ── Shared letter styles ── */
        .letter-heading {
            font-size: calc(clamp(40px, 6vw, 96px) * var(--page-scale, 1));
            line-height: .98;
            letter-spacing: -.02em;
            color: var(--fg);
            margin: 0;
            max-width: 820px;
        }
        .letter-tagline {
            font-size: calc(clamp(9px, .8vw, 10px) * var(--page-scale, 1));
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            line-height: 1.5;
            color: var(--fg);
            margin: 0;
        }
        .letter-body p {
            font-size: calc(15px * var(--page-scale, 1));
            line-height: 1.7;
            color: var(--ink-mid);
            margin: 0 0 20px;
            max-width: 820px;
        }
        .letter-body p:last-child {
            margin-bottom: 0;
        }
        .letter-card-caption {
            margin-top: auto;
            padding-top: var(--l-sp-4);
            font-size: var(--fs-micro);
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--ink-light);
        }

        /* ── Custom title card (yellow) ── */
        .letter-card-frame.title-card-frame {
            background: var(--accent);
            border-color: var(--accent);
        }
        .letter-card-frame.title-card-frame .letter-cover {
            border-bottom-color: rgba(28, 28, 30, 0.15);
        }
        .letter-card-frame.title-card-frame .letter-cover-kicker,
        .letter-card-frame.title-card-frame .letter-cover-deck {
            color: rgba(28, 28, 30, 0.6);
        }
        .letter-card-frame.title-card-frame .letter-cover-name {
            color: var(--ink);
        }
        .letter-card-frame.title-card-frame .letter-toolbar .letter-count {
            color: rgba(28, 28, 30, 0.5);
        }

        /* ── Custom index card (dark) ── */
        .letter-card-frame.index-card-frame {
            background: var(--card-dark);
            border-color: var(--card-dark);
        }
        .letter-card-frame.index-card-frame .letter-cover {
            border-bottom-color: rgba(255, 255, 255, 0.12);
        }
        .letter-card-frame.index-card-frame .letter-cover-kicker,
        .letter-card-frame.index-card-frame .letter-cover-deck {
            color: rgba(255, 255, 255, 0.55);
        }
        .letter-card-frame.index-card-frame .letter-cover-name {
            color: #ffffff;
        }
        .letter-card-frame.index-card-frame .letter-toolbar .letter-count {
            color: rgba(255, 255, 255, 0.4);
        }

        /* ── Title Card Grid (legacy, kept for backwards compat) ── */
        .title-card-letter {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: rgba(28, 28, 30, 0.15);
            border: 1px solid rgba(28, 28, 30, 0.15);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .title-card-letter .tc-cell {
            background: var(--accent);
            padding: 1.25rem 1.4rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            min-height: 110px;
            color: var(--ink);
        }
        .title-card-letter .tc-cell.span-2 {
            grid-column: span 2;
        }
        .title-card-letter .tc-cell.row-span-2 {
            grid-row: span 2;
        }
        .title-card-letter .tc-photo {
            padding: 0;
            overflow: hidden;
        }
        .title-card-letter .tc-photo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            min-height: 110px;
        }
        .tc-label {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(28, 28, 30, 0.55);
            font-weight: 500;
        }
        .tc-value {
            font-family: var(--font);
            font-size: calc(var(--fs-body) * 1.1);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.25;
            color: var(--ink);
        }
        .tc-value-sm {
            font-family: var(--font);
            font-size: calc(var(--fs-body) * 0.95);
            font-weight: 500;
            color: var(--ink);
        }
        .tc-stat-row {
            display: flex;
            gap: 18px;
        }
        .tc-stat-num {
            font-family: var(--font);
            font-size: calc(var(--fs-body) * 1.3);
            font-weight: 700;
            color: var(--ink);
        }
        .tc-stat-label {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(28, 28, 30, 0.55);
        }
        .tc-edit-btn {
            align-self: flex-start;
            margin-top: 14px;
        }

        /* ── Index Card List ── */
        .index-letter {
            display: grid;
            grid-template-rows: repeat(6, auto);
            grid-auto-flow: column;
            gap: 0.2rem 2rem;
            max-width: 480px;
            overflow: hidden;
        }
        .index-letter a.idx-row {
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
            padding: 0.35rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: color 0.2s, transform 0.15s;
            color: rgba(255, 255, 255, 0.85);
            max-width: 100%;
            overflow: hidden;
            text-decoration: none;
        }
        .index-letter a.idx-row:hover {
            color: var(--accent);
            transform: translateX(4px);
        }
        .index-letter .idx-num {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            letter-spacing: 0.04em;
            opacity: 0.45;
            flex-shrink: 0;
            min-width: 2.6em;
            color: rgba(255, 255, 255, 0.55);
        }
        .index-letter .idx-title {
            font-family: var(--font);
            font-size: calc(var(--fs-body) * 0.95);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
            color: #ffffff;
        }

        /* ── Conversation stack hint ── */
        .conversation-stack-hint {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .conversation-stack-hint::before {
            content: '⤵';
            font-size: 1rem;
            opacity: 0.4;
        }
        .letter-card-frame.index-card-frame .conversation-stack-hint {
            border-top-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.4);
        }
        .letter-card-frame.index-card-frame .conversation-stack-hint::before {
            color: rgba(255,255,255,0.3);
        }
        .letter-card-frame.title-card-frame .conversation-stack-hint {
            border-top-color: rgba(28,28,30,0.15);
            color: rgba(28,28,30,0.5);
        }

        /* ── Edit flow mockup ── */
        .edit-flow-mock {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1.5rem 1.2rem;
            margin: 1.5rem 0;
            width: 100%;
        }
        .edit-flow-mock .step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .edit-flow-mock .step:last-child {
            border-bottom: none;
        }
        .edit-flow-mock .step-indicator {
            font-family: var(--font-mono);
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--ink-light);
            min-width: 28px;
        }
        .edit-flow-mock .step-desc {
            font-size: calc(var(--fs-body) * 0.9);
            color: var(--ink-mid);
        }
        .edit-flow-mock .step-desc strong {
            color: var(--fg);
        }
        .edit-flow-mock .step-desc .tag-rude {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 6px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #d43a3a;
            border: 1px solid #d43a3a;
            padding: 0 4px;
            border-radius: 2px;
            margin-left: 4px;
        }
        .edit-flow-mock .note {

            margin-top: 12px;
            padding-top: 12px;

            align-items: center;

        .edit-flow-mock .timer-bar .bar-bg {

            height: 3px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        .edit-flow-mock .timer-bar .bar-fill {
            height: 100%;
            width: 30%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.1s linear;

        .edit-flow-mock .timer-bar .bar-label {

            font-size: 8px;
            color: var(--ink-light);
            min-width: 36px;

        .edit-flow-mock .btn-group {

            margin-top: 10px;

        .edit-flow-mock .btn-group .btn {
            font-size: 7px;
            padding: 4px 10px;
            min-height: 26px;

        .edit-flow-mock .btn-group .btn-primary {

        .edit-flow-mock .btn-group .btn-primary:hover {
            background: var(--ink-mid);

        .edit-flow-mock .btn-group .btn-opt {
            background: var(--accent);
            border-color: var(--accent);

        .edit-flow-mock .btn-group .btn-opt:hover {

        .edit-flow-mock .btn-group .btn-opt-inactive {
            opacity: 0.4;
            pointer-events: none;

        .edit-flow-mock .mock-post {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            margin-top: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;

        .edit-flow-mock .mock-post .avatar {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            background: var(--bg);
            border: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--ink);

        .edit-flow-mock .mock-post .post-content {
            flex: 1;
            font-size: calc(var(--fs-body) * 0.85);
            color: var(--ink-mid);
        }
        .edit-flow-mock .mock-post .post-content .meta {
            font-family: var(--font-mono);
            font-size: 7px;
            color: var(--ink-light);
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 4px;

        .edit-flow-mock .mock-post .post-content .meta .rude-tag {
            font-size: 6px;
            text-transform: uppercase;
            color: #d43a3a;
            border: 1px solid #d43a3a;
            padding: 0 4px;
            border-radius: 2px;
        }
        .edit-flow-mock .mock-post .post-content .hold-up {
            font-size: 7px;
            color: var(--ink-light);
            background: rgba(229, 229, 103, 0.3);
            padding: 2px 6px;
            border-radius: 2px;
            display: inline-block;
            margin-bottom: 4px;
            font-family: var(--font-mono);

        .edit-flow-mock .mock-post .post-content .hold-up::before {
            content: '⚠️ ';
