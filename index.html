        /* ── Font overrides ── */
        body[data-font='satoshi'] {
            --font: 'Satoshi', sans-serif;
        }
        body[data-font='serif'] {
            --font: 'EB Garamond', serif;
        }

        /* ── Special Gothic: exclusive dark theme ── */
        body[data-font='special'] {
            --font: 'Special Gothic', sans-serif;
            --bg: #1c1c1e;
            --fg: #ffffff;
            --fg-rgb: 255, 255, 255;
            --nav-bg-rgb: 28, 28, 30;
            --rule: rgba(255, 255, 255, .08);
            --faint: rgba(255, 255, 255, .04);
            --muted: rgba(255, 255, 255, .55);
            --card: #1c1c1e;
            --card-dark: #2c2c2e;
            --card-mid: #3a3a3c;
            --ink: #ffffff;
            --ink-mid: #b0b0b6;
            --ink-light: #8e8e93;
            --ink-lighter: #6e6e73;
            --border: rgba(255, 255, 255, .12);
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-floating: 0 8px 32px rgba(0, 0, 0, 0.6);
            /* Grid tokens lifted for contrast on dark backgrounds */
            --grid-outline: rgba(0, 160, 255, 0.65);
            --grid-fill: rgba(0, 160, 255, 0.08);
            --grid-gutter: rgba(0, 160, 255, 0.18);
            --grid-label-bg: rgba(0, 160, 255, 0.28);
        }
        body[data-font='special'] .viewport-blur-top {
            background: linear-gradient(to bottom, rgba(28, 28, 30, 0.7), rgba(28, 28, 30, 0));
        }
        body[data-font='special'] .viewport-blur-bottom {
            background: linear-gradient(to top, rgba(28, 28, 30, 0.7), rgba(28, 28, 30, 0));
        }
        body[data-font='special'] .hud {
            background: rgba(28, 28, 30, 0.92);
        }
        body[data-font='special'] .grid-info-badge {
            background: rgba(28, 28, 30, 0.85);
            border-color: rgba(255, 255, 255, 0.12);
            color: var(--ink-light);
        }
        body[data-font='special'] .btn-grid.active {
            background: rgba(0, 160, 255, 0.6);
            border-color: rgba(0, 160, 255, 0.6);
        }

        /* ═══════════════════════════════════════════════════════════
           SHARED TEMPLATE EXTENSIONS · v22.3
           v22.3: fixes span+offset composition, cover stretch,
                  dark-theme grid contrast, mobile shorthand.
           ═══════════════════════════════════════════════════════════ */

        :root {
            --impact-gain: #2F6B4F;
            --impact-loss: #C63A2A;
            --impact-accent: #8A7A1F;
        }
        body[data-font='special'] {
            --impact-gain: #6FCF97;
            --impact-loss: #FF6B6B;
            --impact-accent: #E5E567;
        }

        /* ── 1. PER-LETTER COVER FONT OVERRIDES ── */
        .letter-cover-name[data-cover-font="syne"]      { font-family:'Syne',sans-serif;         font-weight:800; letter-spacing:-.02em; }
        .letter-cover-name[data-cover-font="playfair"]  { font-family:'Playfair Display',serif;  font-weight:900; letter-spacing:-.015em; }
        .letter-cover-name[data-cover-font="bebas"]     { font-family:'Bebas Neue',sans-serif;   font-weight:400; letter-spacing:.01em; }
        .letter-cover-name[data-cover-font="outfit"]    { font-family:'Outfit',sans-serif;       font-weight:900; letter-spacing:-.02em; }
        .letter-cover-name[data-cover-font="fraunces"]  { font-family:'Fraunces',serif;          font-weight:600; letter-spacing:-.01em; }
        .letter-cover-name[data-cover-font="space"]     { font-family:'Space Grotesk',sans-serif;font-weight:700; letter-spacing:-.01em; }
        .letter-cover-name[data-cover-font="dmserif"]   { font-family:'DM Serif Display',serif;  font-weight:400; letter-spacing:0; }
        .letter-cover-name[data-cover-font="anton"]     { font-family:'Anton',sans-serif;        font-weight:400; letter-spacing:.005em; }

        /* ── 2. FIGURE ── */
        .letter-figure { width:100%; margin:44px 0; }
        .letter-figure img,
        .letter-figure video { display:block; width:100%; height:auto; border-radius:var(--radius-sm); }
        .letter-figure figcaption {
            margin-top:12px; font-size:calc(12px * var(--page-scale,1));
            line-height:1.5; color:var(--ink-light); max-width:820px;
        }

        /* ── 3. DIALOGUE ── */
        .letter-dialogue { display:flex; flex-direction:column; gap:36px; max-width:820px; margin:48px 0; }
        .letter-dialogue-line { max-width:82%; }
        .letter-dialogue-line.is-a { align-self:flex-start; text-align:left; }
        .letter-dialogue-line.is-b { align-self:flex-end;   text-align:right; }
        .letter-dialogue-quote {
            display:block;
            font-family:'Playfair Display',serif; font-style:italic; font-weight:600;
            font-size:calc(clamp(20px,2.5vw,30px) * var(--page-scale,1));
            line-height:1.4; letter-spacing:-.005em; color:var(--ink);
        }
        .letter-dialogue-line.is-b .letter-dialogue-quote { color:var(--ink-mid); }
        .letter-dialogue-quote::before,
        .letter-dialogue-quote::after { font-style:normal; font-weight:700; opacity:.55; }
        .letter-dialogue-quote::before { content:'\201C'; }
        .letter-dialogue-quote::after  { content:'\201D'; }
        .letter-dialogue-line.is-a .letter-dialogue-quote::before,
        .letter-dialogue-line.is-a .letter-dialogue-quote::after { color:var(--accent); }
        .letter-dialogue-line.is-b .letter-dialogue-quote::before,
        .letter-dialogue-line.is-b .letter-dialogue-quote::after { color:var(--ink-lighter); }
        .letter-dialogue-who {
            display:block; margin-top:12px;
            font-family:var(--font-mono); font-size:calc(10px * var(--page-scale,1));
            font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-light);
        }
        .letter-dialogue-who::before { content:'\2014\a0'; opacity:.6; }
        @media (max-width:640px) { .letter-dialogue-line { max-width:100%; } }

        /* ── 4. TIMELINE TOOLTIPS ── */
        .tl-entry {
            position:relative; display:block; padding:3px 0; cursor:default;
            color:var(--ink-light); line-height:2.2;
        }
        .tl-entry:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
        .tl-entry .tl-label { font-size:calc(11px * var(--page-scale,1)); }
        .tl-tooltip {
            position:absolute; left:0; bottom:calc(100% + 4px);
            background:var(--card); border:1px solid var(--border); color:var(--ink-mid);
            font-size:calc(10px * var(--page-scale,1)); line-height:1.6;
            padding:8px 12px; max-width:420px; width:max-content; white-space:normal;
            pointer-events:none; opacity:0; transform:translateY(4px);
            transition:opacity .15s ease, transform .15s ease;
            z-index:100; border-radius:var(--radius-sm);
            box-shadow:var(--shadow-floating);
        }
        .tl-entry:hover .tl-tooltip,
        .tl-entry:focus-visible .tl-tooltip { opacity:1; transform:translateY(0); }

        /* ── 5. IMPACT / EXHIBIT SYSTEM ── */
        .letter-impact-doc {
            color:var(--ink-mid); font-family:'IBM Plex Sans',sans-serif;
            max-width:820px; margin:0 0 40px; -webkit-font-smoothing:antialiased;
        }
        .letter-impact-mono    { font-family:'IBM Plex Mono',monospace; }
        .letter-impact-display { font-family:'Fraunces',serif; }

        .letter-impact-ticker-wrap {
            background:var(--faint); overflow:hidden; white-space:nowrap;
            border-top:1px solid var(--border); border-bottom:1px solid var(--border);
            border-radius:var(--radius-sm);
        }
        .letter-impact-ticker-track {
            display:inline-block; padding-left:100%;
            animation:letterImpactScroll 42s linear infinite;
            font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.03em;
            padding-top:8px; padding-bottom:8px;
        }
        @keyframes letterImpactScroll { 0%{transform:translateX(0)} 100%{transform:translateX(-100%)} }
        .letter-impact-tick { margin-right:2.5em; color:var(--ink-light); }
        .letter-impact-tick .up  { color:var(--impact-gain); font-weight:600; }
        .letter-impact-tick .dn  { color:var(--impact-loss); font-weight:600; }
        .letter-impact-tick .neu { color:var(--ink-light); }
        @media (prefers-reduced-motion:reduce) {
            .letter-impact-ticker-track { animation:none; padding-left:2em; }
        }

        .letter-impact-body { padding:24px 0 8px; }
        .letter-impact-eyebrow {
            font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
            text-transform:uppercase; color:var(--ink-light);
            display:flex; gap:12px; align-items:center; margin-bottom:16px;
        }
        .letter-impact-eyebrow::before {
            content:''; width:22px; height:1px; background:var(--ink-lighter); display:inline-block;
        }
        .letter-impact-title {
            font-family:'Fraunces',serif; font-size:clamp(30px,5vw,46px);
            line-height:.98; font-weight:600; margin:0 0 14px; letter-spacing:-.01em; color:var(--ink);
        }
        .letter-impact-title em { font-style:italic; font-weight:600; color:var(--impact-accent); }
        .letter-impact-subtitle {
            font-size:15px; max-width:56ch; color:var(--ink-light); margin:0 0 20px; line-height:1.55;
        }
        .letter-impact-filing-meta {
            display:grid; grid-template-columns:1fr 1fr; gap:10px 24px;
            font-size:12px; line-height:1.5; color:var(--ink-light);
            border-top:1px solid var(--border); padding-top:16px; margin-bottom:4px;
        }
        .letter-impact-filing-meta strong {
            display:block; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
            color:var(--ink-light); margin-bottom:2px; font-weight:600;
        }
        .letter-impact-method {
            font-size:13px; line-height:1.6; color:var(--ink-light);
            border-top:1px solid var(--border); border-bottom:1px solid var(--border);
            padding:16px 0; margin:20px 0 0;
        }
        .letter-impact-method strong { color:var(--ink); }

        .letter-impact-exhibit { padding:4px 0 20px; }
        .letter-impact-exhibit-head {
            display:flex; justify-content:space-between; align-items:baseline; gap:12px;
            font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em;
            text-transform:uppercase; color:var(--impact-accent); margin-bottom:10px;
        }
        .letter-impact-exhibit-filed {
            color:var(--ink-light); text-transform:none; letter-spacing:0;
        }
        .letter-impact-exhibit-title {
            font-family:'Fraunces',serif; font-size:clamp(20px,2.6vw,27px);
            font-weight:600; margin:0 0 4px; color:var(--ink);
        }
        .letter-impact-exhibit-role {
            font-size:12px; font-weight:600; color:var(--ink-light); margin-bottom:10px;
        }
        .letter-impact-exhibit-intro {
            font-size:14px; line-height:1.6; color:var(--ink-light); margin:0 0 18px;
        }

        .letter-impact-cert {
            background:var(--faint); border:1px solid var(--border);
            border-radius:var(--radius-sm); padding:16px 18px; margin-bottom:16px;
        }
        .letter-impact-cert:last-child { margin-bottom:0; }
        .letter-impact-cert-top {
            display:flex; justify-content:space-between; align-items:center; gap:10px;
            flex-wrap:wrap; margin-bottom:10px;
        }
        .letter-impact-ticker-badge {
            font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
            letter-spacing:.03em; color:var(--ink-light);
        }
        .letter-impact-status-pill {
            font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600;
            letter-spacing:.02em; padding:3px 9px; border-radius:999px; white-space:nowrap;
            border:1px solid var(--border); color:var(--ink-light); background:transparent;
        }
        .letter-impact-status-pill.is-gain { color:var(--impact-gain); border-color:var(--impact-gain); }
        .letter-impact-status-pill.is-loss { color:var(--impact-loss); border-color:var(--impact-loss); }
        .letter-impact-status-pill.is-neu  { color:var(--ink-light);   border-color:var(--border); }

        .letter-impact-cert-body h3,
        .letter-impact-cert-body h4 {
            font-family:'Fraunces',serif; font-style:italic; font-weight:600;
            font-size:17px; margin:0 0 8px; color:var(--ink);
        }
        .letter-impact-cert-body p {
            font-size:13.5px; line-height:1.6; color:var(--ink-light); margin:0 0 10px;
        }
        .letter-impact-cert-body p:last-child { margin-bottom:0; }
        .letter-impact-cert-body p.letter-impact-note {
            font-size:12.5px; color:var(--ink-light); font-style:italic;
        }

        .letter-impact-spark-wrap { margin-top:10px; }
        .letter-impact-spark-label {
            font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.06em;
            color:var(--ink-light); margin-bottom:4px;
        }

        .letter-impact-seal-row {
            display:flex; align-items:center; gap:16px; margin-top:16px;
            padding-top:14px; border-top:1px solid var(--border);
        }
        .letter-impact-seal-row svg { width:64px; height:64px; flex-shrink:0; color:var(--ink); }
        .letter-impact-seal-caption { font-size:11.5px; color:var(--ink-light); line-height:1.5; }

        .letter-impact-refs { padding:20px 0 4px; }
        .letter-impact-refs h2 {
            font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.08em;
            text-transform:uppercase; font-weight:600; color:var(--ink-light);
            margin:0 0 12px; border-top:1px solid var(--border); padding-top:16px;
        }
        .letter-impact-refs ol { margin:0; padding-left:20px; }
        .letter-impact-refs li {
            font-size:12.5px; line-height:1.6; color:var(--ink-light); margin-bottom:8px;
        }
        .letter-impact-refs li:last-child { margin-bottom:0; }
        .letter-impact-colophon {
            text-align:center; font-style:italic; font-size:12px;
            color:var(--ink-light); padding:16px 0 20px;
        }

        /* ── 6. CARD-GRID INDEX VARIANT ── */
        .index-card-grid {
            display:grid; grid-template-columns:1fr 1fr; gap:1px;
            background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.1);
            border-radius:var(--radius-sm); overflow:hidden; max-width:640px;
        }
        .index-card-grid .icg-card {
            display:flex; flex-direction:column; align-items:flex-start;
            justify-content:space-between; gap:20px; padding:18px 20px;
            background:var(--card-dark); border:none; cursor:pointer;
            text-align:left; font-family:inherit; color:#fff;
            transition:background .2s ease; min-height:118px;
        }
        .index-card-grid .icg-card:hover { background:#2c2c2e; }
        .index-card-grid .icg-num {
            font-family:var(--font-mono); font-size:10px; font-weight:600;
            letter-spacing:.08em; color:rgba(255,255,255,.45);
        }
        .index-card-grid .icg-name {
            font-family:'Syne',sans-serif; font-weight:800;
            font-size:20px; letter-spacing:-.01em; color:#fff;
        }
        .index-card-grid .icg-arrow {
            align-self:flex-end; color:rgba(255,255,255,.45); font-size:16px;
        }
        .index-card-grid .icg-card:hover .icg-arrow { color:var(--accent); }
        .index-card-grid-label {
            font-family:var(--font-mono);
            font-size:0.6rem;
            letter-spacing:.08em;
            text-transform:uppercase;
            color:rgba(255,255,255,.45);
            margin-bottom:10px;
            display:block;
        }
        @media (max-width:480px) {
            .index-card-grid { grid-template-columns:1fr; }
            .index-card-grid .icg-card { flex-direction:row; align-items:center; min-height:0; }
            .index-card-grid .icg-name { flex:1; }
            .index-card-grid .icg-arrow { align-self:center; }
        }

        /* ═══════════════════════════════════════════════════════════
           SWISS GRID: CONTENT-FACING LAYOUT
           ═══════════════════════════════════════════════════════════ */

        .swiss-grid .letter-accordion,
        .swiss-grid .letter-checklist,
        .swiss-grid .letter-never-list,
        .swiss-grid .letter-body,
        .swiss-grid .letter-impact-doc,
        .swiss-grid .index-letter,
        .swiss-grid .index-card-grid,
        .swiss-grid .letter-card-caption {
            margin-top: 0;
            margin-bottom: 0;
            max-width: none;
        }
        .swiss-grid .letter-body p { max-width: none; }
        .swiss-grid .letter-heading,
        .swiss-grid .letter-tagline { max-width: none; }

        .letter-cover-grid {
            gap: 8px var(--swiss-gap, 24px);
        }

        .title-card-swiss {
            gap: 1px;
            background: rgba(28, 28, 30, 0.15);
            border: 1px solid rgba(28, 28, 30, 0.15);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .title-card-swiss > .swiss-col {
            background: var(--accent);
            padding: 1.25rem 1.4rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            min-height: 110px;
            color: var(--ink);
        }
        body.show-grid .title-card-swiss > .swiss-col {
            background: var(--accent);
        }

        @media (max-width: 900px) {
            .swiss-grid { --swiss-gap: 16px; }
        }
        @media (max-width: 640px) {
            .swiss-grid {
                grid-template-columns: 1fr !important;
                gap: 16px !important;
            }
            .swiss-grid > * {
                grid-column: 1 / -1 !important;
            }
            .title-card-swiss { gap: 1px !important; }
            .title-card-swiss > .swiss-col { min-height: 0; }
            .letter-cover-grid { gap: 4px !important; }
            body.show-grid .swiss-grid::before { display: none; }
        }

        /* ═══════════════════════════════════════════════════════════
           v22.4 — SPECIAL GOTHIC / DARK THEME PATCH
           1. Minimal corner radius throughout — crisp, Swiss.
           2. Yellow title card: force ALL text to dark ink.
           ═══════════════════════════════════════════════════════════ */

        /* ── 1. RADIUS TOKENS → CRISP ── */
        body[data-font='special'] {
            --radius: 2px;
            --radius-sm: 2px;
        }

        /* ── 2. HARDCODED RADII → CRISP ── */
        body[data-font='special'] .scroll-border-top,
        body[data-font='special'] .scroll-border-bottom,
        body[data-font='special'] .scroll-border-corner-tl,
        body[data-font='special'] .scroll-border-corner-tr,
        body[data-font='special'] .scroll-border-corner-bl,
        body[data-font='special'] .scroll-border-corner-br {
            border-radius: 0;
        }
        body[data-font='special'] .letter-checklist-mark,
        body[data-font='special'] .letter-never-toggle button,
        body[data-font='special'] .edit-flow-mock .mock-post .post-content .meta .rude-tag,
        body[data-font='special'] .edit-flow-mock .mock-post .post-content .hold-up,
        body[data-font='special'] .letter-impact-status-pill,
        body[data-font='special'] .hud-nav-counter,
        body[data-font='special'] .hud .filter-count,
        body[data-font='special'] .hud .btn,
        body[data-font='special'] .btn,
        body[data-font='special'] .btn-grid {
            border-radius: 2px;
        }

        /* ── 3. TITLE CARD — FORCE ALL TEXT DARK ── */
        body[data-font='special'] .letter-card-frame.title-card-frame .letter-cover-name,
        body[data-font='special'] .letter-card-frame.title-card-frame h2,
        body[data-font='special'] .letter-card-frame.title-card-frame h3,
        body[data-font='special'] .letter-card-frame.title-card-frame .tc-value,
        body[data-font='special'] .letter-card-frame.title-card-frame .tc-value-sm,
        body[data-font='special'] .letter-card-frame.title-card-frame .tc-stat-num {
            color: #1c1c1e !important;
        }
        body[data-font='special'] .letter-card-frame.title-card-frame .letter-cover-kicker,
        body[data-font='special'] .letter-card-frame.title-card-frame .letter-cover-deck,
        body[data-font='special'] .letter-card-frame.title-card-frame .tc-label,
        body[data-font='special'] .letter-card-frame.title-card-frame .tc-stat-label,
        body[data-font='special'] .letter-card-frame.title-card-frame .letter-toolbar .letter-count,
        body[data-font='special'] .letter-card-frame.title-card-frame .conversation-stack-hint,
        body[data-font='special'] .letter-card-frame.title-card-frame .letter-card-caption {
            color: rgba(28, 28, 30, 0.65) !important;
        }

        /* ═══════════════════════════════════════════════════════════
           LEFT CLAMP RAIL — view switcher widget
           A vertically-centered, edge-clamped toolbar. Off by default;
           opt-in surfaces set <body data-view-rail="on">.
           ═══════════════════════════════════════════════════════════ */
        .left-rail {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%) translateX(-6px);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: stretch;
            width: 46px;
            padding: 8px 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px) saturate(1.1);
            -webkit-backdrop-filter: blur(20px) saturate(1.1);
            border: 1px solid var(--border);
            border-left: none;
            border-radius: 0 var(--radius) var(--radius) 0;
            box-shadow: var(--shadow-floating);
            font-family: var(--font-mono);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                        opacity 0.35s ease;
        }

        body[data-view-rail="on"] .left-rail {
            display: flex;
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        .left-rail-label {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            align-self: center;
            padding: 4px 0 8px;
            font-size: 7px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink-light);
            opacity: 0.55;
        }

        .left-rail-divider {
            height: 1px;
            margin: 0 10px 4px;
            background: var(--border);
        }

        .rail-btn {
            appearance: none;
            border: none;
            background: transparent;
            font-family: var(--font-mono);
            font-size: 7px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink-light);
            padding: 10px 0;
            cursor: pointer;
            text-align: center;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .rail-btn:hover {
            color: var(--ink);
            background: var(--faint);
        }
        .rail-btn.active {
            color: var(--ink);
            background: var(--accent);
            font-weight: 600;
        }

        /* dark theme */
        body[data-font='special'] .left-rail {
            background: rgba(28, 28, 30, 0.92);
        }
        body[data-font='special'] .rail-btn.active {
            background: rgba(229, 229, 103, 0.85);
            color: #1c1c1e;
        }

        /* mobile: keep it out of the way */
        @media (max-width: 640px) {
            .left-rail {
                width: 38px;
            }
            .rail-btn {
                font-size: 6px;
                padding: 8px 0;
            }
        }
    </style>
</head>
<body data-view-rail="hidden">

    <!-- ─── CURSOR ─── -->
    <div class="write-cursor-ellipse" id="writeCursorEllipse" aria-hidden="true"></div>
    <div class="write-cursor-dot" id="writeCursorDot" aria-hidden="true"></div>

    <!-- ─── SCROLL PROGRESS: BORDER WRAP ─── -->
    <div class="scroll-border-top" id="scrollBorderTop" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
    <div class="scroll-border-bottom" id="scrollBorderBottom" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>

    <!-- Corner accents -->
    <div class="scroll-border-corner scroll-border-corner-tl" id="cornerTL"></div>
    <div class="scroll-border-corner scroll-border-corner-tr" id="cornerTR"></div>
    <div class="scroll-border-corner scroll-border-corner-bl" id="cornerBL"></div>
    <div class="scroll-border-corner scroll-border-corner-br" id="cornerBR"></div>

    <!-- ─── VIEWPORT BLUR ─── -->
    <div class="viewport-blur viewport-blur-top" id="viewportBlurTop" aria-hidden="true"></div>
    <div class="viewport-blur viewport-blur-bottom" id="viewportBlurBottom" aria-hidden="true"></div>

    <!-- ─── TOPBAR ─── -->
    <div class="topbar">
        <div class="wrap">
            <div class="wordmark">
                <span>intoview.pro</span>
                <span class="count" id="topCount">◈</span>
            </div>
            <div class="topbar-right">
                <button class="btn btn-grid" id="gridToggle" aria-label="Toggle grid outlines">
                    <span class="dot-indicator"></span>
                    Grid
                </button>
                <div class="topbar-appearance-wrapper">
                    <button class="btn" id="appearanceTrigger">Aa</button>
                </div>
                <button class="btn" id="topResetBtn">↺ Reset</button>
            </div>
        </div>
    </div>

    <!-- ─── TOP HUD · navigation only ─── -->
    <div class="hud hud-top" id="hudTop">
        <button class="btn btn-icon" id="hudPrev" title="Previous" aria-label="Previous letter">‹</button>
        <span class="hud-nav-counter" id="hudNavCounter" role="status" aria-live="polite">1/5</span>
        <button class="btn btn-icon" id="hudNext" title="Next" aria-label="Next letter">›</button>
    </div>

    <!-- ─── LEFT CLAMP RAIL · view switcher ───
         Disabled on this surface via <body data-view-rail="hidden">.
         Set data-view-rail="on" (or remove the attribute) to enable. -->
    <aside class="left-rail" id="leftRail" role="toolbar" aria-label="View switcher">
        <span class="left-rail-label">View</span>
        <div class="left-rail-divider"></div>
        <button class="rail-btn active" data-view="list"  type="button" title="List view"  aria-label="List view">List</button>
        <button class="rail-btn"        data-view="grid"  type="button" title="Grid view"  aria-label="Grid view">Grid</button>
        <button class="rail-btn"        data-view="bento" type="button" title="Bento view" aria-label="Bento view">Bento</button>
    </aside>

    <div class="wrap">
        <div class="letters-viewport" id="lettersViewport">
            <div class="letters-track" id="lettersTrack"></div>
            <div class="letter-hotspot letter-hotspot-prev" id="letterHotspotPrev" aria-hidden="true" tabindex="-1"></div>
            <div class="letter-hotspot letter-hotspot-next" id="letterHotspotNext" aria-hidden="true" tabindex="-1"></div>
        </div>
    </div>

    <div class="hud hud-bottom" id="hud">
        <span class="hud-label">Status</span>
        <span class="filter-count" id="hudStatusCount">0</span>
        <span style="font-size:0.75rem;color:var(--ink-light);" id="hudStatusText">Ready</span>
        <div class="hud-divider"></div>
        <button class="btn" id="hudNew">+ New</button>
    </div>

    <div class="grid-info-badge" id="gridInfoBadge">
        12 cols · <span id="gridInfoGap">24px</span> gap
    </div>

    <div class="topbar-appearance-dropdown" id="appearanceDropdown"></div>

    <script>
        (function() {
            'use strict';

            const escapeHtml = (s) => (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                    '"': '&quot;', "'": '&#39;' })[c]);
            const closestSafe = (node, selector) => node && node.nodeType === 1 && node.closest ? node.closest(
                selector) : null;

            function positionFloatingPanel(panel, trigger, opts = {}) {
                if (!panel || !trigger) return;
                const margin = opts.margin ?? 10;
                const gap = opts.gap ?? 8;
                const align = opts.align || 'right';
                const triggerRect = trigger.getBoundingClientRect();
                const vw = window.innerWidth,
                    vh = window.innerHeight;
                panel.style.position = 'fixed';
                panel.style.right = 'auto';
                panel.style.bottom = 'auto';
                const panelRect = panel.getBoundingClientRect();
                const pw = panelRect.width,
                    ph = panelRect.height;
                const spaceBelow = vh - triggerRect.bottom - gap;
                const spaceAbove = triggerRect.top - gap;
                let top = ph <= spaceBelow || spaceBelow >= spaceAbove ? triggerRect.bottom + gap : triggerRect.top -
                    gap - ph;
                top = Math.max(margin, Math.min(top, vh - ph - margin));
                let left = align === 'left' ? triggerRect.left : triggerRect.right - pw;
                left = Math.max(margin, Math.min(left, vw - pw - margin));
                panel.style.top = top + 'px';
                panel.style.left = left + 'px';
            }

            let letterData = [];
            let activeIndex = 0;

            function updateBorderProgress() {
                const total = letterData.length;
                const topBar = document.getElementById('scrollBorderTop');
                const bottomBar = document.getElementById('scrollBorderBottom');
                const cornerTL = document.getElementById('cornerTL');
                const cornerTR = document.getElementById('cornerTR');
                const cornerBL = document.getElementById('cornerBL');
                const cornerBR = document.getElementById('cornerBR');

                if (total <= 1) {
                    topBar.style.width = '0%';
                    bottomBar.style.width = '0%';
                    topBar.setAttribute('aria-valuenow', '0');
                    bottomBar.setAttribute('aria-valuenow', '0');
                    [cornerTL, cornerTR, cornerBL, cornerBR].forEach(el => el.classList.remove('show'));
                    return;
                }

                const progress = activeIndex / (total - 1);
                const percent = Math.round(progress * 100);

                topBar.style.width = percent + '%';
                topBar.setAttribute('aria-valuenow', String(percent));
                bottomBar.style.width = percent + '%';
                bottomBar.setAttribute('aria-valuenow', String(percent));

                const showTL = percent > 0;
                const showTR = percent > 0 && percent < 100;
                const showBR = percent < 100;
                const showBL = percent > 0 && percent < 100;

                cornerTL.classList.toggle('show', showTL);
                cornerTR.classList.toggle('show', showTR);
                cornerBR.classList.toggle('show', showBR);
                cornerBL.classList.toggle('show', showBL);

                if (percent === 0) {
                    cornerTL.classList.add('show');
                    cornerTR.classList.remove('show');
                    cornerBL.classList.remove('show');
                    cornerBR.classList.remove('show');
                }
                if (percent === 100) {
                    [cornerTL, cornerTR, cornerBL, cornerBR].forEach(el => el.classList.add('show'));
                }
            }

            function handleAccordion(e) {
                const trigger = e.currentTarget;
                const item = trigger.closest('.letter-accordion-item');
                if (!item) return;
                const nowOpen = item.classList.toggle('is-open');
                trigger.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
            }

            function handleNeverToggle(e) {
                const btn = e.currentTarget;
                const group = btn.closest('[data-never-toggle-group]');
                if (!group) return;
                const list = group.parentElement.querySelector('[data-never-list]');
                if (!list) return;
                const mode = btn.dataset.neverMode;
                list.classList.toggle('is-numbered', mode === 'numbered');
                list.classList.toggle('is-bulleted', mode === 'bulleted');
                group.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
            }

            function bindInteractions(container) {
                if (!container) return;
                container.querySelectorAll('.letter-accordion-trigger').forEach(trigger => {
                    trigger.removeEventListener('click', handleAccordion);
                    trigger.addEventListener('click', handleAccordion);
                });
                container.querySelectorAll('[data-never-toggle-group] button').forEach(btn => {
                    btn.removeEventListener('click', handleNeverToggle);
                    btn.addEventListener('click', handleNeverToggle);
                });
                container.querySelectorAll('.letter-accordion-item.is-open .letter-accordion-trigger').forEach(tr => {
                    tr.setAttribute('aria-expanded', 'true');
                });
                container.querySelectorAll('.letter-accordion-item:not(.is-open) .letter-accordion-trigger').forEach(tr => {
                    tr.setAttribute('aria-expanded', 'false');
                });
            }

            function buildLetterPanel(index, data) {
                const panel = document.createElement('div');
                panel.className = 'letter-panel' + (index === 0 ? ' active' : '');
                panel.dataset.index = String(index);

                const frame = document.createElement('div');
                let frameClass = 'letter-card-frame';
                if (data.isTitleCard) frameClass += ' title-card-frame';
                if (data.isIndexCard) frameClass += ' index-card-frame';
                frame.className = frameClass;

                const cover = document.createElement('div');
                cover.className = 'letter-cover';
                const label = data.isSpecial ? data.specialLabel || 'SPECIAL' : 'LETTER ' + String(index + 1).padStart(2, '0');
                cover.innerHTML = `
                        <div class="swiss-grid letter-cover-grid">
                            <span class="swiss-col swiss-col-span-3 letter-cover-kicker">${label}</span>
                            <h2 class="swiss-col swiss-col-span-9 letter-cover-name"${data.coverFont ? ` data-cover-font="${data.coverFont}"` : ''}>${escapeHtml(data.title)}</h2>
                            <p class="swiss-col swiss-col-span-6 swiss-offset-3 letter-cover-deck">${escapeHtml(data.deck || '')}</p>
                        </div>
                    `;
                frame.appendChild(cover);

                const toolbar = document.createElement('div');
                toolbar.className = 'letter-toolbar';
                const countEl = document.createElement('span');
                countEl.className = 'letter-count';
                countEl.textContent = data.viewMode || 'info';
                toolbar.appendChild(countEl);
                frame.appendChild(toolbar);

                const content = document.createElement('div');
                content.className = 'letter-content';
                frame.appendChild(content);

                panel.appendChild(frame);

                panel.addEventListener('click', () => {
                    const idx = Number(panel.dataset.index);
                    if (idx !== activeIndex) activatePanel(idx);
                });

                return panel;
            }

            function injectLetterContent(index) {
                const panels = document.querySelectorAll('.letter-panel');
                if (!panels.length) return;
                const panel = panels[index];
                if (!panel) return;
                const data = letterData[index];
                if (!data) return;

                const frame = panel.querySelector('.letter-card-frame');
                const content = frame.querySelector('.letter-content');
                if (!content) return;

                if (data.contentFn) {
                    content.innerHTML = data.contentFn();
                } else if (data.staticContent) {
                    content.innerHTML = data.staticContent;
                } else {
                    content.innerHTML = `<div class="sample-letter"><p>This letter is empty. Edit <code>letterData[${index}]</code> to add content.</p></div>`;
                }

                if (!data.isIndexCard && !data.isTitleCard) {
                    const hint = document.createElement('div');
                    hint.className = 'conversation-stack-hint';
                    hint.textContent = 'Conversation & replies live below this letter';
                    content.appendChild(hint);
                } else if (data.isTitleCard) {
                    const hint = document.createElement('div');
                    hint.className = 'conversation-stack-hint';
                    hint.textContent = 'Threads and responses follow beneath this manifesto';
                    content.appendChild(hint);
                }

                bindInteractions(content);
            }

            function renderLetter(index) {
                injectLetterContent(index);
                assignColumnLabels();
                syncViewRail();
                if (index === activeIndex) {
                    updateBorderProgress();
                    const counter = document.getElementById('hudNavCounter');
                    if (counter) counter.textContent = `${activeIndex+1}/${letterData.length}`;
                    const statusCount = document.getElementById('hudStatusCount');
                    if (statusCount) statusCount.textContent = String(letterData.length);
                }
            }

            function assignColumnLabels() {
                if (window.innerWidth <= 640) return;

                document.querySelectorAll('.swiss-grid').forEach(grid => {
                    const children = Array.from(grid.children).filter(el =>
                        el.nodeType === 1 && (
                            el.classList.contains('swiss-col') ||
                            /(^|\s)swiss-col-span-\d+(\s|$)/.test(el.className)
                        )
                    );
                    let cursor = 1;
                    children.forEach(col => {
                        const spanMatch = col.className.match(/swiss-col-span-(\d+)/);
                        const spanNum = spanMatch ? parseInt(spanMatch[1], 10) : 1;
                        const offsetMatch = col.className.match(/swiss-offset-(\d+)/);
                        if (offsetMatch) cursor = parseInt(offsetMatch[1], 10) + 1;
                        const start = cursor;
                        const end = Math.min(start + spanNum - 1, 12);
                        col.setAttribute('data-col-label', `${start}–${end}`);
                        cursor = end + 1;
                        if (cursor > 12) cursor = 1;
                    });
                });
            }

            function renderTrack() {
                const track = document.getElementById('lettersTrack');
                track.innerHTML = '';
                letterData.forEach((data, i) => track.appendChild(buildLetterPanel(i, data)));
                letterData.forEach((_, i) => injectLetterContent(i));
                renderLetter(0);
                updateBorderProgress();
                const counter = document.getElementById('hudNavCounter');
                if (counter) counter.textContent = `1/${letterData.length}`;
                assignColumnLabels();
                syncViewRail();
            }

            /* ── View switcher helpers (rail-driven) ── */
            function setViewMode(mode) {
                if (!letterData[activeIndex]) return;
                letterData[activeIndex].viewMode = mode;
                injectLetterContent(activeIndex);
                assignColumnLabels();
                syncViewRail();
            }

            function syncViewRail() {
                const current = (letterData[activeIndex] && letterData[activeIndex].viewMode) || 'info';
                document.querySelectorAll('.rail-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.view === current);
                });
            }

            function activatePanel(newIndex) {
                if (newIndex < 0) newIndex = letterData.length - 1;
                if (newIndex >= letterData.length) newIndex = 0;
                if (newIndex === activeIndex) { scrollToPanel(newIndex);
                    updateBorderProgress(); syncViewRail(); return; }
                const panels = document.querySelectorAll('.letter-panel');
                panels.forEach(p => p.classList.remove('active'));
                activeIndex = newIndex;
                panels[activeIndex].classList.add('active');
                injectLetterContent(activeIndex);
                scrollToPanel(activeIndex);
                updateBorderProgress();
                syncViewRail();
                const counter = document.getElementById('hudNavCounter');
                if (counter) counter.textContent = `${activeIndex+1}/${letterData.length}`;
                assignColumnLabels();
            }

            function scrollToPanel(index) {
                const panel = document.querySelectorAll('.letter-panel')[index];
                if (!panel) return;
                const track = document.getElementById('lettersTrack');
                const trackRect = track.getBoundingClientRect();
                const panelRect = panel.getBoundingClientRect();
                const delta = panelRect.left + panelRect.width / 2 - (trackRect.left + trackRect.width / 2);
                track.scrollTo({ left: track.scrollLeft + delta, behavior: 'smooth' });
            }

            function setupViewportBlur() {
                const top = document.getElementById('viewportBlurTop'),
                    bottom = document.getElementById('viewportBlurBottom'),
                    hudTop = document.getElementById('hudTop');
                if (!top || !bottom) return;

                function update() {
                    const scrollY = window.scrollY || window.pageYOffset || 0;
                    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                    top.classList.toggle('scrolling', scrollY > 4);
                    bottom.classList.toggle('scrolling', scrollY < maxScroll - 4);
                    if (hudTop) hudTop.classList.toggle('docked', scrollY > 4);
                }
                let ticking = false;

                function onScrollOrResize() { if (ticking) return;
                    ticking = true;
                    requestAnimationFrame(() => { update();
                        ticking = false; }); }
                window.addEventListener('scroll', onScrollOrResize, { passive: true });
                window.addEventListener('resize', onScrollOrResize);
                update();
            }

            (function initWriteCursor() {
                const dot = document.getElementById('writeCursorDot');
                const ellipse = document.getElementById('writeCursorEllipse');
                if (!dot || !ellipse) return;
                const NATIVE_SELECTOR = ['button', 'a', 'input', 'textarea', 'select', '[role="button"]',
                    '.letter-hotspot'
                ].join(', ');
                let ptrX = 0,
                    ptrY = 0,
                    prevFrameX = 0,
                    prevFrameY = 0,
                    frameInit = false;
                let ellAngle = 0,
                    ellScaleX = 1,
                    ellScaleY = 1,
                    rafId = null;
                const ELLIPSE_LERP = 0.22,
                    SPEED_SATURATE = 34,
                    MAX_STRETCH = 0.6;

                function shortAngleLerp(current, target, factor) { const diff = ((target - current + 540) % 360) - 180; return current +
                        diff * factor; }

                function step() {
                    if (!frameInit) { prevFrameX = ptrX;
                        prevFrameY = ptrY;
                        frameInit = true; }
                    const dx = ptrX - prevFrameX,
                        dy = ptrY - prevFrameY;
                    prevFrameX = ptrX;
                    prevFrameY = ptrY;
                    const speed = Math.hypot(dx, dy);
                    const angleTarget = speed > 0.4 ? Math.atan2(dy, dx) * (180 / Math.PI) : ellAngle;
                    const stretch = Math.min(speed / SPEED_SATURATE, 1) * MAX_STRETCH;
                    ellAngle = shortAngleLerp(ellAngle, angleTarget, ELLIPSE_LERP);
                    ellScaleX += (1 + stretch - ellScaleX) * ELLIPSE_LERP;
                    ellScaleY += (1 - stretch * 0.45 - ellScaleY) * ELLIPSE_LERP;
                    ellipse.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px) rotate(' + ellAngle +
                        'deg) scale(' + ellScaleX + ',' + ellScaleY + ')';
                    rafId = requestAnimationFrame(step);
                }

                function startLoop() { if (!rafId) rafId = requestAnimationFrame(step); }

                function stopLoop() { if (rafId) { cancelAnimationFrame(rafId);
                        rafId = null; } }

                function hideAll() { dot.classList.remove('visible');
                    ellipse.classList.remove('visible');
                    document.body.classList.remove('write-native-cursor', 'custom-cursor-active');
                    stopLoop(); }
                window.addEventListener('mousemove', (e) => {
                    const overNative = !!(e.target && e.target.nodeType === 1 && e.target.closest(NATIVE_SELECTOR));
                    document.body.classList.add('custom-cursor-active');
                    document.body.classList.toggle('write-native-cursor', overNative);
                    ptrX = e.clientX;
                    ptrY = e.clientY;
                    dot.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px)';
                    dot.classList.add('visible');
                    ellipse.classList.add('visible');
                    startLoop();
                });
                document.addEventListener('mouseleave', hideAll);
            })();

            function setupAppearanceDropdown() {
                const trigger = document.getElementById('appearanceTrigger');
                const dropdown = document.getElementById('appearanceDropdown');
                const wrapper = document.querySelector('.topbar-appearance-wrapper');
                if (!trigger || !dropdown) return;

                const scales = ['xxl', 'xl', 'l', 'm', 's'];
                const fonts = ['satoshi', 'serif', 'special'];
                const labelMap = { satoshi: 'Sat', serif: 'Ser', special: 'SpG' };
                const scaleMap = { s: 'S', m: 'M', l: 'L', xl: 'XL', xxl: 'XXL' };

                function renderMenu() {
                    const currentFont = document.body.getAttribute('data-font') || 'satoshi';
                    const currentScale = document.body.getAttribute('data-scale') || 'xl';
                    dropdown.innerHTML = '';
                    fonts.forEach(font => {
                        scales.forEach(scale => {
                            const item = document.createElement('button');

            letterData = getDefaultLetterData();

            document.addEventListener('DOMContentLoaded', function() {
                setupViewportBlur();
                setupAppearanceDropdown();
                setupGridToggle();

                renderTrack();

                document.getElementById('hudPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
                document.getElementById('hudNext').addEventListener('click', () => activatePanel(activeIndex + 1));
                document.getElementById('letterHotspotPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
                document.getElementById('letterHotspotNext').addEventListener('click', () => activatePanel(activeIndex + 1));

                /* ── View switcher: rail-driven ── */
                document.querySelectorAll('.rail-btn').forEach(btn => {
                    btn.addEventListener('click', () => setViewMode(btn.dataset.view));
                });

                document.getElementById('hudNew').addEventListener('click', function() {
                    alert('Add your own "New" action here.');
                });

                document.getElementById('topResetBtn').addEventListener('click', function() {
                    if (confirm('Reset to default letters?')) resetDemo();
                });

                document.addEventListener('click', function(e) {
                    const link = closestSafe(e.target, '.idx-row') || closestSafe(e.target, '.icg-card');
                    if (link && link.dataset.jump !== undefined) {
                        e.preventDefault();
                        const idx = parseInt(link.dataset.jump);
                        if (!isNaN(idx) && idx >= 0 && idx < letterData.length) activatePanel(idx);
                    }
                });

                const track = document.getElementById('lettersTrack');
                let isDragging = false,
                    dragStartX = 0,
                    dragStartScroll = 0;
                track.addEventListener('pointerdown', (e) => {
                    if (e.pointerType === 'touch') return;
                    if (closestSafe(e.target, 'button, a, input')) return;
                    isDragging = true;
                    dragStartX = e.clientX;
                    dragStartScroll = track.scrollLeft;
                    track.classList.add('dragging');
                    track.setPointerCapture(e.pointerId);
                });
                track.addEventListener('pointermove', (e) => {
                    if (!isDragging) return;
                    track.scrollLeft = dragStartScroll - (e.clientX - dragStartX);
                });
                track.addEventListener('pointerup', () => { isDragging = false;
                    track.classList.remove('dragging'); });
                track.addEventListener('pointercancel', () => { isDragging = false;
                    track.classList.remove('dragging'); });

                let settleTimer = null;
                track.addEventListener('scroll', () => {
                    clearTimeout(settleTimer);
                    settleTimer = setTimeout(() => {
                        const rect = track.getBoundingClientRect();
                        const centerX = rect.left + rect.width / 2;
                        let best = 0,
                            bestDist = Infinity;
                        Array.from(track.children).forEach((panel, i) => {
                            const r = panel.getBoundingClientRect();
                            const c = r.left + r.width / 2;
                            const d = Math.abs(c - centerX);
                            if (d < bestDist) { bestDist = d;
                                best = i; }
                        });
                        if (best !== activeIndex) {
                            const panels = track.querySelectorAll('.letter-panel');
                            panels.forEach(p => p.classList.remove('active'));
                            activeIndex = best;
                            panels[best].classList.add('active');
                            injectLetterContent(activeIndex);
                            updateBorderProgress();
                            syncViewRail();
                            assignColumnLabels();
                            const counter = document.getElementById('hudNavCounter');
                            if (counter) counter.textContent = `${activeIndex+1}/${letterData.length}`;
                        } else updateBorderProgress();
                    }, 150);
                }, { passive: true });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft') { activatePanel(activeIndex - 1);
                        e.preventDefault(); }
                    if (e.key === 'ArrowRight') { activatePanel(activeIndex + 1);
                        e.preventDefault(); }
                    if (e.key === 'Escape') {
                        const drop = document.getElementById('appearanceDropdown');
                        if (drop.classList.contains('open')) drop.classList.remove('open');
                    }
                    if (e.key === 'g' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                        const toggle = document.getElementById('gridToggle');
                        if (toggle) toggle.click();
                        e.preventDefault();
                    }
                });

                const statusCount = document.getElementById('hudStatusCount');
                if (statusCount) statusCount.textContent = String(letterData.length);
                const statusText = document.getElementById('hudStatusText');
                if (statusText) statusText.textContent = `${letterData.length} letters`;

                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(assignColumnLabels, 200);
                });
            });
        })();
    </script>
