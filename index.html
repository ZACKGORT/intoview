            function renderCanvas() {
                const surface = document.getElementById('canvasSurface');
                const edges = document.getElementById('canvasEdges');
                Array.from(surface.children).forEach(ch => { if (ch !== edges) ch.remove(); });
                edges.innerHTML = '';
                minimapNodeEls.clear();

                const nodes = getCanvasNodeSpecsWithPositions();
                nodes.forEach(spec => {
                    const wrap = document.createElement('div');
                    wrap.className = 'canvas-node';
                    wrap.dataset.nodeId = spec.id;
                    wrap.dataset.kind = spec.kind;

                    if (spec.kind === 'identity') {
                        wrap.appendChild(renderIdentityCard(spec.card));
                    } else if (spec.kind === 'index') {
                        wrap.appendChild(renderIndexCard(spec.card));
                    } else {
                        wrap.dataset.clusterId = spec.card.id;
                        renderClusterStack(wrap, spec.card);
                    }

                    surface.appendChild(wrap);
                    attachNodeHandlers(wrap);
                });

                restPositions.clear();
                nodes.forEach(spec => {
                    const node = surface.querySelector(`[data-node-id="${CSS.escape(spec.id)}"]`);
                    if (!node) return;
                    restPositions.set(spec.id, { x: spec.x, y: spec.y });
                    node.style.left = spec.x + 'px';
                    node.style.top = spec.y + 'px';
                    node.style.zIndex = String(++topZ);
                });

                document.body.dataset.layout = canvasLayout;

                if (panOffset.x === 0 && panOffset.y === 0) {
                    requestAnimationFrame(fitCanvasToViewport);
                } else {
                    applyPanTransform();
                }
                updateCanvasToolbarUI();
                attachCanvasHandlers();
                requestAnimationFrame(() => drawCanvasEdges());
                queueMinimapLayout();
            }

            function getCanvasNodeSpecsWithPositions() {
                const specs = getCanvasNodes();
                const saved = loadCanvasState();
                const savedPositions = (saved && saved.positions) || {};
                const computed = getLayoutPositions(canvasLayout, specs);
                return specs.map(spec => {
                    const savedPos = savedPositions[spec.id];
                    const compPos = computed[spec.id] || { x: 0, y: 0 };
                    return Object.assign({}, spec, {
                        x: savedPos ? savedPos.x : compPos.x,
                        y: savedPos ? savedPos.y : compPos.y
                    });
                });
            }

            function renderClusterStack(wrap, cluster) {
                const stack = document.createElement('div');
                stack.className = 'cluster-stack';
                stack.dataset.expanded = expandedClusters.has(cluster.id) ? 'true' : 'false';

                const stackInner = document.createElement('div');
                stackInner.className = 'cluster-stack-inner';

                const title = document.createElement('div');
                title.className = 'cluster-title';

                const hit = document.createElement('div');
                hit.className = 'cluster-peek-hit';
                hit.dataset.action = 'expand';
                title.appendChild(hit);

                const peekCount = Math.min(cluster.cardIds.length, 4);
                for (let d = peekCount; d >= 1; d--) {
                    const peek = document.createElement('div');
                    peek.className = 'cluster-peek';
                    peek.dataset.depth = String(d);
                    title.appendChild(peek);
                }

                title.appendChild(renderCompactCard(cluster));
                stackInner.appendChild(title);
                stack.appendChild(stackInner);

                const leaves = document.createElement('div');
                leaves.className = 'cluster-leaves';
                cluster.cardIds.forEach(cardId => {
                    const card = CARDS.get(cardId);
                    if (!card) return;
                    const leaf = document.createElement('div');
                    leaf.className = 'cluster-leaf';
                    leaf.dataset.cardId = card.id;
                    leaf.dataset.clusterId = card.clusterId;
                    leaf.appendChild(renderCompactCard(card));
                    leaves.appendChild(leaf);
                });
                stack.appendChild(leaves);

                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'cluster-collapse-chip';
                chip.textContent = 'Collapse';
                chip.title = 'Collapse cluster';
                stack.appendChild(chip);

                wrap.appendChild(stack);
            }

            /* ═══ LAYOUT ═══ */
            function getLayoutPositions(layout, nodes) {
                const positions = {};
                positions.identity = { x: 0, y: 0 };
                positions.index = { x: 0, y: ROW_PITCH };

                const clusters = nodes.filter(n => n.kind === 'cluster');
                // In array mode, packArray() will overwrite these; use grid as fallback
                clusters.forEach((n, i) => {
                    const col = i % 3;
                    const row = Math.floor(i / 3);
                    positions[n.id] = {
                        x: (col + 1) * COL_PITCH,
                        y: row * ROW_PITCH
                    };
                });
                return positions;
            }

            function packArray() {
                const startX = COL_PITCH;   // right of the left rail
                const gutterX = 40;
                const gutterY = 28;
                const margin = 32;
                const maxRight = Math.min(window.innerWidth - margin, 3360);
                const maxRowWidth = Math.max(COL_PITCH, maxRight - startX);

                const clusterNodes = [...document.querySelectorAll('.canvas-node[data-kind="cluster"]')];
                if (!clusterNodes.length) return;

                // Sort by CLUSTER_ORDER so packing is deterministic
                clusterNodes.sort((a, b) => {
                    const ai = CLUSTER_ORDER.indexOf(a.dataset.clusterId);
                    const bi = CLUSTER_ORDER.indexOf(b.dataset.clusterId);
                    return ai - bi;
                });

                let shelfX = 0, shelfY = 0, shelfH = 0;
                clusterNodes.forEach(node => {
                    const w = node.offsetWidth;
                    const h = node.offsetHeight;
                    if (shelfX > 0 && shelfX + w > maxRowWidth) {
                        shelfX = 0;
                        shelfY += shelfH + gutterY;
                        shelfH = 0;
                    }
                    const x = snapTo(startX + shelfX, COL_PITCH);
                    const y = shelfY;
                    node.style.left = x + 'px';
                    node.style.top  = y + 'px';
                    restPositions.set(node.dataset.nodeId, { x, y });
                    shelfX += w + gutterX;
                    if (h > shelfH) shelfH = h;
                });
            }

            function relCenter(el) {
                if (!el) return null;
                const node = el.closest('.canvas-node');
                if (!node) return null;
                const nodeX = parseFloat(node.style.left) || 0;
                const nodeY = parseFloat(node.style.top) || 0;
                const nodeRect = node.getBoundingClientRect();
                const elRect = el.getBoundingClientRect();
                return {
                    x: nodeX + (elRect.left - nodeRect.left) + elRect.width / 2,
                    y: nodeY + (elRect.top - nodeRect.top) + elRect.height / 2
                };
            }

            function drawCanvasEdges() {
                const svg = document.getElementById('canvasEdges');
                svg.innerHTML = '';

                const identityNode = document.querySelector('.canvas-node[data-node-id="identity"]');
                const indexNode = document.querySelector('.canvas-node[data-node-id="index"]');
                if (!identityNode || !indexNode) return;

                const identityCard = identityNode.querySelector('.prov-card');
                const indexCard = indexNode.querySelector('.prov-card');
                const identityCenter = relCenter(identityCard);
                const indexCenter = relCenter(indexCard);
                if (!identityCenter || !indexCenter) return;

                const ns = 'http://www.w3.org/2000/svg';
                const addPath = (a, b) => {
                    if (!a || !b) return;
                    const path = document.createElementNS(ns, 'path');
                    path.setAttribute('class', 'canvas-edge');
                    const dx = b.x - a.x;
                    const d = `M ${a.x} ${a.y} C ${a.x + dx * 0.4} ${a.y}, ${b.x - dx * 0.4} ${b.y}, ${b.x} ${b.y}`;
                    path.setAttribute('d', d);
                    svg.appendChild(path);
                };

                addPath(identityCenter, indexCenter);

                document.querySelectorAll('.canvas-node[data-kind="cluster"]').forEach(clusterNode => {
                    const titleCard = clusterNode.querySelector('.cluster-title > .prov-card');
                    const titleCenter = relCenter(titleCard);
                    addPath(indexCenter, titleCenter);

                    const stack = clusterNode.querySelector('.cluster-stack');
                    if (stack && stack.dataset.expanded === 'true') {
                        clusterNode.querySelectorAll('.cluster-leaf').forEach(leafEl => {
                            const leafCard = leafEl.querySelector('.prov-card');
                            addPath(titleCenter, relCenter(leafCard));
                        });
                    }
                });
            }

            function updateCanvasToolbarUI() {
                document.querySelectorAll('[data-canvas-layout]').forEach(b => {
                    b.classList.toggle('active', b.dataset.canvasLayout === canvasLayout);
                });
                document.querySelectorAll('[data-action="toggle-snap"]').forEach(b => {
                    b.classList.toggle('active', snapEnabled);
                });
                const toggle = document.querySelector('#canvasContextMenu [data-action="toggle-widget"]');
                if (toggle) toggle.classList.toggle('active', widgetVisible);
                const mmToggle = document.querySelector('#canvasContextMenu [data-action="toggle-minimap"]');
                if (mmToggle) mmToggle.classList.toggle('active', minimapVisible);
                const gridToggle = document.querySelector('#canvasContextMenu [data-action="toggle-grid"]');
                if (gridToggle) gridToggle.classList.toggle('active', document.body.classList.contains('show-grid'));
                updateMobileSheetActiveStates();
            }

            function applyPanTransform() {
                const surface = document.getElementById('canvasSurface');
                if (surface) surface.style.transform = `translate3d(${panOffset.x}px, ${panOffset.y}px, 0)`;
                queueMinimapFrame();
            }

            function fitCanvasToViewport() {
                const nodes = [...document.querySelectorAll('.canvas-node')];
                if (!nodes.length) return;
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                nodes.forEach(n => {
                    const x = parseFloat(n.style.left) || 0;
                    const y = parseFloat(n.style.top) || 0;
                    minX = Math.min(minX, x);
                    minY = Math.min(minY, y);
                    maxX = Math.max(maxX, x + n.offsetWidth);
                    maxY = Math.max(maxY, y + n.offsetHeight);
                });
                const cx = (minX + maxX) / 2;
                const cy = (minY + maxY) / 2;
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const topbarH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--topbar-height')) || 72;
                panOffset.x = vw / 2 - cx;
                panOffset.y = (vh + topbarH) / 2 - cy;
                applyPanTransform();
            }

            /* ═══ CANVAS ACTIONS ═══ */
            function setCanvasLayout(layout) {
                if (!layout || layout === canvasLayout) {
                    if (layout === canvasLayout) return;
                }

                if (layout === 'array') {
                    // Snapshot current state so we can restore on exit
                    const positions = {};
                    restPositions.forEach((pos, id) => { positions[id] = { x: pos.x, y: pos.y }; });
                    preArraySnapshot = {
                        positions,
                        expanded: new Set(expandedClusters),
                        layout: canvasLayout
                    };

                    canvasLayout = 'array';
                    document.body.dataset.layout = 'array';

                    // Force all clusters expanded
                    CLUSTER_ORDER.forEach(id => expandedClusters.add(id));
                    document.querySelectorAll('.cluster-stack').forEach(s => s.dataset.expanded = 'true');

                    updateCanvasToolbarUI();
                    updateStatusText();

                    // Wait for leaf transition before measuring
                    setTimeout(() => {
                        packArray();
                        saveCanvasState();
                        drawCanvasEdges();
                        queueMinimapLayout();
                        fitCanvasToViewport();
                    }, 420);
                    return;
                }

                // Switching to grid
                if (canvasLayout === 'array' && preArraySnapshot) {
                    // Restore prior expanded state
                    expandedClusters.clear();
                    preArraySnapshot.expanded.forEach(id => expandedClusters.add(id));
                    document.querySelectorAll('.cluster-stack').forEach(s => {
                        const cid = s.closest('.canvas-node').dataset.clusterId;
                        s.dataset.expanded = expandedClusters.has(cid) ? 'true' : 'false';
                    });
                }

                canvasLayout = 'grid';
                document.body.dataset.layout = 'grid';
                preArraySnapshot = null;
                restPositions.clear();

                const specs = getCanvasNodes();
                const computed = getLayoutPositions('grid', specs);

                setTimeout(() => {
                    specs.forEach(s => {
                        const pos = computed[s.id] || { x: 0, y: 0 };
                        restPositions.set(s.id, { x: pos.x, y: pos.y });
                        const node = document.querySelector(`.canvas-node[data-node-id="${CSS.escape(s.id)}"]`);
                        if (node) { node.style.left = pos.x + 'px'; node.style.top = pos.y + 'px'; }
                    });
                    updateCanvasToolbarUI();
                    updateStatusText();
                    setTimeout(() => {
                        fitCanvasToViewport();
                        saveCanvasState();
                        drawCanvasEdges();
                        queueMinimapLayout();
                    }, 400);
                }, 20);
            }

            function fitCanvas() {
                fitCanvasToViewport();
                saveCanvasState();
            }

            function resetCanvas() {
                if (!confirm('Reset canvas layout?')) return;
                try { localStorage.removeItem(CANVAS_STORAGE_KEY); } catch (e) {}
                canvasLayout = 'grid';
                expandedClusters.clear();
                restPositions.clear();
                clusterDisplacements.clear();
                preArraySnapshot = null;
                panOffset.x = 0; panOffset.y = 0;
                document.body.dataset.layout = 'grid';
                renderCanvas();
            }

            function alignAllToGrid() {
                document.querySelectorAll('.canvas-node').forEach(node => {
                    const x = parseFloat(node.style.left) || 0;
                    const y = parseFloat(node.style.top) || 0;
                    const nx = snapTo(x, COL_PITCH);
                    const ny = snapTo(y, ROW_PITCH);
                    node.style.left = nx + 'px';
                    node.style.top = ny + 'px';
                    restPositions.set(node.dataset.nodeId, { x: nx, y: ny });
                });
                saveCanvasState();
                drawCanvasEdges();
                queueMinimapLayout();
            }

            function setSnap(on) {
                snapEnabled = !!on;
                try { localStorage.setItem(SNAP_KEY, snapEnabled ? '1' : '0'); } catch (e) {}
                updateCanvasToolbarUI();
                updateStatusText();
            }

            /* ═══ WIDGET / MINIMAP VISIBILITY ═══ */
            function applyWidgetVisibility() {
                const widget = document.getElementById('canvasWidget');
                if (!widget) return;
                const inSection = currentRoute.level !== 'canvas';
                widget.hidden = !widgetVisible || inSection;
            }

            function setWidgetVisible(on) {
                widgetVisible = !!on;
                try { localStorage.setItem(WIDGET_ON_KEY, widgetVisible ? '1' : '0'); } catch (e) {}
                applyWidgetVisibility();
                updateCanvasToolbarUI();
            }

            function applyMinimapVisibility() {
                const mm = document.getElementById('canvasMinimap');
                if (!mm) return;
                const inSection = currentRoute.level !== 'canvas';
                const shouldShow = minimapVisible && !inSection;
                const wasHidden = mm.hidden;
                mm.hidden = !shouldShow;
                if (shouldShow && wasHidden) {
                    requestAnimationFrame(() => updateMinimapLayout());
                }
            }

            function setMinimapVisible(on) {
                minimapVisible = !!on;
                try { localStorage.setItem(MINIMAP_ON_KEY, minimapVisible ? '1' : '0'); } catch (e) {}
                applyMinimapVisibility();
                updateCanvasToolbarUI();
            }

            function applyMinimapPos() {
                const mm = document.getElementById('canvasMinimap');
                if (!mm) return;
                if (minimapPos && typeof minimapPos.x === 'number' && typeof minimapPos.y === 'number') {
                    mm.style.left = minimapPos.x + 'px';
                    mm.style.top  = minimapPos.y + 'px';
                    mm.style.right = 'auto';
                    mm.style.bottom = 'auto';
                } else {
                    mm.style.left = ''; mm.style.top = '';
                    mm.style.right = ''; mm.style.bottom = '';
                }
            }

            function clampMinimapPos(x, y) {
                const mm = document.getElementById('canvasMinimap');
                if (!mm) return { x, y };
                const w = mm.offsetWidth, h = mm.offsetHeight;
                x = Math.max(4, Math.min(window.innerWidth  - w - 4, x));
                y = Math.max(4, Math.min(window.innerHeight - h - 4, y));
                return { x, y };
            }

            function queueMinimapLayout() {
                if (minimapLayoutQueued) return;
                minimapLayoutQueued = true;
                requestAnimationFrame(() => {
                    minimapLayoutQueued = false;
                    updateMinimapLayout();
                });
            }

            function queueMinimapFrame() {
                if (minimapLayoutQueued || minimapFrameQueued) return;
                minimapFrameQueued = true;
                requestAnimationFrame(() => {
                    minimapFrameQueued = false;
                    updateMinimapFrame();
                });
            }

            function updateMinimapLayout() {
                const mm = document.getElementById('canvasMinimap');
                const content = document.getElementById('minimapContent');
                const viewport = document.getElementById('minimapViewport');
                if (!mm || mm.hidden || !content || !viewport) return;

                const nodes = [...document.querySelectorAll('.canvas-node')];
                if (!nodes.length) {
                    content.style.transform = '';
                    minimapNodeEls.clear();
                    minimapBounds = null;
                    return;
                }

                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                const nodeData = nodes.map(n => {
                    const x = parseFloat(n.style.left) || 0;
                    const y = parseFloat(n.style.top)  || 0;
                    const w = n.offsetWidth;
                    const h = n.offsetHeight;
                    if (x < minX) minX = x;
                    if (y < minY) minY = y;
                    if (x + w > maxX) maxX = x + w;
                    if (y + h > maxY) maxY = y + h;
                    return { el: n, x, y, w, h };
                });

                const pad = 80;
                minX -= pad; minY -= pad; maxX += pad; maxY += pad;

                const worldW = Math.max(1, maxX - minX);
                const worldH = Math.max(1, maxY - minY);

                const mmW = viewport.clientWidth  || 220;
                const mmH = viewport.clientHeight || 140;
                const innerPad = 6;
                const usableW = mmW - innerPad * 2;
                const usableH = mmH - innerPad * 2;
                const scale = Math.min(usableW / worldW, usableH / worldH);
                const offsetX = innerPad + (usableW - worldW * scale) / 2;
                const offsetY = innerPad + (usableH - worldH * scale) / 2;

                minimapBounds = { minX, minY, maxX, maxY, scale, offsetX, offsetY };

                const seen = new Set();
                nodeData.forEach(nd => {
                    const id = nd.el.dataset.nodeId;
                    seen.add(id);
                    let el = minimapNodeEls.get(id);
                    if (!el) {
                        el = document.createElement('div');
                        el.className = 'minimap-node';
                        minimapNodeEls.set(id, el);
                        content.appendChild(el);
                    }
                    el.dataset.kind = nd.el.dataset.kind || 'card';
                    el.style.left   = nd.x + 'px';
                    el.style.top    = nd.y + 'px';
                    el.style.width  = nd.w + 'px';
                    el.style.height = nd.h + 'px';
                });
                minimapNodeEls.forEach((el, id) => {
                    if (!seen.has(id)) { el.remove(); minimapNodeEls.delete(id); }
                });

                content.style.transform =
                    `translate(${offsetX - minX * scale}px, ${offsetY - minY * scale}px) scale(${scale})`;

                updateMinimapFrame();
            }

            function updateMinimapFrame() {
                const frame = document.getElementById('minimapFrame');
                if (!frame || !minimapBounds) return;
                const { scale, offsetX, offsetY, minX, minY } = minimapBounds;
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const wx = -panOffset.x;
                const wy = -panOffset.y;
                frame.style.left   = (offsetX + (wx - minX) * scale) + 'px';
                frame.style.top    = (offsetY + (wy - minY) * scale) + 'px';
                frame.style.width  = (vw * scale) + 'px';
                frame.style.height = (vh * scale) + 'px';
            }

            function minimapJump(clientX, clientY) {
                const viewport = document.getElementById('minimapViewport');
                if (!viewport || !minimapBounds) return;
                const rect = viewport.getBoundingClientRect();
                const mx = clientX - rect.left;
                const my = clientY - rect.top;
                const { scale, offsetX, offsetY, minX, minY } = minimapBounds;
                const wx = (mx - offsetX) / scale + minX;
                const wy = (my - offsetY) / scale + minY;
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const topbarH = parseInt(getComputedStyle(document.documentElement)
                    .getPropertyValue('--topbar-height')) || 72;
                panOffset.x = vw / 2 - wx;
                panOffset.y = (vh + topbarH) / 2 - wy;
                applyPanTransform();
            }

            function setupMinimap() {
                const mm = document.getElementById('canvasMinimap');
                if (!mm) return;

                try {
                    const stored = localStorage.getItem(MINIMAP_ON_KEY);
                    if (stored === null) {
                        // Default off on mobile, on desktop
                        minimapVisible = window.innerWidth > 640;
                    } else {
                        minimapVisible = stored === '1';
                    }
                } catch (e) { minimapVisible = window.innerWidth > 640; }

                try {
                    const pos = JSON.parse(localStorage.getItem(MINIMAP_POS_KEY) || 'null');
                    if (pos && typeof pos.x === 'number' && typeof pos.y === 'number') minimapPos = pos;
                } catch (e) {}
                applyMinimapPos();

                mm.querySelector('.minimap-close').addEventListener('click', () => setMinimapVisible(false));

                const grip = mm.querySelector('.minimap-grip');
                grip.addEventListener('pointerdown', (e) => {
                    if (e.button !== 0) return;
                    const rect = mm.getBoundingClientRect();
                    const startX = e.clientX, startY = e.clientY;
                    const startL = rect.left, startT = rect.top;

                    mm.style.right = 'auto'; mm.style.bottom = 'auto';
                    mm.style.left = startL + 'px'; mm.style.top = startT + 'px';
                    mm.classList.add('dragging');
                    try { grip.setPointerCapture(e.pointerId); } catch (err) {}

                    const onMove = (ev) => {
                        if (ev.pointerId !== e.pointerId) return;
                        const cx = startL + (ev.clientX - startX);
                        const cy = startT + (ev.clientY - startY);
                        const c = clampMinimapPos(cx, cy);
                        mm.style.left = c.x + 'px'; mm.style.top = c.y + 'px';
                        minimapPos = c;
                    };
                    const onUp = (ev) => {
                        if (ev.pointerId !== e.pointerId) return;
                        mm.classList.remove('dragging');
                        grip.removeEventListener('pointermove', onMove);
                        grip.removeEventListener('pointerup', onUp);
                        grip.removeEventListener('pointercancel', onUp);
                        try { grip.releasePointerCapture(e.pointerId); } catch (err) {}
                        try { if (minimapPos) localStorage.setItem(MINIMAP_POS_KEY, JSON.stringify(minimapPos)); } catch (err) {}
                    };
                    grip.addEventListener('pointermove', onMove);
                    grip.addEventListener('pointerup', onUp);
                    grip.addEventListener('pointercancel', onUp);
                    e.preventDefault();
                });

                const viewport = mm.querySelector('.minimap-viewport');
                let panState = null;
                viewport.addEventListener('pointerdown', (e) => {
                    if (e.button !== 0) return;
                    panState = { pointerId: e.pointerId };
                    try { viewport.setPointerCapture(e.pointerId); } catch (err) {}
                    viewport.style.cursor = 'grabbing';
                    minimapJump(e.clientX, e.clientY);
                    e.preventDefault();
                });
                viewport.addEventListener('pointermove', (e) => {
                    if (!panState || e.pointerId !== panState.pointerId) return;
                    minimapJump(e.clientX, e.clientY);
                });
                const endPan = (e) => {
                    if (!panState || e.pointerId !== panState.pointerId) return;
                    panState = null;
                    viewport.style.cursor = '';
                    try { viewport.releasePointerCapture(e.pointerId); } catch (err) {}
                    saveCanvasState();
                };
                viewport.addEventListener('pointerup', endPan);
                viewport.addEventListener('pointercancel', endPan);
            }

            /* ═══ CONTEXT MENU ═══ */
            function closeContextMenu() {
                const menu = document.getElementById('canvasContextMenu');
                if (!menu) return;
                menu.classList.remove('open');
                menu.hidden = true;
            }

            function openContextMenu(x, y) {
                const menu = document.getElementById('canvasContextMenu');
                if (!menu) return;
                updateCanvasToolbarUI();
                menu.hidden = false;
                menu.style.left = '0px'; menu.style.top = '0px';
                menu.classList.add('open');
                const mr = menu.getBoundingClientRect();
                const vw = window.innerWidth, vh = window.innerHeight;
                if (x + mr.width > vw - 8) x = vw - mr.width - 8;
                if (y + mr.height > vh - 8) y = vh - mr.height - 8;
                if (x < 8) x = 8;
                if (y < 8) y = 8;
                menu.style.left = x + 'px'; menu.style.top = y + 'px';
            }

            function setupContextMenu() {
                const canvas = document.getElementById('canvasRoot');
                const menu = document.getElementById('canvasContextMenu');
                if (!canvas || !menu) return;

                canvas.addEventListener('contextmenu', (e) => {
                    if (e.target.closest('.canvas-widget, .canvas-context-menu, .canvas-minimap')) return;
                    e.preventDefault();
                    openContextMenu(e.clientX, e.clientY);
                });

                document.addEventListener('pointerdown', (e) => {
                    if (!menu.classList.contains('open')) return;
                    if (menu.contains(e.target)) return;
                    closeContextMenu();
                }, true);

                menu.querySelectorAll('[data-canvas-layout]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        setCanvasLayout(btn.dataset.canvasLayout);
                        closeContextMenu();
                    });
                });
                menu.querySelector('[data-action="toggle-snap"]').addEventListener('click', () => setSnap(!snapEnabled));
                menu.querySelector('[data-action="toggle-grid"]').addEventListener('click', () => {
                    const on = document.body.classList.toggle('show-grid');
                    const topToggle = document.getElementById('gridToggle');
                    if (topToggle) topToggle.classList.toggle('active', on);
                    updateCanvasToolbarUI();
                });
                menu.querySelector('[data-action="align-grid"]').addEventListener('click', () => { alignAllToGrid(); closeContextMenu(); });
                menu.querySelector('[data-action="fit"]').addEventListener('click', () => { fitCanvas(); closeContextMenu(); });
                menu.querySelector('[data-action="reset"]').addEventListener('click', () => { resetCanvas(); closeContextMenu(); });
                menu.querySelector('[data-action="toggle-widget"]').addEventListener('click', () => setWidgetVisible(!widgetVisible));
                menu.querySelector('[data-action="toggle-minimap"]').addEventListener('click', () => setMinimapVisible(!minimapVisible));
            }

            /* ═══ WIDGET ═══ */
            function applyWidgetPos() {
                const widget = document.getElementById('canvasWidget');
                if (!widget) return;
                if (widgetPos && typeof widgetPos.x === 'number' && typeof widgetPos.y === 'number') {
                    widget.style.left = widgetPos.x + 'px';
                    widget.style.top = widgetPos.y + 'px';
                    widget.style.right = 'auto';
                    widget.style.bottom = 'auto';
                } else {
                    widget.style.left = ''; widget.style.top = '';
                    widget.style.right = ''; widget.style.bottom = '';
                }
            }

            function clampWidgetPos(x, y) {
                const widget = document.getElementById('canvasWidget');
                if (!widget) return { x, y };
                const w = widget.offsetWidth, h = widget.offsetHeight;
                x = Math.max(4, Math.min(window.innerWidth - w - 4, x));
                y = Math.max(4, Math.min(window.innerHeight - h - 4, y));
                return { x, y };
            }

            function setupWidget() {
                const widget = document.getElementById('canvasWidget');
                if (!widget) return;

                try { widgetVisible = localStorage.getItem(WIDGET_ON_KEY) === '1'; } catch (e) {}
                try {
                    const pos = JSON.parse(localStorage.getItem(WIDGET_POS_KEY) || 'null');
                    if (pos && typeof pos.x === 'number' && typeof pos.y === 'number') widgetPos = pos;
                } catch (e) {}
                applyWidgetPos();

                widget.querySelector('.widget-close').addEventListener('click', () => setWidgetVisible(false));
                widget.querySelectorAll('[data-canvas-layout]').forEach(btn => {
                    btn.addEventListener('click', () => setCanvasLayout(btn.dataset.canvasLayout));
                });
                widget.querySelector('[data-action="toggle-snap"]').addEventListener('click', () => setSnap(!snapEnabled));
                widget.querySelector('[data-action="fit"]').addEventListener('click', fitCanvas);
                widget.querySelector('[data-action="reset"]').addEventListener('click', resetCanvas);

                const grip = widget.querySelector('.widget-grip');
                grip.addEventListener('pointerdown', (e) => {
                    if (e.button !== 0) return;
                    const rect = widget.getBoundingClientRect();
                    const startX = e.clientX, startY = e.clientY;
                    const startL = rect.left, startT = rect.top;

                    widget.style.right = 'auto'; widget.style.bottom = 'auto';
                    widget.style.left = startL + 'px'; widget.style.top = startT + 'px';
                    widget.classList.add('dragging');
                    try { grip.setPointerCapture(e.pointerId); } catch (err) {}

                    const onMove = (ev) => {
                        if (ev.pointerId !== e.pointerId) return;
                        const cx = startL + (ev.clientX - startX);
                        const cy = startT + (ev.clientY - startY);
                        const clamped = clampWidgetPos(cx, cy);
                        widget.style.left = clamped.x + 'px';
                        widget.style.top = clamped.y + 'px';
                        widgetPos = { x: clamped.x, y: clamped.y };
                    };
                    const onUp = (ev) => {
                        if (ev.pointerId !== e.pointerId) return;
                        widget.classList.remove('dragging');
                        grip.removeEventListener('pointermove', onMove);
                        grip.removeEventListener('pointerup', onUp);
                        grip.removeEventListener('pointercancel', onUp);
                        try { grip.releasePointerCapture(e.pointerId); } catch (err) {}
                        try { if (widgetPos) localStorage.setItem(WIDGET_POS_KEY, JSON.stringify(widgetPos)); } catch (err) {}
                    };
                    grip.addEventListener('pointermove', onMove);
                    grip.addEventListener('pointerup', onUp);
                    grip.addEventListener('pointercancel', onUp);
                    e.preventDefault();
                });
            }

            /* ═══ NODE DRAG ═══ */
            function attachNodeHandlers(node) {
                let dragState = null;

                node.addEventListener('pointerdown', (e) => {
                    if (e.button !== 0) return;
                    dragState = {
                        startX: e.clientX, startY: e.clientY,
                        startLeft: parseFloat(node.style.left) || 0,
                        startTop: parseFloat(node.style.top) || 0,
                        origTarget: e.target, moved: false, pointerId: e.pointerId
                    };
                    try { node.setPointerCapture(e.pointerId); } catch (err) {}
                    node.classList.add('dragging');
                    node.style.zIndex = String(++topZ);
                    e.preventDefault();
                    e.stopPropagation();
                });

                node.addEventListener('pointermove', (e) => {
                    if (!dragState || e.pointerId !== dragState.pointerId) return;
                    const dx = e.clientX - dragState.startX;
                    const dy = e.clientY - dragState.startY;
                    if (!dragState.moved && Math.hypot(dx, dy) > 4) {
                        dragState.moved = true;
                        document.body.classList.add('dragging-node');
                        // Exiting array on first actual drag; keep dragged node where it is
                        if (canvasLayout === 'array' && node.dataset.kind === 'cluster') {
                            exitArrayForDrag(node);
                        }
                    }
                    if (!dragState.moved) return;
                    const x = dragState.startLeft + dx;
                    const y = dragState.startTop + dy;
                    node.style.left = x + 'px';
                    node.style.top = y + 'px';

                    const mmEl = minimapNodeEls.get(node.dataset.nodeId);
                    if (mmEl) {
                        mmEl.style.left = x + 'px';
                        mmEl.style.top  = y + 'px';
                    }
                });

                const endDrag = (e) => {
                    if (!dragState || (e && e.pointerId !== dragState.pointerId)) return;
                    const state = dragState;
                    dragState = null;
                    node.classList.remove('dragging');
                    document.body.classList.remove('dragging-node');
                    try { node.releasePointerCapture(state.pointerId); } catch (err) {}

                    if (state.moved) {
                        let nx = parseFloat(node.style.left) || 0;
                        let ny = parseFloat(node.style.top) || 0;
                        if (snapEnabled) {
                            nx = snapTo(nx, COL_PITCH);
                            ny = snapTo(ny, ROW_PITCH);
                            node.style.left = nx + 'px';
                            node.style.top  = ny + 'px';
                        }
                        restPositions.set(node.dataset.nodeId, { x: nx, y: ny });

                        clusterDisplacements.forEach((list, cid) => {
                            const idx = list.findIndex(d => d.nodeId === node.dataset.nodeId);
                            if (idx >= 0) {
                                list.splice(idx, 1);
                                if (!list.length) clusterDisplacements.delete(cid);
                            }
                        });

                        saveCanvasState();
                        requestAnimationFrame(() => drawCanvasEdges());
                        queueMinimapLayout();
                        return;
                    }

                    const target = state.origTarget;

                    // Index card row → cluster
                    if (target.closest && target.closest('.index-row')) {
                        const cid = target.closest('.index-row').dataset.clusterId;
                        if (cid) { navigate({ level: 'cluster', clusterId: cid }); return; }
                    }
                    // Identity card → identity letter
                    if (node.dataset.kind === 'identity') {
                        navigate({ level: 'cluster', clusterId: 'identity' });
                        return;
                    }
                    // Index card → index letter
                    if (node.dataset.kind === 'index') {
                        navigate({ level: 'cluster', clusterId: 'index' });
                        return;
                    }

                    if (target.closest && target.closest('.cluster-collapse-chip')) {
                        toggleCluster(node.dataset.clusterId);
                        return;
                    }
                    if (target.closest && target.closest('.cluster-peek-hit')) {
                        toggleCluster(node.dataset.clusterId);
                        return;
                    }
                    const leaf = target.closest && target.closest('.cluster-leaf');
                    if (leaf) {
                        navigate({ level: 'card', clusterId: leaf.dataset.clusterId, cardId: leaf.dataset.cardId });
                        return;
                    }
                    if (node.dataset.kind === 'cluster') {
                        navigate({ level: 'cluster', clusterId: node.dataset.clusterId });
                        return;
                    }
                };

                node.addEventListener('pointerup', endDrag);
                node.addEventListener('pointercancel', endDrag);
            }

            function exitArrayForDrag(draggedNode) {
                if (canvasLayout !== 'array') return;
                const draggedId = draggedNode.dataset.nodeId;
                const draggedX = parseFloat(draggedNode.style.left) || 0;
                const draggedY = parseFloat(draggedNode.style.top) || 0;

                // Collapse all
                expandedClusters.clear();
                document.querySelectorAll('.cluster-stack').forEach(s => s.dataset.expanded = 'false');

                canvasLayout = 'grid';
                document.body.dataset.layout = 'grid';
                preArraySnapshot = null;

                const specs = getCanvasNodes();
                const computed = getLayoutPositions('grid', specs);
                specs.forEach(s => {
                    if (s.id === draggedId) {
                        restPositions.set(s.id, { x: draggedX, y: draggedY });
                        return;
                    }
                    const pos = computed[s.id] || { x: 0, y: 0 };
                    restPositions.set(s.id, { x: pos.x, y: pos.y });
                    const n = document.querySelector(`.canvas-node[data-node-id="${CSS.escape(s.id)}"]`);
                    if (n) { n.style.left = pos.x + 'px'; n.style.top = pos.y + 'px'; }
                });
                updateCanvasToolbarUI();
                updateStatusText();
            }

            /* ═══ CLUSTER EXPAND / COLLAPSE ═══ */
            function toggleCluster(id) {
                if (!id) return;
                if (canvasLayout === 'array') return; // no manual toggle in array
                const wasExpanded = expandedClusters.has(id);
                if (wasExpanded) expandedClusters.delete(id);
                else expandedClusters.add(id);

                const node = document.querySelector(`.canvas-node[data-cluster-id="${CSS.escape(id)}"]`);
                if (node) {
                    const stack = node.querySelector('.cluster-stack');
                    if (stack) stack.dataset.expanded = wasExpanded ? 'false' : 'true';
                }

                if (!wasExpanded) {
                    const snapshot = new Map();
                    document.querySelectorAll('.canvas-node').forEach(n => {
                        snapshot.set(n.dataset.nodeId, {
                            x: parseFloat(n.style.left) || 0,
                            y: parseFloat(n.style.top) || 0
                        });
                    });
                    setTimeout(() => {
                        const displaced = pushOverlaps(snapshot);
                        if (displaced.length) clusterDisplacements.set(id, displaced);
                        saveCanvasState();
                        drawCanvasEdges();
                        queueMinimapLayout();
                    }, 360);
                } else {
                    const displaced = clusterDisplacements.get(id);
                    if (displaced) {
                        displaced.forEach(({ nodeId, x, y }) => {
                            const n = document.querySelector(`.canvas-node[data-node-id="${CSS.escape(nodeId)}"]`);
                            if (!n) return;
                            n.style.left = x + 'px';
                            n.style.top = y + 'px';
                            restPositions.set(nodeId, { x, y });
                        });
                        clusterDisplacements.delete(id);
                    }
                    saveCanvasState();
                    setTimeout(() => {
                        if (expandedClusters.size > 0) {
                            const snapshot = new Map();
                            document.querySelectorAll('.canvas-node').forEach(n => {
                                snapshot.set(n.dataset.nodeId, {
                                    x: parseFloat(n.style.left) || 0,
                                    y: parseFloat(n.style.top) || 0
                                });
                            });
                            pushOverlaps(snapshot);
                            saveCanvasState();
                        }
                        drawCanvasEdges();
                        queueMinimapLayout();
                    }, 360);
                }
            }

            function collapseAllClusters() {
                if (expandedClusters.size === 0) return false;
                expandedClusters.clear();
                document.querySelectorAll('.cluster-stack').forEach(s => s.dataset.expanded = 'false');

                clusterDisplacements.forEach((list) => {
                    list.forEach(({ nodeId, x, y }) => {
                        const n = document.querySelector(`.canvas-node[data-node-id="${CSS.escape(nodeId)}"]`);
                        if (!n) return;
                        n.style.left = x + 'px';
                        n.style.top = y + 'px';
                        restPositions.set(nodeId, { x, y });
                    });
                });
                clusterDisplacements.clear();

                saveCanvasState();
                setTimeout(() => { drawCanvasEdges(); queueMinimapLayout(); }, 360);
                return true;
            }

            function pushOverlaps(snapshot) {
                const expandedNodes = [];
                document.querySelectorAll('.canvas-node[data-kind="cluster"]').forEach(n => {
                    if (expandedClusters.has(n.dataset.clusterId)) expandedNodes.push(n);
                });
                if (!expandedNodes.length) return [];

                const gap = 32;
                const displaced = new Map();

                for (let pass = 0; pass < 4; pass++) {
                    let movedThisPass = false;
                    document.querySelectorAll('.canvas-node').forEach(node => {
                        if (node.dataset.kind === 'cluster' && expandedClusters.has(node.dataset.clusterId)) return;
                        if (node.dataset.nodeId === 'identity' || node.dataset.nodeId === 'index') return;

                        const nx = parseFloat(node.style.left) || 0;
                        const ny = parseFloat(node.style.top) || 0;
                        const nw = node.offsetWidth;
                        const nh = node.offsetHeight;

                        for (const ex of expandedNodes) {
                            if (ex === node) continue;
                            const exX = parseFloat(ex.style.left) || 0;
                            const exY = parseFloat(ex.style.top) || 0;
                            const exW = ex.offsetWidth;
                            const exH = ex.offsetHeight;

                            const overlapX = nx < exX + exW + gap && nx + nw + gap > exX;
                            const overlapY = ny < exY + exH + gap && ny + nh + gap > exY;
                            if (!overlapX || !overlapY) continue;

                            const pushRight = exX + exW + gap - nx;
                            const pushDown  = exY + exH + gap - ny;

                            let newX = nx, newY = ny;
                            if (pushRight <= pushDown) newX = snapUp(nx + pushRight, COL_PITCH);
                            else newY = snapUp(ny + pushDown, ROW_PITCH);

                            if (snapshot && !displaced.has(node.dataset.nodeId)) {
                                const orig = snapshot.get(node.dataset.nodeId);
                                if (orig) displaced.set(node.dataset.nodeId, {
                                    nodeId: node.dataset.nodeId, x: orig.x, y: orig.y
                                });
                            }

                            node.style.left = newX + 'px';
                            node.style.top  = newY + 'px';
                            restPositions.set(node.dataset.nodeId, { x: newX, y: newY });
                            movedThisPass = true;
                            break;
                        }
                    });
                    if (!movedThisPass) break;
                }
                return Array.from(displaced.values());
            }

            function attachCanvasHandlers() {
                const canvasRoot = document.getElementById('canvasRoot');
                if (!canvasRoot || canvasRoot.dataset.bound === '1') return;
                canvasRoot.dataset.bound = '1';

                canvasRoot.addEventListener('pointerdown', (e) => {
                    if (e.target.closest('.canvas-node')) return;
                    if (e.target.closest('.canvas-widget, .canvas-context-menu, .canvas-minimap')) return;
                    if (e.button !== 0 && e.button !== 1) return;
                    const state = {
                        startX: e.clientX, startY: e.clientY,
                        startPanX: panOffset.x, startPanY: panOffset.y,
                        pointerId: e.pointerId, button: e.button, moved: false
                    };
                    try { canvasRoot.setPointerCapture(e.pointerId); } catch (err) {}
                    canvasRoot.classList.add('panning');
                    e.preventDefault();
                    const onMove = (ev) => {
                        if (ev.pointerId !== state.pointerId) return;
                        const dx = ev.clientX - state.startX;
                        const dy = ev.clientY - state.startY;
                        if (!state.moved && Math.hypot(dx, dy) > 4) state.moved = true;
                        panOffset.x = state.startPanX + dx;
                        panOffset.y = state.startPanY + dy;
                        applyPanTransform();
                    };
                    const onUp = (ev) => {
                        if (ev.pointerId !== state.pointerId) return;
                        canvasRoot.classList.remove('panning');
                        canvasRoot.removeEventListener('pointermove', onMove);
                        canvasRoot.removeEventListener('pointerup', onUp);
                        canvasRoot.removeEventListener('pointercancel', onUp);
                        try { canvasRoot.releasePointerCapture(state.pointerId); } catch (err) {}
                        if (!state.moved && state.button === 0 && expandedClusters.size > 0 && canvasLayout !== 'array') {
                            collapseAllClusters();
                        }
                        saveCanvasState();
                    };
                    canvasRoot.addEventListener('pointermove', onMove);
                    canvasRoot.addEventListener('pointerup', onUp);
                    canvasRoot.addEventListener('pointercancel', onUp);
                });

                canvasRoot.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    panOffset.x -= e.deltaX;
                    panOffset.y -= e.deltaY;
                    applyPanTransform();
                }, { passive: false });
            }

            /* ═══ PERSISTENCE ═══ */
            function saveCanvasState() {
                const positions = {};
                restPositions.forEach((pos, id) => { positions[id] = { x: pos.x, y: pos.y }; });

                const displacements = {};
                clusterDisplacements.forEach((list, cid) => { displacements[cid] = list; });

                const state = {
                    layout: canvasLayout,
                    positions,
                    pan: { x: panOffset.x, y: panOffset.y },
                    expanded: Array.from(expandedClusters),
                    displacements
                };
                try { localStorage.setItem(CANVAS_STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
            }

            function loadCanvasState() {
                try {
                    const raw = localStorage.getItem(CANVAS_STORAGE_KEY);
                    return raw ? JSON.parse(raw) : null;
                } catch (e) { return null; }
            }

            /* ═══ CAROUSEL ═══ */
            function handleAccordion(e) {
                const trigger = e.currentTarget;
                const item = trigger.closest('.letter-accordion-item');
                if (!item) return;
                const nowOpen = item.classList.toggle('is-open');
                trigger.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
            }

            function handleNeverToggle(e) {
                const btn = e.currentTarget;
                const group = btn.closest('.letter-never-toggle');
                if (!group) return;
                const list = group.parentElement.querySelector('.letter-never-list');
                if (!list) return;
                const mode = btn.dataset.neverMode;
                list.classList.toggle('is-numbered', mode === 'numbered');
                list.classList.toggle('is-bulleted', mode === 'bulleted');
                group.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
            }

            function bindInteractions(container) {
                if (!container) return;
                container.querySelectorAll('.letter-accordion-trigger').forEach(trigger => {
                    trigger.removeEventListener('click', handleAccordion);
                    trigger.addEventListener('click', handleAccordion);
                });
                container.querySelectorAll('.letter-never-toggle button').forEach(btn => {
                    btn.removeEventListener('click', handleNeverToggle);
                    btn.addEventListener('click', handleNeverToggle);
                });
            }

            function renderTrack() {
                const track = document.getElementById('lettersTrack');
                track.innerHTML = '';
                currentCards.forEach((card, i) => {
                    track.appendChild(renderFullCard(card, i, currentCards.length));
                });
                const panels = track.querySelectorAll('.letter-panel');
                panels.forEach(p => p.classList.remove('active'));
                if (panels[activeIndex]) panels[activeIndex].classList.add('active');
                bindInteractions(track);
                updateBorderProgress();
                const counter = document.getElementById('hudNavCounter');
                if (counter) counter.textContent = (activeIndex + 1) + '/' + currentCards.length;
                requestAnimationFrame(() => scrollToPanel(activeIndex, false));
                updateStatusText();
            }

            function activatePanel(newIndex, updateHash) {
                if (newIndex < 0) newIndex = currentCards.length - 1;
                if (newIndex >= currentCards.length) newIndex = 0;
                const panels = document.querySelectorAll('.letter-panel');
                panels.forEach(p => p.classList.remove('active'));
                activeIndex = newIndex;
                if (panels[activeIndex]) panels[activeIndex].classList.add('active');
                scrollToPanel(activeIndex, true);
                updateBorderProgress();
                const counter = document.getElementById('hudNavCounter');
                if (counter) counter.textContent = (activeIndex + 1) + '/' + currentCards.length;
                if (updateHash !== false) {
                    const card = currentCards[activeIndex];
                    if (card && card.type !== 'cluster') {
                        navigate({ level: 'card', clusterId: card.clusterId || card.id, cardId: card.id }, true);
                        updateBreadcrumb();
                        updateMobileBack();
                    } else if (card && card.type === 'cluster') {
                        navigate({ level: 'cluster', clusterId: card.id }, true);
                        updateBreadcrumb();
                        updateMobileBack();
                    }
                }
            }

            function scrollToPanel(index, smooth) {
                const panel = document.querySelectorAll('.letter-panel')[index];
                if (!panel) return;
                const track = document.getElementById('lettersTrack');
                const trackRect = track.getBoundingClientRect();
                const panelRect = panel.getBoundingClientRect();
                const delta = panelRect.left + panelRect.width / 2 - (trackRect.left + trackRect.width / 2);
                track.scrollTo({ left: track.scrollLeft + delta, behavior: smooth ? 'smooth' : 'auto' });
            }

            function updateBorderProgress() {
                const total = currentCards.length;
                const topBar = document.getElementById('scrollBorderTop');
                const bottomBar = document.getElementById('scrollBorderBottom');
                const corners = ['cornerTL','cornerTR','cornerBL','cornerBR'].map(id => document.getElementById(id));
                if (total <= 1) {
                    topBar.style.width = '0%'; bottomBar.style.width = '0%';
                    corners.forEach(el => el && el.classList.remove('show'));
                    return;
                }
                const percent = Math.round((activeIndex / (total - 1)) * 100);
                topBar.style.width = percent + '%';
                bottomBar.style.width = percent + '%';
                topBar.setAttribute('aria-valuenow', String(percent));
                bottomBar.setAttribute('aria-valuenow', String(percent));
                corners.forEach(el => el && el.classList.toggle('show', percent > 0 || percent < 100));
            }

            /* ═══ VIEWPORT BLUR / CURSOR / THEME ═══ */
            function setupViewportBlur() {
                const top = document.getElementById('viewportBlurTop');
                const bottom = document.getElementById('viewportBlurBottom');
                if (!top || !bottom) return;
                function update() {
                    const scrollY = window.scrollY || 0;
                    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                    top.classList.toggle('scrolling', scrollY > 4);
                    bottom.classList.toggle('scrolling', scrollY < maxScroll - 4);
                }
                let ticking = false;
                function onScroll() {
                    if (ticking) return;
                    ticking = true;
                    requestAnimationFrame(() => { update(); ticking = false; });
                }
                window.addEventListener('scroll', onScroll, { passive: true });
                window.addEventListener('resize', onScroll);
                update();
            }

            (function initWriteCursor() {
                const dot = document.getElementById('writeCursorDot');
                const ellipse = document.getElementById('writeCursorEllipse');
                if (!dot || !ellipse) return;
                const NATIVE = ['button','a','input','textarea','select','[role="button"]','.letter-hotspot','.canvas-node','.canvas-widget','.canvas-context-menu','.prov-card','.cluster-peek-hit','.canvas-minimap','.mobile-sheet','.mobile-menu-btn'].join(', ');
                const ACCENT_SURFACE = '.prov-card[data-type="cluster"], .letter-card-frame.title-card-frame, .cluster-collapse-chip, .cluster-peek';
                const LIGHT_SURFACE = '.prov-card[data-type="identity"]';
                let ptrX = 0, ptrY = 0, prevX = 0, prevY = 0, init = false;
                let angle = 0, sx = 1, sy = 1, raf = null;
                function lerpAngle(cur, tgt, f) {
                    const d = ((tgt - cur + 540) % 360) - 180;
                    return cur + d * f;
                }
                function step() {
                    if (!init) { prevX = ptrX; prevY = ptrY; init = true; }
                    const dx = ptrX - prevX, dy = ptrY - prevY;
                    prevX = ptrX; prevY = ptrY;
                    const sp = Math.hypot(dx, dy);
                    const tgt = sp > 0.4 ? Math.atan2(dy, dx) * 180 / Math.PI : angle;
                    const stretch = Math.min(sp / 34, 1) * 0.6;
                    angle = lerpAngle(angle, tgt, 0.22);
                    sx += (1 + stretch - sx) * 0.22;
                    sy += (1 - stretch * 0.45 - sy) * 0.22;
                    ellipse.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px) rotate(' + angle + 'deg) scale(' + sx + ',' + sy + ')';
                    raf = requestAnimationFrame(step);
                }
                window.addEventListener('mousemove', (e) => {
                    const el = (e.target && e.target.nodeType === 1) ? e.target : null;
                    const overNative = !!(el && el.closest(NATIVE));
                    const overAccent = !!(el && el.closest(ACCENT_SURFACE));
                    const overLight = !overAccent && !!(el && el.closest(LIGHT_SURFACE));

                    document.body.classList.add('custom-cursor-active');
                    document.body.classList.toggle('write-native-cursor', overNative);
                    document.body.classList.toggle('cursor-on-accent', overAccent);
                    document.body.classList.toggle('cursor-on-light', overLight);

                    ptrX = e.clientX; ptrY = e.clientY;
                    dot.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px)';
                    dot.classList.add('visible');
                    ellipse.classList.add('visible');
                    if (!raf) raf = requestAnimationFrame(step);
                });
                document.addEventListener('mouseleave', () => {
                    dot.classList.remove('visible'); ellipse.classList.remove('visible');
                    document.body.classList.remove('write-native-cursor','custom-cursor-active','cursor-on-accent','cursor-on-light');
                    if (raf) { cancelAnimationFrame(raf); raf = null; }
                });
            })();

            function positionFloatingPanel(panel, trigger) {
                const r = trigger.getBoundingClientRect();
                const pr = panel.getBoundingClientRect();
                const vw = window.innerWidth, vh = window.innerHeight;
                panel.style.position = 'fixed';
                let top = r.bottom + 8;
                if (top + pr.height > vh - 10) top = r.top - pr.height - 8;
                let left = r.right - pr.width;
                left = Math.max(10, Math.min(left, vw - pr.width - 10));
                panel.style.top = top + 'px';
                panel.style.left = left + 'px';
            }

            function applyTheme(theme) {
                document.body.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
                try { localStorage.setItem(THEME_STORAGE_KEY, theme); } catch (e) {}
            }

            function setupAppearanceDropdown() {
                const trigger = document.getElementById('appearanceTrigger');
                const dropdown = document.getElementById('appearanceDropdown');
                const wrapper = document.querySelector('.topbar-appearance-wrapper');
                if (!trigger || !dropdown) return;

                const themes = [{ id: 'light', label: 'Light' }, { id: 'dark', label: 'Dark' }];
                function currentTheme() {
                    return document.body.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
                }
                function renderMenu() {
                    const ct = currentTheme();
                    dropdown.innerHTML = '';
                    themes.forEach(t => {
                        const item = document.createElement('button');
                        item.type = 'button';
                        item.className = 'menu-item' + (t.id === ct ? ' active' : '');
                        item.textContent = t.label;
                        item.addEventListener('click', (e) => {
                            e.stopPropagation();
                            applyTheme(t.id);
                            renderMenu();
                            dropdown.classList.remove('open');
                            trigger.setAttribute('aria-expanded', 'false');
                        });
                        dropdown.appendChild(item);
                    });
                }
                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isOpen = dropdown.classList.contains('open');
                    dropdown.classList.remove('open');
                    trigger.setAttribute('aria-expanded', 'false');
                    if (!isOpen) {
                        renderMenu();
                        dropdown.classList.add('open');
                        trigger.setAttribute('aria-expanded', 'true');
                        positionFloatingPanel(dropdown, trigger);
                    }
                });
                document.addEventListener('click', (e) => {
                    if (wrapper && !wrapper.contains(e.target)) {
                        dropdown.classList.remove('open');
                        trigger.setAttribute('aria-expanded', 'false');
                    }
                });
            }

            function setupGridToggle() {
                const toggle = document.getElementById('gridToggle');
                if (!toggle) return;
                toggle.addEventListener('click', () => {
                    const on = document.body.classList.toggle('show-grid');
                    toggle.classList.toggle('active', on);
                    updateCanvasToolbarUI();
                });
            }
